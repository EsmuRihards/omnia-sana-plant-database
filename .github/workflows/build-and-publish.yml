name: Build & publish JSON

# On any change to the canonical data: (1) auto-verify vernacular names for any NEW
# plant (one that has no names/<id>.yaml yet) — anchoring its GBIF/Wikidata ids and
# harvesting verified common names from authoritative sources; (2) validate; (3) rebuild
# the build/*.json outputs the website consumes; (4) commit everything back in ONE push.
# A monthly run (and the workflow_dispatch "refresh_names" input) re-harvests ALL plants
# to pick up newly-added upstream names.
#
# The bot commits touch plants/ + names/ (trigger paths), so an actor guard skips the
# bot's own pushes to prevent a loop. build/ is intentionally NOT a trigger path.

on:
  push:
    paths:
      - 'plants/**'
      - 'names/**'
      - 'vocabularies/**'
      - 'compounds/**'
      - 'practice/**'
      - 'bibliography.bibtex'
      - 'schema/**'
      - 'scripts/**'
  schedule:
    - cron: '17 4 1 * *'   # 04:17 UTC on the 1st of each month: full name re-verify
  workflow_dispatch:
    inputs:
      refresh_names:
        description: 'Re-verify ALL vernacular names (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'omnia-sana-bot'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable, and
      # this job holds a contents:write token plus EPPO_TOKEN - repointing a
      # major tag would run attacker code with both. The trailing comment keeps
      # the pin human-readable so it can be reviewed and bumped deliberately.
      #
      # NOTE: persist-credentials is deliberately left at its default (true).
      # The "Commit regenerated data" step below does `git push`, which needs the
      # token in the runner's git config. Do not add persist-credentials: false
      # here without also giving that step an explicit token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pinned exactly. Unpinned, this resolves at run time, so a compromised
        # release of the package (or a transitive dependency) would execute in a
        # job that can write to this repository and read EPPO_TOKEN.
        #
        # `requests` used to be installed here and was never imported by any
        # script in this repo - verify_names.py fetches with stdlib urllib. It
        # was removed rather than pinned: the smallest dependency set is the one
        # that cannot be compromised at all.
        run: pip install pyyaml==6.0.3

      - name: Auto-verify vernacular names
        # Push -> only plants with no names file yet (auto-populate on add).
        # Schedule / manual refresh -> re-verify everything, ignoring the cache.
        env:
          EPPO_TOKEN: ${{ secrets.EPPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.refresh_names }}" = "true" ]; then
            python scripts/verify_names.py --refresh
          else
            python scripts/verify_names.py --new
          fi

      - name: Validate
        run: python scripts/validate.py

      - name: Build JSON outputs
        run: python scripts/build.py

      - name: Commit regenerated data if changed
        run: |
          git config user.name "omnia-sana-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- build/ names/ plants/; then
            git add build/ names/ plants/
            git commit -m "data: auto-verify vernacular names + regenerate JSON outputs"
            git push
          else
            echo "no changes"
          fi
