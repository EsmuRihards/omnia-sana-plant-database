  | 2026-11-24: symptom-source audit research-deepening batch 1 - Searched PubMed (name clause
  "Acorus calamus" OR "sweet flag" OR "calamus rhizome" OR "calamus oil" OR "Acorus americanus"
  tiab, Vacha ti; human-trial, SR, safety, observational, review families), Europe PMC,
