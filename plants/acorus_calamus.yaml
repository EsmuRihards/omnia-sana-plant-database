botanical_description:
  text: Aromatic, reed-like aquatic perennial with a long, branched, cylindrical rhizome about the thickness
    of a finger, creeping in the mud and sending out numerous roots. The few erect leaves are yellowish-green,
    2-3 feet long, sword-shaped, narrow and flat, sheathing and pink at the base, with entire but wavy
    or crimped edges and an aromatic smell when bruised. From the side of a leaf-like stem a solid, cylindrical,
    blunt flower spike (spadix) 2-4 inches long projects at an angle, densely crowded with very small
    greenish-yellow flowers, in June and July. All parts of the plant have a peculiar, agreeable fragrance.
  height: Leaves 2-3 feet (about 60-90 cm)
  habit: Erect, rhizomatous, semi-aquatic perennial herb
  leaves: Few, erect, yellowish-green, sword-shaped, sheathing and pink at the base, with wavy or crimped
    edges; aromatic when bruised
  flowers: Very small greenish-yellow flowers crowded on a blunt, cylindrical spadix 2-4 inches long,
    projecting at an angle from the side of a leaf-like stem
  stem: Leaf-like flowering stalk arising from the rhizome; the true stem is the underground rhizome
  root: Long, branched, cylindrical rhizome about the thickness of a finger, creeping in mud, with numerous
    roots
  flowering_period: June and July
  reference_ids:
  - REF-3186
  status: verified
habitat:
  text: Grows in ditches, at the margins of lakes, ponds and streams and in marshy places, often with
    reeds, bulrushes and bur-reed. Thought to be native to eastern Asia (the mountain marshes of India)
    and apparently also to the northern United States; now found wild in most European countries except
    Spain, including most English counties.
  reference_ids:
  - REF-3186
  status: verified
harvesting:
  text: The rhizomes are dug in late autumn or early spring, once large enough (generally after two or
    three years) and before they lose their firmness and become hollow, then washed, cleared of rootlets
    and dried, losing 70-75% of their weight. Peeling is discouraged because the aromatic oil lies in
    the outer layer. The crimped leaf edges and the aromatic smell of the bruised leaves distinguish it
    from the non-aromatic yellow flag iris.
  parts:
  - Rhizome
  season: Late autumn or early spring
  reference_ids:
  - REF-3186
  status: verified
harvest_readiness:
- part: rhizome
  signals:
  - "Dig the rhizome in the dormant season - from late autumn once the top has died back, through to early spring before the new leaves emerge - lifting it while still firm, before it turns hollow."
  - "Confirm identity before digging: the wet-ground rhizome and sword-like leaves are confusable with the toxic, NON-aromatic yellow flag iris (Iris pseudacorus); true Acorus calamus is strongly sweet-aromatic when cut. See this plant's Dangerous Lookalikes."
  basis: traditional
  source_quote: "The rhizome should be gathered in early spring or in October and November, freed from dirt and its bitter rootlets, and dried quickly in a gently warmed room."
  reference_ids:
  - REF-3185
  - REF-3186
  independent_confirmation: "Grieve (REF-3186) independently gives the same dormant-season window - 'Late autumn or early spring is the time chosen for collection' - and adds the readiness cue that the rhizomes are lifted 'before they lose their firmness and become hollow'."
  species_confirmed: true
  status: verified
traditional_uses:
  text: 'Sweet flag rhizome was esteemed as an aromatic stimulant and mild tonic: used to increase the
    appetite and help digestion, as a carminative for flatulence, chewed or infused for dyspepsia, for
    ague and low fevers, and (by older writers) for nervous complaints, vertigo and headaches; in Oriental
    medicine for dyspepsia and bronchitis, and chewed as a cough lozenge. Ayurvedic practitioners used
    it for weak memory and against worms, after a traditional detoxifying process (shodhana) prescribed
    because of its toxic beta-asarone. Other reported traditional uses include stomach cramps, dysentery
    and asthma.'
  reference_ids:
  - REF-3186
  - REF-5045
  - REF-5047
  status: verified
preparations:
- name: Infusion
  text: 'Historically an infusion of 1 oz (about 28 g) of the dried rhizome to 1 pint of boiling water
    was taken by the teacupful for dyspepsia. Shown for history only: see the serious safety warning about
    asarone.'
  reference_ids:
  - REF-3186
  status: verified
- name: Tincture
  text: 'Historically made by macerating the finely cut rhizome in alcohol for seven days and filtering,
    and used as a stomachic and flavouring. Shown for history only: see the serious safety warning about
    asarone.'
  status: verified
  reference_ids:
  - REF-3186
- name: Powder
  text: 'The powdered rhizome was historically given in small doses (12 grains to half a drachm, about
    0.8-1.9 g), and the dried root was chewed for dyspepsia and to clear the voice. Shown for history
    only: see the serious safety warning about asarone.'
  status: verified
  reference_ids:
  - REF-3186
dosage:
- name: All preparations
  text: Because alpha- and beta-asarone are genotoxic and carcinogenic in animal studies and their content
    varies widely between varieties, no general dose is given here. The EU herbal committee's provisional
    limit for asarone exposure from herbal medicines is about 115 micrograms a day (about 2 micrograms
    per kg body weight). Internal use should be restricted to properly characterised, beta-asarone-free
    preparations under professional guidance. Educational reference only, not a prescription.
  reference_ids:
  - REF-0515
  - REF-5047
  status: verified
