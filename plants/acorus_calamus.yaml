contraindications:
- note: 'SERIOUS: alpha- and beta-asarone, the main aromatic compounds of the rhizome, are genotoxic and
    cause liver cancer in rodents. The EU herbal committee (EMA/HMPC) advises keeping asarone in herbal
    medicines to a minimum and always preferring the beta-asarone-free diploid variety, with a provisional
    exposure limit of about 115 micrograms a day (about 2 micrograms per kg body weight); herbal teas
    and food supplements made from calamus have been found to contain high asarone levels. It is banned
    as a food additive in the USA. Avoid internal use except properly characterised beta-asarone-free
    preparations.'
  severity: serious
  reference_ids:
  - REF-0515
  - REF-5047
  - REF-5046
  status: verified
- note: Do not use in pregnancy or breastfeeding, or for prolonged periods. The North American variety
    (Acorus americanus) is essentially beta-asarone-free, but most commercial calamus is not.
  severity: caution
  reference_ids:
  - REF-0515
  - REF-5047
  status: verified
- note: 'Calamus products sold online as "legal highs" have caused poisonings: the Swedish Poisons Information
    Centre was consulted about 30 intentional intoxications in 2003-2006, mainly with prolonged vomiting
    lasting up to 15 hours.'
  severity: warning
  reference_ids:
  - REF-5041
  - REF-5042
  status: verified
- note: In laboratory skin-safety tests, sweet flag rhizome oil (about 41% beta-asarone) was a moderate
    skin sensitiser and irritant; its authors give safe concentrations of about 0.13-0.78% for leave-on
    products.
  severity: caution
  reference_ids:
  - REF-5044
  status: verified
