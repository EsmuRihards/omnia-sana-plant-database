internal_notes: 'Enriched 2026-06-12 from scientific literature (Cochrane review of horse chestnut seed extract for CVI;
  Cancer Letters review of escin). Originally a skeleton imported from the omniasana.bio Symptom-to-Plant
  Lookup tool (varicose-veins, swelling, hemorrhoids, inflammation); associations retained and now
  part-mapped and cited. Further enriched 2026-06-14 with a PubMed-sourced pharmacological/clinical review
  of escin''s anti-edematous, anti-inflammatory and venotonic properties (REF-0590; reduced vascular
  permeability, efficacy in CVI and blunt trauma). Further enriched 2026-06-14 with five more PubMed sources
  (REF-0675..REF-0679) - escin reviews and an endothelial-cell mechanism study (REF-0675, REF-0676), an
  escin pharmacokinetics study (REF-0677), and two venoactive-compound reviews of chronic venous disease
  that include horse chestnut seed extract (REF-0678, REF-0679). | 2026-06-15: migrated to entity schema
  (actions->vocab ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched to
  >=10 scientific publications: added 5 PubMed-verified @article sources (REF-2402, REF-2403, REF-2404,
  REF-2405, REF-2406) - woven into relevant actions/indications and the plant-level references bucket. |
  2026-07-11: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage) sourced from the existing references bucket; general/undated claims marked status:
  draft per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where absent) +
  cancer indication (anticancer/antitumour research) sourced from the plant''s cited literature, as part of
  the cancer-condition campaign. | 2026-07-18 (dosage-sourcing campaign, batch 5): the ''Topical gel'' entry
  is sourced to the EU herbal monograph on Aesculus hippocastanum L., semen, Rev 1 (REF-3086, new):
  semi-solid forms equivalent to 0.4% triterpene glycosides as protoaescigenin, thin layer 1-3 times daily.
  The ''Standardised oral extract'' entry was left as-is on REF-0590 deliberately: the monograph''s
  well-established-use posology is expressed as 21 mg triterpene glycosides calculated as PROTOAESCIGENIN
  twice daily, whereas the entry states 100-150 mg ESCIN daily - different analytical bases, not directly
  comparable, and converting between them here would be guesswork. TODO: reconcile the two bases properly,
  or state both side by side with their sources. | 2026-08-14 (harvest-calendar campaign, Batch 1): added
  harvest_readiness for the seed (provisional) - the ripe conker is collected in autumn as the spiny green
  husk splits and the nut falls, sourced to Grieve Horse Chestnut (REF-3189, new). A pharmacopoeial "ripe,
  dried seed" definition would upgrade it to verified. Existing harvesting.season not inherited; raw-seed
  esculin toxicity noted in the signal.
  | 2026-11-10: symptom-source audit batch 1 - REF-0678 purged (venoactive-drug review never names
  horse chestnut). REF-2832/2833/2834 purged (escin papers, no source species named).
  REF-0590/REF-0676 removed from arthritis/hemorrhoids/skin-irritation (abstracts do not name
  them).
  | 2026-11-12: symptom-source audit deep re-sweep batch 1 - Deep re-sweep. Cochrane 2006 REF-2446
  merged into its 2012 update REF-0470 (superseded, inv. 11). REF-2405 credits the 5-ingredient
  product Flonat Fast (escin alone not reported in the abstract) - removed from arthritis, kept as
  a mechanistic card; arthritis is now inferred only. Inflammation and cancer notes labelled as
  escin (signature compound) evidence.
  | 2026-11-24: symptom-source audit research-deepening batch 1 - Added human evidence
  (REF-5001..5023): Diehm 1996 Lancet RCT (HCSE 50 mg aescin twice daily = compression, both beat
  placebo on leg volume), Siebert 2002 MA (13 RCTs + 3 observational), Diehm 1992 RCT, Dickson
  2004 open study (Aesculaforce) to swelling + varicose-veins; Ottillinger 2001 (advanced CVI:
  HCSE not superior to placebo) and Koch 2002 (open, Venostasin not significant vs Pycnogenol)
  recorded as no-effect. EU monograph REF-3086 (read from the PDF 2026-11-24: printed 15 January
  2020, EMA/HMPC/638242/2018; year corrected from 2023) names CVI swollen legs, varicose veins,
  pain; traditional cutaneous use for bruises (local oedema, haematoma); interactions none
  reported; pregnancy/lactation not recommended. NEW bruising pair: Calabrese 1993 RCT (2% escin
  gel, experimental haematoma, compound evidence) + EU monograph. Hemorrhoids now sourced: two
  Thai RCTs adding escin to MPFF (NCT06748014 registers the drug as "Aescin in Horse Chestnut").
  Bisler 1986 crossover RCT (capillary filtration -22%) to anti-oedematous. Safety: DILI case
  2021, Venoplant injection hepatic injury 1986, seed poisoning (Korean-chestnut confusion), snuff
  intoxication, Marseille PCC food confusion (A. hippocastanum 2.5% of 2,197 events), renal
  angiomyolipoma bleed. Raw-seed note re-sourced (Cochrane states none of it; "esculin" wording
  dropped, the reports blame the seed/aescin) and raised to warning. Draft CYP3A4 interaction
  (insufficient; in vitro only). Not wired to the approved anticoagulant interaction (owner
  record): REF-5017 would support it. Bucket: Leach 2006 venous-ulcer RCT (healing NS; slough and
  dressing changes better), thyroid-eye-disease add-on RCT. Rejected: Pittler 1998 Arch Dermatol
  SR (earlier version of the held Cochrane review, superseded), Rehn 1996 (active comparator
  only), 1788677 (no abstract), Fang 2010 escin varicocele RCT (Chinese escin, species not named,
  all arms on composite medicines), escin/diethylamine-salicylate/heparin gels (Wetzel 2002, 2001:
  combinations), aescin+heparin+PDC registry, F1000 third-molar aescin protocol (no results),
  sulodexide NMA (no HCSE-specific result), Aesculaforce 5-study product review, HAVLUT methods
  paper, cost-benefit companion, effusive pericarditis after "horse chestnut paste" (single case,
  product unclear), IV aescin renal-failure reports (parenteral, gentamicin co-therapy, no
  abstracts), contact urticaria / dermatitis / defensin-allergy letters (no abstracts),
  indinavir-crystallization escin trial (no symptom; plasma indinavir unchanged). Sweet chestnut
  (Castanea) is not a DB plant, so the conker/sweet-chestnut confusion is recorded as a safety
  note, not a dangerous_lookalikes entry.'