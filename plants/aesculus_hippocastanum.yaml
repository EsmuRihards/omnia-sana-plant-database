drug_class_interactions:
- drug_class: anticoagulants-antiplatelets
  severity: caution
  mechanism: Horse chestnut seed contains aescin and coumarin-like constituents (esculin) that may add
    to the effect of blood-thinning or antiplatelet drugs, so combined use should be monitored.
  reference_ids:
  - REF-0470
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- drug_class: cyp3a4-substrates
  severity: insufficient
  mechanism: In laboratory tests a commercial horse chestnut product inhibited the drug-clearing enzyme
    CYP3A4 and the P-glycoprotein drug pump, and also lowered CYP activity in human liver cells; its authors
    suggested possible interactions in the gut. No study in people has tested this, and the EU monograph
    reports no interactions, so the evidence is insufficient to judge.
  reference_ids:
  - REF-5018
  - REF-5019
  - REF-3086
  status: draft
