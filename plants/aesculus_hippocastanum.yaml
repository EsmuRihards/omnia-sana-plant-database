botanical_description:
  text: Large deciduous tree, to 25-30 m, with a broad domed crown and stout, upward-arching branches.
    The leaves are opposite and palmately compound, with five to seven large, obovate, toothed leaflets
    radiating from a long stalk. In spring the tree bears large, showy, upright pyramidal flower spikes
    ('candles') of white flowers marked with yellow or pink at the base. The glossy brown seeds ('conkers')
    develop inside a spiky green husk and fall in autumn.
  height: Up to 25-30 m
  habit: Large deciduous tree
  leaves: Opposite, palmately compound with 5-7 large obovate toothed leaflets
  flowers: Showy, upright, pyramidal spikes ('candles') of white flowers marked yellow/pink at the base
  stem: Stout trunk with a broad domed crown of upward-arching branches
  root: Not medicinally used
  fruit: Glossy brown seed ('conker') enclosed in a spiny green husk
  flowering_period: April-May
  reference_ids:
  - REF-2402
  status: verified
habitat:
  text: Native to the Balkan Peninsula, and widely planted and naturalised as an ornamental and avenue
    tree across temperate Europe, North America and elsewhere.
  reference_ids:
  - REF-2402
  status: verified
harvesting:
  text: The seeds are gathered as they fall from the spiny husks in autumn; medicinal use requires a standardised,
    processed extract, since the raw seed, bark and leaves contain toxic esculin and must never be eaten
    raw.
  parts:
  - Seed (standardised extract)
  season: Autumn
  reference_ids:
  - REF-0470
  - REF-2402
  status: verified
harvest_readiness:
- part: seed
  signals:
  - "Collect the ripe seed (conker) in autumn, when the spiny green husk splits into three valves and the shining brown nut falls to the ground - the freed, fallen nut is the mature, ready seed."
  - "SAFETY: the raw seed contains toxic esculin and is used only as a standardised, processed extract - never eaten raw."
  basis: traditional
  source_quote: "a large green husk, protected with short spines, which splits into three valves when it falls to the ground and frees the nut."
  reference_ids:
  - REF-3189
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Grieve also notes 'the nuts, which are collected in the autumn.' Single authoritative source for the ripeness cue -> provisional; a pharmacopoeial 'ripe, dried seed' definition (Ph. Eur. Hippocastani semen) would upgrade to verified. The toxicity note reflects the plant's existing contraindications."
traditional_uses:
  text: Horse chestnut seed has a long folk history as a remedy for varicose veins, haemorrhoids and 'heavy
    legs', and was also used topically for rheumatic pain and bruising. Modern use is almost exclusively
    as a standardised seed extract for chronic venous insufficiency, confirming this traditional venous-support
    reputation.
  reference_ids:
  - REF-2402
  status: verified
preparations:
- name: Standardised extract (oral)
  text: Standardised seed extract, normalised to escin content, taken as tablets or capsules for chronic
    venous insufficiency; this is the best-studied clinical form.
  reference_ids:
  - REF-0590
  - REF-2402
  status: verified
- name: Topical gel
  text: Escin-containing transdermal gel applied to the skin over affected veins or bruised tissue.
  reference_ids:
  - REF-0590
  status: verified
dosage:
- name: Standardised oral extract
  text: The EU herbal monograph (well-established use) gives a standardised dry extract corresponding
    to 21 mg triterpene glycosides, calculated as protoaescigenin (previously declared as 50 mg aescin),
    twice daily for adults and the elderly; at least 4 weeks may be needed before any benefit, and use
    under 18 is not recommended. The main placebo-controlled trial gave extract providing 50 mg aescin
    twice daily for 12 weeks. Educational reference only, not a prescription.
  reference_ids:
  - REF-3086
  - REF-5001
  - REF-5021
  status: verified
- name: Topical gel
  text: The EU herbal monograph gives semi-solid dosage forms containing the equivalent of 0.4% triterpene
    glycosides calculated as protoaescigenin (or, depending on the preparation, 0.85-20% herbal preparation),
    applied as a thin layer to the affected area 1-3 times daily, in adults and elderly. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-3086
  status: verified
actions:
- action: anti-inflammatory
  note: Anti-oedematous and anti-inflammatory - escin reduces vascular permeability in inflamed tissue
    and exerts venotonic effects on veins
  reference_ids:
  - REF-0590
  - REF-2402
  - REF-2403
  - REF-2405
  status: verified
- action: anti-oedematous
  note: Anti-oedematous and anti-inflammatory - escin reduces vascular permeability in inflamed tissue
    and exerts venotonic effects on veins
  reference_ids:
  - REF-0590
  - REF-5004
  status: verified
- action: anticancer
  reference_ids:
  - REF-0471
  - REF-2835
  status: needs-review
  note: Escin, the triterpene saponin of Aesculus hippocastanum, induces apoptosis and cell-cycle arrest
    and chemosensitizes breast, hepatocellular, lung and pancreatic cancer cells (preclinical, including
    in vivo xenograft models).
- action: venotonic
  note: Anti-oedematous and anti-inflammatory - escin reduces vascular permeability in inflamed tissue
    and exerts venotonic effects on veins; Relief of haemorrhoid symptoms (venotonic)
  reference_ids:
  - REF-0590
  - REF-2402
  status: needs-review
indications:
- condition: arthritis
  note: inferred from anti-inflammatory action
  reference_ids: []
  status: needs-review
  mechanistic_exclude_ids:
  - REF-2403
  - REF-0590
- condition: cancer
  note: Escin, horse chestnut's main active compound, slowed breast, liver, lung and pancreatic cancer
    cells and made them more sensitive to chemotherapy in lab studies (compound evidence, preclinical)
  reference_ids:
  - REF-0471
  - REF-2835
  status: needs-review
- condition: hemorrhoids
  note: Adding escin (the main saponin of horse chestnut seed, registered as "aescin in horse chestnut";
    compound evidence) to a flavonoid haemorrhoid drug (MPFF) stopped bleeding haemorrhoids sooner than
    MPFF alone in two randomized trials, and in the double-blind one it also cut recurrence over 3 months
  reference_ids:
  - REF-5010
  - REF-5011
  status: verified
  mechanistic_exclude_ids:
  - REF-0590
- condition: inflammation
  note: Escin, horse chestnut's main active compound, reduced inflammation and swelling in lab and animal
    studies and in trials of escin gel for blunt injuries (compound evidence; reviews)
  reference_ids:
  - REF-0471
  - REF-0590
  - REF-0676
  status: needs-review
- condition: pain
  note: In chronic venous insufficiency, horse chestnut seed extract reduced leg pain vs placebo in six
    of seven placebo-controlled trials (Cochrane review); the EU monograph lists leg pain among the venous
    symptoms it treats
  reference_ids:
  - REF-0470
  - REF-0679
  - REF-3086
  status: verified
- condition: skin-irritation
  note: inferred from anti-inflammatory action
  reference_ids: []
  status: needs-review
  mechanistic_exclude_ids:
  - REF-2403
  - REF-0590
  - REF-2405
- condition: swelling
  note: Horse chestnut seed extract reduced lower-leg volume (oedema) vs placebo in chronic venous insufficiency
    in randomized trials and meta-analyses, and matched compression stockings in one trial; the EU monograph
    lists swollen legs among the venous symptoms it treats. A trial in advanced venous insufficiency and
    an open comparison with pine bark extract found no significant effect
  reference_ids:
  - REF-0470
  - REF-0679
  - REF-5001
  - REF-5002
  - REF-5003
  - REF-5005
  - REF-3086
  status: verified
  null_result_ids:
  - REF-5006
  - REF-5007
- condition: varicose-veins
  note: 'Chronic venous insufficiency (varicose veins, swollen, heavy and aching legs): horse chestnut
    seed extract improved leg swelling, pain and itching vs placebo in meta-analyses of randomized trials
    and is an EU well-established-use medicine for it; one trial in advanced venous insufficiency and
    one open comparison found no significant benefit'
  reference_ids:
  - REF-0470
  - REF-0679
  - REF-2406
  - REF-5001
  - REF-5002
  - REF-5003
  - REF-5005
  - REF-3086
  status: verified
  null_result_ids:
  - REF-5006
  - REF-5007
- condition: bruising
  note: A 2% escin gel (escin is the main saponin of horse chestnut seed; compound evidence) reduced the
    tenderness of experimentally induced bruises vs placebo in a double-blind randomized trial; the EU
    monograph lists traditional use on the skin for bruises (local swelling and haematoma)
  reference_ids:
  - REF-5009
  - REF-3086
  status: verified
contraindications:
- note: 'Use only standardised, processed seed extract. Raw conkers are poisonous: people who ate them
    after mistaking them for edible sweet chestnuts developed stomach pain, nausea and vomiting, and in
    one case a temporary irregular heartbeat; snorting the powdered seeds has caused vomiting, breathing
    difficulty and fainting. Never eat raw horse chestnut.'
  severity: warning
  reference_ids:
  - REF-5014
  - REF-5016
  - REF-5015
  status: verified
- note: The EU monograph advises seeing a doctor before use if you have heart or kidney failure, inflamed
    skin, thrombophlebitis, leg ulcers, severe pain or sudden swelling of one or both legs, and does not
    recommend use in pregnancy, while breastfeeding or under 18 years. One case of life-threatening kidney
    bleeding in a woman taking horse chestnut seed extract has been reported, and its authors advise caution
    with blood-thinning medicines.
  severity: caution
  reference_ids:
  - REF-3086
  - REF-5017
  status: verified
- note: 'Reported side effects include stomach and gut complaints, headache, dizziness, itching and allergic
    reactions, and itching or redness of the skin with gels and creams (EU monograph). Liver injury is
    rare but has been reported: once with an oral horse chestnut supplement in a 70-year-old man (2021)
    and once after an injected horse chestnut extract (1986). Stop and seek advice if jaundice, dark urine
    or itching all over develops.'
  severity: caution
  reference_ids:
  - REF-3086
  - REF-5012
  - REF-5013
  status: verified
