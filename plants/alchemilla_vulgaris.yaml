id: alchemilla-vulgaris
scientific_name: Alchemilla vulgaris
common_names:
- Lady’s-mantle
- Lady's mantle
- lion's foot
family: Rosaceae
external_ids:
  gbif: 7890713
  wikidata: Q160189
parts_used:
