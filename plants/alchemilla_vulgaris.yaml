traditional_uses:
  text: Lady's mantle was valued as an astringent and styptic herb because of its tannin, and was formerly
    considered one of the best wound herbs; Culpeper recommended it for inflamed wounds and to stop bleeding,
    vomiting and fluxes. In early twentieth-century herbal practice it was taken as an infusion for excessive
    menstruation, and a strong decoction of the fresh root was recommended to stop bleeding.
  reference_ids:
  - REF-3192
  - REF-0113
  status: verified
preparations:
- name: Infusion
  text: An infusion of 1 oz of the dried herb to 1 pint of boiling water, taken in teacupful doses (historically
    for excessive menstruation); the same infusion was used as a wash.
  reference_ids:
  - REF-3192
  - REF-0113
  status: verified
- name: Tincture
  text: Alcoholic extract of the dried herb.
  status: draft
- name: Poultice/wash
  text: Infused herb used as a topical wash or poultice for minor wounds and skin irritation.
  status: draft
dosage:
- name: Infusion
  text: Grieve (1931) gives an infusion of 1 oz (about 28 g) of dried herb to 1 pint (about 570 mL) of
    boiling water, taken in teacupful doses as required, and a fluid extract dose of 1/2 to 1 drachm (about
    2-4 mL). These are historical doses, not modern standardised guidance. Educational reference only,
    not a prescription.
  status: verified
  reference_ids:
  - REF-3192
- name: Tincture
  text: About 2-4 mL of a 1:5 tincture, up to three times daily. Educational reference only, not a prescription.
  status: draft
