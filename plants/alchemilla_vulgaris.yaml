constituents:
- name: Phenolic compounds and tannins
  compounds:
  - phenolic-compound
  - phenolic-acid
  - tannin
  - caffeic-acid
  - flavonoid
  - quercetin
  - catechin
  - gallic-acid
  note: Lady's mantle is rich in ellagitannins and other tannins (the basis of its astringency) together
    with phenolic acids (gallic and caffeic acids) and flavonoids such as quercetin and catechin, which
    underlie its antioxidant activity.
  reference_ids:
  - REF-0686
  - REF-0687
botanical_description:
  text: Low perennial herb, only about a foot high and green throughout, from a short, stout, black rootstock.
    The lower leaves are 6-8 inches across on stalks 6-18 inches long, somewhat kidney-shaped, and cut
    into seven or mostly nine broad but shallow lobes, finely toothed at the edges; the upper leaves are
    stalkless or short-stalked. The numerous small flowers, only about 1/8 inch across, are yellow-green,
    have no petals and four stamens, and are borne in loose clusters from June to August.
  height: About a foot (30 cm)
  habit: Low, clump-forming perennial herb
  leaves: Lower leaves 6-8 inches across, kidney-shaped, cut into seven or mostly nine broad shallow lobes,
    finely toothed; upper leaves stalkless or short-stalked
  flowers: Numerous tiny (1/8 inch) yellow-green flowers without petals, four stamens, in loose clusters
  root: Short, stout, black perennial rootstock
  flowering_period: June-August
  reference_ids:
  - REF-3192
  status: verified
habitat:
  text: Grows in moist, hilly pastures and by streams, up to about 3,600 feet in the Scottish Highlands
    - essentially a plant of the north; native to Europe and parts of temperate Asia.
  reference_ids:
  - REF-3192
  - REF-0208
  status: verified
harvesting:
  text: The whole herb is gathered in June and July, when in flower and when the leaves are at their best,
    and dried; the root is sometimes also used, generally fresh.
  parts:
  - Flower
  - Leaf
  season: June and July (in flower)
  reference_ids:
  - REF-3192
  status: verified
