indications:
- condition: cancer
  note: Alchemilla vulgaris extracts suppress the growth of MCF-7, A375, A549, HCT116 (aerial parts) and
    PC-3, MCF-7, Caco-2 (root) cancer cells via caspase-dependent apoptosis and autophagy, while protecting
    normal cells (preclinical).
  reference_ids:
  - REF-0686
  - REF-0687
  - REF-0688
  - REF-2837
  status: needs-review
- condition: inflammation
  note: Extract reduced inflammatory and oxidative-stress markers in a rat model of heart injury (preclinical)
  reference_ids:
