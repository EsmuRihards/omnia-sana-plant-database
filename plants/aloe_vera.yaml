  references bucket; general/undated claims marked status: draft per the integrity-first sourcing policy.
  | 2026-07-19 (dosage-sourcing campaign, batch 9): the ''Topical gel'' entry is sourced to the WHO monograph
  on Aloe Vera Gel, WHO Vol 1 (REF-3103, new) - fresh gel, or preparations containing 10-70% fresh gel.
  The ''Oral gel/juice'' entry is left UNSOURCED because WHO gives no oral posology for the gel, and a
  SAFETY DISTINCTION was added to its text instead: WHO''s separate ''Aloe'' monograph covers the dried
  leaf JUICE (latex), a stimulant laxative dosed at 0.04-0.17 g. Those two preparations differ in action
  and by orders of magnitude in dose, and conflating them - which is easy, since both are called ''aloe''
