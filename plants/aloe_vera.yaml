contraindications:
- note: Topical aloe gel is generally well tolerated, though burning, itching, rash and eczema are occasionally
    reported. Taken by mouth, aloe latex can cause abdominal pain, cramps and diarrhoea, and the US FDA
    removed it from over-the-counter laxatives in 2002 for lack of safety data. IARC classes non-decolorized
    whole-leaf aloe extract as possibly carcinogenic to humans, and the European Food Safety Authority
    regards the hydroxyanthracene derivatives in aloe latex and whole-leaf extracts (such as aloe-emodin)
    as genotoxic and carcinogenic unless shown otherwise. Acute hepatitis has been reported after oral
    aloe leaf extracts, while purified inner-leaf gel did not change liver tests in healthy volunteers
    over 60 days. Large amounts of the fibrous gel have caused bowel obstruction (bezoar). Oral aloe may
    lower blood sugar, so monitor glucose with diabetes medicines, and oral aloe in any form may be unsafe
    in pregnancy and while breastfeeding.
  severity: warning
  reference_ids:
  - REF-5130
  - REF-5117
  - REF-5115
  - REF-5116
  - REF-5112
  - REF-5113
  - REF-5114
  - REF-5105
  status: verified
- note: 'Duke (2002) reports clinical evidence (score 2/3) supporting aloe gel''s use in psoriasis, constipation
    (in adults), and as a vulnerary. Gel preparations have been clinically validated for peptic ulcers
    (excluding stress-induced), radiation burns, and skin ulcers. Dose: 1 tablespoon gel three times daily
    or 50–200 mg dried juice equivalent per day as a laxative. An important safety distinction is made:
    the gel (inner leaf mucilage) is AHPA Class 1 (safe), while the inner leaf juice or dried latex is
    Class 2b due to anthraquinone content and is contraindicated in intestinal inflammation, colitis,
    Crohn''s disease, appendicitis, and during menstruation (Duke, 2002).'
  severity: caution
  reference_ids:
  - REF-0063
  status: verified
