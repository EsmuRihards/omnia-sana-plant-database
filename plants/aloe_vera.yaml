  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- drug_class: cardiac-glycosides
  severity: caution
  mechanism: NCCIH warns that overuse of aloe latex, a stimulant laxative, may increase the risk of adverse
    effects from cardiac glycosides such as digoxin.
  reference_ids:
