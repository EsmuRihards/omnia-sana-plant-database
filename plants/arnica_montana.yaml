id: arnica-montana
scientific_name: Arnica montana
common_names:
- Arnica
- Mountain arnica
- Leopard's bane
- Wolf's bane
- Mountain tobacco
family: Asteraceae
external_ids:
  gbif: 5405976
  wikidata: Q207848
parts_used:
- Flower head (topical preparations)
constituents:
- name: Sesquiterpene lactones (helenalin, dihydrohelenalin)
  compounds:
  - sesquiterpene-lactone
  - sesquiterpene
  note: The main anti-inflammatory principles; also responsible for the plant's toxicity and contact-allergy
    potential.
  reference_ids:
  - REF-0398
- name: Flavonoids
  compounds:
  - flavonoid
  note: Antioxidant and anti-inflammatory constituents.
  reference_ids:
  - REF-0398
- name: Essential oil, phenolic acids and coumarins
  compounds:
  - phenolic-acid
  - essential-oil
  - coumarin
  note: Aromatic and supporting constituents of the flower.
  reference_ids:
  - REF-0398
- name: Pyrrolizidine alkaloids (trace)
  compounds:
  - alkaloid
  note: Present in small amounts; relevant to the caution against internal use.
  reference_ids:
  - REF-0398
botanical_description:
  text: Aromatic mountain perennial herb with a basal rosette of oval, hairy leaves and one or two pairs
    of smaller opposite leaves on an erect, softly hairy flowering stem. Each stem bears one or a few
    large, bright golden-yellow, daisy-like flower heads with narrow, slightly twisted ray florets.
  height: 20-60 cm
  habit: Erect, aromatic mountain perennial herb
  leaves: Basal rosette of oval, hairy leaves; one or two pairs of smaller opposite stem leaves
  flowers: Large, bright golden-yellow, daisy-like flower heads with narrow, slightly twisted ray florets
  stem: Erect, softly hairy, sparsely leaved flowering stem
  root: Short, blackish rhizome with fibrous roots
  fruit: Small, hairy achene with a pappus
  flowering_period: June-August
  reference_ids:
  - REF-0398
  status: verified
habitat:
  text: Grows in acidic, nutrient-poor mountain meadows, pastures and open woodland, typically at moderate
    to high elevations across central and northern Europe; increasingly scarce in the wild due to habitat
    loss and overharvesting.
  reference_ids:
  - REF-0398
  status: verified
harvesting:
  text: The flower heads are picked by hand as they open, in mid- to late summer, and dried quickly in
    a warm, shaded, airy place; wild populations are protected in many regions, so cultivated or sustainably
    wildcrafted material is preferred.
  parts:
  - Flower head (topical preparations)
  season: Mid- to late summer, as flowers open
  reference_ids:
  - REF-0398
  status: verified
harvest_readiness:
- part: flower
  signals:
  - "Pick the flower heads when they are fully open, and dry promptly; the receptacles are sometimes removed as they are prone to insect attack."
  basis: traditional
  source_quote: "The flowers are harvested when fully open and dried - the receptacles are sometimes removed since these are liable to be attacked by insects."
  reference_ids:
  - REF-3207
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Temperate Plants (REF-3207) for Arnica montana. Single source -> provisional."
traditional_uses:
  text: Arnica flower has a long central European folk reputation, reflected in the name 'leopard's bane'
    and 'mountain tobacco', as a topical remedy for bruising, sprains, muscle soreness and swelling after
    minor injury, applied only to unbroken skin. Internal use of the whole herb has always been considered
    dangerous and is confined to highly diluted homeopathic preparations.
  reference_ids:
  - REF-0398
  status: verified
preparations:
- name: Topical cream/gel/ointment
  text: Standardised flower extract formulated into a cream, gel or ointment for external application
    to bruises, sprains and muscle soreness on unbroken skin.
  reference_ids:
  - REF-0398
  status: verified
- name: Diluted tincture (topical)
  text: Alcoholic tincture of the dried flower heads, diluted before topical application as a compress;
    never taken internally in this form.
  reference_ids:
  - REF-0398
  status: draft
- name: Infused oil
  text: Flower heads infused in a carrier oil for topical massage use.
  status: draft
dosage:
- name: Topical cream/gel
  text: The EU herbal monograph gives cutaneous use only, in adolescents, adults and elderly - a semi-solid
    preparation containing 20-25% tincture applied as a thin layer 2-3 times daily, a 50% liquid-extract
    preparation 2-4 times daily, or 2.5 mL of a liquid preparation as an impregnated dressing 3-4 times
    daily. Apply to unbroken skin only. If symptoms persist after 3 to 4 days a healthcare practitioner
    should be consulted. Not recommended under 12 years. Never taken by mouth except as a highly diluted
    homeopathic preparation. Educational reference only, not a prescription.
  reference_ids:
  - REF-3073
  status: verified
actions:
- action: analgesic
  note: Topical analgesic for muscle soreness and pain
  reference_ids:
  - REF-0398
  status: verified
- action: anti-inflammatory
  note: Topical anti-inflammatory for bruising, swelling and sprains
  reference_ids:
  - REF-0398
  - REF-0726
  - REF-2099
  - REF-2100
  - REF-2101
  - REF-2105
  status: verified
- action: anticancer
  reference_ids:
  - REF-2104
  - REF-2864
  - REF-2865
  status: needs-review
  note: Helenalin, the sesquiterpene lactone of Arnica montana, shows anticancer activity against multiple
    tumour types in vitro and in vivo, largely by covalently inhibiting NF-kappaB p65 and inducing apoptosis
    (preclinical).
- action: antimicrobial
  note: Antimicrobial and antioxidant (in vitro)
  reference_ids:
  - REF-0398
  - REF-2104
  status: verified
- action: antioxidant
  note: Antimicrobial and antioxidant (in vitro)
  reference_ids:
  - REF-0398
  - REF-2104
  - REF-2106
  status: verified
- action: vulnerary
  note: Antiecchymotic / vulnerary (helps disperse bruises)
  reference_ids:
  - REF-0398
  - REF-2102
  status: verified
indications:
- condition: arthritis
  note: An arnica gel was as effective as ibuprofen gel for hand osteoarthritis in a randomized trial,
    and knee osteoarthritis scores improved with an arnica gel in an open trial without a comparison group;
    applied for rheumatic muscle and joint complaints (EU herbal monograph)
  reference_ids:
  - REF-0726
  - REF-3446
  - REF-5175
  status: needs-review
  mechanistic_exclude_ids:
  - REF-2101
  - REF-2105
  - REF-0398
- condition: bruising
  note: Traditional topical remedy for bruises (EU herbal monograph, summarised in a review); a 20% arnica
    ointment sped bruise healing in one randomized trial and arnica cream reduced bruising after nose
    surgery in two small randomized trials with untreated comparison, but arnica gel, a 10% ointment and
    a systematic review found no clear benefit
  reference_ids:
  - REF-0726
  - REF-3442
  - REF-5173
  - REF-5183
  status: verified
  mechanistic_exclude_ids:
  - REF-0398
  null_result_ids:
  - REF-3443
  - REF-3444
  - REF-3445
- condition: cancer
  note: Arnica montana and its constituent helenalin exert anticancer activity against several tumour
    types in vitro and in vivo, inhibiting NF-kappaB (p65) signalling, inducing apoptosis and synergizing
    with other anticancer agents (preclinical).
  reference_ids:
  - REF-2104
  - REF-2864
  - REF-2865
  status: needs-review
- condition: infection
  note: Antibacterial activity reported in lab studies (narrative review)
  reference_ids:
  - REF-0398
  status: needs-review
- condition: inflammation
  note: Applied for inflammation after blunt injuries (EU herbal monograph, summarised in a review); anti-inflammatory
    activity in lab and animal studies
  reference_ids:
  - REF-0398
  - REF-0726
  status: needs-review
  mechanistic_exclude_ids:
  - REF-2105
- condition: swelling
  note: Arnica cream reduced swelling around the eyes after nose surgery in two small randomized trials
    compared with no treatment; after wisdom-tooth surgery, topical arnica did not reduce swelling
  reference_ids:
  - REF-5173
  - REF-5183
  status: verified
  null_result_ids:
  - REF-5174
- condition: pain
  note: Added to standard pain relief, topical arnica reduced pain for the first 5 days after wisdom-tooth
    surgery in a randomized trial without placebo
  reference_ids:
  - REF-5174
  status: verified
contraindications:
- note: EXTERNAL USE ONLY on unbroken skin. Arnica is toxic if swallowed and can cause stomach pain, vomiting,
    diarrhoea, breathing difficulty, irregular heartbeat and, in serious cases, cardiac arrest; the only
    safe oral form is the highly diluted homeopathic preparation.
  severity: info
  reference_ids:
  - REF-0400
  - REF-0398
  - REF-5178
  - REF-5186
  status: verified
- note: Do not apply to broken or damaged skin, open wounds, eyes or mucous membranes.
  severity: caution
  reference_ids:
  - REF-0400
  status: verified
- note: As a member of the daisy family (Asteraceae) it can cause allergic contact dermatitis; prolonged
    topical use can also irritate the skin. About 1 in 100 people in a clinic series of 443 patch tests
    reacted to arnica, and 5 of 6 people already sensitised to arnica reacted to arnica-based products;
    people allergic to sunflowers, marigolds or ragweed are likely to react.
  severity: info
  reference_ids:
  - REF-0398
  - REF-5176
  - REF-5177
  - REF-5186
  status: verified
- note: Avoid medicinal use during pregnancy and breastfeeding. A 9-day-old breastfed baby developed haemolytic
    anaemia (breakdown of red blood cells) 48 hours after the mother began drinking arnica flower tea
    (case cited by Memorial Sloan Kettering).
  severity: caution
  reference_ids:
  - REF-0400
  - REF-5186
  status: verified
