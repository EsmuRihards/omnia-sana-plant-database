internal_notes: 'Enriched 2026-06-12 from scientific and general literature (J Pharm Pharmacol review,
  Frontiers in Surgery meta-analysis, Poison Control). Originally a skeleton imported from the omniasana.bio
  Symptom-to-Plant Lookup tool (bruising, pain, inflammation, muscle-soreness); associations retained
  and now part-mapped and cited. NOTE: external use only - see contraindications. | 2026-06-15: migrated
  to entity schema (actions->vocab ids, indications split out, constituents linked to compounds). | 2026-06-20:
  added 3 PubMed-sourced references to the plant-level references bucket (least-cited enrichment): REF-0725,
  REF-0726, REF-0727. | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified
  @article sources (REF-0726, REF-0398, REF-2098, REF-2099, REF-2100, REF-2101, REF-2102, REF-2103, REF-2104,
  REF-2105, REF-2106) - woven into relevant actions/indications and the plant-level references bucket.
  | 2026-07-11: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage) sourced from the existing references bucket; general/undated claims marked status:
  draft per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where absent)
  + cancer indication (anticancer/antitumour research) sourced from the plant''s cited literature, as
  part of the cancer-condition campaign. | 2026-07-18 (dosage-sourcing campaign, batch 3): dosage sourced
  to the EU herbal monograph on Arnica montana L., flos (EMA/HMPC/198793/2012 = REF-3073, new). The existing
  ''2-3 times daily on unbroken skin'' matched the monograph but carried no preparation strengths; now
  gives the monograph''s actual forms (20-25% tincture in a semi-solid base 2-3x daily, 50% liquid extract
  in base 2-4x daily, 2.5 mL liquid as an impregnated dressing 3-4x daily) plus the 3-4 day consult trigger
  and the Asteraceae contraindication. Cutaneous use only - the monograph gives no oral posology, consistent
  with the existing note about homeopathic dilutions. status -> verified. DEAD END (preparations, 2026-07-20):
  checked against the monograph references already on this record, judged from their stored posology summaries
  and not from the full monograph PDFs - a later pass with the PDFs, or a new seam (Health Canada NNHPD,
  ESCOP, Commission E), may still resolve these. ''Infused oil'': The monograph''s cutaneous forms are
  tincture-based and liquid-extract-based semi-solid preparations and impregnated dressings. An oil infusion
  of flower heads in a carrier oil is a different preparation and is not covered. | 2026-08-14
  (harvest-calendar campaign, Batch 4): added harvest_readiness for the flower head (provisional) - pick
  the heads when fully open, before insect damage, sourced to Useful Temperate Plants (REF-3207). Existing
  harvesting.season not inherited; signal re-derived.
  | 2026-11-10: symptom-source audit batch 2 - Homeopathic studies purged (owner decision
  2026-11-10: not evidence for the plant): REF-0399 (also non-significant vs placebo, p=0.059),
  REF-2098, REF-2103 (Alpine/Boiron pellets; p=0.097/0.074). REF-0398 abstract names only
  antibacterial/anti-inflammatory/antitumour activity. REF-0726 quotes the EU monograph (blunt
  injuries, inflammations, rheumatic muscle and joint complaints) - wired to bruising,
  inflammation, arthritis.
  | 2026-11-12: symptom-source audit deep re-sweep batch 2 - Deep re-sweep. Wounds and
  skin-irritation dropped: contradicted by the record''s own safety notes ("do not apply to broken
  or damaged skin, open wounds"; "prolonged topical use can also irritate the skin"; inv. 11).
  Bruising: 20% ointment RCT REF-3442 added; topical arnica gel RCT REF-3443, 10% ointment
  blepharoplasty RCT REF-3444 and the arnica/bromelain SR REF-3445 ("insufficient data") recorded
  as no-effect. Hand-OA RCT REF-3446 (arnica gel non-inferior to ibuprofen gel) added to
  arthritis. Homeopathic arnica trials not used (owner rule). Gap: topical arnica increased muscle
  pain after eccentric exercise (20807867) - no muscle pair exists.
  | 2026-11-24: symptom-source audit research-deepening batch 4 - Searched PubMed (Arnica montana
  tiab, arnica ti), Europe PMC, ClinicalTrials.gov (33) and OpenAlex. Most arnica trials are
  homeopathic dilutions (12CH, D4, D12, D30, Boiron/Alpine pellets, SinEcch) and are not used
  (owner rule); topical creams, gels and ointments count as plant evidence (inv. 11
  mother-tincture rule). Added: Simsek 2016 rhinoplasty RCT (arnica cream vs no treatment, less
  ecchymosis and faster oedema regression) and Grigg 2026 split-face septorhinoplasty RCT (Aust J
  Otolaryngol, found via OpenAlex) to bruising; both make a NEW swelling pair, with Akay 2024
  (third-molar RCT, arnica did not reduce oedema) recorded as no-effect; Akay 2024 also makes a
  NEW pain pair (lower VAS to day 5 vs standard therapy alone; open, no placebo). Knuesel 2002
  open knee-OA gel trial to arthritis. Safety: Reider 2001 patch tests (1.13% of 443) and Paulsen
  2008 (5/6 arnica-sensitive positive to arnica products) to the Asteraceae allergy note; CIR 2001
  safety assessment (ingestion: gastroenteritis, fast heart rate, muscular weakness, death) and
  MSKCC About Herbs (REF-5186, read 2026-11-24) to the oral-toxicity note; MSKCC neonatal
  haemolysis case to the pregnancy/breastfeeding caution; new DRAFT interaction with
  anticoagulants/antiplatelets (insufficient, needs owner sign-off). NOT ADDED - muscle-soreness:
  Pumpa 2014 RCT (n=20, less pain 72 h after downhill running) conflicts with Adkison 2010 RCT
  (n=53, arnica cream INCREASED leg pain at 24 h); left out as conflicting, flagged for owner.
  Infection: Robledo 2025 phase Ib/II arnica tincture healed cutaneous leishmaniasis in 12/12
  completers, but it is applied to ulcers and the record forbids broken skin (inv. 12d). Also not
  added: 2026 Cureus SR and 2026 facial-surgery SR (pool homeopathic and topical forms), 2025
  eyelid-surgery SR (same mix; no benefit), arnica + hydroxyethyl salicylate spray (arnica-alone
  arm not tested against placebo in the abstract), carpal-tunnel trial (homeopathic tablets plus
  ointment), umbilical Arnica-Echinacea powder, menthol mud pack and other combinations, LiverTox
  and LactMed arnica pages (NCBI bot check blocked the fetch).
  | 2026-11-24: owner approved the research-deepening draft herb-drug interaction(s):
  anticoagulants-antiplatelets.'
drug_class_interactions:
- drug_class: anticoagulants-antiplatelets
  severity: insufficient
  mechanism: Arnica's helenalin inhibits platelets in laboratory tests, and Memorial Sloan Kettering notes
    that arnica may add to the effect of warfarin and other blood thinners; the clinical relevance is
    not known, and arnica is meant for use on unbroken skin only.
  reference_ids:
  - REF-5186
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-11-24'
