indications:
- condition: cancer
  note: Bacopaside II from Bacopa monnieri inhibits colon cancer cell growth via cell-cycle arrest and
    apoptosis (aquaporin-1 blockade), and its bacopasaponins are cytotoxic to lung (PC9) and colon (SW620)
    cancer cells (preclinical).
  reference_ids:
  - REF-0742
  - REF-2871
  - REF-2872
  status: needs-review
- condition: cognitive-function
  note: Improved attention and processing speed in a meta-analysis of randomized trials, and cognitive
    performance in older adults in placebo-controlled trials; a 2026 network meta-analysis found gains
    in working memory but not in attention or processing speed, and one 12-week trial found no effect
    on any cognitive measure
  reference_ids:
  - REF-0740
  - REF-0283
  - REF-2107
  - REF-5194
  status: needs-review
  null_result_ids:
  - REF-5196
- condition: inflammation
  note: inferred from anti-inflammatory action
  reference_ids: []
  status: needs-review
- condition: memory
  note: Improved memory recall and retention in randomized trials in healthy adults and older people (systematic
    review); a 2026 network meta-analysis found high doses improved working and short-term memory, though
    one 12-week trial in healthy adults found no effect
  reference_ids:
  - REF-0740
  - REF-0283
  - REF-3456
  - REF-3457
  - REF-3458
  - REF-5194
  - REF-5195
  status: needs-review
  null_result_ids:
  - REF-5196
- condition: anxiety
  note: Anxiety scores fell in older adults taking Bacopa for 12 weeks (and rose on placebo) in a randomized
    trial; two other trials found no clear change in anxiety
  reference_ids:
  - REF-0740
  status: verified
  null_result_ids:
  - REF-3458
  - REF-5196
- condition: depression
  note: Depression scores fell in older adults taking Bacopa for 12 weeks (and rose on placebo) in a randomized
    trial, and added to citalopram it improved depression and anhedonia scores more than citalopram alone
    in a 4-week trial
  reference_ids:
  - REF-0740
  - REF-5197
  status: verified
contraindications:
- note: Generally well tolerated at standard doses. The most commonly reported side effects are gastrointestinal
    - nausea, stomach cramps, and increased bowel movements - which can be reduced by taking with food.
    Not recommended during pregnancy. May interact with medications that increase acetylcholine levels
    (e.g. Alzheimer's medications). Use with caution in thyroid conditions, as bacopa may increase thyroid
    hormone levels.
  severity: caution
  reference_ids:
  - REF-0740
  - REF-0283
  status: verified
- note: Duke (2002) does not include a dedicated entry for Bacopa monnieri (water hyssop/brahmi) in the
    Handbook of Medicinal Herbs, Second Edition.
  severity: info
  reference_ids:
  - REF-0740
  - REF-0283
  - REF-0063
  status: verified
- note: Reviews advise care when taking it with some medicines and in hyperthyroidism (an overactive thyroid);
    safety in pregnancy and breastfeeding has not been established.
  severity: caution
  reference_ids:
  - REF-5198
  status: verified
