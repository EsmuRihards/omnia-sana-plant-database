botanical_description:
  text: A much-branched, creeping, non-aromatic perennial herb whose stems, 5-40 cm long, root at the
    nodes. The leaves are succulent, oblong to oblanceolate, about 4-6 mm thick and arranged in opposite
    pairs. The flowers are small, symmetrical and white, with four or five petals. It flowers and fruits
    through most of the year.
  height: About 5 cm; creeping stems 5-40 cm long
  habit: Much-branched, creeping perennial herb
  leaves: Succulent, oblong to oblanceolate, opposite
  flowers: Small, symmetrical, white, with four or five petals
  stem: Creeping, rooting at the nodes
  flowering_period: Through most of the year
  reference_ids:
  - REF-3971
  - REF-3972
  status: verified
habitat:
  text: 'Probably originating in tropical Asia, it is found through most of the tropics and subtropics:
    marshy areas of India, Nepal, Sri Lanka, China, Pakistan, Taiwan and Vietnam, tropical and southern
    Africa, Madagascar, Australia, the Caribbean and Central and South America, and Florida, Louisiana,
    Texas and Hawaii. It grows on estuarine mud flats and in moist and wet places such as the borders
    of water channels, wells and irrigated fields, tolerating slightly brackish water.'
  reference_ids:
  - REF-3971
  - REF-3972
  status: verified
harvesting:
  text: The whole plant (leaf and trailing stem) is harvested during active growth, typically cut a few
    centimetres above the mud or water line, and dried or used fresh.
  parts:
  - Leaf
  - Whole Plant
  season: During active growth (warm season)
  status: draft
harvest_readiness:
- part: whole-plant
  signals:
  - "Harvest the whole plant (the leafy soft stems) during active growth in the warm season, at the mature/flowering stage, when active-compound (bacoside) content is highest."
  basis: constituent
  constituent_note: "A growth-stage study reports the harvest window for peak actives: 'this period should be considered for Brahmi harvesting to obtain high active compounds and crop yield' (week 12, which coincides with peak flowering)."
  source_quote: "Regarding capacity per plant, the highest content of active compounds was found in week 12."
  reference_ids:
  - REF-3215
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Thai Journal of Agricultural Science growth-stage study (REF-3215). Week 12 of cultivation coincides with peak flowering / mature active growth; there is no traditional-collection source, so the signal rests on the constituent-peak study (basis: constituent). Single source -> provisional."
- part: leaf
  signals:
  - "Handpick the leaves and soft stems during active growth in the warm season, at the mature/flowering stage when bacoside content peaks."
  basis: constituent
  source_quote: "Regarding capacity per plant, the highest content of active compounds was found in week 12."
  reference_ids:
  - REF-3215
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Thai Journal of Agricultural Science growth-stage study (REF-3215). Single source -> provisional."
traditional_uses:
  text: 'Bacopa (brahmi) is an important Ayurvedic herb, used for centuries, alone or with other herbs,
    to enhance memory and learning, as a sedative and as an anti-epileptic, and valued for its effect
    on the nervous system: it was used for neuralgia, hysteria, epilepsy, insanity and nervous exhaustion,
    and also for hoarseness, indigestion, ulcers, wind, constipation, asthma, bronchitis and infertility.
    A poultice of the boiled plant was applied to children''s chests for bronchitis and coughs, and the
    juice was used as a wash on burns. A meta-analysis of randomised trials of standardised extracts found
    improvements in speed of attention.'
  reference_ids:
  - REF-0742
  - REF-3971
  - REF-2113
  - REF-2107
  status: verified
preparations:
- name: Standardised extract
  text: A standardised extract of the plant, taken by mouth, is the form tested in the randomised trials
    of cognition pooled in a meta-analysis (nine trials, at least 12 weeks each); one trial used a whole-plant
    standardised dry extract as tablets.
  reference_ids:
  - REF-2107
  - REF-0740
  status: verified
- name: Infusion
  text: Fresh or dried leaf/whole plant infused in hot water as a traditional nervine tea.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried herb.
  status: draft
dosage:
- name: Standardised extract (trials)
  text: A randomised trial in healthy adults over 65 used 300 mg a day of a standardised whole-plant extract
    for 12 weeks; the meta-analysis included only trials lasting at least 12 weeks. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-0740
  - REF-2107
  status: verified
constituents:
- name: Triterpenoid saponins (bacosides A and B)
  compounds:
  - saponin
  - triterpene-saponin
  note: Saponins including bacosides A and B, bacopasides I and II and bacopasaponin C are named in reviews
    as among the plant's main active constituents, linked to its effects on the nervous system.
  reference_ids:
  - REF-2108
  - REF-2113
  - REF-3971
- name: Flavonoids and alkaloids
  compounds:
  - flavonoid
  - alkaloid
  note: Additional antioxidant and neuroactive constituents.
  reference_ids:
  - REF-2109
