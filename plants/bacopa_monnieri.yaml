drug_class_interactions:
- drug_class: sedatives-cns-depressants
  severity: caution
  mechanism: Bacopa (brahmi) is traditionally used as a calming, sedative herb; taken with sedatives,
    sleeping tablets or other central-nervous-system depressants (including alcohol) it may add to drowsiness
    and slowed reactions.
  reference_ids:
  - REF-2452
  - REF-2460
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- drug_class: antidepressants-serotonergic
  severity: caution
  mechanism: In a review of adverse-event reports, bacopa taken with antidepressants was linked to back
    pain and heavy sweating (with agomelatine) and to a heart attack (with moclobemide); this rests on
    two reports, with no controlled study.
  reference_ids:
  - REF-5199
  status: draft
