internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0740, REF-0741, REF-0742.
  | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-0742,
  REF-2107, REF-0740, REF-2108, REF-2109, REF-2110, REF-2111, REF-2112, REF-2113, REF-2114, REF-2115) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage
  + constituents) sourced from the existing references bucket; general/undated claims marked status: draft
  per the integrity-first sourcing policy. | 2026-08-14 (harvest-calendar campaign, Batch 5): added
  harvest_readiness for whole-plant + leaf (provisional, basis constituent) - harvest during active
  warm-season growth at the mature/flowering stage when bacoside content peaks, sourced to a growth-stage
  study (Thai J. Agric. Sci., REF-3215; week 12 = peak actives, coinciding with flowering). No
  traditional-collection source located. Existing harvesting.season not inherited.
  | 2026-11-10: symptom-source audit batch 3 - Merged duplicate REF-0038 -> REF-0740 (same
  Calabrese 2008 RCT). REF-0309 (generic "WHO Monographs" 2002; no Bacopa monograph found) removed
  from every symptom as unverifiable.
  | 2026-11-12: symptom-source audit deep re-sweep batch 3 - Deep re-sweep. REF-0309 (WHO 2002
  vol. 2, no Bacopa monograph) purged from the actions. MA REF-2107 moved to direct for
  cognitive-function. Memory: Pase 2012 SR REF-3456, Morgan 2010 RCT REF-3457, Roodenrys 2002 RCT
  REF-3458 added. New anxiety and depression pairs from Calabrese 2008 REF-0740 (STAI and CESD-10
  fell vs placebo; owner rule); Roodenrys 2002 (anxiety unaffected) recorded as no-effect for
  anxiety. Not added: Bacumen 2025 RCT (no cognitive benefit; stress/fatigue secondary), MCI sleep
  RCT (no effect on sleep - no insomnia pair exists).
  | 2026-11-19 (monograph-source audit): botanical_description and habitat cited only REF-2107 (cognition meta-analysis); traditional_uses, constituents[0], preparations[0] and dosage[0] cited REF-2107 + REF-0740 (RCT). RE-SOURCED: Useful Tropical Plants (REF-3971, new) and Wikipedia (REF-3972, new) for the plant and its range; reviews REF-0742 (Ayurvedic memory, sedative, anti-epileptic use) and REF-2113/REF-2108 (bacosides named as active constituents); REF-0740 (300 mg/day for 12 weeks) and REF-2107 (trials of at least 12 weeks; speed of attention) kept for what they report. Dropped as unsupported: 5-15 cm, spatula-shaped, pale lavender flowers, ovoid capsule, flowering year-round, rice paddies, medhya rasayana wording, calming nervine for anxiety and sleep, capsules, standardised to bacoside content, around 300 mg in most trials.
  | 2026-11-24: symptom-source audit research-deepening batch 5 - Searched PubMed (Bacopa monnieri
  / monniera / Herpestis monniera tiab; Bacopa, brahmi ti), Europe PMC, ClinicalTrials.gov (65)
  and OpenAlex. Added: 2026 Brahmi vs Ginkgo network MA (29 RCTs, healthy adults; high dose
  improved working and short-term memory vs placebo, no effect on attention or processing speed)
  to memory and cognitive-function; Stough 2008 90-day RCT to memory; Sathyanarayanan 2013 12-week
  RCT (no effect on any cognitive measure, only a non-significant anxiety trend) recorded as
  no-effect for memory, cognitive-function and anxiety; Micheli 2020 citalopram add-on trial in
  anhedonia to depression. Safety: 2025 review (care with some medicines, hyperthyroidism,
  pregnancy) as a new caution; pharmacovigilance chart review (agomelatine, moclobemide reports)
  as a new DRAFT serotonergic-antidepressant interaction, needs owner sign-off. Memory and
  cognitive-function stay needs-review (status not changed by this pass). Considered, not added:
  Brahmi vati, Brahmi ghrita, Medhya Rasayana and other Ayurvedic formulations; Bacopa + ginseng,
  Pycnogenol, micronutrient and multi-ingredient products; Bacopa vs donepezil (active
  comparator); 2025 older-adult plant NMA ("bacopa compound", a combination); dementia SR 2022
  (very low quality, mixes combinations); ADHD, schizophrenia and Parkinson trials (no vocab
  condition); cevimeline toxicity case (supplement also had phosphatidylserine); necrotising
  myopathy letter (no abstract); in vitro CYP screen (negligible inhibition).'
