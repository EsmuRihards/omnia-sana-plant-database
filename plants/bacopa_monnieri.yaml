id: bacopa-monnieri
scientific_name: Bacopa monnieri
common_names:
- Water Hyssop
- Bacopa
- brahmi
- herb of grace
family: Plantaginaceae
external_ids:
  gbif: 3171169
  wikidata: Q1366575
parts_used:
- Leaf
