  - REF-0746
  status: verified
indications:
- condition: cancer
  note: Polygonum bistorta (Bistorta officinalis) methanol-water and aqueous extracts inhibit hepatocellular
    carcinoma cells via ROS-induced ER stress and apoptosis (delaying xenograft tumour growth), with phenolic
    constituents driving the cytotoxicity (preclinical).
  reference_ids:
  - REF-2122
  - REF-2123
  status: needs-review
- condition: diarrhea
  note: Astringent for mild diarrhoea (tannins tighten the gut lining and reduce excess secretion)
  reference_ids:
  - REF-0746
  status: verified
- condition: infection
