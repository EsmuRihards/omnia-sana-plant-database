  - REF-2123
  status: needs-review
  note: Bistorta officinalis (Polygonum bistorta) rhizome extract, rich in gallotannins and phenolic acids,
    shows cytotoxic and pro-apoptotic activity against hepatocellular and other cancer cells (preclinical).
- action: antidiarrheal
  note: Astringent for mild diarrhoea (tannins tighten the gut lining and reduce excess secretion)
  reference_ids:
  - REF-0746
  - REF-2116
  status: verified
- action: antimicrobial
