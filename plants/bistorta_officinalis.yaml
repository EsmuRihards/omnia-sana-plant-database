- action: astringent
  note: Astringent for mild diarrhoea (tannins tighten the gut lining and reduce excess secretion)
  reference_ids:
  - REF-0746
  status: verified
- action: styptic
  note: Vulnerary and styptic for minor wounds (topical)
  reference_ids:
  - REF-0746
  status: verified
- action: vulnerary
  note: Vulnerary and styptic for minor wounds (topical)
