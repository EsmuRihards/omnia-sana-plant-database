  note: Other rhizome constituents.
  reference_ids: []
botanical_description:
  text: A perennial herb with an S-shaped rootstock bearing tuberous roots. Large oval leaves with heart-shaped
    bases rise directly from the rootstock; they are bluish-green above and ash-grey tinged with purple
    beneath, with stalks and blades each about 15 cm long, the upper part of the stalk winged. The slender,
    erect, unbranched flowering stems, 30-80 cm tall, carry a few smaller leaves on very short stalks
    and end in a dense, cylindrical spike of flesh-pink flowers, each with five coloured sepals and eight
    stamens. It flowers in May and June and again in September and October; the seeds are small, brown
    and shining.
  height: 30-80 cm
  habit: Perennial herb forming clusters of stems from an S-shaped rootstock
  leaves: Large, oval, heart-shaped at the base, bluish-green above, ash-grey tinged purple beneath; stem
    leaves few, smaller, on very short stalks
  flowers: Dense cylindrical spike of flesh-pink flowers, each with five coloured sepals and eight stamens
  stem: Erect, slender, unbranched flowering stem
  root: S-shaped rootstock with tuberous roots
  fruit: Small, brown, shining seeds
  flowering_period: May-June and again September-October
  reference_ids:
  - REF-3997
  - REF-3214
  status: verified
habitat:
  text: Widespread through temperate Eurasia, from northern Europe to Siberia, Japan and western Asia
    to the Himalayas, and in Morocco, though absent from Scandinavia and central Asia. It grows in damp
    meadows and by water, especially on acid soils, and in hilly grassland up to 3,000 m; in Britain it
    is common in northern England and southern Scotland but very rare in Ireland.
  reference_ids:
  - REF-3214
  - REF-3997
  status: verified
harvesting:
  text: The rootstock is gathered in early spring (March), when the leaves are just beginning to shoot,
    and dried. The young leaves and shoots were picked in spring to eat as a vegetable.
  parts:
  - Rhizome (root) and aerial parts
  season: Rootstock in early spring as the leaves begin to shoot; young leaves in spring
  reference_ids:
  - REF-3997
  - REF-3214
  status: verified
harvest_readiness:
- part: rhizome
  signals:
  - "Dig the rhizome in early spring, just as the new leaves begin to shoot (or in autumn); wash and dry."
  basis: traditional
  source_quote: "It is gathered in early spring when the leaves are just beginning to shoot, and then dried"
  reference_ids:
  - REF-3214
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Temperate Plants (REF-3214) for Bistorta officinalis (syn. Persicaria bistorta / Polygonum bistorta). Single source -> provisional."
- part: aerial-parts
  signals:
  - "Gather the leaves/aerial parts young, from spring to early summer, while still tender - they become much tougher as the season advances."
  basis: traditional
  source_quote: "The leaves are available from late winter in most years and can be eaten until the early autumn though they become much tougher as the season progresses"
  reference_ids:
  - REF-3214
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Temperate Plants (REF-3214). The source frames the tender-young window (gather before toughening) rather than a flowering harvest. Single source -> provisional."
traditional_uses:
  text: Bistort root, which contains about 20% tannin, is one of the strongest astringent herbs. It was
    used to stop bleeding, internal or external, including nosebleeds, and for diarrhoea, dysentery and
    other bowel complaints and for haemorrhoids; as a gargle it was used for spongy gums, mouth ulcers
    and sore throats, and the leaves had a reputation for healing wounds. In northern England the leaves
    and young shoots were eaten in spring in a herb pudding, under names such as Easter-ledges and Easter-mangiant.
  reference_ids:
  - REF-3997
  - REF-3214
  status: verified
preparations:
- name: Decoction (rhizome)
  text: Dried rhizome simmered in water as a strongly astringent traditional remedy for diarrhoea, or
    used as a gargle/mouthwash for sore throat.
  reference_ids:
  - REF-0746
  status: verified
- name: Tincture
  text: Alcoholic extract of the dried rhizome.
  status: draft
- name: Poultice/wash
  text: Crushed rhizome or aerial parts applied externally, or used as a wash, for minor wounds and bleeding.
  reference_ids: []
  status: draft
dosage:
- name: Decoction/gargle
  text: Traditional herbal references suggest around 1-2 g of dried rhizome per cup, up to three times
    daily, or used as a gargle. Educational reference only, not a prescription.
  status: draft
actions:
- action: anti-inflammatory
  note: Anti-inflammatory gargle / mouthwash for inflammation of the mouth and throat (sore throat)
  reference_ids:
  - REF-0746
  - REF-2116
  status: verified
- action: anticancer
