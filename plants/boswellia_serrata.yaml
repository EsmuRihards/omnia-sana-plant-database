id: boswellia-serrata
scientific_name: Boswellia serrata
common_names:
- Boswellia
- Indian frankincense
- Salai guggul
- Shallaki
family: Burseraceae
external_ids:
  gbif: 5421354
  powo: 'urn:lsid:ipni.org:names:127067-1'
  wikidata: Q2367334
parts_used:
- Gum resin (oleo-gum-resin)
constituents:
- name: Boswellic acids (pentacyclic triterpenes, especially KBA and AKBA)
  compounds:
  - boswellic-acid
  - terpene
  note: The principal anti-inflammatory compounds; AKBA inhibits 5-lipoxygenase. Absorption improves when
    taken with a high-fat meal.
  reference_ids: []
- name: Other triterpenes and essential oil of the resin
  compounds:
  - essential-oil
  - terpene
  note: Additional constituents of the oleo-gum-resin.
  reference_ids: []
botanical_description:
  text: Small to medium deciduous tree with thin, papery, peeling bark. The leaves are pinnately compound
    with numerous small, toothed leaflets, clustered toward the branch tips. Small, pale yellow to white
    flowers are borne in axillary racemes. When the bark is cut, it exudes a fragrant, resinous gum (oleo-gum-resin)
    that hardens into pale, waxy tears - the medicinal part.
  height: 4-10 m
  habit: Small to medium deciduous tree
  leaves: Pinnately compound with numerous small, toothed leaflets
  flowers: Small, pale yellow to white flowers in axillary racemes
  stem: Thin, papery, peeling bark, exuding resin when cut
  root: Woody root system
  fruit: Small, three-valved capsule
  flowering_period: Varies with climate; typically before or with new leaves
  reference_ids: []
  status: verified
habitat:
  text: Native to dry, rocky, hilly terrain of India and parts of the Middle East and North Africa, where
    it is tapped for its resin much like frankincense (Boswellia sacra).
  reference_ids: []
  status: verified
harvesting:
  text: The bark is deliberately incised and the exuded oleo-gum-resin is allowed to harden and is collected
    over several days to weeks, then cleaned and graded before use or extraction.
  parts:
  - Gum resin (oleo-gum-resin)
  season: Tapped through the dry season
  reference_ids: []
  status: verified
harvest_readiness:
- part: sap
  signals:
  - "Tap the bark (shallow incisions) in the dry season; leave the exuded oleo-gum-resin to accumulate and harden over several days, then collect the hardened resin and sun-dry it."
  basis: traditional
  source_quote: "After tapping a tree in one spot and allowing the secretion of resin to continue for a couple days, they collect the accumulated resin and take it to the common collection center for sun-drying."
  reference_ids:
  - REF-3220
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Banyan Botanicals (REF-3220) for Boswellia serrata; the resin is wild-harvested through the dry season (stated as October to March in India). Single source -> provisional."
traditional_uses:
  text: Boswellia resin (salai guggul) is a mainstay of Ayurvedic medicine for inflammatory joint and
    respiratory conditions, and has been burned as incense across many cultures. Modern standardised extracts,
    rich in boswellic acids, are used for osteoarthritis, inflammatory bowel disease and other inflammatory
    conditions, directly building on this traditional anti-inflammatory reputation.
  reference_ids: []
  status: verified
preparations:
- name: Standardised extract
  text: Resin extract standardised to boswellic acid (often AKBA) content, taken as capsules or tablets,
    ideally with a fat-containing meal to aid absorption.
  reference_ids: []
  status: verified
- name: Resin/incense
  text: Raw resin tears burned as incense or chewed traditionally; not a standardised medicinal dose.
  status: draft
- name: Topical cream
  text: Resin extract formulated into topical creams for joint and skin application.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials in osteoarthritis commonly use extracts providing around 100-250 mg of boswellic
    acids (or several hundred mg of standardised extract) daily, in divided doses, taken with food. Educational
    reference only, not a prescription.
  reference_ids: []
  status: draft
actions:
- action: analgesic
  note: Analgesic (pain relief)
  reference_ids:
  - REF-0422
  - REF-0573
  - REF-1810
  - REF-1816
  status: verified
- action: anti-inflammatory
  note: Anti-inflammatory (inhibits 5-lipoxygenase / leukotriene synthesis and NF-kB signalling); Reduces
    inflammatory markers (e.g. hs-CRP) and, in one RCT, improved knee joint-space and reduced osteophytes
    on radiograph
  reference_ids:
  - REF-0573
  - REF-1809
  - REF-1810
  - REF-1811
  - REF-1812
  - REF-1813
  - REF-1815
  - REF-1816
  - REF-1818
  status: needs-review
- action: anticancer
  reference_ids:
  - REF-1814
  - REF-2873
  - REF-2876
  status: needs-review
  note: Boswellic acids, especially acetyl-11-keto-beta-boswellic acid (AKBA) from Boswellia serrata,
    induce cell-cycle arrest and apoptosis and inhibit proliferation, invasion and metastasis across lung,
    colorectal and prostate cancers (preclinical, incl. in vivo).
indications:
- condition: arthritis
  note: Reduced osteoarthritis pain and stiffness and improved function in meta-analyses and randomized
    trials (from about 4 weeks of use)
  reference_ids:
  - REF-0422
  - REF-0573
  - REF-0574
  - REF-1810
  - REF-3463
  status: verified
  mechanistic_exclude_ids:
  - REF-1811
  - REF-1813
- condition: cancer
  note: Boswellia serrata resin and its triterpenoid AKBA arrest the cell cycle and induce apoptosis in
    non-small-cell lung cancer, suppress colitis-associated colorectal cancer (NF-kB, gut microbiota)
    and inhibit prostate cancer (IL-17 pathway) in vitro and in vivo (preclinical).
  reference_ids:
  - REF-1814
  - REF-2873
  - REF-2876
  status: needs-review
- condition: inflammation
  note: Boswellia extract reduced inflammatory markers and knee osteoarthritis symptoms in a placebo-controlled
    trial; boswellic acids inhibit inflammatory enzymes in lab studies
  reference_ids:
  - REF-0573
  status: needs-review
- condition: pain
  note: Relieved osteoarthritis joint pain in meta-analyses and randomized trials
  reference_ids:
  - REF-0422
  - REF-0573
  - REF-0574
  - REF-1810
  - REF-3463
  status: verified
- condition: skin-irritation
  note: A Boswellia cream reduced radiotherapy skin redness and the need for steroid creams in a randomized
    trial in breast cancer
  reference_ids:
  - REF-3471
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0573
  - REF-1810
  - REF-1811
  - REF-1813
  - REF-1816
- condition: blood-sugar
  note: Boswellia improved blood glucose markers and blood lipids in type 2 diabetes (meta-analysis of
    randomized trials)
  reference_ids:
  - REF-3464
  status: verified
- condition: ibs
  note: A lecithin form of Boswellia extract (Casperome) improved IBS symptoms in a randomized study
  reference_ids:
  - REF-3465
  status: verified
- condition: asthma
  note: A lecithin form of Boswellia extract (Casperome) reduced the need for inhaled asthma medication
    in a randomized add-on study
  reference_ids:
  - REF-3466
  status: verified
- condition: diarrhea
  note: A lecithin form of Boswellia extract (Casperome) shortened acute diarrhoea and reduced stool frequency
    in a randomized study
  reference_ids:
  - REF-3467
  status: verified
- condition: heavy-bleeding
  note: Frankincense (Boswellia serrata resin) reduced heavy menstrual bleeding vs placebo in a randomized
    trial
  reference_ids:
  - REF-3468
  status: verified
- condition: infection
  note: Boswellia serrata vaginal preparation improved thrush symptoms as much as clotrimazole in a randomized
    trial
  reference_ids:
  - REF-3469
  status: verified
- condition: cognitive-function
  note: A Boswellia extract improved memory and processing-speed tests vs placebo in a pilot trial after
    traumatic brain injury
  reference_ids:
  - REF-3470
  status: verified
contraindications:
- note: Generally well tolerated; the most commonly reported side effects are mild gastrointestinal symptoms,
    and allergic reactions are rare.
  severity: info
  reference_ids:
  - REF-0422
  status: verified
- note: Boswellic acids can affect drug-metabolising enzymes, so caution is advised when taking other
    medicines; safety in pregnancy and breastfeeding is not established, so avoid medicinal doses.
  severity: caution
  reference_ids: []
  status: needs-review
