internal_notes: 'Enriched 2026-06-12 from scientific literature (BMC Complementary Medicine and Therapies
  osteoarthritis meta-analysis; review of boswellic acids in chronic inflammatory disease). Originally
  a skeleton imported from the omniasana.bio Symptom-to-Plant Lookup tool (inflammation, arthritis, asthma,
  pain, ibd); associations retained and now part-mapped and cited. Further enriched 2026-06-14 with PubMed-sourced
  evidence - a double-blind RCT in knee osteoarthritis with radiographic and hs-CRP outcomes (REF-0573)
  and an independent systematic review/meta-analysis of supplements for osteoarthritis that ranked Boswellia
  among the few with a large short-term effect on pain (REF-0574). | 2026-06-15: migrated to entity schema
  (actions->vocab ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched
  to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-1809, REF-0573, REF-1810,
  REF-1811, REF-1812, REF-1813, REF-1814, REF-1815, REF-1816, REF-1817, REF-1818) - woven into relevant
  actions/indications and the plant-level references bucket. | 2026-07-11: added monograph-base fields
  (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage) sourced from the
  existing references bucket; general/undated claims marked status: draft per the integrity-first sourcing
  policy. | 2026-07-13: added anticancer action (where absent) + cancer indication (anticancer/antitumour
  research) sourced from the plant''s cited literature, as part of the cancer-condition campaign. |
  2026-08-14 (harvest-calendar campaign, Batch 6): added harvest_readiness for the gum resin (mapped to
  sap; provisional) - tap the bark in the dry season, let the oleo-gum-resin harden over several days, then
  collect and sun-dry; sourced to Banyan Botanicals (REF-3220). Existing harvesting.season not inherited.
  | 2026-11-10: symptom-source audit batch 3 - Purged REF-0423 (boswellic acids of unnamed
  Boswellia species), REF-1817 (Curcuma + Boswellia product), REF-2874/2875 (AKBA, species not
  named). Asthma and IBD rested only on REF-0423.
  | 2026-11-12: symptom-source audit deep re-sweep batch 3 - Deep re-sweep. Aflapin RCT REF-1810
  moved to direct and 2024 MA REF-3463 added for arthritis and pain; the note no longer claims
  rheumatoid arthritis (no RA source). Radiotherapy-cream RCT REF-3471 added to skin-irritation.
  New pairs (owner rule, RCT/MA with benefit): blood-sugar REF-3464, ibs REF-3465, asthma
  REF-3466, diarrhea REF-3467 (Casperome studies), heavy-bleeding REF-3468, infection REF-3469
  (VVC), cognitive-function REF-3470 (TBI pilot). Not added: collagenous-colitis Cochrane 29127772
  ("uncertain"), B. carteri episiotomy trial (other species).'
