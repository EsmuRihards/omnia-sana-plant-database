botanical_description:
  text: Aromatic annual or short-lived perennial herb with soft, hairy, oblong leaves and branching, slightly
    sticky stems. The flower heads are bright orange to yellow, daisy-like, with numerous narrow ray florets
    surrounding a darker central disc, opening in sunlight and closing at dusk.
  height: 30-60 cm
  habit: Erect, branching annual or short-lived perennial herb
  leaves: Soft, hairy, oblong to lance-shaped
  flowers: Bright orange to yellow, daisy-like flower heads with numerous narrow ray florets
  stem: Branching, softly hairy, slightly sticky
  root: Shallow taproot
  fruit: Curved, ridged achene, without pappus
  flowering_period: June to first frost
  reference_ids:
  - REF-0752
  status: verified
habitat:
  text: Widely cultivated as a garden and medicinal plant; believed native to southern Europe and the
    Mediterranean, now naturalised in gardens and waste ground worldwide.
  reference_ids:
  - REF-0752
  status: draft
harvesting:
  text: The flower heads (or just the ray-floret petals) are picked by hand as they open, through the
    flowering season, and dried quickly in a warm, shaded, airy place to preserve colour and resin content.
  parts:
  - Flower
  - Petals
  season: Through the flowering season (summer to autumn), as flowers open
  reference_ids:
  - REF-0752
  status: verified
harvest_readiness:
- part: flower
  signals:
  - "Pick the flower heads (from which the petals are stripped) when fully open, through the flowering season; dry quickly in the shade."
  basis: traditional
  source_quote: "The flowers are also used fresh or dried, for drying they are harvested when fully open and need to be dried quickly in the shade"
  reference_ids:
  - REF-3217
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Temperate Plants (REF-3217) for Calendula officinalis. Both parts_used labels (Flower and Petals) resolve to the flower head, picked when fully open. Single source -> provisional."
traditional_uses:
  text: Calendula flower is one of the most widely used topical wound-healing and skin-soothing herbs
    in Western herbal medicine, applied to cuts, grazes, minor burns and skin inflammation, and used internally
    as a gentle anti-inflammatory and antimicrobial remedy and as a gargle for mouth and throat irritation.
  reference_ids:
  - REF-0752
  status: verified
preparations:
- name: Infused oil
  text: Dried petals infused in a carrier oil, used as a soothing base for topical creams and balms for
    skin healing.
  reference_ids:
  - REF-0752
  status: verified
- name: Cream/ointment
  text: Standardised flower extract formulated into a cream or ointment for topical wound and skin care;
    the best-studied modern form.
  reference_ids:
  - REF-0752
  status: verified
- name: Infusion
  text: Dried flower infused in hot water, 1-2 g in 150 ml, used still warm as a mouth rinse or gargle
    2-4 times daily. The EU herbal monograph's posology for this preparation is OROMUCOSAL only - it does
    not support taking the infusion internally. Educational reference only, not a prescription.
  status: verified
  reference_ids:
  - REF-3065
dosage:
- name: Topical cream/ointment
  text: The EU herbal monograph gives semi-solid preparations containing the equivalent of 2-10% herbal
    substance, applied as a thin layer to the affected area 2 to 4 times daily. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-3065
  status: verified
- name: Infusion/gargle
  text: The EU herbal monograph gives 1-2 g of the flower in 150 mL water as an infusion, used still warm
    for rinsing and gargling 2 to 4 times daily, or to prepare impregnated dressings for the skin. This
    is an oromucosal and cutaneous preparation, not an oral tea. Educational reference only, not a prescription.
  reference_ids:
  - REF-3065
  status: verified
constituents:
