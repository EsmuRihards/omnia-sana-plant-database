botanical_description:
  text: A very aromatic annual herb, much branched from the base and 30-60 cm tall, with angular, hairy,
    solid stems. The leaves are stalkless and light green, with glandular hairs on both surfaces; the
    lower leaves are spoon-shaped and 10-20 cm long, the upper ones oblong and 4-7 cm long. The flower
    heads sit in bracts covered with long glandular hairs; the strap-shaped ray florets are bright yellow
    or orange and 15-25 mm long, and in cultivated plants often form several rows. The flowers close in
    the dark and when rain is expected. The fruits are narrowly oblong, strongly curved achenes 10-12
    mm long, the outer ones warty-ribbed and the inner ones prickly-warty.
  height: 30-60 cm
  habit: Very aromatic annual herb, much branched from the base
  leaves: Stalkless, light green, with glandular hairs on both surfaces; lower leaves spoon-shaped, 10-20
    cm long; upper leaves oblong, 4-7 cm long
  flowers: Flower heads with glandular-hairy bracts; ray florets bright yellow or orange, 15-25 mm long,
    often in several rows in cultivated plants; they close in the dark and when rain is expected
  stem: Angular, hairy and solid
  fruit: Narrowly oblong, strongly curved achenes 10-12 mm long; outer ones warty-ribbed, inner ones prickly-warty
  flowering_period: June to November
  reference_ids:
  - REF-3957
  - REF-3958
  - REF-3217
  status: verified
habitat:
  text: Not known in the wild; it probably originated in the Mediterranean region. It occurs as a garden
    escape on waste, cultivated and arable land and along roadsides, and is cultivated commercially in
    North America, the Balkans, Eastern Europe and Germany. The WHO monograph describes it as indigenous
    to central, eastern and southern Europe.
  reference_ids:
  - REF-3217
  - REF-3958
  - REF-3957
  status: verified
harvesting:
  text: The flowers are used fresh or dried. For drying they are picked when fully open and dried quickly
    in the shade. The medicinal material is the dried ray florets (the petals) or the whole flower heads.
  parts:
  - Flower
  - Petals
  season: When the flowers are fully open; the plant flowers from June to November
  reference_ids:
  - REF-3217
  - REF-3957
  - REF-3958
  status: verified
harvest_readiness:
- part: flower
  signals:
  - "Pick the flower heads (from which the petals are stripped) when fully open, through the flowering season; dry quickly in the shade."
  basis: traditional
  source_quote: "The flowers are also used fresh or dried, for drying they are harvested when fully open and need to be dried quickly in the shade"
  reference_ids:
  - REF-3217
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Temperate Plants (REF-3217) for Calendula officinalis. Both parts_used labels (Flower and Petals) resolve to the flower head, picked when fully open. Single source -> provisional."
traditional_uses:
  text: In pharmacopoeial and traditional medicine calendula flowers are applied externally to superficial
    cuts, wounds, leg ulcers and minor inflammations of the skin and of the lining of the mouth. Folk
    medicine also used them for amenorrhoea, angina, fevers, gastritis, low blood pressure, jaundice,
    rheumatism and vomiting, uses the WHO monograph notes are not supported by experimental or clinical
    data. The EU herbal monograph accepts traditional use for minor skin inflammation such as sunburn,
    as an aid in healing minor wounds, and for minor inflammation in the mouth or throat.
  reference_ids:
  - REF-3957
  - REF-3065
  status: verified
preparations:
- name: Infused oil
  text: An oily extract of the flowers, 1 part flower to 10 parts of a fatty vegetable oil such as olive
    oil, is one of the herbal preparations the EU herbal monograph lists for use on the skin.
  reference_ids:
  - REF-3065
  status: verified
- name: Cream/ointment
  text: Flower preparations made into creams and ointments for use on the skin. The WHO monograph gives
    ointments of 2-5%, and the EU herbal monograph semi-solid forms containing the equivalent of 2-10%
    of the flower. Topical calendula extract is the form tested in wound-healing studies, with mixed results
    in a systematic review.
  reference_ids:
  - REF-3957
  - REF-3065
  - REF-0752
  status: verified
- name: Infusion
  text: Dried flower infused in hot water, 1-2 g in 150 ml, used still warm as a mouth rinse or gargle
    2-4 times daily. The EU herbal monograph's posology for this preparation is OROMUCOSAL only - it does
    not support taking the infusion internally. Educational reference only, not a prescription.
  status: verified
  reference_ids:
  - REF-3065
dosage:
- name: Topical cream/ointment
  text: The EU herbal monograph gives semi-solid preparations containing the equivalent of 2-10% herbal
    substance, applied as a thin layer to the affected area 2 to 4 times daily. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-3065
  status: verified
- name: Infusion/gargle
  text: The EU herbal monograph gives 1-2 g of the flower in 150 mL water as an infusion, used still warm
    for rinsing and gargling 2 to 4 times daily, or to prepare impregnated dressings for the skin. This
    is an oromucosal and cutaneous preparation, not an oral tea. Educational reference only, not a prescription.
  reference_ids:
  - REF-3065
  status: verified
constituents:
- name: Triterpene saponins (oleanolic acid glycosides, calendulosides)
  compounds:
  - triterpene-saponin
  - saponin
  note: 'The major constituents of the flower: triterpene saponins (2-10%) based on oleanolic acid, the
    calendulosides.'
  reference_ids:
  - REF-3957
- name: Flavonoids and carotenoids
  compounds:
  - flavonoid
  - carotenoid
  note: Flavonoids, the 3-O-glycosides of isorhamnetin and quercetin (including astragalin, hyperoside,
    isoquercitrin and rutin), are among the major constituents; carotenoids are also present.
  reference_ids:
  - REF-3957
  - REF-0753
- name: Essential oil, sesquiterpenes and triterpenes
  compounds:
  - essential-oil
  note: Other constituents include essential oil, sesquiterpenes such as caryophyllene, and triterpenes
    such as alpha- and beta-amyrin, lupeol and lupenone; polysaccharides have also been reported.
  reference_ids:
  - REF-3957
