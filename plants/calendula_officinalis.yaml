contraindications:
- note: Do not use if allergic to plants of the daisy family (Asteraceae); skin sensitisation (contact
    allergy) has been reported, and about 2 in 100 people in a clinic series of patch tests reacted to
    marigold. Not recommended in pregnancy or breastfeeding because safety has not been established, nor
    as a medicine for children under 6 (on the skin) or under 12 (mouth and throat) (EU herbal monograph).
    Calendula in food and tea is generally considered safe, and cosmetic ingredients from the flower were
    not irritating or sensitising in tests.
  severity: caution
  reference_ids:
  - REF-3065
  - REF-5229
  - REF-5219
  - REF-5176
  status: verified
- note: 'Duke (2002) rates calendula (Calendula officinalis) and notes anti-inflammatory, wound-healing
    (vulnerary), antifungal, and antispasmodic activities at experimental levels. Commission E (KOM) approves
    calendula flower for wound healing and anti-inflammatory uses, both topically and as a gargle. The
    plant contains flavonoids, triterpene saponins (oleanolic acid glycosides), and essential oils. Dose:
    1–2 g dried flower as tea (for mouth rinse/gargle); or as cream/ointment containing 2–5% calendula
    extract for topical use. Duke notes that calendula is generally very well-tolerated, though Asteraceae
    sensitivity can occasionally cause allergic reactions (Duke, 2002).'
  severity: info
  reference_ids:
