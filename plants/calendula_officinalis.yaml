- condition: cancer
  note: A Calendula officinalis (LACE) aqueous extract inhibits proliferation (70-100%) of leukemia, melanoma,
    breast, prostate, lung and colon cancer cell lines via G0/G1 arrest and caspase-3 apoptosis and inhibits
    melanoma growth in nude mice; a systematic review documents its cytotoxic and antimetastatic antitumour
    activity (preclinical).
  reference_ids:
