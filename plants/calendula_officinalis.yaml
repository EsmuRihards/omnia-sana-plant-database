internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0752, REF-0753, REF-0754.
  | 2026-06-20: enriched to >=10 scientific publications: added 10 PubMed-verified @article sources (REF-0752,
  REF-0753, REF-2124, REF-2125, REF-2126, REF-2127, REF-2128, REF-2129, REF-2130, REF-2131) - woven into
  relevant actions/indications and the plant-level references bucket. | 2026-07-11: added monograph-base
  fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage + constituents)
  sourced from the existing references bucket; general/undated claims marked status: draft per the integrity-first
  sourcing policy. | 2026-07-18 (dosage-sourcing campaign, batch 1): both dosage entries sourced to the
  current EU herbal monograph on Calendula officinalis L., flos, Rev 1 (EMA/HMPC/437450/2017 = REF-3065).
  Topical entry corrected 2-3x -> 2 to 4 times daily and given the monograph''s 2-10% herbal-substance
  strength. Infusion entry corrected: the monograph gives 1-2 g in 150 mL used 2-4x daily for rinsing/gargling
  and for impregnated dressings, i.e. oromucosal/cutaneous use only - calendula flower has no EU-monograph
  oral-tea posology, and the text now says so explicitly. status -> verified. Preparations sourced 2026-07-20
  to monographs already on this record. Each supporting quote was checked to appear verbatim in the stored
  monograph posology, the reference confirmed present on the plant, and the dose form / plant part / route
  checked for mismatch; text rewritten to the source rather than having a reference stapled on. | 2026-08-14
  (harvest-calendar campaign, Batch 6): added harvest_readiness for the flower (provisional) - pick the
  flower heads when fully open (both parts_used labels, Flower and Petals, resolve to the flower head);
  sourced to Useful Temperate Plants (REF-3217). Existing harvesting.season not inherited.
  | 2026-11-10: symptom-source audit batch 3 - REF-0183 purged as a phantom: the "double-blind RCT
  of a monograph-based Calendula cream" (Nicolaus 2017) is not in PubMed and had no DOI or
  journal; it had lifted 6 pairs to 5/10. REF-0112 (Hoffmann) removed from every symptom as
  unverifiable. REF-0199 (rat excision wounds) kept for wounds only. Added REF-0752 (SR: some
  evidence for wound healing) and REF-2125 (RCT, burn wounds, positive) to wounds.
  | 2026-11-12: symptom-source audit deep re-sweep batch 3 - Deep re-sweep. Skin-irritation was
  inferred only although trials exist: Pommier 2004 phase III REF-3472, 2015 RCT REF-3473, 2025
  contact-dermatitis RCT REF-3474 and diaper-dermatitis RCT REF-3475 added; 2021 radiation RCT
  REF-3476 (no difference from sorbolene) recorded as no-effect. Hand-wound RCT REF-3477 added to
  wounds. Held VVC RCT REF-0754 wired to infection. Owner answer (batch 3): systematic reviews of
  lab/animal studies keep scoring as SRs - REF-2124 (cancer) left as tagged.'
