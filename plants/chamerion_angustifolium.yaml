dangerous_lookalikes:
- dangerous_plant: veratrum-album
  severity: fatal
  confused_part: Young shoots and leaves, gathered in spring to cook as greens or picked for tea.
  confusion_context: 'No recorded case of fireweed being mistaken for white hellebore (Veratrum album)
    was found, so this warning is a precaution. White hellebore grows in Europe and western Asia, every
    part of it is poisonous, and it is regularly gathered by mistake: it has been taken for yellow gentian,
    for wild garlic eaten in salads and soups, and, at a youth camp, among herbs collected to make fresh
    tea. In one case series symptoms began within 15-30 minutes: nausea, vomiting and abdominal pain,
    then dizziness, disturbed vision, a slow heart rate and low blood pressure.'
  distinguishing_features:
  - 'Leaf shape: fireweed has narrow, lance-shaped leaves with smooth (entire) edges, arranged spirally
    up the stem; white hellebore has pleated leaves on a stout stem.'
  - 'Leaf veins (fireweed): the side veins join together to form one continuous vein running just inside
    the leaf edge.'
  key_test: 'Check the leaves. Narrow, lance-shaped leaves whose side veins join into one vein just inside
    the edge are fireweed. Pleated leaves are not fireweed: do not eat or brew them.'
