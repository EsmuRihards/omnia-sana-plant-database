botanical_description:
  text: A herbaceous perennial with usually simple, erect, smooth, reddish stems 0.5-2 m tall (Grieve
    gives up to about 2.4 m), spreading by creeping stems. The leaves are scattered and spirally arranged,
    narrowly lance-shaped and willow-like, with the side veins joining in a continuous vein just inside
    the margin. The flowers, 2-3 cm across with four magenta to pink petals, grow in a tall terminal raceme
    that blooms progressively from the bottom upwards. The upright, reddish-brown seed capsule splits
    open to release tiny seeds, each with a tuft of silky white hairs that the wind carries away.
  height: 0.5-2 m
  habit: Herbaceous perennial spreading by creeping stems
  leaves: Scattered, spirally arranged, narrowly lance-shaped, willow-like
  flowers: 2-3 cm across, four magenta to pink petals, in a tall terminal raceme opening from the bottom
    upwards
  stem: Usually simple, erect, smooth, reddish
  fruit: Upright reddish-brown capsule releasing seeds with tufts of silky hairs
  reference_ids:
  - REF-3374
  - REF-3999
  status: verified
habitat:
  text: Native across the temperate Northern Hemisphere, including large parts of the boreal forests.
    It grows by moist riversides and in copses, and springs up on cleared or burned ground, including
    waste ground left after buildings are demolished; in North America it is one of the plants called
    fireweed because it appears on land recently cleared by fire.
  reference_ids:
  - REF-3374
  - REF-3999
  - REF-0118
  status: verified
harvesting:
  text: The young shoots and leaves are the parts eaten; the young shoots are boiled and eaten like asparagus.
    The leaves are used to make tea, known in Russia as Ivan-chai or Kaporie tea. Before eating or brewing
    it, rule out white hellebore (Veratrum album), a poisonous plant regularly gathered by mistake for
    wild garlic, yellow gentian and herbs for tea (see Dangerous Lookalikes).
  parts:
  - Flower
  - Leaf
  - Young sprouts
  season: Young shoots and leaves while young (spring); leaves for tea
  reference_ids:
