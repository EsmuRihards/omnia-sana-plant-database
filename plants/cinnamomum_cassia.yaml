internal_notes: 'Enriched 2026-06-12 from scientific literature (Annals of Family Medicine meta-analysis;
  cassia-bark glucose/lipid meta-analysis). Originally a skeleton imported from the omniasana.bio Symptom-to-Plant
  Lookup tool (blood-sugar, high-cholesterol, indigestion); associations retained and now part-mapped
  and cited. NOTE coumarin/liver caution vs Ceylon cinnamon. Further enriched 2026-06-14 with two recent
  PubMed-sourced meta-analyses of RCTs - an updated dose-response meta-analysis (REF-0598; lower fasting
  glucose, HbA1c and HOMA-IR) and a 28-RCT review (REF-0599; capsule form at <=2 g/day also improved the
  lipid profile and BMI). | 2026-06-15: migrated to entity schema (actions->vocab ids, indications split
  out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific publications: added
  10 PubMed-verified @article sources (REF-1819, REF-1820, REF-1821, REF-1822, REF-1823, REF-1824, REF-1825,
  REF-1826, REF-1827, REF-1828) - woven into relevant actions/indications and the plant-level references
  bucket. | 2026-07-11: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage) sourced from the existing references bucket; general/undated claims marked status:
  draft per the integrity-first sourcing policy. | 2026-08-14 (harvest-calendar campaign, Batch 8): added
  harvest_readiness for the bark (provisional) - cut coppiced stems and peel the inner bark in the rainy
  season, when the bark is most pliable; sourced to RawSpiceBar (REF-3230, which names Cinnamomum cassia).
  No prior harvesting.season existed.
  | 2026-11-10: symptom-source audit batch 4 - Owner rule 2026-11-11: clinical evidence on unnamed
  "cinnamon" goes to Cassia (the species most trials used, e.g. Khan 2003, Akilen 2010). Added
  REF-0006, REF-0136, REF-0666, REF-0667 here (moved from True cinnamon).
  | 2026-11-12: symptom-source audit deep re-sweep batch 4 - Deep re-sweep. Cochrane "Cinnamon for
  diabetes mellitus" 2012 REF-3498 ("insufficient evidence"), cassia IGT RCT REF-3500 and
  Vanschoonbeek 2006 RCT REF-3501 (no glycaemic or lipid effect) recorded as no-effect; positive
  2012 MA REF-3499 added. Arterial-stiffness RCT REF-3502: no BP/lipid/vascular change (no-effect
  for cardiovascular-support) but lower weight and HbA1c (metabolic-support). New diarrhea pair
  from RCT REF-3503 (owner rule). Notes now state the mixed evidence.
  | 2026-11-19 (monograph-source audit): traditional_uses, constituents[0-2], preparations[0] and dosage[0] cited only REF-0430 (meta-analysis of cassia powder in type 2 diabetes, whose pooled result was NOT significant). RE-SOURCED: traditional use from reviews REF-1821/REF-1824 and REF-1822; cinnamaldehyde 85% of the oil Ooi 2006 (REF-3975, new); procyanidins A1/A2/B1/C1 Dai 2024 (REF-3976, new); coumarin Choi 2001 (REF-3977, new) + Blahova 2012 (REF-3978, new; cassia-type ground cinnamon 2.65-7.0 mg/g, Ceylon none). REF-0430 kept for what it reports (1-2 g/day for 90 days, no significant effect). Dropped as unsupported: rou gui and warming/cold-type wording, circulation and metabolic support, insulin-sensitising, capsules, standardised extract, 1-6 g, prefer Ceylon cinnamon, key safety-limiting. FOLLOW-UP (not done here): check whether REF-0430, a null pooled result, sits in any indication''s reference_ids (invariant 7).'
