id: cinnamomum-cassia
scientific_name: Cinnamomum cassia
common_names:
- Cassia Cinnamon
- Chinese cinnamon
- Cassia bark
- Rou gui
family: Lauraceae
external_ids:
  gbif: 6688
  powo: 'urn:lsid:ipni.org:names:77109079-1'
  wikidata: Q204148
parts_used:
- Bark
constituents:
- name: Cinnamaldehyde (cinnamic aldehyde)
  note: The main constituent of cassia bark essential oil, about 85% of the oil; the oil's broad antimicrobial
    activity in laboratory tests is attributed to it.
  reference_ids:
  - REF-3975
- name: Procyanidins
  compounds:
  - proanthocyanidin
  - phenolic-compound
  note: Nine procyanidins, including procyanidins A1, A2, B1 and C1, were identified in cassia bark as
    antioxidants and as inhibitors of the digestive enzymes alpha-glucosidase and pancreatic lipase in
    laboratory tests.
  reference_ids:
  - REF-3976
- name: Coumarin
  compounds:
  - coumarin
  note: Coumarin has been isolated from Cinnamomum cassia bark oil. Ground cinnamon from Czech shops,
    identified as cassia cinnamon by its coumarin, contained about 2.7-7.0 mg/g, while a Ceylon cinnamon
    (Cinnamomum verum) sample from Sri Lanka contained none.
  reference_ids:
  - REF-3977
  - REF-3978
botanical_description:
  text: Evergreen tree with smooth, aromatic, reddish-brown bark and leathery, oval leaves with three
    prominent longitudinal veins. Small, pale yellow-green flowers are borne in panicles, followed by
    small, dark, single-seeded berries. The dried inner bark, rolled into thick, dark reddish-brown quills,
    is the cassia cinnamon of commerce.
  height: Up to 10-15 m
  habit: Evergreen tree
  leaves: Leathery, oval, with three prominent longitudinal veins
  flowers: Small, pale yellow-green, in panicles
  stem: Smooth, aromatic, reddish-brown bark
  root: Woody root system
  fruit: Small, dark, single-seeded berry
  flowering_period: Varies with climate
  status: draft
habitat:
  text: Native to southern China and mainland Southeast Asia; cultivated extensively in China, Vietnam
    and Indonesia on warm, humid, tropical to subtropical hillsides.
  status: draft
harvesting:
  text: The bark is stripped from branches and stems of mature trees, then dried; as it dries it curls
    into the characteristic thick quills of cassia cinnamon, distinctly darker and rougher than the thin,
    tightly rolled quills of true (Ceylon) cinnamon.
  parts:
  - Bark
  status: draft
harvest_readiness:
- part: bark
  signals:
  - "Cut the coppiced stems close to the ground during the rainy season, when the bark is most pliable and loosest, then strip the outer bark and carefully peel the inner bark."
  basis: traditional
  source_quote: "Harvesting is usually done during the rainy season when the bark is more pliable."
  reference_ids:
  - REF-3230
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "RawSpiceBar (REF-3230), which names Cinnamomum cassia and describes cutting the stems and peeling the inner bark in the rainy season. Single source -> provisional."
traditional_uses:
  text: 'Cassia bark is a common traditional Chinese medicine, used to promote the secretion of gastric
    juice and digestion and to improve the function of the gut, and it is also used in Unani, Ayurvedic
    and Japanese traditional medicine for indigestion, peptic ulcer disease and ischaemic brain injury.
    It is a widely used spice. Trials of the bark in type 2 diabetes have given mixed results: a meta-analysis
    of trials using 1-2 g of ground bark a day for 40-90 days found no significant reduction in blood
    glucose or lipids.'
  reference_ids:
  - REF-1822
  - REF-1824
  - REF-1821
  - REF-0430
  status: verified
preparations:
- name: Ground bark powder
  text: Ground cassia bark in capsules is the form tested in trials in type 2 diabetes; a meta-analysis
    of eight trials using 1-2 g a day for 40-90 days found no significant reduction in fasting glucose,
    HbA1c or blood lipids.
  reference_ids:
  - REF-0430
  status: verified
- name: Decoction/infusion
  text: Bark simmered or infused in hot water as a warming traditional digestive tea.
  status: draft
- name: Culinary use
  text: Ground bark or whole quills used as a food spice, the most common traditional and modern form
    of use.
  status: draft
dosage:
- name: Ground bark powder (trials)
  text: In the eight trials pooled in a 2021 meta-analysis, people with type 2 diabetes took 1-2 g of
    ground cassia bark a day in capsules for 40-90 days; the pooled result showed no significant reduction
    in fasting glucose, HbA1c or blood lipids. Educational reference only, not a prescription.
  reference_ids:
  - REF-0430
  status: verified
actions:
- action: antidiabetic
  note: Lowers fasting blood glucose as an adjunct in type 2 diabetes (evidence is positive but mixed)
    - recent meta-analyses report reduced fasting glucose, HbA1c and HOMA-IR
  reference_ids:
  - REF-0429
  - REF-0598
  - REF-0599
  - REF-1820
  - REF-1821
  - REF-1823
  - REF-1828
  status: verified
- action: carminative
  note: Warming carminative for indigestion (traditional)
  reference_ids:
  - REF-1822
  - REF-1824
  - REF-1825
  - REF-1826
  status: needs-review
- action: lipid-lowering
  note: Improves the lipid profile (lowers total and LDL cholesterol and triglycerides)
  reference_ids:
  - REF-0429
  - REF-0599
  - REF-1821
  status: verified
indications:
- condition: bloating
  note: inferred from carminative action
  reference_ids: []
  status: needs-review
  mechanistic_exclude_ids:
  - REF-1822
  - REF-1825
  - REF-1826
- condition: blood-sugar
  note: Cinnamon (mostly cassia) lowered fasting glucose in several meta-analyses, but a Cochrane review
    judged the evidence insufficient and some trials found no effect on glucose control or insulin sensitivity.
    A 2021 meta-analysis of cassia bark powder (1-2 g a day) also found no significant effect on fasting
    glucose or HbA1c.
  reference_ids:
  - REF-0429
  - REF-0598
  - REF-0599
  - REF-0006
  - REF-0136
  - REF-0667
  - REF-3499
  status: verified
  null_result_ids:
  - REF-3498
  - REF-3500
  - REF-3501
  - REF-0430
- condition: cardiovascular-support
  note: Cinnamon improved blood pressure and blood lipids in some meta-analyses and trials, mostly in
    type 2 diabetes; a trial of cassia found no change in arterial stiffness, blood pressure or lipids.
    A 2021 meta-analysis of cassia bark powder found no significant effect on blood lipids.
  reference_ids:
  - REF-0429
  - REF-0599
  - REF-0006
  - REF-0136
  - REF-0666
  - REF-0667
  status: needs-review
  null_result_ids:
  - REF-3502
  - REF-0430
- condition: high-cholesterol
  note: Cinnamon lowered total cholesterol and triglycerides (LDL less consistently) in meta-analyses
    of trials, mostly in type 2 diabetes; some trials found no change. A 2021 meta-analysis of cassia
    bark powder (1-2 g a day) found no significant effect on total, LDL or HDL cholesterol or triglycerides.
  reference_ids:
  - REF-0429
  - REF-0599
  - REF-0136
  - REF-0666
  - REF-0667
  status: needs-review
  null_result_ids:
  - REF-3501
  - REF-0430
- condition: metabolic-support
  note: Cinnamon improved glucose, lipids and body weight in people with type 2 diabetes (meta-analyses;
    randomized trials). A 2021 meta-analysis of cassia bark powder (1-2 g a day) found no significant
    effect on glucose or lipids.
  reference_ids:
  - REF-0429
  - REF-0598
  - REF-0599
  - REF-0006
  - REF-0136
  - REF-0667
  - REF-3502
  status: needs-review
  null_result_ids:
  - REF-0430
- condition: diarrhea
  note: A cassia cinnamon water extract eased diarrhoea symptoms vs placebo in a randomized trial
  reference_ids:
  - REF-3503
  status: verified
- condition: menstrual-cramps
  note: Cinnamon capsules reduced period pain more than placebo in two double-blind randomized trials,
    one of which also found less nausea and vomiting (cinnamon species not stated)
  reference_ids:
  - REF-5262
  - REF-5263
  status: verified
- condition: wounds
  note: A cinnamon ointment reduced perineal pain and improved healing of episiotomy wounds more than
    placebo in a double-blind randomized trial (cinnamon species not stated)
  reference_ids:
  - REF-5264
  status: verified
- condition: high-blood-pressure
  note: Cinnamon supplements modestly lowered systolic and diastolic blood pressure in meta-analyses of
    randomized trials, confirmed by a 2024 umbrella review (cinnamon species often not stated)
  reference_ids:
  - REF-5265
  - REF-5266
  - REF-5267
  status: verified
contraindications:
- note: 'Cassia bark contains coumarin, which can damage the liver; a subgroup of people is especially
    sensitive to it. The tolerable daily intake is 0.1 mg of coumarin per kg of body weight, and heavy
    consumers of cassia cinnamon can reach it: ground cassia-type cinnamon has contained about 2.7-7.0
    mg of coumarin per gram, while a Ceylon cinnamon (Cinnamomum verum) sample contained none.'
  severity: info
  reference_ids:
  - REF-3977
  - REF-4025
  - REF-3978
  status: verified
- note: Its blood-sugar-lowering action means it can add to the effect of diabetes medicines (risk of
    hypoglycaemia); avoid concentrated/medicinal doses in pregnancy (culinary amounts are fine).
  severity: caution
  reference_ids:
  - REF-0429
  status: verified
- note: 'Allergy: cinnamon (cinnamaldehyde) can cause immediate allergic reactions; in reported cases,
    people first sensitised by inhaling heated, cinnamon-flavoured fog-machine or shisha vapour later
    had severe reactions, including anaphylaxis, to spiced food.'
  severity: caution
  reference_ids:
  - REF-5268
  status: verified
