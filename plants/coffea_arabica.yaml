  - REF-5274
  status: verified
  note: Green coffee bean extract (about 500 mg chlorogenic acid a day) lowered body weight, and green
    coffee lowered fasting blood sugar, insulin and triglycerides, in meta-analyses of randomized trials;
    coffee drinking has been linked to lower type 2 diabetes risk (review); coffee-leaf extracts lowered
    blood glucose in lab studies
- condition: liver-support
  note: Drinking more coffee was linked to a much lower risk of liver cirrhosis in a meta-analysis of
    observational studies
  reference_ids:
  - REF-0135
  status: verified
- condition: blood-sugar
  note: Coffee drinking, caffeinated or decaffeinated, was linked to a lower risk of type 2 diabetes in
    a meta-analysis of prospective studies
  reference_ids:
