botanical_description:
  text: An evergreen shrub or small tree; wild plants grow 9-12 m tall with an open branching system.
    The leaves are opposite, simple, elliptic-ovate to oblong, 6-12 cm long and 4-8 cm broad, glossy dark
    green with prominent veins and wavy margins. White flowers, 10-15 mm across, grow in clusters of two
    to nine in the leaf axils. The fruit is a drupe (the coffee 'cherry') 10-15 mm across, ripening bright
    red to purple and usually holding two seeds, the coffee beans.
  height: 9-12 m in the wild
  habit: Evergreen shrub or small tree with an open branching system
  leaves: Opposite, elliptic-ovate to oblong, 6-12 x 4-8 cm, glossy dark green, prominent veins, wavy
    margins
  flowers: White, 10-15 mm across, in axillary clusters of two to nine
  fruit: Drupe ('cherry') 10-15 mm, ripening bright red to purple, usually with two seeds
  reference_ids:
  - REF-3235
  status: verified
habitat:
  text: Native to the highland forests of Ethiopia and South Sudan; cultivated across the tropical highland
    belt worldwide (Latin America, Africa, Asia) at elevation, on well-drained, often volcanic soils.
  status: draft
harvesting:
  text: Ripe red berries are hand- or machine-picked, then processed (washed or dried) to remove the fruit
    pulp and expose the two seeds ('beans'), which are dried, hulled and roasted before use.
  parts:
  - Seed
  status: draft
harvest_readiness:
- part: seed
  signals:
  - "Pick the coffee cherries when fully ripe - when the drupe has turned completely bright red (or yellow in some varieties); the two seeds (beans) are inside the ripe cherry."
  basis: traditional
  source_quote: "the plant becomes completely red or yellow depending on the variety of C. arabica. At this point, they are called \"cherries\", which fruit they then resemble, and are ready for picking."
  reference_ids:
  - REF-3235
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Wikipedia, Coffea arabica (REF-3235); the ripe drupe matures 'bright red to purple' and is then ready for picking, the seed being the coffee bean inside. Single source -> provisional."
traditional_uses:
  text: The first written record of coffee brewed from roasted beans comes from Arab scholars, who wrote
    that it helped them work longer hours; Yemen and southern Ethiopia were probably the first places
    the beans were cultivated, and the Yemeni drink spread to the Hejaz, Egypt and Turkey and then around
    the world. Coffee is an active brain stimulant that causes sleeplessness, and was formerly used against
    narcotic poisoning; the Malays infused the leaves, which contain even more caffeine than the berries.
  reference_ids:
  - REF-3235
  - REF-4022
  status: verified
preparations:
- name: Roasted, brewed (culinary/traditional)
  text: Roasted, ground seed brewed with hot water as the classic stimulant beverage; the most common
    form of use worldwide.
  status: draft
- name: Standardised extract
  text: Decaffeinated or standardised green/roasted bean or leaf extract, taken as capsules for antioxidant
    or metabolic support studies.
  reference_ids:
  - REF-2379
  status: verified
dosage:
- name: Brewed coffee
  text: The EFSA Scientific Opinion on the safety of caffeine concluded that habitual caffeine intakes
    up to about 400 mg daily (roughly 3-4 cups of brewed coffee) do not raise safety concerns for healthy
    adults, and that single doses up to 200 mg are likewise not of concern. For pregnant women EFSA sets
    a lower figure of up to 200 mg per day. Note this is a safe-intake ceiling for caffeine, not a therapeutic
    dose of coffee. Educational reference only, not a prescription.
  reference_ids:
  - REF-0081
  status: verified
constituents:
- name: Caffeine
  note: The principal stimulant alkaloid, driving alertness and much of coffee's pharmacological activity.
  reference_ids:
  - REF-2379
  compounds:
  - caffeine
- name: Chlorogenic acids
  compounds:
  - chlorogenic-acid
  - phenolic-acid
  note: Major antioxidant polyphenols of the green and roasted bean, linked to metabolic and hypoglycaemic
    effects.
  reference_ids:
  - REF-2379
- name: Diterpenes (cafestol, kahweol)
  note: Present in unfiltered coffee (e.g. French press, espresso); raise LDL cholesterol, unlike paper-filtered
    coffee where they are largely removed.
