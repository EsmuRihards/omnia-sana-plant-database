- condition: cognitive-function
  note: Caffeine, coffee's signature compound, improves alertness (MedlinePlus; compound evidence); moderate
    coffee drinking (about 2.5 cups a day) was linked to the lowest risk of Alzheimer's disease in a dose-response
    meta-analysis of observational studies
  reference_ids:
