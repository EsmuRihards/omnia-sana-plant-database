  preparations, dosage + constituents) sourced from the existing references bucket; general/undated claims
  marked status: draft per the integrity-first sourcing policy. | 2026-07-19 (dosage-sourcing campaign,
  batch 9): the ''Brewed coffee'' entry is sourced to REF-0081, the EFSA Scientific Opinion on the safety
  of caffeine, which was already in the bibliography and is the authoritative source for the 400 mg/day
  figure the entry already used. EFSA concludes that habitual intakes up to 400 mg/day do not raise safety
  concerns for healthy adults, that single doses up to 200 mg are likewise not of concern, and sets up
  to 200 mg/day for pregnant women. The text now states explicitly that this is a SAFE-INTAKE CEILING
  for caffeine, not a therapeutic dose of coffee - an important framing difference for a dosage field.
  D6 (entity gap) 2026-07-20: this plant named a defining constituent that had NO entity in compounds/,
