internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0788, REF-0789, REF-0790.
  | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-0789,
  REF-2001, REF-2002, REF-2003, REF-2004, REF-2005, REF-2006, REF-2007, REF-2008, REF-2009, REF-2010) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage
  + constituents) sourced from the existing references bucket; general/undated claims marked status: draft
  per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where absent) + cancer
  indication (anticancer/antitumour research) sourced from the plant''s cited literature, as part of the
  cancer-condition campaign. | 2026-07-20: parts_used corrected from ''Flower'' to ''Stigma''. The saffron
  drug is the dried stigma, not the flower; the petals/tepals are a by-product. Three independent reviews
  state this explicitly in their abstracts: Marrone et al. 2024 Nutrients 16(14):2319 doi:10.3390/nu16142319
  ("derived exclusively from dried stigmas"); Bukhari et al. 2018 Biomed Pharmacother 98:733-745 doi:10.1016/j.biopha.2017.12.090
  ("saffron of commercial importance comprises of dried stigmas"); Xing et al. 2021 J Ethnopharmacol 281:114555
  doi:10.1016/j.jep.2021.114555 ("the dried red stigma of the perennial herb Crocus sativus L."). Not
  wired as reference_ids because parts_used carries no reference_ids field in plant.schema.json - recorded
  here instead so the correction is auditable. Adding these as bibliography entries with nothing to cite
  them from would create orphans, which osdb-verify-integrity would then instruct a later session to delete.
  D6 (entity gap) 2026-07-20: this plant named a defining constituent that had NO entity in compounds/,
  so it resolved to nothing and would have emitted no practice recommendation. Entity created and the
  constituent wired to it. Only the molecules the entry already names were wired - no constituent was
  reinterpreted. | 2026-08-14: Harvest Calendar (phenological) - added harvest_readiness for stigma
  (verified: PFAF REF-3239 + independent Wikipedia REF-3240; autumn flowering, stigmas gathered at dawn as
  the flowers open). Safety clause cross-links Dangerous Lookalikes (Colchicum autumnale, fatal): the
  autumn-flowering harvest stage is itself the fatal-confusion window, so the signal names the decisive
  3-vs-6 stamen test. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 5 - REF-0115 is Hosseinzadeh & Nassiri-Asl 2013
  (Avicenna Canon of Medicine and saffron, PubMed 22815242): names antidepressant, hypnotic,
  anti-inflammatory, hepatoprotective, bronchodilatory, emmenagogue uses - kept for insomnia and
  inflammation, removed from 7 pairs.
  | 2026-11-12: symptom-source audit deep re-sweep batch 5 - Deep re-sweep. Depression RCTs
  REF-0005/REF-0172 were filed under six unrelated actions, and depression reviews/RCTs
  REF-0789/2001/2002 plus the ADHD trial REF-2003 under "sedative" - removed (still cited for
  depression / in references). Added: GRADE MA REF-3517 (depression; new anxiety pair with
  REF-2002), sleep RCT REF-3518 (insomnia), OA RCT REF-3519 (arthritis), AD RCT REF-3523
  (cognition, memory). New pairs (owner rule): pms (REF-3520 RCT, REF-3521 MA), menstrual-cramps
  (REF-3521), metabolic-support (REF-3522), blood-sugar (held MA REF-2502 + REF-3522).
  | 2026-11-19 (monograph-source audit): traditional_uses, constituents[0-1], preparations[0] and dosage[0] cited only REF-0788 (saffron vs SSRI meta-analysis; abstract gives no chemistry, form or dose). RE-SOURCED: WHO Stigma Croci vol. 3 (REF-3979, new; uses, constituents, dosage forms, posology); 30 mg/day capsules from the trials REF-0005 (depression vs imipramine), REF-3520 (PMS) and REF-3523 (Alzheimer''s). REF-0172 (PETAL capsules) deliberately not used for the stigma dose. Dropped as unsupported: Mediterranean, Middle Eastern and South Asian tradition wording, colour and scent attributions, antioxidant and mood activity of constituents, standardised to safranal/crocin, metabolic studies, culinary use under 1 g.
  | 2026-11-25: symptom-source audit research-deepening batch 10 - Searched PubMed (Crocus sativus
  / saffron tiab; crocin, safranal ti: 384 HT, 141 SR, 606 SAFE hits; SR/MA read in depth), Europe
  PMC, ClinicalTrials.gov (32) and OpenAlex. Depression (10), anxiety, PMS, period pain, metabolic
  and blood-sugar pairs are already MA-backed and were not padded. Added: 2022 insomnia MA to
  insomnia; NEW high-cholesterol and high-blood-pressure pairs from the 2022 cardiovascular-risk
  dose-response MA; 2026 integrative pregnancy review (low doses promising for labour, excessive
  intake risky) to the pregnancy caution. Not added: erectile-dysfunction MA 2018 (not low libido:
  near-miss, inv. 12c/f), crocin lipid MA 2025 (inconclusive), saffron + fenugreek glucose MA
  (combined), umbrella reviews of depression (already at 10). Europe PMC pass: NEW low-libido pair
  (2024 Tabriz triple-blind RCT, saffron + vitamin E vs vitamin E alone, libido domain improved)
  and NEW menopause pair (2021 affron RCT in perimenopause: psychological symptoms improved,
  vasomotor and somatic did not); CYP1A2 phenotyping study 2019 and two healthy-volunteer safety
  studies (2008 tablets, 2014 coagulation) as info notes; DRAFT anticoagulant interaction from a
  2022 rivaroxaban bleeding case report, stated with the negative 2014 coagulation study (needs
  owner sign-off). HELD pending owner decision: a 2026 data-integrity analysis (Research Integrity
  and Peer Review, PMID 42288935) found that 223 RCTs from one psychopharmacology research group
  were unlikely to have been randomised and cautioned against using them; it estimates the group
  produced about a third of saffron-vs-placebo trials. Three candidate trials share that group''s
  senior author and were not added: hot flushes in postmenopausal depression (PMID 29332222; the
  only positive hot-flush trial, so no hot-flushes pair), fluoxetine-induced sexual dysfunction in
  women (23280545; desire not improved) and female sexual dysfunction (36186931); nor the 2019
  sexual-dysfunction MA pooling such trials (31516855). Existing pairs citing that group are
  unchanged pending the owner. Not added: preprints (Safr''Inside menopause and PMS RCTs 2026,
  glycaemic MA 2026), crocin-only trials outside the vocabulary.'
