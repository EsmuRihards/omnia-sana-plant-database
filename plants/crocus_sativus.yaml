- Stigma
botanical_description:
  text: Small, cormous perennial with narrow, grass-like, dark green leaves emerging with or just after
    the flowers. Each flower is a delicate lilac-purple, six-petalled bloom with three golden-yellow anthers
    and a single style dividing into three long, deep-red, thread-like stigmas - the saffron of commerce.
    The plant is a sterile triploid that never sets seed and is propagated entirely by division of its
    underground corms.
  height: 10-20 cm
  habit: Small, cormous, autumn-flowering perennial
  leaves: Narrow, grass-like, dark green, emerging with or just after the flowers
  flowers: Lilac-purple, six-petalled, with three golden anthers and three long deep-red stigma threads
  stem: Very short; flowers arise almost directly from the corm
  root: Underground corm with fibrous roots
  fruit: Sterile triploid; does not set seed, propagated by corm division
  flowering_period: Autumn (October-November)
  status: draft
habitat:
  text: Believed to have originated in Greece or Crete and spread through cultivation across the Mediterranean,
    Middle East and Asia (notably Iran, Kashmir and Spain); grown in sunny, well-drained fields with hot,
    dry summers and cool, wet autumns/winters.
  status: draft
harvesting:
  text: The flowers are hand-picked at dawn as they open, and the three red stigma threads are immediately
    hand-separated from each flower and dried - an extremely labour-intensive process (many thousands
    of flowers are needed for a small amount of dried saffron), which accounts for saffron's high cost.
  parts:
  - Flower
  season: Autumn, at flowering, harvested at dawn
  status: draft
harvest_readiness:
- part: stigma
  signals:
  - "Gather the crimson stigmas in autumn as the flowers open: pick the flowers at dawn on the day they bloom, before they wilt, and hand-separate the three red styles/stigmas."
  basis: traditional
  source_quote: "It is in flower in October. The styles are harvested in the autumn when the plant is in flower and are dried for later use."
  reference_ids:
  - REF-3239
  - REF-3240
  independent_confirmation: "Wikipedia (REF-3240), an independent non-Ken-Fern prism, confirms the same autumn/dawn stage: 'Only in October ... do its brilliantly hued flowers develop' and 'after blossoming at dawn, flowers quickly wilt as the day passes.'"
  species_confirmed: true
  status: verified
  notes: "PFAF (REF-3239, Ken Fern lineage) and Wikipedia (REF-3240, independent) agree: autumn flowering, stigmas gathered as the flowers open at dawn. SAFETY: the autumn-flowering harvest stage coincides exactly with the deadly Colchicum autumnale (autumn crocus / meadow saffron), a classic fatal confusion. Confirm identity before gathering - see Dangerous Lookalikes: true saffron (Crocus sativus, Iridaceae) has exactly THREE stamens and three long deep-red saffron threads, whereas Colchicum (Colchicaceae) has SIX stamens and no red threads and is lethally toxic (colchicine, no ready antidote). If in any doubt, do not harvest."
traditional_uses:
  text: In traditional medicine saffron was used as an emmenagogue and for absent periods, abdominal pain,
    coughs, depression, digestive ailments, fever and the pain of wounds, and also as an aphrodisiac,
    appetite stimulant, diaphoretic, contraceptive, antispasmodic and nerve sedative; pharmacopoeias describe
    it as a tonic, sedative and emmenagogue. A meta-analysis of eight randomised trials found no significant
    difference between saffron and SSRI antidepressants in reducing depressive symptoms, with fewer adverse
    events on saffron.
  reference_ids:
  - REF-3979
  - REF-0788
  status: verified
preparations:
- name: Stigma extract (capsules)
  text: Extracts of the dried stigmas are a recognised dosage form. Saffron capsules were the form tested
    in randomised trials, including eight trials comparing saffron with SSRI antidepressants for depression.
  reference_ids:
  - REF-3979
  - REF-0788
  - REF-0005
  status: verified
- name: Infusion
  text: A few dried stigma threads steeped in hot water or milk, a traditional culinary and mild medicinal
    preparation.
  status: draft
- name: Culinary use
  text: Dried stigma threads used as a spice and natural dye/flavouring in cooking, the most common traditional
    and modern use.
  status: draft
dosage:
- name: Saffron capsules (trials) and dried stigma
  text: Randomised trials in mild to moderate depression, premenstrual syndrome and mild to moderate Alzheimer's
    disease gave saffron capsules of 30 mg a day, for example 15 mg twice daily. The WHO monograph says
    there is not enough information to set an accurate dose range; it notes a daily dose of 3.0-9.0 g
    of dried stigma in the Chinese pharmacopoeia but, because toxicity has been reported at 5.0 g, recommends
    less than 5.0 g a day. Food amounts carry no risk. Educational reference only, not a prescription.
  reference_ids:
  - REF-0005
  - REF-3520
  - REF-3523
  - REF-3979
  status: verified
constituents:
- name: Crocin and crocetin
  note: A series of carotenoid glucosides, the crocins (about 2% of the stigma), with dimethylcrocetin
    and their aglycone crocetin, are among the major constituents.
  reference_ids:
  - REF-3979
  compounds:
  - crocin
  - crocetin
- name: Safranal
  note: Safranal, which can be obtained by hydrolysis of the monoterpene glucoside picrocrocin (about
    4%), is among the major constituents, alongside an essential oil (0.4-1.3%) containing alpha- and
    beta-pinene and 1,8-cineole.
  reference_ids:
  - REF-3979
  compounds:
  - safranal
- name: Picrocrocin
  note: The main bitter-tasting glycoside of the stigma, a precursor of safranal.
  compounds:
  - picrocrocin
