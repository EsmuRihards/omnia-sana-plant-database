botanical_description:
  text: A perennial herb up to about 1 m tall, growing from an underground rhizome, with a short stem
    and 6-10 tufted leaves. The leaves are lance-shaped, uniformly green, up to 50 cm long and 7-25 cm
    wide, with a pointed, tail-like tip and a tapering base. The main rhizome is stout, fleshy and nearly
    egg-shaped, about 3 cm across, with slightly bent side rhizomes; all are orange inside. The flowers
    grow in a cylindrical spike 10-15 cm long at the top of the shoot, among white or white-and-light-green
    bracts 5-6 cm long; the flowers are pale yellow, about 5 cm long, with a white, funnel-shaped corolla
    tube. The fruit is an ellipsoid capsule.
  height: Up to about 1 m
  habit: Perennial herb growing from an underground rhizome, with a short stem and 6-10 tufted leaves
  leaves: Lance-shaped, uniformly green, up to 50 cm long and 7-25 cm wide; tip pointed and tail-like,
    base tapering; stalk and sheath sparsely to densely hairy
  flowers: Cylindrical spike 10-15 cm long at the top of the shoot; bracts white or white with a light
    green upper half, 5-6 cm long; flowers pale yellow, about 5 cm long, with a white funnel-shaped corolla
    tube
  stem: Short
  root: Stout, fleshy, nearly egg-shaped main rhizome about 3 cm across, with slightly bent side rhizomes
    2-6 cm long; orange inside
  fruit: Ellipsoid capsule
  reference_ids:
  - REF-3959
  - REF-3242
  status: verified
habitat:
  text: Native to South Asia (India) and Southeast Asia; cultivated extensively in warm, humid tropical
    climates on well-drained, fertile soils.
  status: draft
harvesting:
  text: The rhizomes are dug at the end of the growing season, typically 8-10 months after planting, when
    the leaves have died back; they are cleaned, boiled or steamed, then dried and often ground into the
    familiar yellow powder.
  parts:
  - Rhizome
  season: End of growing season, 8-10 months after planting
  status: draft
harvest_readiness:
- part: rhizome
  signals:
  - "Lift the rhizomes at the end of the season, once the foliage withers and dies back into dormancy."
  basis: traditional
  source_quote: "the crop is harvested when the leaves wither after 270 - 365 days"
  reference_ids:
  - REF-3242
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Useful Tropical Plants / Ken Fern (REF-3242): rhizomes are lifted at roughly 9-12 months once the leaves wither. Independent confirmation not found - Wikipedia (Turmeric) gives no readiness signal ('gathered each year for their rhizomes'), and Britannica and Gardening Know How returned 403/404. Single lineage -> provisional."
traditional_uses:
  text: Turmeric rhizome is a cornerstone spice and medicine of Ayurvedic and traditional Chinese medicine,
    used for millennia as an anti-inflammatory, digestive and wound-healing remedy and valued as a golden
    dye; its curcuminoid-rich rhizome is now among the most extensively researched botanicals for inflammatory
    and joint conditions, directly building on this traditional reputation.
  reference_ids:
  - REF-0002
  - REF-0791
  status: verified
preparations:
- name: Curcumin or turmeric extract
  text: 'Curcumin or Curcuma longa extract taken by mouth is the form tested in randomised trials in arthritis
    (29 trials in a 2022 meta-analysis). Curcumin alone is poorly absorbed: in healthy volunteers, adding
    20 mg of piperine (from black pepper) to 2 g of curcumin increased its bioavailability by 2000%.'
  reference_ids:
  - REF-0791
  - REF-0273
  status: verified
- name: Decoction/'golden milk'
  text: Fresh or dried rhizome simmered in milk or water, traditionally with black pepper and a fat source,
    as a warming digestive and anti-inflammatory drink.
  status: draft
- name: Culinary use
  text: Fresh or dried, ground rhizome used extensively as a food spice and colourant.
  status: draft
dosage:
- name: Curcumin or turmeric extract (trials)
  text: In the 29 randomised trials in arthritis pooled in a 2022 meta-analysis, curcumin or Curcuma longa
    extract was given at 120-1500 mg a day for 4-36 weeks. Educational reference only, not a prescription.
  reference_ids:
  - REF-0791
  status: verified
constituents:
- name: Curcuminoids (curcumin, demethoxycurcumin, bisdemethoxycurcumin)
  compounds:
  - curcumin
  note: The principal yellow-orange pigments and best-studied bioactive compounds, responsible for most
    of turmeric's anti-inflammatory and antioxidant activity; oral bioavailability is low unless combined
    with piperine or a lipid carrier.
  reference_ids:
  - REF-0002
  - REF-0791
- name: Essential (volatile) oil
  compounds:
  - essential-oil
  - terpene
  note: Aromatic sesquiterpenes (including turmerone) contributing to fragrance and additional bioactivity.
