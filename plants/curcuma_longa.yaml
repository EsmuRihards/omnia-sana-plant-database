  | 2026-11-25: symptom-source audit research-deepening batch 10 - Searched PubMed (Curcuma longa
  tiab; turmeric, curcumin, curcuminoids ti: 1,467 HT, 507 SR, 4,120 SAFE hits; SR/MA and safety
  read in depth), Europe PMC, ClinicalTrials.gov (248) and OpenAlex. Arthritis, inflammation,
  blood sugar, cholesterol, BP, IBD, psoriasis and depression are already MA-backed and were not
  padded. Added: NEW oral-health pair (2024 oral-mucositis MA, 2026 and 2019 SRs); lead-chromate
  adulteration (South Asia 2024; Bangladesh 2014) as a new caution; oxalate nephropathy case 2024
  as a new caution; a probable fluindione (vitamin K antagonist) INR-rise case to the approved
  anticoagulant interaction (its only source was a rat study; text unchanged). NOT ADDED:
  liver-support (MASLD MAs) because the record carries a serious liver-injury warning (inv. 12d);
  periodontitis adjunct MAs (local delivery, mixed photodynamic designs); oral lichen planus vs
  corticosteroids (active comparator); earlier PMS / dysmenorrhoea trials whose outcomes were
  sleep, cognition, immunity or vitamin D; further liver-injury case reports (the serious warning
  already has three case series). Europe PMC pass added: 2022 Thai placebo RCT in functional
  dyspepsia (indigestion was resting on the WHO monograph alone); NEW hot-flashes pair (2026
  curcuminoid pilot RCT, with the 2025 menopause SR as no-effect since it found hot-flush results
  conflicting); NEW prostate-support (2026 BPH MA, curcumin as add-on); NEW pms and
  menstrual-cramps (2025 Tabriz placebo RCT, PSST and pain VAS); NEW fatigue (2025 BMJ Open
  placebo RCT in postmenopausal women). Not added: 2026 Japanese cognition RCT (2 of 35 endpoints
  significant), chemotherapy-neuropathy RCTs (sensory symptoms, not pain: near-miss), curcumin vs
  triamcinolone for mouth ulcers (active comparator), preprints.'
