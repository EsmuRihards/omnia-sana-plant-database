internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0791, REF-0792, REF-0793.
  | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-0791,
  REF-2164, REF-0792, REF-2165, REF-2166, REF-2167, REF-2168, REF-2169, REF-2170, REF-2171, REF-2172) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage
  + constituents) sourced from the existing references bucket; general/undated claims marked status: draft
  per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where absent) + cancer
  indication (anticancer/antitumour research) sourced from the plant''s cited literature, as part of the
  cancer-condition campaign. | 2026-08-14: Harvest Calendar (phenological) - added harvest_readiness for
  rhizome (provisional: Useful Tropical Plants REF-3242; lift at the end of the season once the foliage
  withers). Independent confirmation not found - Wikipedia (Turmeric) gave no readiness signal, Britannica
  and Gardening Know How returned 403/404 - logged. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 5 - REF-0305 (WHO vol. 1, Rhizoma Curcumae Longae) kept
  on dyspepsia/acid dyspepsia, rheumatic pain and inflammation, skin diseases, ringworm and
  slow-healing wounds per its known Medicinal uses text; the WHO PDF blocks automated reading -
  flagged for owner spot-check. Removed from blood-sugar, cardiovascular, metabolic. REF-0002
  (curcumin review; signature compound) kept for cardiovascular, metabolic, inflammation, cancer.
  Arthritis SR/MAs REF-0791/REF-0792 and skin SR REF-2165 moved from mechanistic-only to direct.
  | 2026-11-10: symptom-source audit batch 8 - REF-0305 merged into REF-0308 (both were WHO
  Monographs on Selected Medicinal Plants vol. 1, 1999).
  | 2026-11-12: symptom-source audit deep re-sweep batch 5 - Deep re-sweep. Piperine
  pharmacokinetics study REF-0273 removed from all six actions (kept in references). Held MAs
  REF-2167 (RA, psoriasis, UC) and REF-0791 wired. New pairs from GRADE-assessed MAs (owner rule;
  curcumin = signature compound, labelled): blood-sugar (REF-3529 + held SR REF-0793),
  high-cholesterol REF-3530, high-blood-pressure REF-3531, ibd REF-3532 + REF-2167, psoriasis
  REF-2167, depression REF-3533. Inflammation MA REF-3534 and obesity MA REF-3535 added. Not added
  (owner to decide): liver-support - a GRADE MA (37178581) exists, but turmeric-associated liver
  injury is reported (Tuscany phytovigilance SR 32656820); muscle-soreness MA 37408367 was null
  (no pair exists).
  | 2026-11-13: owner decisions (deep re-sweep) - Turmeric liver-support NOT added (owner,
  2026-11-13): 2023 GRADE MA 37178581 (31 RCTs; ALT -4.1, AST -3.8 U/L; GGT ns; low/very-low
  certainty; authors: not necessarily clinically meaningful) and 2025 NAFLD MA 38213188 (ALT -4.1)
  vs rare idiosyncratic supplement hepatotoxicity. NEW serious contraindication: Tuscany
  phytovigilance 7 cases + SR of 23 case reports REF-3651; US DILIN 10 cases, 1 death, HLA-B*35:01
  in 7 REF-3652; 2025 histopathology series of 11 REF-3653. The record previously carried no
  liver-injury warning.
  | 2026-11-19 (monograph-source audit): botanical_description, preparations[0] and dosage[0] cited only REF-0791 (arthritis meta-analysis), which does not describe the plant. botanical_description RE-SOURCED to the WHO monograph Rhizoma Curcumae Longae vol. 1 (REF-3959, new; archive.org text) and Useful Tropical Plants REF-3242 (short stem, 6-10 tufted leaves). Dropped as unsupported: leaves in a clump, pink bracts, pseudostem of leaf bases, rarely sets seed, flowering summer to early autumn. preparations[0]/dosage[0] rewritten to what REF-0791 states (curcumin or C. longa extract, 120-1500 mg/day for 4-36 weeks in 29 RCTs; the old 1000-1500 mg was not in the abstract) and the piperine clause now cites Shoba 1998 REF-0273 (20 mg piperine raised curcumin bioavailability 2000%). Dropped: standardised to curcuminoids, capsules.
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): generic WHO vol. 1 citation
  REF-0308 replaced by the turmeric monograph entry REF-3959 on acid-reflux (acid dyspepsia),
