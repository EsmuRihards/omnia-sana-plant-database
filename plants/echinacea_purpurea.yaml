drug_class_interactions:
- drug_class: immunosuppressants
  severity: caution
  mechanism: Echinacea can both stimulate immune activity and alter CYP3A/CYP1A2 enzymes, so it may reduce
    the effect or change the blood levels of immunosuppressant drugs such as ciclosporin and tacrolimus;
    use only under medical supervision after a transplant or with autoimmune therapy.
  reference_ids:
  - REF-2445
