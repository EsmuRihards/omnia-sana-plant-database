internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0797, REF-0798, REF-0799.
  | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-2011,
  REF-2012, REF-2013, REF-2014, REF-2015, REF-2016, REF-2017, REF-2018, REF-2019, REF-2020, REF-2021) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage
  + constituents) sourced from the existing references bucket; general/undated claims marked status: draft
  per the integrity-first sourcing policy. | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for flower (verified: PFAF REF-3247 + Wikipedia REF-3248, summer heads) and root
  (provisional: PFAF REF-3247, dug in late autumn from mature 2-3 year plants). Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 6 - REF-0153 (Cochrane 2006) purged: superseded by the
  2014 update REF-0797 (owner decision 2026-11-11), which pools all Echinacea species and finds
  products "have not here been shown to provide benefits for treating colds" - recorded in
  null_result_ids for cold. REF-0271 purged as a phantom (title, volume and pages match no paper
  by Sharma/Schoop/Suter in PubMed, Crossref or OpenAlex). Jawad 2012 RCT (REF-3392, PubMed
  23024696, 755 people, E. purpurea reduced cold episodes vs placebo) added to cold. REF-0308 (WHO
  vol. 1, Herba Echinaceae Purpureae) kept for cold, infection, immune-support, wounds,
  skin-irritation per its known Medicinal uses text (colds and respiratory/urinary infections via
  immune stimulation; externally wound healing and inflammatory skin conditions); removed from
  arthritis and inflammation. WHO PDF blocks automated reading - flagged for owner spot-check.
  | 2026-11-12: symptom-source audit deep re-sweep batch 6 - Deep re-sweep. Cold now shows both
  sides: added MA in children REF-3536, Goel 2004 REF-3537, Ogal 2021 REF-3538 and the narrative
  REF-2014; Yale 2004 REF-3539, Taylor 2003 (JAMA, children) REF-3540, Sperber 2004 REF-3541 and
  O''Neil 2008 REF-3542 recorded as no-effect (all E. purpurea). REF-2017 (pilot: "effectiveness
  could not be accurately assessed") and REF-2014 removed from the antimicrobial action. Immune
  RCT REF-3543 and held RCT REF-2013 to immune-support. New eczema pair from alkylamide cream RCT
  REF-3544 (owner rule).
  | 2026-11-19 (monograph-source audit): preparations[0] and dosage[0] cited only REF-0797 (Cochrane cold review; abstract gives no form or dose). RE-SOURCED: WHO Herba Echinaceae Purpureae vol. 1 (REF-3988, new); REF-0797 kept for its point that products differ in composition. Dropped as unsupported: root extract, tablets/drops/capsules at the first sign of a cold, best-studied form, 300-900 mg a day for 7-10 days.
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): generic WHO vol. 1 citation
  REF-0308 replaced by the Herba Echinaceae Purpureae entry REF-3988 (external use for wounds and
  inflammatory skin conditions; not in autoimmune disease; no more than 8 weeks) and removed from the
  Duke note.
  | 2026-11-25: symptom-source audit research-deepening batch 11 - Searched PubMed (Echinacea
  purpurea / purple coneflower tiab, echinacea ti: 140 HT, 30 SR, 206 SAFE hits; SR/MA, safety and
  E. purpurea trials read in depth), Europe PMC, ClinicalTrials.gov (42) and OpenAlex. Species
  rule: only E. purpurea products, or reviews pooling Echinacea products with E. purpurea named as
  the leading preparation. Added: ERA-PRIMA MA 2024 and the 2022 Echinaforce open RCT to
  infection, with E. purpurea placebo trials in genital herpes (2001) and otitis-prone children
  (2008) as no-effect; Echinilin cold study 2005 to immune-support with the two pressed-juice
  crossover trials (2002, 2005) as no-effect; 2026 safety MA (48 trials, adverse events no higher
  than control) to the safety note; new allergy and pregnancy cautions (2005 safety SR, 2017
  VigiBase children); human interaction studies (docetaxel, darunavir-ritonavir, etravirine, CYP
  phenotyping) as an info note. Not added: the cold pair (already 9 with five no-effect trials)
  was not padded either way - positive (Schulten 2001, Brinkeborn 1999, air travellers 2012, 2019
  URTI MA) and null (Barrett 2002, Grimm 1999, Turner 2000) trials logged here only; 2015
  recurrent-RTI MA (superseded by ERA-PRIMA); anxiety trials (EP107 is E. angustifolia root); oral
  lichen planus RCT 2022, tonsillitis add-on study 2020 and COVID syrup RCT 2024 (species not
  stated); warfarin and digoxin interaction studies (species not stated in the abstract); athletic
  VO2max/EPO trials and MA (no vocab condition); combinations (Kan Jang, Imupret, echinacea + zinc
  / propolis / ginger / sage); homeopathic products.'
