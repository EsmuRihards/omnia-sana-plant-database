contraindications:
- note: Generally considered safe, but caution advised for those with autoimmune conditions. Not recommended
    for long-term use (more than 8 weeks continuously).
  severity: caution
  reference_ids:
  - REF-3988
  - REF-5326
  status: verified
- note: 'Duke (2002) rates echinacea as +++ - among the most thoroughly documented herbal immunostimulants.
    It notes experimental and clinical evidence for immunostimulant, antiviral, and anti-inflammatory
    activities. Multiple species have been studied (E. purpurea, E. angustifolia, E. pallida), and Duke
    emphasizes that species identification in commercial products is often unreliable. Commission E approves
    E. purpurea for supporting immune function during colds and flu. Dose: 900 mg standardized extract
    daily in acute use; use should be limited to 8 weeks continuous. Contraindicated in autoimmune diseases
    (MS, lupus, HIV/AIDS), tuberculosis, and with immunosuppressive drugs (cyclosporine) (Duke, 2002).'
  severity: caution
  reference_ids:
  - REF-0063
  status: verified
- note: 'Allergy: echinacea, a daisy-family plant, can rarely cause allergic reactions, sometimes severe;
    people with allergies or asthma should take care. E. purpurea was among the herbal medicines most
    often linked to allergy-like reactions in children in the WHO safety database.'
  severity: caution
  reference_ids:
  - REF-5327
  - REF-5328
  status: verified
- note: 'Pregnancy and breastfeeding: there are too few data on echinacea in pregnancy and breastfeeding
    to judge its safety, and a systematic review of its safety advised against use in these periods.'
  severity: caution
  reference_ids:
  - REF-5327
  status: verified
- note: 'Medicines: in clinical studies, E. purpurea did not meaningfully change blood levels of the cancer
    drug docetaxel or the HIV drugs darunavir-ritonavir and etravirine, and had only minor, non-significant
    effects on the liver enzymes CYP1A2, CYP2D6, CYP2E1 and CYP3A4 in healthy volunteers.'
  severity: info
  reference_ids:
  - REF-5329
  - REF-5330
  - REF-5331
  - REF-5332
  status: verified
