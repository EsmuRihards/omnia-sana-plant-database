  - REF-3543
  - REF-2013
  - REF-5323
  status: verified
  note: Improved immune markers vs placebo in randomized trials (healthy adults; athletes) and raised
    white-cell and natural-killer-cell counts during a cold (placebo-controlled study); the pressed juice
    of the herb did not stimulate immune cells in two placebo-controlled crossover trials in healthy men;
    traditional immunostimulant (WHO monograph)
  null_result_ids:
  - REF-5324
  - REF-5325
- condition: infection
  note: Echinacea extracts reduced respiratory infections, their complications and antibiotic use in a
    2024 meta-analysis of clinical trials (strongest for fresh E. purpurea alcoholic extracts); E. purpurea
    reduced respiratory infections and antibiotic use in children in a randomized trial, and an open randomized
    trial in adults found fewer SARS-CoV-2 infections; it did not reduce recurrences of genital herpes
    or prevent ear infections in otitis-prone children (placebo-controlled trials); supportive use for
    respiratory and urinary infections (WHO monograph)
  reference_ids:
