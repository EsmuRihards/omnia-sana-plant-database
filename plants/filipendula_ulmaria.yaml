  status: verified
habitat:
  text: Wet ground in swamps, marshes, fens, wet woods and meadows, on wet rock ledges and by rivers,
    but not on acid peat. Native to Europe, including Britain, from Iceland south and east to Spain, temperate
    Asia and Mongolia.
