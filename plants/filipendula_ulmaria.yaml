botanical_description:
  text: A perennial herb with fern-like foliage and erect, furrowed stems 60-120 cm tall, sometimes purple.
    The leaves are dark green above and whitish and downy beneath, interruptedly pinnate, with a few large
    toothed leaflets and small ones in between; the terminal leaflet is large, 2.5-7.5 cm long and three-
    to five-lobed. Small creamy-white flowers with a very strong, sweet smell are clustered close together
    in irregularly branched heads, from June to August or almost September.
  height: 60-120 cm
  habit: Erect perennial herb with fern-like foliage
  leaves: Interruptedly pinnate, dark green above, whitish and downy beneath; large toothed leaflets with
    small ones between; terminal leaflet 2.5-7.5 cm, three- to five-lobed
  flowers: Small, creamy-white, very sweet-smelling, in irregularly branched clusters
  stem: Erect, furrowed, sometimes purple
  flowering_period: June to August (almost September)
