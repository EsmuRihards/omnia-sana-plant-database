traditional_uses:
  text: Meadowsweet has a very long history of herbal use and is said to have been one of the three most
    sacred herbs of the Druids. In folk medicine it was used against rheumatism, fever and ulcers; it
    was valued in diarrhoea, especially children's diarrhoea, as a stomach remedy for hyperacidity, heartburn,
    gastritis and peptic ulcers, and for urinary complaints and dropsy, and an infusion of the fresh tops
    was used to promote sweating. The flower head contains salicylic acid, from which aspirin can be made;
    unlike isolated aspirin, which can cause stomach ulcers at high doses, the whole herb is said to protect
    the stomach lining while still easing inflammation.
  reference_ids:
  - REF-3256
  - REF-3998
  - REF-0815
