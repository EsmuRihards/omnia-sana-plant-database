  status: verified
dosage:
- name: Decoction (tea)
  text: 'Serbian folk record from a single informant: one spoon of the dried, ground mushroom cooked in
    1 L of water for 30 minutes, taken as a preventative. A recorded folk practice, not a tested dose;
    no human trial has studied birch polypore. Educational reference only.'
  reference_ids:
