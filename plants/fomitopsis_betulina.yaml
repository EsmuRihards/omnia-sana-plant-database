  - REF-3897
  status: verified
harvesting:
  text: 'The fruiting body is the part used. Folk practice favours young, fresh brackets: in Serbia it
    was eaten only while still young, and dried, ground fruiting bodies were used for tea, while fresh
    pieces were laid on wounds. Fruiting bodies take up arsenic from polluted ground (about ten times
    more near a former mine than at a clean site), so gather away from mines and contaminated land. In
    South Tyrol the species is listed as vulnerable or near threatened on the regional Red List.'
  parts:
  - Fruiting body
