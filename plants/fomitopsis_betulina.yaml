- name: Tincture (folk record)
  text: 'Serbian folk record: 100 g of the mushroom soaked in 1 L of brandy or vodka for 21 days with
    daily shaking, then decanted; the mushroom is then boiled in 3 L of water for 3 hours and the cooled
    tea mixed with the tincture.'
  reference_ids:
