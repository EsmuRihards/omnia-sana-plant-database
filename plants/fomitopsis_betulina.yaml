internal_notes: '2026-11-16: record created (Model: anthropic/claude-opus-5-5). Accepted name Fomitopsis
  betulina (Bull.) B.K.Cui, M.L.Han & Y.C.Dai 2016 (GBIF 9819973 ACCEPTED; Wikidata Q96894257, the item
  with the sitelinks and common names; Q865591 is the older Piptoporus item). Spirin et al. 2024 keep
  Fomitopsis and sink Piptoporus into it. Public name "Birch polypore"; "brown birch polypore" is not
  attested in any source and was not used; "birch conk" avoided (chaga uses it). | SEARCH: PubMed all
  name variants (83 records, all abstracts read); Europe PMC incl. full text, patents, preprints, Agricola
  (302 records; every hit for patients/randomised/clinical trial/case report was a passing mention in
  a review, the one "case report" hit is a conference abstract on antioxidant chemistry); OpenAlex title/abstract
  (400 records) plus Chinese, Russian, Polish and German names (no relevant hits); ClinicalTrials.gov
  (no trial of this species; the two Fomitopsis RCTs, NCT04667247 and NCT04951336, used F. officinalis
  with Trametes versicolor); Crossref; PMC/Europe PMC full text of about 30 papers; 7 web pages. NOT searched:
  CNKI, eLibrary.ru, WHO ICTRP, EU CTR, Google Scholar. | HUMAN EVIDENCE: none. The 2024 PRISMA review
  (Nowotarska) states there are no clinical studies of efficacy or safety in humans. | NO INDICATIONS
  by owner decision 2026-11-16: symptom pairs need human evidence (a human trial or a review of human
  studies), one rule for all plants. The lab-only PRISMA review would otherwise have scored a cancer pair
  7/10. All lab findings are recorded as actions. | REJECTED (wrong species): Piptoporus soloniensis (PMIDs
  16233291, 21888369, 40997269), P. quercinus / Buglossoporus (15119356), Lenzites betulina (betulinans;
  not this species), F. pinicola and F. officinalis papers. | NOT USED: Li 2024 abstract claims anti-malarial
  effects but the body has no data; Herbal Reality page not read. Wound healing: de Jesus 2018 (isolated
  beta-glucan, Caco-2 scratch assay positive) conflicts with Wende 2010 (Planta Medica conference abstract;
  crude extracts not significant in HaCaT scratch assay), so no vulnerary action. ACE inhibition in vitro
  (Vunduk 2015; Western Balkans 2024) but oral extracts did not change blood pressure in rats (Fajemiroye
  2017), so no antihypertensive action. Serbian survey notes Shamtsyan 2004 found no strong immunomodulating
  effect in vitro (not retrieved). | DEAD ENDS (paywalled, abstract not retrievable, so not cited): Papp
  et al. 2017 Transylvania ethnomycology (Genet Resour Crop Evol 64:101-111), Peintner, Poder & Pumpel
  1998 The iceman''s fungi (Mycol Res 102:1153-1162), Han et al. 2016 Fungal Diversity 80:343-373, Capasso
  1998 Lancet letter. Not used: Efimenko 1960/1961 and Kandefer-Szerszen 1974 (titles only, no further
  data); Uzbekistan 2023 and Mazovia 2019 surveys repeat literature claims rather than recording local
  use. | DOSAGE: the only dose is a Serbian folk record from one informant; no EMA, WHO, ESCOP or Commission
  E monograph exists for this fungus, so no tincture practice record was built (the calculator degrades
  to general defaults). | Lookalikes: none-known, owner-authorized 2026-11-16; confusables named in sources
  (Fomes fomentarius, blushing bracket) are not toxic. | Build script and source map: docs/additions/2026-11-16-fomitopsis-betulina/.
  | audit_species.py flagged REF-3926 and REF-3927 (abstracts name only F. pinicola). Full texts read (PMC10819588,
  PMC6264674): both report F. betulina / P. betulinus results, so not wrong-species. REF-3927 (Reis 2011) kept on
  the vitamins constituent only, not on the antioxidant action, because its abstract never names this species.'
