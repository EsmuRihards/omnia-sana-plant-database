habitat:
  text: Grows only on birch (Betula species such as silver, downy and paper birch), mainly as a saprotroph
    on dead trees and occasionally as a parasite of living ones, in northern temperate forests and parks
    of Europe, Asia and North America. It is one of the commonest brown-rot fungi and reduces the heartwood
    to a red-brown, crumbly mass.
  reference_ids:
