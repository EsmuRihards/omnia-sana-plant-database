traditional_uses:
  text: Ötzi the Iceman, who lived about 5,300 years ago, carried two pieces of birch polypore; he had
    a whipworm infection, and a medicinal (anthelmintic) purpose has been proposed, though this remains
    disputed. In European folk medicine an infusion of the fruiting body was popular in Russia, the Baltic
    countries, Hungary and Romania for its nutritional and calming properties, and the tea was used against
    cancers, stomach and gastrointestinal complaints and parasites, to enhance immunity and to relieve
    fatigue. Fresh pieces were applied to wounds as antiseptic, bleeding-stopping dressings, and the dried
    powder or its ash was used as a painkiller or snuff. In Serbia it was recorded as a preventative taken
    as a tea or as a tincture in brandy or vodka. The Sami drank a hot infusion of it (common before coffee
    arrived in the 1860s and revived during the Second World War), burned small pieces on the skin for
    toothache, headache, rheumatism, fractures and pneumonia, and made balls from it for games. It was
    also used as tinder and by barbers as a razor strop.
