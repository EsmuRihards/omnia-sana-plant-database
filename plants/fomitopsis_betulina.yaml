botanical_description:
  text: Annual bracket fungus (not a plant) that grows only on birch. Fruiting bodies emerge as white,
    rounded lumps breaking through the bark, then expand into smooth, hoof- or kidney-shaped brackets
    attached to the trunk without a stem, white at first and later grey-brown on top. The underside is
    a layer of very fine white pores that turn buff to brownish with age, and the flesh is white, thick
    and corky. The fungus decays the wood to a red-brown, crumbly brown rot.
  height: Bracket about 10-20 cm across
  habit: Annual bracket (polypore) fungus on birch; mainly on dead trees, occasionally parasitic on living
    ones
  leaves: Not applicable (fungus)
  flowers: Not applicable (fungus); reproduces by spores
  stem: No stem; the bracket is attached directly to the trunk (sessile)
  root: Mycelium grows through the birch wood, causing brown rot
  fruit: Spores are shed from fine white pores on the underside; basidiospores smooth, colourless and
    cylindrical
  flowering_period: Annual fruiting bodies; old, tough brackets often remain on the tree into the following
    year
  reference_ids:
