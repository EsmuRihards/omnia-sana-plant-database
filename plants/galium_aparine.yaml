id: galium-aparine
scientific_name: Galium aparine
common_names:
- Cleavers
- clivers
- goose grass/goosegrass
- stickyweed
- stickywilly
- catchweed bedstraw
family: Rubiaceae
external_ids:
  gbif: 2913548
  wikidata: Q161581
parts_used:
- Leaf
- Seed
- Stem
botanical_description:
  text: An annual herb whose weak, four-angled stems and leaves are covered in small, backward-pointing
    hooked bristles that cling to whatever they touch, so it climbs ladder-like through hedgerows and
    often forms matted masses; it is 10-80 cm tall but sprawls or scrambles to about 1 m. The narrow,
    lance-shaped leaves, about 1.2 cm long and 0.6 cm broad, grow in whorls of six or eight and are rough
    on both margins and surface. Small, star-like white or greenish-white flowers grow two or three together
    from the leaf axils from June to August, followed by little globular seed-vessels covered in hooked
    bristles.
  height: 10-80 cm; sprawling or scrambling to about 1 m
  habit: Annual herb, scrambling and climbing by hooked bristles
  leaves: Narrow, lance-shaped, about 1.2 x 0.6 cm, in whorls of six or eight, rough with backward-pointing
    prickles
  flowers: Small, star-like, white or greenish-white, two or three together in the leaf axils
  stem: Weak, four-angled, with hooked bristles
  fruit: Small globular seed-vessels covered in hooked bristles
  flowering_period: June to August
  reference_ids:
  - REF-4001
  - REF-3260
  status: verified
habitat:
  text: An abundant hedgerow weed throughout Europe and also in North America, springing up in fields
    and waste places; also a weed of cultivated land and of moist, grassy places on most soils. Native
    to Europe, including Britain, from Scandinavia south to Spain, and to northern and western Asia.
  reference_ids:
  - REF-4001
  - REF-3260
  status: verified
harvesting:
  text: The whole aerial plant (leaf, stem and seed) is cut in spring to early summer, before the fruit
    fully hardens, and used fresh (as juice) or dried.
  parts:
  - Leaf
  - Seed
  - Stem
  season: Spring to early summer
  status: draft
harvest_readiness:
- part: leaf
  signals:
  - "Gather the herb (leaf and stem) as it comes into flower, in late spring to early summer."
  basis: traditional
  source_quote: "It is harvested in May and June as it comes into flower and can be used fresh or dried for later use."
  reference_ids:
  - REF-3260
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3260); the cleavers herb is gathered as it comes into flower (May-June). Single lineage -> provisional."
- part: stem
  signals:
  - "Gather the straggling stems with the leaf as the herb comes into flower, in late spring to early summer."
  basis: traditional
  source_quote: "It is harvested in May and June as it comes into flower and can be used fresh or dried for later use."
  reference_ids:
  - REF-3260
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3260); the stems are gathered with the herb as it comes into flower. Single lineage -> provisional."
- part: seed
  signals:
  - "Collect the seeds (clinging burrs) when ripe in late summer to early autumn."
  basis: traditional
  source_quote: "It is in flower from June to August, and the seeds ripen from August to September."
  reference_ids:
  - REF-3260
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3260); the seeds (roasted as a coffee substitute) ripen in late summer to early autumn. Single lineage -> provisional."
traditional_uses:
  text: In old herbals cleavers was praised as a purifier of the blood, and its tops went into rural 'spring
    drinks'. It was used as a diuretic, tonic, alterative and mild laxative, for dropsy, and for skin
    conditions such as scurvy, scrofula, psoriasis, eczema and seborrhoea. The expressed juice was taken,
    but as a fairly strong diuretic it was not given where diabetes was suspected.
  reference_ids:
  - REF-4001
  - REF-3260
  status: verified
preparations:
- name: Fresh juice
  text: Fresh aerial parts crushed or juiced, traditionally taken as a spring tonic or applied topically
    to skin irritation and wounds.
  reference_ids:
  - REF-1720
  status: verified
- name: Infusion
  text: Dried or fresh herb infused in hot (or cold) water as a traditional diuretic and lymphatic-support
    tea.
  status: draft
- name: Poultice/wash
  text: Crushed fresh herb or a strained infusion applied topically as a wash or poultice for skin irritation
    and minor wounds.
  reference_ids:
  - REF-1720
  status: verified
dosage:
- name: Infusion
  text: Traditional herbal references suggest around 2-4 g of dried herb per cup, up to three times daily.
    Educational reference only, not a prescription.
  status: draft
constituents:
- name: Iridoid glycosides (asperuloside)
  compounds:
  - iridoid-glycoside
  - glycoside
  note: Characteristic Rubiaceae iridoids shared with related bedstraws, contributing to the plant's traditional
    activity.
  reference_ids:
