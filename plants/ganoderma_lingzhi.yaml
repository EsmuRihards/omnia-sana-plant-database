  - REF-5368
- condition: cancer
  note: Reishi polysaccharides slowed tumours in lab and animal studies; a Cochrane review found it may
    improve tumour response and immune markers as an add-on to cancer treatment (low-quality evidence;
    no proven survival benefit)
