indications:
- condition: blood-sugar
  note: 'Results are mixed: a 2025 randomized trial found lower fasting glucose and HbA1c than in controls
    in type 2 diabetes, but a 2016 placebo-controlled trial found no effect on HbA1c and a Cochrane review
    found the trials do not support reishi for blood sugar; antidiabetic effects in lab and animal studies
    (review)'
