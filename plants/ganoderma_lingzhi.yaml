drug_class_interactions:
- drug_class: sedatives-cns-depressants
  severity: caution
  mechanism: Reishi is traditionally used as a calming, sedative herb; taken with sedatives, sleeping
    tablets or other central-nervous-system depressants (including alcohol) it may add to drowsiness and
    slowed reactions.
  reference_ids:
  - REF-2452
  - REF-2460
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- drug_class: anticoagulants-antiplatelets
  severity: caution
  mechanism: In patients with atherosclerotic disease, reishi (1 g three times a day for 2 weeks) reduced
    platelet aggregation by up to about 30% (clinical study), so it may add to the effect of antiplatelet
    and anticoagulant medicines.
  reference_ids:
  - REF-5371
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-11-26'
