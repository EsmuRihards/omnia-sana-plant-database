botanical_description:
  text: 'A polypore (bracket) fungus native to East Asia, not a plant. Its reddish-brown, varnished, kidney-shaped
    cap, marked with bands and attached to a stem at its edge, gives it a fan-like look; when fresh it
    is soft, cork-like and flat. It has no gills: its spores are released through fine yellow pores on
    the underside, and the spore print is brown. Depending on growing conditions it can also grow antler-like,
    without a cap.'
  habit: Polypore (bracket) fungus
  leaves: Not applicable (fungus)
  flowers: Not applicable (fungus); reproduces by spores
  stem: Stem attached at the edge of a reddish-brown, varnished, kidney-shaped, banded cap
  fruit: No gills; fine yellow pores underneath release the spores; brown spore print
  reference_ids:
  - REF-4024
  status: verified
habitat:
  text: Grows as a wood-decay fungus on the stumps and trunks of deciduous trees (notably maple and other
    hardwoods) in East Asian forests; also widely cultivated commercially on hardwood logs or sawdust
    substrate.
  status: draft
harvesting:
  text: Wild fruiting bodies are collected once mature; cultivated material is harvested from logs or
    substrate at maturity, then dried and processed into slices, powder or extract.
  parts:
  - Mycelium
  - Whole Plant
  status: draft
harvest_readiness:
- part: fruiting-body
  signals:
  - "Harvest the conk when the pale growing margin dulls from white/orange to matte red, growth has stopped and the surface is fully lacquered - before the heavy reddish-brown spore drop."
  basis: traditional
  source_quote: "The margin of reishi (where it's growing from) will dull from white or orange to a more matte red in maturity."
  reference_ids:
  - REF-3263
  independent_confirmation: null
  species_confirmed: false
  status: provisional
  notes: "North Spore (REF-3263) describes reishi harvest maturity at the genus level (Ganoderma), not naming Ganoderma lingzhi specifically -> species_confirmed false. The fruiting body is ready when the white/orange growing margin turns matte red and growth stops ('Harvest them when growth has stopped and their color has darkened a bit'), before the heavy spore drop. Single source -> provisional. SAFETY: the fatal Podostroma cornu-damae can be confused with reishi - confirm identity; see Dangerous Lookalikes."
traditional_uses:
  text: Reishi/lingzhi, the 'mushroom of immortality', is one of the most revered tonic fungi in traditional
    Chinese medicine, used for centuries to support vitality, calm the spirit, strengthen immunity and
    promote longevity; this traditional tonic reputation is now studied for immunomodulatory, anticancer-adjunct
    and metabolic effects.
  reference_ids:
  - REF-0821
  - REF-2039
  status: verified
preparations:
- name: Decoction
  text: Dried, sliced fruiting body simmered in water for an extended period, the traditional preparation
    to extract polysaccharides.
  status: draft
- name: Standardised extract
  text: Extract standardised to polysaccharide (beta-glucan) or triterpene content, taken as capsules
    or powder; the form used in most modern studies.
  reference_ids:
  - REF-0821
  - REF-2039
  status: verified
- name: Tincture
  text: Alcohol/water dual extraction, used to capture both water-soluble polysaccharides and alcohol-soluble
    triterpenes.
  status: draft
dosage:
- name: Standardised extract
  text: Traditional and clinical references commonly cite around 1-3 g of dried fruiting body extract
    daily, or higher doses of raw powder/decoction. Educational reference only, not a prescription.
  status: draft
