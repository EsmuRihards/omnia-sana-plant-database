traditional_uses:
  text: Water avens root has tonic and powerfully astringent action and was used, like the common avens,
    for diarrhoea and passive bleeding. In eastern North America, where it is called Indian chocolate
    and cure-all, it was a popular remedy for pulmonary consumption, simple dyspepsia and bowel complaints,
    and was valued as a febrifuge and tonic. A root infusion is taken for diarrhoea and stomach complaints
    and used externally as a wash for skin eruptions; it is considered less active than wood avens and
    is seldom used.
  reference_ids:
  - REF-4002
  - REF-3267
  status: verified
