botanical_description:
  text: Perennial herb about 30 cm tall, stouter than wood avens, with a stem a foot or more high, scarcely
    branching and with few leaves; the lower stem has bent-back hairs and is downy above. The basal leaves
    form a rosette and are long-stalked and lobed, with a larger terminal leaflet. The flowers are larger
    and fewer than in wood avens and droop, the petals forming a compact bell of dull purplish hue with
    darker veins, the calyces brownish and tinged with purple; the awns are feathery. It flowers from
    May to September.
  height: About 30 cm (1 ft) or more
  habit: Perennial herb with a basal leaf rosette and a scarcely branched flowering stem
  leaves: Basal rosette of long-stalked, lobed leaves with a larger terminal leaflet; few stem leaves
  flowers: Drooping, bell-like, dull purplish with darker veins; calyces brownish-purple
  stem: Scarcely branching, with bent-back hairs below and downy above
  root: Aromatic, tannin-rich root
  fruit: Achenes with feathery awns
  flowering_period: May-September
  reference_ids:
