internal_notes: 'Created 2026-07-10. 17 refs REF-2761..REF-2777: 9 genuine Geum rivale (its species-specific
  literature is thin - phytochem-heavy) + 8 clearly-labelled Geum urbanum (wood avens) congener refs supplying
  the antimicrobial/anticancer/antiviral/antidiabetic pharmacology. >=15 total met via genuine + labelled
  congener (genuine-only <15: G. rivale is a congener-dependent species, acceptable per the integrity
  policy). Research-workflow leads (wf_25f58939-508) self-verified because the adversarial-verify stage
  failed on the session limit; exact titles pulled from PubMed metadata. Signature: eugenol clove-scented
  ''chocolate root''. Cross-links: potentilla-erecta + agrimonia-eupatoria (Rosaceae astringents), filipendula-ulmaria
  (shared ellagitannins). lookalikes none-known (distinctive nodding purple-pink bell flowers). | 2026-07-13:
  added anticancer action (where absent) + cancer indication (anticancer/antitumour research) sourced
  from the plant''s cited literature, as part of the cancer-condition campaign. | 2026-07-19 (dosage-sourcing
  campaign, closing sweep): DOCUMENTED DEAD END - closing sweep of the dosage-sourcing campaign. The remaining
  unsourced dosage entry/entries on this record were searched against every seam this campaign opened
  and none yields a dose for this species in this preparation. Seams checked: (1) the official EMA herbal
  medicines register (medicines-output-herbal_medicines-report, 251 rows, retrieved 2026-07-18), matched
  on the accepted binomial AND on every synonym and common name appearing in a register row; (2) WHO monographs
  on selected medicinal plants Volumes 1-4, indexed by Latin drug title with each monograph''s Definition
  read to confirm the species - 177 monographs indexed; (3) this plant''s own reference bucket, mined
  for human studies that state an administered dose. Per the campaign''s integrity bar the entry is left
  unsourced at status draft rather than attached to a tangentially-related paper. INTEGRITY FIX 2026-07-20:
  a contraindication carried status ''verified'' with no reference_ids. The caution itself is an honest
  statement about the ABSENCE of safety data and is retained unchanged - dropping a safety warning would
  be the more harmful error - but ''verified'' asserts a source was checked against, and none exists.
  Demoted to ''needs-review'', which is what the data actually merits. Sourcing an absence is possible
  (cf. the euphrasia precedent, where an EMA public statement was cited as the authority for there being
  no established posology) and is the proper fix if a seam opens. | 2026-08-15: Harvest Calendar
  (phenological) - added harvest_readiness for root + aerial-parts + flower (all provisional: PFAF REF-3267;
  aromatic rootstock dug in spring when most fragrant or autumn, herb/flower gathered in flower May-Sept).
  Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 8 - REF-2777 purged: its urolithin study tested Geum
  urbanum (and other plants), not G. rivale. REF-2768 (Rosaceae tannin/elastase screen) names no
  diarrhoea - removed; retagged preclinical. REF-2769 (1954 tannin anatomy) hidden from diarrhoea
  cards. REF-2763 (in vitro antimicrobial) removed from sore-throat. REF-2761 (antibacterial vs E.
  coli and S. aureus) added to infection.
  | 2026-11-12: symptom-source audit deep re-sweep batch 8 - Deep re-sweep. REF-2769 (1954 tannin
  anatomy, no abstract) removed from antidiarrheal and vulnerary actions (kept in references);
  REF-2768 (Rosaceae elastase/tannin screen) removed from antidiarrheal. Notes rewritten to their
  lab sources. No trials on PubMed.
  | 2026-11-19 (monograph-source audit): habitat cited only REF-2761 (lab study). RE-SOURCED: PFAF REF-3267 + Grieve Water Avens (REF-4002, new). Dropped as unsupported: wet meadows, marshes, fens, base-rich soils, the comparison with wood avens on dry hedgerows.
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): REF-2769 (Blinova 1954,
  rhizome anatomy and tannin localisation in G. urbanum and G. rivale, PMID 13159200) now has its
  PMID; an anatomy paper states none of the preparations, uses, description or harvest claims, so it
  is removed from them (kept on the lookalike review). Botanical description, harvesting, traditional
  uses and the root infusion are rewritten from Grieve''s Water Avens (REF-4002) and PFAF (REF-3267).
  Dropped: 20-60 cm, clove smell from eugenol (REF-2765 finds eugenol as the main root-oil compound of
  G. urbanum, not of G. rivale), hooked styles (Grieve: awns feathery, not hooked), ale flavouring,
  gargle for sore throat, decoction. The draft infusion of aerial parts is left unsourced and stays
  withheld.'
