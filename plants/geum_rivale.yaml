  - REF-3267
  status: verified
habitat:
  text: Damp places such as moist ditches and streamsides, damp woods and the coarse vegetation along
    canals, most often in shade. Native to Europe, including Britain, from Iceland south and east to Spain,
    Siberia and western Asia, and to North America (including Canada); in Britain it is commoner in the
    north and in Scotland than in the south.
