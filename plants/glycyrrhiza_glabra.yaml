  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage)
  sourced from the existing references bucket; general/undated claims marked status: draft per the integrity-first
  sourcing policy. | 2026-07-11: added constituents (missed in the earlier monograph-fields batch) sourced
  from the existing references bucket. | 2026-07-18 (dosage-sourcing campaign, batch 4): dosage sourced
  to the EU herbal monograph on Glycyrrhiza glabra/inflata/uralensis radix (EMA/HMPC/571119/2010 = REF-3081,
  new). CORRECTIONS: the entry gave no actual preparation dose at all, only a glycyrrhizin ceiling; it
  now carries the monograph''s 1.5-2 g in 150 mL as infusion or decoction 2-4x daily after meals, plus
  the soft-extract posology (32 mg 2-3x daily, max 160 mg daily). Duration corrected from ''no more than
  4-6 weeks'' to the monograph''s explicit ''not to be used for more than 4 weeks'', and the under-18
  restriction added. The previous ''under about 100 mg glycyrrhizin (roughly under 10-15 g dried root)
  daily'' figure was REMOVED rather than re-sourced: it is not in this monograph (it derives from a separate
  EU Scientific Committee on Food opinion on glycyrrhizic acid) and 10-15 g/day of root is well above
  the monograph''s own 3-8 g/day tea posology, so it read as permissive. TODO if wanted: source the SCF
  100 mg/day figure properly and reinstate it as a distinct safety note rather than a dose. DEAD END (preparations,
  2026-07-20): checked against the monograph references already on this record, judged from their stored
  posology summaries and not from the full monograph PDFs - a later pass with the PDFs, or a new seam
  (Health Canada NNHPD, ESCOP, Commission E), may still resolve these. ''Deglycyrrhizinated licorice (DGL)'':
  The monograph covers whole licorice root as an infusion/decoction and a soft extract, and limits use
  to 4 weeks. Deglycyrrhizinated licorice is not mentioned, and the monograph offers no support for prolonged
  use without the glycyrrhizin risk. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness
  for root (provisional: PFAF REF-3265, dug in autumn from 3-4 year old plants). Single lineage. Binomial
  confirmed.
  | 2026-11-10: symptom-source audit batch 8 - REF-0012 (Asl & Hosseinzadeh 2008, "Glycyrrhiza
  sp.") is a genus-level review with prose-only attribution - removed from all pairs; metadata and
  abstract added. REF-0089 (Fiore 2005; year corrected) abstract names no condition - removed from
