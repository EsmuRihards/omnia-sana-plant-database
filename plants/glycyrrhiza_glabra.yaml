contraindications:
- note: 'Glycyrrhizin in whole licorice root makes the body retain salt and water and lose potassium (pseudoaldosteronism),
    which can raise blood pressure and cause swelling and low potassium, especially with large doses or
    prolonged use. Do not use if you are pregnant or have low potassium, high blood pressure, or a kidney,
    liver or heart disorder, and do not combine with heart medicines, corticosteroids, stimulant laxatives
    or other products that can upset electrolytes (Health Canada; EMA). The liver warning is about these
    salt and potassium effects, not liver damage: in trials in liver disease the side effects were of
    this kind, and intravenous glycyrrhizin raised blood pressure in people with hepatitis C. Deglycyrrhizinated
    licorice (DGL) avoids this effect.'
  severity: warning
  reference_ids:
  - REF-3648
  - REF-3649
  - REF-3650
  - REF-0308
  - REF-0012
  status: verified
- note: 'Duke (2002) rates licorice as ++ and documents extensive activities. Glycyrrhizin (the key compound)
    has anti-inflammatory, antiulcer, antiviral, and adrenal-stimulant properties. Duke highlights an
    important safety concern: chronic use of licorice can cause pseudoaldosteronism - sodium retention,
    potassium loss, edema, and hypertension - due to glycyrrhizin''s inhibition of cortisol metabolism.
    This effect is typically seen with >50 g licorice/day for more than 6 weeks. Deglycyrrhizinated licorice
    (DGL) avoids this side effect. Dose: 5–15 g dried root daily. Contraindicated in hypertension, kidney
    disease, low potassium, liver cirrhosis, and in combination with diuretics or corticosteroids (Duke,
    2002).'
  severity: caution
  reference_ids:
  - REF-0012
  - REF-0089
  - REF-0308
  - REF-0063
  status: verified
