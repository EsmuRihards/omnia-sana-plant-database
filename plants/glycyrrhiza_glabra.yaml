  cold - EMA page 429, flagged) added to acid-reflux, indigestion, cough, cold,
  respiratory-support.
  | 2026-11-12: symptom-source audit deep re-sweep batch 8 - Deep re-sweep. New pairs (owner
  rule): sore-throat (MA REF-3569 + RCT REF-3570 + WHO demulcent use), oral-health (aphthous-ulcer
