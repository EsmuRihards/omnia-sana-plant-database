  status: verified
dosage:
- name: Whole root/decoction
  text: The EU herbal monograph gives, for adults and elderly, 1.5-2 g of the comminuted root in 150 mL
    of boiling water as an infusion or decoction 2 to 4 times daily, taken one cup after meals; a soft
    extract (DER 1:0.4-0.5) at 32 mg 2-3 times daily, not exceeding 160 mg daily, is also listed. The
    monograph directs that it is NOT to be used for more than 4 weeks, and is not recommended under 18
    years - the duration limit matters because prolonged licorice use causes pseudoaldosteronism (sodium
    and water retention, potassium loss, raised blood pressure). Deglycyrrhizinated licorice (DGL) is
    preferred where prolonged use is intended. Educational reference only, not a prescription.
  reference_ids:
  - REF-3081
  status: verified
