id: harpagophytum-procumbens
scientific_name: Harpagophytum procumbens
common_names:
- Devil's Claw
- Grapple plant
- Wood spider
family: Pedaliaceae
external_ids:
  gbif: 3585335
  powo: 'urn:lsid:ipni.org:names:675824-1'
  wikidata: Q386675
parts_used:
- Secondary root tuber
constituents:
- name: Iridoid glycosides (harpagoside, harpagide, procumbide)
  compounds:
  - iridoid-glycoside
  - harpagoside
  - glycoside
  note: Harpagoside is the main marker compound and anti-inflammatory principle; effective extracts are
    standardised to it, with the better-quality clinical evidence using preparations delivering roughly
    50-60 mg harpagoside per day.
  reference_ids:
  - REF-0444
  - REF-0443
  - REF-0562
- name: Phenylethanoid glycosides (acteoside, isoacteoside) and flavonoids
  compounds:
  - verbascoside
  - flavonoid
  note: In devil's claw root tinctures the isomers acteoside (verbascoside) and isoacteoside were the
    main compounds after harpagoside. The root also contains flavonoids, phytosterols, sugars and harpagoquinone.
  reference_ids:
  - REF-3962
  - REF-3961
botanical_description:
  text: A prostrate, sprawling, mat-forming perennial herb up to 1.5 m across, with annual stems growing
    from a stout perennial rootstock that bears a group of secondary storage tubers up to 6 cm thick,
    with yellowish-brown, lengthwise-striated bark; these secondary tubers are the part used medicinally.
    The leaves are pinnately lobed and covered in glandular hairs, densely hairy underneath. The solitary
    flowers rise from the leaf axils, with a tubular pink-purple corolla up to 7 cm long. The fruits are
    large, hooked, claw-like capsules whose edges carry two rows of woody arms up to 8 cm long with recurved
    spines.
  height: Prostrate; spreading up to 1.5 m across
  habit: Prostrate, sprawling, mat-forming perennial herb with annual stems
  leaves: Pinnately lobed, covered in glandular hairs, densely hairy underneath
  flowers: Solitary in the leaf axils; corolla tubular, pink-purple, up to 7 cm long
  stem: Annual, prostrate stems from a perennial rootstock
  root: Stout perennial rootstock bearing secondary storage tubers up to 6 cm thick (the medicinal part)
  fruit: Large, hooked, claw-like capsule edged with two rows of woody arms up to 8 cm long bearing recurved
    spines
  reference_ids:
  - REF-3960
  - REF-3961
  status: verified
habitat:
  text: Indigenous to the Kalahari desert and the savannas of southern Angola, Botswana, Namibia and South
    Africa. It thrives in clay or sandy soils in arid regions with 200-600 mm of annual rain, preferring
    roadsides and waste ground, especially where the natural vegetation has been cleared.
  reference_ids:
  - REF-3960
  - REF-3961
  status: verified
harvesting:
  text: The secondary root tubers are dug by hand, sliced and dried in the sun, traditionally by local
    harvesters in southern Africa; sustainable wild-harvesting practices are important given the plant's
    slow growth and habitat sensitivity.
  parts:
  - Secondary root tuber
  status: draft
harvest_readiness:
- part: tuber
  signals:
  - "Dig only the secondary storage tubers, which hang at the ends of the fleshy roots, and leave the persistent primary tuber in the ground so the plant regenerates."
  - "A plant can only be found and dug while its above-ground stems are still traceable: those stems emerge after the first rains and die back in drought or after frost."
  basis: traditional
  source_quote: "The stems grow from a persistent primary tuber and several secondary tubers (the harvested organs) grow from the primary tuber at the end of fleshy roots. The above-ground stems emerge after the first rains and die back during droughts or after frosts."
  reference_ids:
  - REF-3378
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Wikipedia (REF-3378) gives the harvested organ and the rain-driven growth cycle that bounds when a plant can be located. NO source found states a harvest month or a dormancy-stage rule, so none is asserted: the FAO/CRIAA certification study on Namibian devil's claw covers trade and certification only, Useful Tropical Plants has no harvest stage, SANBI PlantZAfrica gives dormancy but not harvest, and the Herbal Reality Kalahari account describes technique ('leave the thick root and primary tuber intact') without a season. Devil's claw is CITES Appendix II and permits are required in Namibia, Botswana and South Africa. Single lineage -> provisional."
traditional_uses:
  text: Devil's claw is a traditional medicine of the Kalahari region of southern Africa, taken as a general
    health tonic and for arthritis, pain, fever, ulcers and boils; other local uses include indigestion,
    blood diseases, urinary tract infections, pain after childbirth, sprains and sores, prepared as infusions,
    decoctions, tinctures, powders and extracts. In Western herbalism the bitter root is taken for digestive
    problems and for arthritis and rheumatism. The WHO monograph lists loss of appetite, indigestion and
    supportive treatment of degenerative rheumatism, painful arthrosis and tendonitis as pharmacopoeial
    uses, and pain associated with rheumatic conditions as a use supported by clinical data.
  reference_ids:
  - REF-1829
  - REF-3961
  - REF-3960
  status: verified
preparations:
- name: Standardised extract
  text: Root tuber extract standardised to harpagoside content, taken as capsules or tablets; the best-studied
    clinical form for osteoarthritis and back pain.
  reference_ids:
  - REF-0443
  - REF-0562
  status: verified
- name: Decoction
  text: Dried root tuber simmered in water, a traditional preparation.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried root tuber.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials for osteoarthritis and back pain commonly use extracts providing around 50-60
    mg harpagoside daily. Educational reference only, not a prescription.
  reference_ids:
