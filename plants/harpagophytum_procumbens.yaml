  | 2026-11-19 (monograph-source audit): botanical_description, habitat, traditional_uses and constituents[1] cited only REF-0443 (Natural Standard systematic review; abstract has no content on the plant). RE-SOURCED: WHO monograph Radix Harpagophyti vol. 3 (REF-3960, new; archive.org text), Useful Tropical Plants (REF-3961, new), ethnobotany review REF-1829, Avato 2019 (REF-3962, new; acteoside and isoacteoside after harpagoside in root tinctures). Dropped as unsupported: greyish-green leaves, funnel-shaped violet flowers, flowering in the rainy season, standardised extracts as effective as some conventional analgesics, antioxidant supporting constituents.'
