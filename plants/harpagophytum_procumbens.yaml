internal_notes: 'Enriched 2026-06-12 from scientific literature (Natural Standard evidence-based systematic
  review; Der Orthopade review of herbal analgesia). Originally a skeleton imported from the omniasana.bio
  Symptom-to-Plant Lookup tool (pain, arthritis, back-pain, inflammation); associations retained and now
  part-mapped and cited. Further enriched 2026-06-14 with PubMed-sourced reviews - a systematic review
  of osteoarthritis and low-back-pain trials (REF-0561; strongest evidence for aqueous extracts at >=50
  mg harpagoside/day, non-inferior to rofecoxib short-term) and a clinical-efficacy review on harpagoside
  dose standardisation (REF-0562). | 2026-06-15: migrated to entity schema (actions->vocab ids, indications
  split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific publications:
  added 11 PubMed-verified @article sources (REF-1829, REF-1830, REF-1831, REF-1832, REF-1833, REF-1834,
  REF-1835, REF-1836, REF-1837, REF-1838, REF-1839) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added monograph-base fields (botanical_description, habitat,
  harvesting, traditional_uses, preparations, dosage) sourced from the existing references bucket; general/undated
  claims marked status: draft per the integrity-first sourcing policy. | 2026-08-15: Harvest Calendar
  (phenological) - harvest_readiness for tuber recorded as GAP: no phenological source for devil''s-claw
  secondary-tuber harvest timing (Useful Tropical Plants + Wikipedia both silent). Binomial confirmed. | 2026-08-15: tuber harvest_readiness filled (was gap) from Wikipedia (REF-3378): secondary storage tubers only, primary tuber left in the ground, and the rain-driven stem cycle that bounds when a plant can be found. No source states a harvest month; FAO/CRIAA, SANBI and Herbal Reality were all checked and gave none.
  | 2026-11-10: symptom-source audit batch 8 - REF-0443 (Natural Standard SR) abstract names no
  condition and its text is not retrievable - removed from all pairs. REF-0444 (Chrubasik 2004
  review, retagged) names arthrotic and low back pain only - removed from inflammation. SR
  REF-0561 (OA and low back pain) added to arthritis. REF-1834 (2006 OA review: the evidence
  "cannot provide a definitive answer" to whether it works) recorded in null_result_ids for
  arthritis.
  | 2026-11-12: symptom-source audit deep re-sweep batch 8 - Deep re-sweep. Cochrane LBP 2014
  REF-1261 ("seem to reduce pain more than placebo", moderate quality at best) added to back-pain
