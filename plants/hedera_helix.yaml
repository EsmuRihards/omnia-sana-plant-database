id: hedera-helix
scientific_name: Hedera helix
common_names:
- Ivy Leaf
- Common ivy
- English ivy
family: Araliaceae
external_ids:
  gbif: 8351737
  wikidata: Q26354
parts_used:
- Leaf (standardised dry extract)
constituents:
- name: Triterpene saponins (hederacoside C, alpha-hederin)
  compounds:
  - triterpene-saponin
  - terpene
  - saponin
  note: The secretolytic and antispasmodic active constituents; extracts are standardised to them.
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-2308
  - REF-2309
  - REF-2311
  - REF-2312
- name: Flavonoids (rutin, quercetin, kaempferol)
  compounds:
  - flavonoid
  note: A 50% ethanol extract of ivy leaves contained the flavonoids rutin, quercetin and kaempferol,
    and the sterol stigmasterol.
  reference_ids:
  - REF-2315
botanical_description:
  text: 'An evergreen climbing plant that grows 20-30 m high where trees, cliffs or walls allow, and spreads
    as ground cover where they do not; it climbs by aerial rootlets with matted pads that cling to the
    surface. The alternate leaves are 5-10 cm long on stalks 1.5-2 cm long and come in two kinds: palmately
    five-lobed juvenile leaves on creeping and climbing stems, and unlobed, heart-shaped adult leaves
    on flowering stems in full sun. Small greenish-yellow flowers, rich in nectar, grow in rounded umbels
    3-5 cm across from late summer to late autumn, followed by purple-black to orange-yellow berries 6-8
    mm across.'
  height: Climbs to 20-30 m where supported; also grows as ground cover
  habit: Evergreen climber or ground cover
  leaves: Alternate, 5-10 cm long; palmately five-lobed on juvenile stems, unlobed and heart-shaped on
    adult flowering stems
  flowers: Small, greenish-yellow, nectar-rich, in umbels 3-5 cm across
  stem: Climbing by aerial rootlets with matted pads
  fruit: Purple-black to orange-yellow berries 6-8 mm across; the leaves and fruits contain a saponin
    glycoside that can cause breathing difficulties and coma if eaten
  flowering_period: Late summer to late autumn
  reference_ids:
  - REF-3964
  - REF-3269
  status: verified
habitat:
  text: Grows as a climbing or ground-covering evergreen on trees, walls, buildings and woodland floors,
    tolerant of shade; native to Europe and Western Asia and widely naturalised elsewhere.
  status: draft
harvesting:
  text: Juvenile (lobed) leaves are picked for medicinal use, typically in spring to summer, then dried
    and processed into standardised extract; the fresh raw leaf is not used directly due to irritant saponins.
  parts:
  - Leaf (standardised dry extract)
  status: draft
harvest_readiness:
- part: leaf
  signals:
  - "Gather the leaves in spring to early summer, used fresh or dried."
  basis: traditional
  source_quote: "The leaves are harvested in spring and early summer, they are used fresh and can also be dried."
  reference_ids:
  - REF-3269
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3269); the leaves are gathered in spring and early summer. Single lineage -> provisional."
traditional_uses:
  text: In folk herbal medicine ivy was used especially for rheumatism, and applied externally to skin
    eruptions, swollen tissue, painful joints, burns and festering cuts. The leaf has long been used for
    cough and respiratory problems and is approved by the German Commission E. The EU herbal monograph
    accepts ivy leaf extracts as an expectorant for productive cough on the basis of well-established
    use, and in an open study in acute bronchitis an ivy-leaf syrup improved symptoms about as much as
    acetylcysteine.
  reference_ids:
  - REF-3269
  - REF-0834
  - REF-3963
  - REF-0472
  status: verified
preparations:
- name: Leaf extract (syrup, drops, tablets)
  text: Dry, liquid or soft extracts of the leaf made with ethanol (for example a dry extract 4-8:1 made
    with 24-30% ethanol), taken by mouth in liquid or solid forms such as syrups; these are the preparations
    the EU herbal monograph covers for productive cough. An ivy-leaf extract syrup (EA 575) was the form
    tested against acetylcysteine in acute bronchitis.
  reference_ids:
  - REF-3963
  - REF-0472
  status: verified
- name: Infusion (traditional)
  text: Dried leaf infused in hot water, a traditional preparation predating standardised extracts.
  status: draft
dosage:
- name: Dry leaf extract (EU herbal monograph)
  text: For the dry extract 4-8:1 (24-30% ethanol), the EU herbal monograph gives adolescents and adults
    15-65 mg one to three times daily (45-105 mg a day), children aged 6-11 years 11-35 mg two to three
    times daily, and children aged 2-5 years 8-18 mg two to three times daily; other extracts have their
    own doses. It is not for children under 2, and a doctor should be consulted if symptoms last more
    than a week. Educational reference only, not a prescription.
  reference_ids:
  - REF-3963
  status: verified
actions:
- action: antispasmodic
  note: Antispasmodic / bronchodilatory - eases coughing fits and breathlessness
  reference_ids:
  - REF-0472
  - REF-2309
  - REF-2311
  status: verified
- action: bronchodilator
  note: Antispasmodic / bronchodilatory - eases coughing fits and breathlessness
  reference_ids:
  - REF-0472
  - REF-2309
  status: verified
- action: expectorant
  note: Expectorant / secretolytic for productive cough and acute bronchitis (loosens and helps clear
    mucus)
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  - REF-0834
  - REF-0833
  status: verified
indications:
- condition: asthma
  note: A review of randomized trials found ivy leaf extract improved lung function in children with chronic
    asthma (small evidence base, one placebo-controlled trial); an add-on trial found no effect on its
    main lung-function outcomes
  reference_ids:
  - REF-3577
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0472
  null_result_ids:
  - REF-3578
- condition: bronchitis
  note: Ivy leaf extract eased productive cough and acute bronchitis in trials, including two placebo-controlled
    randomized trials of EA 575 (2016 and 2019); an updated systematic review found the effects minimal
    at best
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  - REF-5395
  status: verified
  null_result_ids:
  - REF-0833
- condition: cough
  note: Ivy leaf extract EA 575 eased acute cough more than placebo in two randomized trials (2016 and
    2019), and ivy extracts helped productive cough in other clinical studies, though an updated systematic
    review of all ivy products found the effects minimal at best
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  - REF-5395
  status: verified
  null_result_ids:
  - REF-0833
- condition: menstrual-cramps
  note: inferred from antispasmodic action
  reference_ids: []
  status: needs-review
  mechanistic_exclude_ids:
