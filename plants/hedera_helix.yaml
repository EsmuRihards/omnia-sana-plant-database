id: hedera-helix
scientific_name: Hedera helix
common_names:
- Ivy Leaf
- Common ivy
- English ivy
family: Araliaceae
external_ids:
  gbif: 8351737
  wikidata: Q26354
parts_used:
- Leaf (standardised dry extract)
constituents:
- name: Triterpene saponins (hederacoside C, alpha-hederin)
  compounds:
  - triterpene-saponin
  - terpene
  - saponin
  note: The secretolytic and antispasmodic active constituents; extracts are standardised to them.
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-2308
  - REF-2309
  - REF-2311
  - REF-2312
- name: Flavonoids and phenolic acids
  compounds:
  - phenolic-acid
  - flavonoid
  note: Antioxidant supporting constituents.
  reference_ids:
  - REF-0472
botanical_description:
  text: Woody, evergreen climbing or trailing vine that attaches to surfaces by small aerial rootlets.
    Juvenile leaves are glossy, dark green with three to five lobes; mature, flowering growth on well-lit
    stems produces unlobed, oval leaves. Small, greenish-yellow flowers in rounded umbels appear in autumn
    on mature growth, followed by black berries.
  height: Climbing/trailing to 20-30 m where supported
  habit: Woody, evergreen climbing or trailing vine
  leaves: Juvenile leaves glossy, three- to five-lobed; mature leaves unlobed, oval
  flowers: Small, greenish-yellow, in rounded umbels, on mature flowering growth
  stem: Woody, climbing by small aerial rootlets
  root: Woody root system plus climbing aerial rootlets
  fruit: Black berry (toxic if eaten in quantity - not used medicinally)
  flowering_period: Autumn (on mature growth only)
  reference_ids:
  - REF-0472
  status: verified
habitat:
  text: Grows as a climbing or ground-covering evergreen on trees, walls, buildings and woodland floors,
    tolerant of shade; native to Europe and Western Asia and widely naturalised elsewhere.
  status: draft
harvesting:
  text: Juvenile (lobed) leaves are picked for medicinal use, typically in spring to summer, then dried
    and processed into standardised extract; the fresh raw leaf is not used directly due to irritant saponins.
  parts:
  - Leaf (standardised dry extract)
  status: draft
harvest_readiness:
- part: leaf
  signals:
  - "Gather the leaves in spring to early summer, used fresh or dried."
  basis: traditional
  source_quote: "The leaves are harvested in spring and early summer, they are used fresh and can also be dried."
  reference_ids:
  - REF-3269
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3269); the leaves are gathered in spring and early summer. Single lineage -> provisional."
traditional_uses:
  text: Ivy leaf has a long European folk history as an expectorant remedy for coughs and chest complaints,
    and modern standardised leaf extracts are among the best-studied herbal treatments for acute bronchitis
    and productive cough, shown in clinical trials to reduce cough severity and ease breathing.
  reference_ids:
  - REF-0472
  status: verified
preparations:
- name: Standardised dry extract (syrup/drops)
  text: Leaf extract standardised to saponin (hederacoside C) content, formulated as a cough syrup or
    drops; the well-studied clinical form for acute bronchitis and productive cough.
  reference_ids:
  - REF-0472
  status: verified
- name: Infusion (traditional)
  text: Dried leaf infused in hot water, a traditional preparation predating standardised extracts.
  status: draft
dosage:
- name: Standardised extract (syrup)
  text: Commercial standardised ivy-leaf syrups are typically dosed per product labelling (varying by
    age); clinical trials show benefit within about 48 hours of starting treatment. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-0472
  status: draft
actions:
- action: antispasmodic
  note: Antispasmodic / bronchodilatory - eases coughing fits and breathlessness
  reference_ids:
  - REF-0472
  - REF-2309
  - REF-2311
  status: verified
- action: bronchodilator
  note: Antispasmodic / bronchodilatory - eases coughing fits and breathlessness
  reference_ids:
  - REF-0472
  - REF-2309
  status: verified
- action: expectorant
  note: Expectorant / secretolytic for productive cough and acute bronchitis (loosens and helps clear
    mucus)
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  - REF-0834
  - REF-0833
  status: verified
indications:
- condition: asthma
  note: A review of randomized trials found ivy leaf extract improved lung function in children with chronic
    asthma (small evidence base, one placebo-controlled trial); an add-on trial found no effect on its
    main lung-function outcomes
  reference_ids:
  - REF-3577
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0472
  null_result_ids:
  - REF-3578
- condition: bronchitis
  note: Ivy leaf extract eased productive cough and acute bronchitis in trials, including vs placebo;
    an updated systematic review found the effects minimal at best
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  status: verified
  null_result_ids:
  - REF-0833
- condition: cough
  note: Ivy leaf extract eased acute productive cough vs placebo in a randomized trial; an updated systematic
    review found the effects minimal at best
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  status: verified
  null_result_ids:
  - REF-0833
- condition: menstrual-cramps
  note: inferred from antispasmodic action
  reference_ids: []
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0472
- condition: respiratory-support
  note: Ivy leaf extract eased productive cough in acute respiratory infections in trials; an updated
    systematic review found the effects minimal at best
  reference_ids:
  - REF-0472
  - REF-0473
  - REF-0575
  status: needs-review
  null_result_ids:
  - REF-0833
contraindications:
- note: Generally well tolerated; occasional gastrointestinal upset or, rarely, allergic reaction. Use
    only standardised extract products - the fresh raw plant contains irritant saponins and falcarinol
    that can cause contact dermatitis.
  severity: info
  reference_ids:
  - REF-0472
  status: verified
- note: A cough lasting more than a week, or with fever, breathlessness or purulent sputum, needs medical
    assessment. Safety in pregnancy and breastfeeding is not established.
  severity: caution
  reference_ids:
  - REF-0472
  status: needs-review
