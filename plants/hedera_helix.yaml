internal_notes: 'Enriched 2026-06-12 from scientific literature (two clinical effectiveness studies of
  standardised ivy-leaf extract in acute bronchitis / productive cough). Originally a skeleton imported
  from the omniasana.bio Symptom-to-Plant Lookup tool (cough, bronchitis); associations retained and now
  part-mapped and cited. Further enriched 2026-06-14 with a PubMed-sourced randomized, double-blind, placebo-controlled
  multicentre trial of the EA 575 ivy-leaf extract in adults with acute cough, showing a significant,
  clinically relevant reduction in cough severity with onset within 48 hours (REF-0575). | 2026-06-15:
  migrated to entity schema (actions->vocab ids, indications split out, constituents linked to compounds).
  | 2026-06-20: added 3 PubMed-sourced references to the plant-level references bucket (least-cited enrichment):
  REF-0833, REF-0834, REF-0835. | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified
  @article sources (REF-0834, REF-0833, REF-2308, REF-2309, REF-2310, REF-0835, REF-2311, REF-2312, REF-2313,
  REF-2314, REF-2315) - woven into relevant actions/indications and the plant-level references bucket.
  | 2026-07-11: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage) sourced from the existing references bucket; general/undated claims marked status:
  draft per the integrity-first sourcing policy. | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for leaf (provisional: PFAF REF-3269, gathered spring to early summer). Single lineage.
  Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 8 - REF-0833 (Sierocinski 2021 updated SR): ivy leaf is
  safe but "effects are minimal at best and of uncertain clinical importance" - recorded in
  null_result_ids for cough, bronchitis and respiratory-support (owner rule: not convincing = no
  effect). REF-0473 (Hedussin post-authorisation study, non-randomised) retagged clinical.
  | 2026-11-12: symptom-source audit deep re-sweep batch 8 - Deep re-sweep. Muscle-spasm dropped
  (airway/gut smooth-muscle work; off-target, inv. 11). REF-2314 removed from antispasmodic (the
  extract contracted stomach strips; kept in references). REF-0835 (ivy + Coptis two-herb mixture,
  animals) purged and deleted. Asthma: review of RCTs REF-3577 added as support, add-on RCT
  REF-3578 (primary outcomes null) as no-effect. REF-0834 retagged narrative-review. Notes now
  state the updated SR REF-0833 finding (effects minimal at best).'
