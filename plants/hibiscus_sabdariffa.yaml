internal_notes: 'Enriched 2026-06-12 from scientific literature (Nutrition Reviews meta-analysis; Foods
  systematic review/meta-analysis). Originally a skeleton imported from the omniasana.bio Symptom-to-Plant
  Lookup tool (high-blood-pressure, high-cholesterol); associations retained and now part-mapped and cited.
  Further enriched 2026-06-14 with PubMed-sourced meta-analyses of RCTs - a 13-trial review confirming
  systolic/diastolic reductions but no advantage over antihypertensive drugs and no effect in metabolic
  syndrome (REF-0566) and a sour-tea review showing reduced fasting plasma glucose and blood pressure
  (REF-0567). | 2026-06-15: migrated to entity schema (actions->vocab ids, indications split out, constituents
  linked to compounds). | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified
  @article sources (REF-1840, REF-1841, REF-0566, REF-0464, REF-1842, REF-1843, REF-1844, REF-1845, REF-1846,
  REF-1847, REF-1848) - woven into relevant actions/indications and the plant-level references bucket.
  | 2026-07-11: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage) sourced from the existing references bucket; general/undated claims marked status:
  draft per the integrity-first sourcing policy. | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for the calyx (mapped to the canonical flower organ; provisional: Wikipedia Roselle
  REF-3271; harvest when the calyx is fleshy and deep crimson as the fruit matures, before it turns woody).
  Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 3 - REF-1844 (SR: trials do not provide reliable
  evidence to recommend H. sabdariffa for hypertension) moved to null_result_ids for
  high-blood-pressure and cardiovascular-support.
  | 2026-11-10: symptom-source audit batch 8 - REF-0465 purged: the meta-analysis pooled Hibiscus
  COMBINED with other plant extracts. REF-0567 names glycaemic status and blood pressure, not
  metabolic syndrome - removed from metabolic-support. REF-1843 (2013 MA: "does not support the
  efficacy" for lowering serum lipids) recorded in null_result_ids for high-cholesterol.
  | 2026-11-12: symptom-source audit deep re-sweep batch 8 - Deep re-sweep. Cochrane 2021 REF-3581
  (evidence vs placebo insufficient, very low certainty) recorded as no-effect for
  high-blood-pressure and cardiovascular-support; held trials REF-1846/REF-1847 wired directly to
  high-blood-pressure. Overview of reviews REF-3582, glycaemic/lipid MA REF-3583 and MetS lipid MA
  REF-3584 added; REF-0567 (no significant lipid effect) recorded as no-effect for
  high-cholesterol; obesity MA REF-3585 (no benefit) as no-effect for metabolic-support (weight).
  | 2026-11-19 (monograph-source audit): constituents[0-2], preparations[0-1] and dosage[0] cited only REF-0464 (blood-pressure meta-analysis; abstract names no constituents, forms or doses). RE-SOURCED: phytochemistry review REF-1840 (sambubiosides, hydroxycitric and hibiscus acids, protocatechuic acid), Wikipedia REF-3271 (calyx flavonoids gossypetin, hibiscetin, sabdaretin), Senegal RCT REF-1847 (10 g calyx brew/day and 375 mg tablets twice daily, as effective as captopril), umbrella review REF-3582 (dose-dependent BP lowering). Dropped as unsupported: red pigments, tartness, antioxidant flavonoids, ruby-red, the form used in most BP studies, capsules, 1.5-3 g/day (one to two cups). Note: Wikipedia now files roselle as Sabdariffa gossypiifolia, a reclassification of the same plant.
  | 2026-11-19 (monograph-source audit): traditional_uses cited only REF-0464 (blood-pressure meta-analysis). RE-SOURCED: REF-1840 (food, drinks, herbal medicine), Wikipedia REF-3271 (karkade, zobo, Caribbean drink), Senegal RCT REF-1847 (bissap widely known for its antihypertensive effect), Cochrane REF-3581 (evidence insufficient) and REF-0464 (reductions). Dropped as unsupported: tart cooling beverage, folk remedy for fevers, ''now well supported by clinical trials'' (the Cochrane review says the evidence is insufficient).
  | 2026-11-26: symptom-source audit research-deepening batch 16 - Searched PubMed (Hibiscus
  sabdariffa / roselle / sour tea / hibiscus tea / karkade tiab: 104 HT, 26 SR, 151 SAFE hits),
  Europe PMC, ClinicalTrials.gov (43) and OpenAlex. Blood pressure (10), blood sugar,
  cardiovascular, cholesterol (9) and metabolic support (8) were not padded. Added: NEW
  liver-support pair (2014 randomized trial vs control in obese adults, steatosis improved); the
  2004 zobo-drink acetaminophen study (faster elimination) to the medicines caution; two DRAFT
  interactions (needs owner sign-off): statins (2017 human crossover, simvastatin AUC ratio 0.65)
  and anticoagulants (2026 warfarin INR case). Not added: hibiscus + valsartan vs valsartan +
  hydrochlorothiazide in CKD (active comparator), Lippia + hibiscus appetite trials, Aqualief and
  L-methionine combinations, iron-status trials (no vocab condition), an amlodipine interaction
  study (rats), an erlotinib skin-toxicity letter (no abstract), an IVF thrombosis case
  (speculative), the 2023 memory MA (preclinical).'
