id: hibiscus-sabdariffa
scientific_name: Hibiscus sabdariffa
common_names:
- Hibiscus
- Roselle
- Sorrel
- Karkade
family: Malvaceae
external_ids:
  gbif: 3152582
  wikidata: Q319390
parts_used:
- Calyx (dried flower calyces)
constituents:
- name: Anthocyanins (delphinidin- and cyanidin-3-sambubioside)
  compounds:
  - anthocyanin
  note: The anthocyanins delphinidin-3-sambubioside and cyanidin-3-sambubioside are among the compounds
    thought to contribute to the plant's reported effects, which may be linked to antioxidant activity,
    inhibition of angiotensin-converting enzyme and direct relaxation of blood vessels.
  reference_ids:
  - REF-1840
- name: Organic and phenolic acids (hydroxycitric acid, hibiscus acid, protocatechuic acid)
  compounds:
  - phenolic-compound
  note: The organic acids hydroxycitric acid and hibiscus acid, and phenolic acids, especially protocatechuic
    acid, are likely contributors to its reported effects.
  reference_ids:
  - REF-1840
- name: Flavonoids
  compounds:
  - flavonoid
  note: The dried calyces contain the flavonoids gossypetin, hibiscetin and sabdaretin; the leaves contain
    flavonoids such as quercetin and kaempferol and their derivatives.
  reference_ids:
  - REF-3271
botanical_description:
  text: Erect, branching annual to short-lived perennial shrub with reddish stems and deeply lobed, palmate
    leaves. Pale yellow to pink hibiscus-type flowers with a dark centre open briefly, followed by the
    fleshy, bright red calyx (sepals) that swells around the seed capsule - this calyx, not the flower
    petals, is the part harvested and used.
  height: 1-2.5 m
  habit: Erect, branching annual to short-lived perennial shrub
  leaves: Deeply lobed, palmate
  flowers: Pale yellow to pink, hibiscus-type, with a dark centre, short-lived
  stem: Reddish, branching
  root: Taproot with fibrous lateral roots
  fruit: Fleshy, bright red calyx surrounding a seed capsule (the calyx is the medicinal/culinary part)
  flowering_period: Summer to autumn
  status: draft
habitat:
  text: Believed native to West Africa; widely cultivated throughout the tropics and subtropics (Africa,
    Asia, the Caribbean and Central America) for its edible calyces.
  status: draft
harvesting:
  text: The fleshy red calyces are hand-picked shortly after the flower petals fall, while still fresh
    and plump, then separated from the seed pod and dried for storage.
  parts:
  - Calyx (dried flower calyces)
  status: draft
harvest_readiness:
- part: flower
  signals:
  - "Harvest the calyces once they have enlarged, turned fleshy and deep crimson red (as the seed capsule matures inside), before they dry and become woody."
  basis: traditional
  source_quote: "becoming fleshy and a deep crimson red as the fruit matures"
  reference_ids:
  - REF-3271
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Wikipedia Roselle (REF-3271) for Hibiscus sabdariffa; the harvested organ is the persistent calyx, ready when it has enlarged and become fleshy and deep crimson as the fruit (seed capsule) matures inside - picked before it dries and turns woody. Mapped to the canonical 'flower' organ (the fleshy calyx is the floral structure gathered). Single source -> provisional."
traditional_uses:
  text: 'Hibiscus calyces have long been used as food, in hot and cold drinks and herbal teas, and as
    a herbal medicine. They make popular drinks such as karkade in Sudan and Egypt, zobo in Nigeria and
    a spiced drink in the Caribbean, and in Senegal, where the plant is called bissap, it is widely known
    in traditional medicine for lowering blood pressure. The trial evidence is mixed: a 2021 Cochrane
    review judged it insufficient to show that roselle lowers blood pressure compared with placebo, while
    other meta-analyses report reductions.'
  reference_ids:
  - REF-1840
  - REF-3271
  - REF-1847
  - REF-3581
  - REF-0464
  status: verified
preparations:
- name: Infusion ('hibiscus tea')
  text: The calyces are used in hot and cold drinks and herbal teas. In a 6-month randomised trial in
    Senegal, a brew of 10 g of calyx a day lowered blood pressure as much as the drug captopril.
  reference_ids:
  - REF-1840
  - REF-1847
  status: verified
- name: Calyx extract (tablets)
  text: Tablets of hibiscus calyx extract (375 mg twice a day) lowered blood pressure about as much as
    captopril in the same 6-month trial, though the brew tended to work slightly better.
  reference_ids:
  - REF-1847
  status: verified
- name: Culinary use
  text: Fresh or dried calyces used in cooking, jams and cold beverages, especially across West Africa
    and Latin America.
  status: draft
dosage:
- name: Infusion (brew)
  text: In a 6-month randomised trial in people with uncomplicated high blood pressure, a brew of 10 g
    of dried calyx a day lowered systolic pressure by about 20 mmHg, as much as captopril; the authors
    suggest later studies might start the brew at a lower dose. An umbrella review of 26 trials found
    that hibiscus lowers blood pressure in a dose-dependent way. Educational reference only, not a prescription.
  reference_ids:
  - REF-1847
  - REF-3582
  status: verified
actions:
- action: antidiabetic
  note: Lowers fasting blood glucose
  reference_ids:
  - REF-0567
  - REF-1842
  - REF-1848
  status: verified
- action: antihypertensive
  note: Lowers blood pressure, with the greatest effect in people with raised blood pressure
