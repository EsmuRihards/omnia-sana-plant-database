  - REF-3583
  - REF-3582
  status: needs-review
- condition: cardiovascular-support
  note: Hibiscus lowered blood pressure and improved some blood lipid and sugar markers in meta-analyses;
    a Cochrane review judged the blood pressure evidence vs placebo insufficient (very low certainty)
  reference_ids:
  - REF-0464
  - REF-0566
  - REF-0567
  - REF-3582
  status: needs-review
  null_result_ids:
  - REF-1844
  - REF-3581
- condition: high-blood-pressure
  note: Hibiscus lowered blood pressure in meta-analyses, most in people with raised blood pressure, and
    matched captopril in one trial; a Cochrane review judged the evidence vs placebo insufficient (very
    low certainty)
  reference_ids:
  - REF-0464
  - REF-0566
  - REF-0567
  - REF-1846
  - REF-1847
  - REF-3582
  status: verified
  null_result_ids:
  - REF-1844
  - REF-3581
- condition: high-cholesterol
  note: 'Meta-analyses disagree: some found hibiscus lowered total and LDL cholesterol, others found no
    significant effect on blood lipids'
  reference_ids:
  - REF-0464
  - REF-3584
  - REF-3583
  - REF-3582
  status: needs-review
  null_result_ids:
  - REF-1843
  - REF-0567
- condition: metabolic-support
  note: Hibiscus improved blood pressure, cholesterol and blood sugar markers in meta-analyses; it did
    not reduce body weight in a 2024 meta-analysis
  reference_ids:
  - REF-3582
  - REF-3584
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0567
  null_result_ids:
