drug_class_interactions:
- drug_class: antihypertensives
  severity: caution
  mechanism: Hibiscus (roselle) lowers systolic and diastolic blood pressure in trials (a meta-analysis
    found reductions of about 7.6/3.5 mmHg); combined with blood-pressure medicines it may add to their
    effect and cause blood pressure to drop too low, so monitor blood pressure.
  reference_ids:
  - REF-0566
  - REF-2527
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- drug_class: statins
  severity: caution
  mechanism: In healthy volunteers, hibiscus tea taken with simvastatin cut the amount of simvastatin
    reaching the blood by about a third (randomized crossover study), so it may weaken the drug; the authors
    advise against combining them.
  reference_ids:
  - REF-5401
  status: draft
- drug_class: anticoagulants-antiplatelets
  severity: caution
  mechanism: A woman on long-term warfarin developed a markedly raised INR after starting hibiscus tea,
    with no other cause found; it normalised after stopping the tea and giving vitamin K (case report).
  reference_ids:
  - REF-5400
  status: draft
pairings:
- partner_id: olea-europaea
  type: caution
  note: Hibiscus and olive leaf can each mildly lower blood pressure, so taking them together - especially
    alongside blood-pressure medicines - may add up and lower blood pressure more than expected. Monitor
    your blood pressure.
  reference_ids:
  - REF-2527
  - REF-2537
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
- partner_id: nigella-sativa
  type: caution
  note: Hibiscus and black seed (Nigella sativa) can each mildly lower blood pressure, so taking them
    together - especially alongside blood-pressure medicines - may add up and lower blood pressure more
    than expected. Monitor your blood pressure.
  reference_ids:
  - REF-2527
  - REF-2512
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
