  status: verified
contraindications:
- note: Its blood-pressure-lowering effect can add to that of antihypertensive medicines; monitor blood
    pressure if you take them. Note that it is not superior to standard antihypertensive drugs and did
    not significantly lower blood pressure in the metabolic-syndrome subgroup.
  severity: info
  reference_ids:
  - REF-0464
  - REF-0566
  status: verified
- note: May alter the absorption or levels of some medicines (e.g. paracetamol, chloroquine); avoid concentrated
    or medicinal doses in pregnancy.
  severity: caution
  reference_ids:
  - REF-0464
  - REF-5402
  status: needs-review
