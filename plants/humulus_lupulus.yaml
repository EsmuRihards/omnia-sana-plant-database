- part: flower
  signals:
  - "Pick the female cones (strobiles) in late summer to early autumn, when ripe - still greenish, aromatic and springy."
  basis: traditional
  source_quote: "The female flowering heads are harvested in the autumn and can be used fresh or dried."
  reference_ids:
