  notes: "PFAF (REF-3272); the female flowering heads (strobiles) are picked in late summer to early autumn while greenish and aromatic. Single lineage -> provisional. SAFETY: the climbing habit can be confused with the dangerous white bryony (Bryonia dioica) - confirm identity; see Dangerous Lookalikes."
traditional_uses:
  text: 'Hops are a traditional sedative and bitter tonic: they were given for nervousness and at bedtime
    to induce sleep, to improve appetite and digestion, and for indigestion and liver complaints, and
    a pillow of warm hops was used to ease toothache, earache and nervous irritation. Traditional medicine
    also used them for abdominal cramps, painful periods, diarrhoea, migraine and oedema. Pharmacopoeias
    describe hops as a sedative for nervous tension and insomnia and as a remedy for indigestion and poor
    appetite, and the EU herbal monograph accepts traditional use for mild symptoms of mental stress and
    to aid sleep.'
  reference_ids:
  - REF-4004
  - REF-4003
  - REF-3077
  status: verified
preparations:
- name: Infusion
  text: Dried flower cones infused in hot water as a herbal tea, 500-1000 mg in 150-200 ml, taken 30-60
    minutes before bedtime per the EU herbal monograph. Educational reference only, not a prescription.
  status: verified
  reference_ids:
  - REF-3077
- name: Tincture
  text: Tincture (1:5) of the dried cones, 1-2 ml up to three times daily per the EU herbal monograph.
    Educational reference only, not a prescription.
  status: verified
  reference_ids:
  - REF-3077
- name: Dry extract
  text: 'A dry extract (4-5:1) is a listed form in the EU herbal monograph: 125 mg two to three times
    daily in mental stress, or 125-250 mg an hour before bedtime to aid sleep. In an animal study a hop
    extract containing xanthohumol and humulone lengthened sleep, acting at the GABA-A receptor, while
    a small uncontrolled study in 15 volunteers found no sleep-inducing effect from a hop concentrate.
    Educational reference only, not a prescription.'
  reference_ids:
  - REF-3077
  - REF-0839
  - REF-4003
  status: verified
dosage:
- name: Infusion
  text: The EU herbal monograph distinguishes two uses, in adolescents, adults and elderly. To aid sleep
    - 500-1000 mg of the comminuted flower in 150-200 mL of boiling water as an infusion, 30-60 minutes
    before bedtime. In mental stress - 500 mg in 150-200 mL as an infusion, up to 4 times daily. A 1:5
    tincture at 1-2 mL up to 3 times daily is also listed. Educational reference only, not a prescription.
  reference_ids:
  - REF-3077
  status: verified
constituents:
- name: Bitter acids (humulone, lupulone)
  note: The strobiles' bitter substances (15-25%) sit in the resins, mainly the alpha acids (humulone
    and related humulones) and beta acids (lupulone and its derivatives). Humulone and lupulone were the
    active constituents of a strobile extract that inhibited Helicobacter pylori in the lab. In an animal
    study, a mix of humulone and xanthohumol matched the sleep-enhancing effect of a hop extract that
    acted at the GABA-A receptor.
  reference_ids:
  - REF-4003
  - REF-0839
- name: Prenylflavonoids (xanthohumol, 8-prenylnaringenin)
  compounds:
  - flavonoid
  note: Xanthohumol has antioxidant activity; 8-prenylnaringenin has notable phytoestrogenic activity,
    the basis of the mild oestrogenic caution.
  reference_ids:
  - REF-1726
- name: Essential oil
  compounds:
  - essential-oil
  note: Aromatic volatile oil contributing to the characteristic hop aroma.
  reference_ids:
  - REF-0839
