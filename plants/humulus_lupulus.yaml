  | 2026-11-20 (owner asked to fix the hop wording): three entries overstated a GABA-A mechanism. (1) Preparation ''Standardised extract'' (REF-0839 only) -> ''Dry extract'': the EU monograph REF-3077 (read 2026-11-20) lists dry extract 4-5:1 at 125 mg 2-3x daily (mental stress) and 125-250 mg 60 min before bedtime (sleep); REF-0839 is an animal pentobarbital-sleep study of one Korean hop extract (not described as standardised); WHO REF-4003 records a 15-volunteer uncontrolled study with no sleep-inducing effect and mixed animal results. (2) Bitter-acids constituent: ''responsible for much of the sedative, GABA-A-receptor-active and antimicrobial activity'' replaced by WHO REF-4003 (bitter substances 15-25% in the resins; humulone and lupulone the active anti-H. pylori constituents) and REF-0839 (humulone + xanthohumol mix matched the extract; xanthohumol is a prenylflavonoid, not a bitter acid). (3) passiflora-incarnata pairing (approved): ''both GABA-acting sedative herbs commonly combined in sleep blends'' had REF-2452 (a hypnotic-herb review naming neither herb) and REF-0565 (passionflower tea RCT); now REF-4203 (Maroo 2013 NSF-3 RCT: valerian + passionflower + hop extracts vs zolpidem, no significant difference, drowsiness commonest AE), REF-3077 (4.7 may impair ability to drive) and REF-0565. Kept approved, reviewed_date 2026-11-20. Not changed: the melissa-officinalis pairing also leans on REF-2452, which does not name hops.
