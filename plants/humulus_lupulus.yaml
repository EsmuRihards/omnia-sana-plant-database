botanical_description:
  text: 'A perennial, dioecious, twining herb with a stout perennial root and long, angular, rough-hairy,
    tough stems that twine up to about 6 m. The leaves are heart-shaped, palmately three-lobed (sometimes
    five- to seven-lobed), rough and dark green. Male and female flowers grow on separate plants: the
    male flowers in loose bunches in the leaf axils, the pale green female flowers in leafy, cone-like
    catkins. These mature into the hops (strobiles), oblong cones about 3 cm long of overlapping, papery,
    yellowish-green to pale brown bracts, each enclosing a small glandular achene and sprinkled with yellow
    lupulin glands.'
  height: Twining stems up to about 6 m
  habit: Perennial, dioecious, twining herb
  leaves: Heart-shaped, palmately three-lobed (sometimes five to seven), rough, dark green
  flowers: Male in loose axillary bunches; female pale green in leafy cone-like catkins
  stem: Long, angular, rough-hairy, tough, twining
  root: Stout perennial root
  fruit: Strobile (hop) about 3 cm long of papery bracts, each enclosing a glandular achene; yellow lupulin
    glands
