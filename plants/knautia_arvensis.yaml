traditional_uses:
  text: 'The name scabious is thought to come from ''scab'', a scaly sore, because some of these plants
    were used against scabies-like skin diseases. Field scabious is astringent and mildly diuretic: an
    infusion was taken as a blood purifier and for eczema and other skin disorders, and applied externally
    to cuts, burns and bruises. Culpeper recommended it for coughs, shortness of breath and other lung
    complaints, and a decoction in wine for pleurisy; the bruised herb and decoction were applied to sores
    and ulcers.'
  reference_ids:
  - REF-4008
  - REF-3280
  status: verified
