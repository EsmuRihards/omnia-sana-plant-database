internal_notes: 'Created 2026-07-10 (inline research; the research-workflow agent failed on the session
  limit). SETTLED-INCOMPLETE: genuine Knautia arvensis medicinal/phytochemical literature is only 3 papers
  (REF-2808 phenolic profile, REF-2809 phenolic/flavone constituents, REF-2810 knautioside/saponosides).
  PubMed for K. arvensis is otherwise dominated by rumen/methane feed studies, plant-pathology and ecology
  (all rejected). Supplemented with 5 clearly-labelled Caprifoliaceae congeners (REF-2811 genus Knautia
  anti-acne/skin - matching the plant''s traditional skin use; REF-2812 Dipsacus/Scabiosa review; REF-2813
  Scabiosa review; REF-2814 Scabiosa antioxidant/antidiabetic; REF-2815 Dipsacus fullonum). 8 total -
  well under 15; genuine-only <15 is genuine for this species. Do NOT pad with unrelated species. Cross-links
  via shared compounds (chlorogenic-acid/flavonoid/iridoid-glycoside/saponin) and skin/inflammation indications.
  lookalikes none-known (distinctive lilac pincushion heads; confusable only with harmless Scabiosa/Succisa).
  | 2026-07-19 (dosage-sourcing campaign, closing sweep): DOCUMENTED DEAD END - closing sweep of the dosage-sourcing
  campaign. The remaining unsourced dosage entry/entries on this record were searched against every seam
  this campaign opened and none yields a dose for this species in this preparation. Seams checked: (1)
  the official EMA herbal medicines register (medicines-output-herbal_medicines-report, 251 rows, retrieved
  2026-07-18), matched on the accepted binomial AND on every synonym and common name appearing in a register
  row; (2) WHO monographs on selected medicinal plants Volumes 1-4, indexed by Latin drug title with each
  monograph''s Definition read to confirm the species - 177 monographs indexed; (3) this plant''s own
  reference bucket, mined for human studies that state an administered dose. Per the campaign''s integrity
  bar the entry is left unsourced at status draft rather than attached to a tangentially-related paper.
  Settled as sparse-literature incomplete in the earlier campaign; no monograph or dose-reporting trial
  exists for this species. INTEGRITY FIX 2026-07-20: a contraindication carried status ''verified'' with
  no reference_ids. The caution itself is an honest statement about the ABSENCE of safety data and is
  retained unchanged - dropping a safety warning would be the more harmful error - but ''verified'' asserts
  a source was checked against, and none exists. Demoted to ''needs-review'', which is what the data actually
  merits. Sourcing an absence is possible (cf. the euphrasia precedent, where an EMA public statement
  was cited as the authority for there being no established posology) and is the proper fix if a seam
  opens. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for flower + aerial-parts
  (provisional: PFAF REF-3280, gathered while in flower July-Sept); root = GAP (no sourced timing). Binomial
  confirmed. | 2026-08-15: root harvest_readiness filled (was gap) on a re-read of PFAF REF-3280, which ties the root to the flowering plant (''with or without the roots'').
  | 2026-11-10: symptom-source audit batch 9 - REF-2811 purged: it tested Knautia drymeia and K.
  macedonica, not K. arvensis (its only link to field scabious is genus-level prose). All 6 pairs
  dropped; plant leaves the Symptom tool.
  | 2026-11-12: symptom-source audit deep re-sweep batch 9 - Deep re-sweep. REF-2814 studies
  Turkish Scabiosa species (S. columbaria, S. triniifolia), not Knautia arvensis - purged and
  deleted. No sourced activity remains.
  | 2026-11-19 (monograph-source audit): botanical_description, habitat, harvesting cited only REF-2808 and traditional_uses only REF-2810 (lab studies). RE-SOURCED: Grieve Field Scabious (REF-4008, new) + PFAF REF-3280. Dropped as unsupported: 25-100 cm, honeysuckle family, lyre-shaped lower leaves, heads 3-4 cm, hairy (not scaly) receptacle, western Asia and Africa, root dug in autumn, best cut from established plants, sore throats, the phenolic/flavonoid/saponin chemistry shared with Scabiosa and Dipsacus (not a traditional use, and genus-level).'
