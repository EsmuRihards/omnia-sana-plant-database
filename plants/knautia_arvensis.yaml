botanical_description:
  text: 'A perennial herb, the largest of the British scabiouses, with a dark, somewhat woody root that
    holds firmly in the ground. The round, slightly branched stems, 60-100 cm tall, are coarse with short
    whitish hairs and rather bare of leaves except near the base. The hairy leaves grow in pairs and vary:
    the lowest are stalked, simple and lance-shaped, about 12.5 cm long and 2.5 cm broad with large teeth;
    the upper ones are stalkless and cut almost to the midrib into four or five pairs of narrow lobes
    with a large end lobe. The large, convex flower heads of delicate mauve grow singly on long stalks;
    the outer florets are larger than the inner, four-lobed ones. It flowers from July to September and
    is pollinated by bees and butterflies. The fruit is rather large, somewhat four-cornered and crowned
    by short bristly hairs.'
