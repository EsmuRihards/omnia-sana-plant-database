  status: provisional
  notes: "PFAF (REF-3282); as an evergreen, the leaves are gathered year-round, typically in summer. Single lineage -> provisional. SAFETY: true bay (Laurus nobilis) is confused with the toxic cherry laurel (Prunus laurocerasus), whose leaves are cyanogenic - never substitute; confirm identity, see Dangerous Lookalikes."
- part: fruit
