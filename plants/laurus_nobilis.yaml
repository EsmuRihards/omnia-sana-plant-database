  status: provisional
  notes: "PROSEA monograph on Laurus nobilis, hosted on Pl@ntUse (REF-3379). The same page gives the gathering practice: 'When berries are harvested they are mostly picked at the same time as the leaves.' Supersedes the earlier dead end (PFAF gave no fruit timing). Single lineage -> provisional. SAFETY CRITICAL: cherry laurel (Prunus laurocerasus) berries are toxic and the two are confused - confirm identity before gathering any 'laurel' fruit, see Dangerous Lookalikes."
traditional_uses:
  text: Bay leaf has an ancient Mediterranean culinary and medicinal history, used as a digestive carminative
    for indigestion and bloating, and topically and traditionally for muscle and joint pain and minor
    wounds; it remains one of the most widely used culinary herbs worldwide.
  reference_ids: []
  status: verified
