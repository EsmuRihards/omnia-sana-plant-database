contraindications:
- note: Generally safe in food amounts. Insufficient reliable information about safety during pregnancy
    or breastfeeding - stick to food amounts. Large amounts of bay leaf tea may cause vomiting (emetic
    properties) and drowsiness (sedative properties). In high doses, bay laurel has cytotoxic activity.
  severity: caution
  reference_ids: []
  status: needs-review
- note: Duke (2002) notes antibacterial, anti-inflammatory, and antioxidant activities for bay laurel,
    primarily at the experimental level. The essential oil contains eugenol and 1,8-cineole as principal
    bioactive components. Traditional dosages in European phytotherapy include 1–3 g of dried leaf as
    a tea. Caution is advised as the essential oil may cause allergic contact dermatitis, and bay berries
    should not be confused with the less toxic leaves (Duke, 2002).
  severity: caution
  reference_ids:
  - REF-0063
  status: verified
- note: 'Liver: two women who regularly drank bay leaf tea developed liver injury (case reports). In one,
    the link was rated probable and she improved after stopping the tea; the other, who had drunk it daily
    for a month, died of liver failure.'
  severity: caution
  reference_ids:
  - REF-5429
  - REF-5430
  status: verified
- note: 'Swallowing the leaves: whole bay leaves have lodged in the oesophagus (gullet) and blocked it
    (two case reports); remove whole leaves from food before eating.'
  severity: caution
  reference_ids:
  - REF-5431
  status: verified
- note: 'Allergy: bay (laurel) leaf oil can cause allergic contact dermatitis, for example after a massage
    with it, sometimes as an unusual target-like (erythema multiforme-like) rash; in a food-industry worker,
    breathing in bay leaf and other herb dusts caused asthma, confirmed by inhalation tests (case reports).'
  severity: caution
  reference_ids:
  - REF-5432
  - REF-5433
  - REF-5434
  status: verified
- note: 'Identification: an 84-year-old developed complete heart block after drinking a tea of oleander
    leaves mistaken for bay leaves, and needed an antidote and a pacemaker (case report). Oleander contains
    heart poisons (cardiac glycosides) in all its parts.'
  severity: warning
  reference_ids:
  - REF-5435
  status: verified
