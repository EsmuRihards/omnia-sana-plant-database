  status: verified
- condition: menstrual-cramps
  note: Inhaling lavender (in sesame oil) over four menstrual cycles eased period-pain symptoms more than
    placebo in 96 students with primary dysmenorrhoea (randomized trial)
  reference_ids:
  - REF-5436
  status: verified
- condition: menopause
  note: Lavender aromatherapy reduced menopausal symptoms in a meta-analysis of trials (some combined
    lavender with other aromas) and in randomized trials of inhaled lavender, including menopause-specific
    quality of life; an oral lavender oil capsule did not beat placebo on overall symptoms (randomized
    trial)
  reference_ids:
  - REF-5437
  - REF-5438
  - REF-5440
  status: verified
  null_result_ids:
  - REF-5441
- condition: hot-flashes
  note: Smelling lavender for 20 minutes twice a day for 12 weeks reduced the number of hot flushes compared
    with a control scent (randomized crossover trial); a meta-analysis of lavender aromatherapy also reported
    fewer hot flushes
  reference_ids:
  - REF-5439
  - REF-5437
  status: verified
- condition: fatigue
  note: Lavender reduced fatigue in a meta-analysis of trials of inhaled oil in haemodialysis patients,
    in a randomized double-blind trial of lavender flower capsules in multiple sclerosis, and in a randomized
    trial of inhaled oil during chemotherapy for blood cancers
  reference_ids:
  - REF-5442
  - REF-5443
  - REF-5444
  status: verified
- condition: oral-health
  note: Lavender oil applied to recurrent mouth ulcers (aphthous ulcers) reduced ulcer size, inflammation
    and pain and shortened healing compared with placebo (randomized double-blind trial)
  reference_ids:
  - REF-5447
  status: verified
- condition: pms
  note: A single 10-minute inhalation of lavender in the premenstrual phase eased low mood and confusion
    and raised calming (parasympathetic) nerve activity compared with water in women with premenstrual
    symptoms (small randomized crossover trial)
  reference_ids:
  - REF-5448
  status: verified
contraindications:
- note: Generally very safe. Essential oil should not be ingested in large amounts. Rarely, contact dermatitis
    may occur. May potentiate the effect of sedative medications. Avoid therapeutic doses during pregnancy.
  severity: caution
  reference_ids:
  - REF-0043
  - REF-0155
  - REF-0265
  status: verified
- note: 'Duke (2002) rates lavender as ++ and provides clinical evidence (score 2) for carminative activity,
    consistent with Commission E approval for nervous stomach disorders and functional abdominal complaints.
    Additional experimental activities include anxiolytic, antispasmodic, and antiseptic effects. The
    essential oil demonstrates COX-2 inhibitory and Alzheimer''s-relevant properties at the experimental
    level. Dose: 1–2 teaspoons (4–8 g) dried flowers as tea; 1–3 drops essential oil in a carrier for
    topical or aromatherapy use. Duke notes that oral lavender oil (Silexan) has clinical evidence for
    generalized anxiety disorder (Duke, 2002).'
  severity: info
  reference_ids:
  - REF-0043
  - REF-0155
  - REF-0265
  - REF-0063
  status: verified
- note: 'Children: in case reports, a few prepubertal boys developed breast growth, and girls early breast
    development, while lavender-containing products (oils, lotions, colognes; in some cases with tea tree
    oil) were used on them regularly; it went away after the products were stopped. A systematic review
    found little evidence of a causal link, a survey of 556 children found no cases, and guideline tests
    of lavender oil''s main compounds found no hormone activity (case reports; review; survey; lab and
    animal studies).'
  severity: caution
  reference_ids:
  - REF-5449
  - REF-5450
  - REF-5451
  - REF-5452
  - REF-5453
  status: verified
- note: 'Skin allergy: lavender is an uncommon cause of allergic contact dermatitis, mostly from personal-care
    products and essential oils (2.2% of 2,178 patients patch-tested with lavender at an Australian clinic
    reacted). Lavender oil left exposed to air oxidises into stronger skin allergens (patch-test and lab
    study).'
  severity: caution
  reference_ids:
  - REF-5454
  - REF-5455
  status: verified
- note: 'Medicines: in randomized crossover studies in healthy volunteers, the oral lavender oil Silexan
    (160 mg a day) had no relevant effect on the drug-clearing enzymes CYP1A2, CYP2C9, CYP2D6 and CYP3A4
    (the CYP2C19 result was inconclusive) and did not change levels of an ethinyl estradiol/levonorgestrel
    contraceptive pill.'
  severity: info
  reference_ids:
  - REF-5456
  - REF-5457
  status: verified
- note: 'Driving and dependence: in randomized trials, Silexan did not impair simulated driving (unlike
    lorazepam), was not liked more than placebo by recreational drug users even at eight times the usual
    dose, and caused no withdrawal symptoms when stopped abruptly after 10 weeks.'
  severity: info
  reference_ids:
  - REF-5458
  - REF-5459
  - REF-5460
  status: verified
