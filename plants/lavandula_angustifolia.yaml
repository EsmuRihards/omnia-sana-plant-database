internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: added 3 PubMed-sourced
  references to the plant-level references bucket (least-cited enrichment): REF-0857, REF-0858, REF-0859.
  | 2026-06-20: enriched to >=10 scientific publications: added 11 PubMed-verified @article sources (REF-2205,
  REF-2206, REF-2207, REF-2208, REF-2209, REF-2210, REF-2211, REF-2212, REF-2213, REF-2214, REF-2215) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  monograph-base fields (botanical_description, habitat, harvesting, traditional_uses, preparations, dosage
  + constituents) sourced from the existing references bucket; general/undated claims marked status: draft
  per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where absent) + cancer
  indication (anticancer/antitumour research) sourced from the plant''s cited literature, as part of the
  cancer-condition campaign. | 2026-07-18 (dosage-sourcing campaign, batch 3): dosage sourced to the EU
  herbal monograph on Lavandula angustifolia Miller, flos (EMA/HMPC/734125/2010 = REF-3071, new). MAJOR
  CORRECTION: the entry claimed ''around 4-8 g of dried flowers per cup'' - roughly four times the monograph
  figure, which is 1-2 g in 150 mL three times daily. Tincture (2-4 mL 3x daily), the under-12 restriction
  and the monograph''s drive/machinery warning added. Note the register also carries Lavandulae aetheroleum
  (the essential oil) as a separate monograph with its own posology; this entry is the FLOWER only. status
  -> verified. DEAD END (preparations, 2026-07-20): checked against the monograph references already on
  this record, judged from their stored posology summaries and not from the full monograph PDFs - a later
  pass with the PDFs, or a new seam (Health Canada NNHPD, ESCOP, Commission E), may still resolve these.
  ''Standardised oral oil preparation'': Wrong herbal substance. REF-3071 is the lavender FLOWER monograph
  (tea and tincture); the standardised oral oil preparation belongs to Lavandulae aetheroleum, a separate
  monograph. The flower monograph contains no oil posology and no mention of Silexan. | 2026-08-15: Harvest
  Calendar (phenological) - added harvest_readiness for flower (provisional: PFAF REF-3283, spikes cut at
  full bloom in mid-to-late summer). Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 3 - REF-0858 (RCT, lavender oil inhalation,
  postmenopausal insomnia: no significant difference on the primary outcome) recorded in
  null_result_ids for insomnia.
  | 2026-11-10: symptom-source audit batch 10 - REF-0043 (Cavanagh 2002, oils of four Lavandula
  species, "data still inconclusive") is a genus-level review and REF-0155 (Lis-Balchin, Lavender:
  The Genus Lavandula, book) is unverifiable and genus-level - both removed from all 9 pairs.
  REF-0265 (Schuwald 2013) is a mechanism study of anxiolytic action, not an RCT (retagged
  preclinical) - removed from insomnia. EU flower monograph REF-3071 (relief of mild symptoms of
  mental stress and exhaustion and to aid sleep - EMA page 429, flagged for owner spot-check)
  added to insomnia; REF-0858 stays in null_result_ids.
  | 2026-11-12: symptom-source audit deep re-sweep batch 10 - Deep re-sweep. REF-0265 (VOCC
  anxiolytic mechanism study) removed from five non-sedative actions. Held Silexan MA REF-2531 and
  herb NMA REF-2546 were never wired to a pair: new pairs (owner rule) anxiety (+ MAs REF-3609,
  REF-3610), depression (MA REF-3611, RCT REF-3612; inconclusive SR REF-2212 recorded as
  no-effect), stress (MA REF-3613), pain (SRs REF-3616, REF-3617). Sleep MAs REF-3614/REF-3615
  added to insomnia; episiotomy SR REF-3617 to wounds. Not used: retracted burn-patient MA
  36651329; underpowered post-dural-puncture headache RCT 33245709.
  | 2026-11-26: symptom-source audit research-deepening batch 19 - Searched PubMed (Lavandula
  angustifolia / Lavandula officinalis / Silexan tiab, lavender ti: 347 HT, 58 SR, 193 SAFE hits),
  Europe PMC, ClinicalTrials.gov (123) and OpenAlex. Huge plant: screened the SR family,
  conditions without a pair and safety; anxiety (9), depression (9), insomnia (8), pain (8),
  stress (7) and wounds (7) were not padded. INTEGRITY HOLD checked: no new reference is first- or
  last-authored by the flagged Tehran psychopharmacology group; the 2003 lavender tincture vs
  imipramine depression trial (12551734) is from that group and was not added. Added: NEW
  menstrual-cramps (2014 placebo RCT), menopause (2020 MA + two RCTs; 2024 oral-oil RCT recorded
  as no-effect on overall symptoms), hot-flashes (2016 crossover RCT + the MA; 29778129 and
  27388435 report the same Ardabil trial and are cited on different pairs), fatigue (2024
  haemodialysis MA, 2022 MS capsule RCT, 2025 chemotherapy RCT), oral-health (2012 aphthous-ulcer
  placebo RCT) and pms (2013 crossover RCT) pairs; knee osteoarthritis RCTs (2016, 2025) to
  arthritis; cautions on prepubertal breast growth (case reports with the review, survey and
  guideline tests that question causality) and on skin allergy (Australian patch-test series;
  oxidised oil); info notes on Silexan drug, contraceptive, driving, abuse and withdrawal studies.
  Not added: headache (2022 post-dural-puncture RCT different only immediately after inhalation;
  2012 migraine trial does not state randomisation; clove+lavender and nitroglycerin-headache
  trials not significant or vs acetaminophen); sexual function (benefit only in a domain of the
  oral-oil RCT, aromatherapy combinations); 2025 post-intubation sore-throat gauze trial
  (procedure-specific); 29389470 (same knee OA trial as 27863613); 2024 blood-pressure trial (with
  ylang-ylang) and a 2013 trial where lavender tended to raise blood pressure; nausea
  (peppermint+ginger+lavender blend); restless legs and dementia agitation (no vocab condition);
  combinations with bergamot, bitter orange, rosemary, sweet orange or ginger; L. stoechas
  labour-pain MA and anticholinergic tea case (other species); retracted burn-pain MA and
  retracted cardiovascular review; serotonin-toxicity letter with sertraline (no abstract; a
  possible interaction worth re-checking if the full text becomes available); aromatherapist
  contact dermatitis letters with no abstract.'
