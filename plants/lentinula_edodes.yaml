id: lentinula-edodes
scientific_name: Lentinula edodes
common_names:
- Shiitake (mushroom)
- Shiitake
- Chinese forest mushroom
- black mushroom
family: Omphalotaceae
external_ids:
  gbif: 2537743
  wikidata: Q320999
parts_used:
- Mycelium
- Whole Plant
botanical_description:
  text: Wood-decay fungus (not a true plant) with a classic cap-and-stem mushroom form. The cap is broad,
    brown to dark brown, often with pale scale-like markings, with a fringed or curled margin when young;
    the underside bears numerous cream-coloured gills radiating from a central or slightly off-centre
    fibrous stem.
  height: Cap 5-20 cm across
  habit: Wood-decay fungus with a typical cap-and-stem structure
  leaves: Not applicable (fungus)
  flowers: Not applicable (fungus); reproduces by spores
  stem: Fibrous, central to slightly off-centre, often tough
  root: Mycelium spreading through the wood substrate
  fruit: Cream-coloured gills radiating beneath the cap, releasing spores
  flowering_period: Fruiting body develops over weeks on the growing substrate
  status: draft
habitat:
  text: Grows naturally as a wood-decay fungus on fallen broadleaf trees (notably shii, oak and chestnut)
    in East Asian forests; almost all commercial shiitake today is cultivated on hardwood logs or sawdust
    blocks.
  status: draft
harvesting:
  text: Fruiting bodies are hand-picked once the cap has opened but before the margin fully flattens,
    then used fresh or dried; mycelium-based extracts are cultivated separately in liquid or grain culture.
  parts:
  - Mycelium
  - Whole Plant
  status: draft
harvest_readiness:
- part: fruiting-body
  signals:
  - "Harvest when the caps are mostly open (about 80-90%) and 2-4 inches wide, while the cap edges are still curled under, before the cap flattens."
  basis: traditional
  source_quote: "Cut mushrooms at the base when caps are 80-90% open."
  reference_ids:
  - REF-3286
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "The Spore Depot (REF-3286) for Lentinula edodes; harvest when the caps are 80-90% open and 2-4 inches wide, while the edges are still curled under (before the cap flattens). Single source -> provisional."
traditional_uses:
  text: Shiitake has been used to improve general health for thousands of years in Asia, where it is known
    as xianggu in China and shiitake in Japan. It is used medicinally for conditions involving weakened
    immunity, colds and flu, high cholesterol, high blood pressure and other complaints, and its polysaccharide
    lentinan has been approved in China and Japan since the 1980s as an adjuvant drug in cancer treatment.
  reference_ids:
  - REF-3642
  - REF-1167
  status: verified
preparations:
- name: Culinary use
  text: Fresh or dried fruiting body cooked and eaten as a food, always fully cooked (never raw) to avoid
    the rare shiitake dermatitis reaction.
  status: draft
- name: Extracts (lentinan, mycelium and culture extracts)
  text: Preparations studied for their pharmacological effects include the polysaccharide lentinan and
    extracts of the mycelium and culture media (LEM, LAP, KS-2); lentinan is an approved adjuvant cancer
    drug in China and Japan.
  reference_ids:
  - REF-1167
  - REF-3642
  status: verified
dosage:
- name: Standardised extract
  text: Traditional and product references commonly suggest around 1-3 g of dried extract daily, in divided
    doses. Educational reference only, not a prescription.
  status: draft
constituents:
- name: Lentinan (beta-1,3-glucan polysaccharide)
  compounds:
  - polysaccharide
  note: A beta-glucan polysaccharide extracted from shiitake with immunostimulatory effects, approved
    as an adjuvant cancer drug in China and Japan since the 1980s.
  reference_ids:
  - REF-3642
- name: Eritadenine
  note: A unique amino-acid-derived compound studied for cholesterol-lowering activity.
