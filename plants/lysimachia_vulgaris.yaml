traditional_uses:
  text: Yellow loosestrife is an astringent, demulcent and expectorant herb, used mainly for diarrhoea
    and dysentery, to stop bleeding from the mouth, nose and wounds and other haemorrhages, and to cleanse
    wounds; as a gargle it was used for a relaxed throat and quinsy, and it was thought equal to eyebright
    for sore eyes. Because gnats and flies seem to dislike the plant, it was put under the yokes of oxen
    to quieten them, which may explain the name loosestrife, and the dried herb was burnt in houses so
    that the smoke would drive away gnats and flies.
  reference_ids:
  - REF-4009
  - REF-3290
  status: verified
