internal_notes: 'Created 2026-07-10 (inline research; the research-workflow agent for this plant failed
  on the session limit). 15 refs REF-2793..REF-2807: 9 genuine Lysimachia vulgaris (incl. var. davurica,
  a variety of the species - PCSK9/lipid-lowering, liver-fibrosis/NASH, IBS-D, antibacterial/antitumor/antioxidant,
  flavonoid/rutin phytochem) + 6 clearly-labelled genus congeners (L. christinae renal/anticancer/saponins,
  L. foenum-graecum antioxidant, L. baviensis anti-inflammatory, L. capillipes anticancer saponins). Every
  congener labelled; the genus shares saponin/flavonoid chemistry. Non-medicinal L. vulgaris hits (pollen/canopy/wetland-ecology/heavy-metal
  bioindication) rejected. Strong genuine finding: PCSK9 inhibition -> statins interaction. Cross-link:
  primula-veris (Primulaceae saponins). lookalikes none-known (distinctive whorled leaves + yellow star
  flowers; unrelated to purple loosestrife Lythrum). | 2026-07-13: added anticancer action (where absent)
  + cancer indication (anticancer/antitumour research) sourced from the plant''s cited literature, as
  part of the cancer-condition campaign. | 2026-07-19 (dosage-sourcing campaign, closing sweep): DOCUMENTED
  DEAD END - closing sweep of the dosage-sourcing campaign. The remaining unsourced dosage entry/entries
  on this record were searched against every seam this campaign opened and none yields a dose for this
  species in this preparation. Seams checked: (1) the official EMA herbal medicines register (medicines-output-herbal_medicines-report,
  251 rows, retrieved 2026-07-18), matched on the accepted binomial AND on every synonym and common name
  appearing in a register row; (2) WHO monographs on selected medicinal plants Volumes 1-4, indexed by
  Latin drug title with each monograph''s Definition read to confirm the species - 177 monographs indexed;
  (3) this plant''s own reference bucket, mined for human studies that state an administered dose. Per
  the campaign''s integrity bar the entry is left unsourced at status draft rather than attached to a
  tangentially-related paper. INTEGRITY FIX 2026-07-20: a contraindication carried status ''verified''
  with no reference_ids. The caution itself is an honest statement about the ABSENCE of safety data and
  is retained unchanged - dropping a safety warning would be the more harmful error - but ''verified''
  asserts a source was checked against, and none exists. Demoted to ''needs-review'', which is what the
  data actually merits. Sourcing an absence is possible (cf. the euphrasia precedent, where an EMA public
  statement was cited as the authority for there being no established posology) and is the proper fix
  if a seam opens. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for aerial-parts +
  flower + leaf (all provisional: PFAF REF-3290, gathered while in flower in summer); root = GAP (no sourced
  timing). Binomial confirmed. | 2026-08-15: root harvest_readiness re-searched and kept a documented gap; PFAF gives the flowering-herb stage only, and the Madaus entry filed under this genus is Lysimachia nummularia (a different species) and specifies the flowering plant WITHOUT root.
  | 2026-11-10: symptom-source audit batch 10 - var. davurica is listed as a synonym on this
  record. REF-2796 (Turkish L. vulgaris: folk use for fever, ulcer, diarrhoea and wounds;
  anti-inflammatory activity; antibacterial) added to wounds and inflammation. REF-2795 (IBS-D
  mouse model) names no inflammation. REF-2797 (hepatic lipogenesis, fatty liver) moved from
  high-cholesterol/metabolic to liver-support; REF-2794 (NASH) removed from metabolic-support.
  | 2026-11-12: symptom-source audit deep re-sweep batch 10 - Deep re-sweep. REF-2805 studies
  Lysimachia foenum-graecum, a different species - purged and deleted. Notes rewritten to their
  lab sources (all preclinical; REF-2796 states folk use for fever, ulcer, diarrhoea and wounds).
  No trials on PubMed.
  | 2026-11-19 (monograph-source audit): botanical_description, habitat, harvesting cited only REF-2796 and traditional_uses REF-2796/REF-2794/REF-2802 (lab studies). RE-SOURCED: Grieve Yellow Loosestrife (REF-4009, new) + PFAF REF-3290. Dropped as unsupported or wrong-species: 150 cm, red-margined sepals (Grieve: calyx fringed with red hairs), naturalised in North America, fertile waterlogged soils, root dug in autumn, flavonoid- and tannin-rich, East Asian use of L. vulgaris var. davurica and L. christinae (congeners, not this species), shared saponin chemistry.'
