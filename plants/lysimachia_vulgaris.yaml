botanical_description:
  text: A tall perennial, 60-120 cm high, with a creeping root that sends up new stems each spring. The
    slightly branched stems are covered in soft, fine down. The nearly stalkless leaves grow in pairs
    or in whorls of three or four, the same arrangement throughout a plant; they are oblong or lance-shaped,
    7.5-15 cm long and about 3 cm broad, with smooth edges, downy beneath and marked with black gland
    dots above. The top of the stem carries a mass of golden flowers on slightly sticky stalks; each flower
    is about 2 cm across, a cup of five petals joined near the base, with a five-pointed calyx fringed
    with fine red hairs. It has no nectar or scent. The fruit is a rounded capsule that opens by five
    valves.
  height: 60-120 cm
