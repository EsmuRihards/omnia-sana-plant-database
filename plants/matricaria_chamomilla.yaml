  REF-1158, REF-1159, REF-1160, REF-1161, REF-1162) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-06-27: enriched to >=15 scientific publications: added 4 PubMed-verified
  @article sources (REF-1155, REF-1160, REF-2348, REF-2349) - woven into relevant actions/indications
  and the plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage/constituents
  monograph-base fields, sourced from the existing ethnomedicinal/phytochemical reviews (REF-1153, REF-1158,
  REF-1162) and book refs. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for flower
  (provisional: PFAF REF-3289, flowerheads picked when fully open). Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 10 - REF-0112 (Hoffmann, Medical Herbalism;
  unverifiable since batch 2) and REF-0189 (Padula 2006, "Chamomile: industrial profiles"; not
  locatable) removed from every symptom as unverifiable. REF-0280 (Srivastava 2010 review; lumps
  German and Roman chamomile, counts for M. chamomilla per the type-species rule) names hay fever,
  inflammation, muscle spasms, insomnia, ulcers, wounds, rheumatic pain, haemorrhoids - removed
  from 9 pairs (incl. menstrual-cramps: "menstrual disorders" is vague) and retagged. EU monograph
  REF-0079 (minor GI complaints such as bloating and minor spasms; common cold; mouth and throat
  inflammation; minor skin inflammation, superficial wounds - EMA page 429, flagged) removed from
  eczema and infection.
  | 2026-11-12: symptom-source audit deep re-sweep batch 10 - Deep re-sweep. Muscle-spasm dropped
  (EU monograph spasms are gastrointestinal; off-target). Anxiety: MA REF-3629 added, herb NMA
  REF-2546 (chamomile not significant vs placebo) no-effect. REF-1156 retagged rct and added to
  depression. UV-erythema RCT REF-3527 no-effect for inflammation and skin-irritation (batch-7
  carry). Anti-inflammatory MA REF-3630, chamomile-tea RCT REF-3638 added. New pairs (owner rule):
  menopause (RCTs REF-3631, REF-3632), hot-flashes (REF-3632), pms (RCT vs mefenamic acid
  REF-3633), migraine (RCT REF-3634), oral-health (RCTs REF-3635, REF-3636 + SR REF-3637),
  back-pain (RCT REF-3639). Not used: saffron+chamomile combination 37427624; ginger/chamomile
  CINV trial 27644672 (conclusion is about ginger).'
