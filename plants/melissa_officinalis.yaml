internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific
  publications: added 10 PubMed-verified @article sources (REF-1193, REF-1194, REF-1195, REF-1196, REF-1197,
  REF-1198, REF-1199, REF-1200, REF-1201, REF-1202) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage/constituents
  monograph-base fields, sourced from the existing ethnopharmacology/pharmacology reviews (REF-1196, REF-1198,
  REF-1201). | 2026-07-18 (dosage-sourcing campaign, batch 3): the ''Infusion (tea)'' entry sourced to
  the EU herbal monograph on Melissa officinalis L., folium (EMA/HMPC/196745/2012 = REF-3078, new). The
  existing 1.5-4.5 g figure matched the monograph EXACTLY - one of the few entries needing no numeric
  correction; frequency confirmed as 1-3 times daily, and the liquid extract, tincture, 2-week consult
  trigger and under-12 restriction added. Also removed a stray editorial aside from the public text (''Duke
  (2002) has no dedicated dosing entry for lemon balm'') - that belongs here, not in reader-facing dosage
  copy, and it remains true. The ''Standardised extract'' entry was already sourced (REF-1193/REF-1194)
  and is untouched. status -> verified. Preparations sourced 2026-07-20 to monographs already on this
  record. Each supporting quote was checked to appear verbatim in the stored monograph posology, the reference
  confirmed present on the plant, and the dose form / plant part / route checked for mismatch; text rewritten
  to the source rather than having a reference stapled on. | 2026-08-15: Harvest Calendar (phenological) -
  added harvest_readiness for leaf + flower (provisional: PFAF REF-3292, gathered just before flowering).
  Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 11 - REF-0112 (Hoffmann; unverifiable since batch 2)
  removed from 10 pairs. REF-0194 (Petersen 2003, "Rosmarinic acid" - a compound found across many
  Lamiaceae, not a lemon balm source) removed from 5 pairs. REF-0134 (Kennedy 2002 RCT) measured
  mood and cognition, not sleep - removed from insomnia (an RCT is cited only for what it
  measured). EU leaf monograph REF-3078 (mild symptoms of mental stress and to aid sleep; mild GI
  complaints including bloating and flatulence - EMA page 429, flagged for owner spot-check) added
  to insomnia, bloating, indigestion.
  | 2026-11-13: symptom-source audit deep re-sweep batch 11 - Deep re-sweep. REF-0134 (acute mood
  RCT) removed from five non-sedative actions. Muscle-spasm dropped (off-target). Held MAs
  REF-1194/REF-1195/REF-1197 and RCT REF-2539 wired. New pairs (owner rule): anxiety, stress,
  high-cholesterol, high-blood-pressure. RCT REF-3657 (T2D) supports depression/anxiety and is
  recorded as no-effect for sleep and blood pressure. Herpes labialis SR REF-3655 added to
  infection. UV-erythema RCT REF-3527 no-effect for skin (batch-7 carry). Not used: psoriasis
  syrup RCT 34193264 (no between-group DLQI difference reported); palpitations RCT 25680840 (no
  matching condition).'
