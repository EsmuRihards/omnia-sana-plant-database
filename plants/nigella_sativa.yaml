contraindications:
- note: Generally well-tolerated in clinical trials at doses up to 200 mg/day of oil for 90 days. Potential
    side effects may include mild gastrointestinal discomfort. Contraindicated during pregnancy due to
    potential uterine stimulant effects. May interact with immunosuppressants and antidiabetic medications.
    Allergic reactions possible in sensitive individuals. Consult healthcare provider before use, especially
    with concurrent medications.
  severity: caution
  reference_ids: []
  status: needs-review
- note: Duke (2002) describes black cumin (Nigella sativa) as one of the most multi-active medicinal spices,
    with experimental evidence for bronchodilation, immunostimulation, hepatoprotection, and antihistaminic
    activity. The prophet Muhammad reportedly described it as 'a cure for all things except death.' Key
    bioactive compounds include thymoquinone and nigellone. Antihistaminic and bronchodilatory activity
    supports its traditional use in asthma and allergic conditions. Duke notes it is generally safe at
    culinary amounts but recommends caution with medicinal doses in pregnancy due to potential uterotonic
    effects (Duke, 2002).
  severity: caution
  reference_ids:
  - REF-0063
  status: verified
- note: 'Skin: black seed oil applied to the skin has caused severe allergic contact dermatitis; three
    women needed hospital care for blistering, target-like lesions spreading beyond where the oil was
    applied, resembling Stevens-Johnson syndrome, with fever and over 15% of the skin detaching (case
    series). Thymoquinone may be the main culprit.'
  severity: warning
  reference_ids:
  - REF-5530
  status: verified
- note: 'Muscles, kidneys and liver: muscle breakdown (rhabdomyolysis), acute kidney injury and liver
    injury followed drinking black seed oil (case report).'
  severity: caution
  reference_ids:
  - REF-5531
  status: verified
- note: 'Liver and kidney tests: in a meta-analysis of 19 randomized trials (1,295 people), black seed
    lowered the liver enzyme ALP and blood urea; creatinine rose slightly in three adjusted trials, and
    doses above 2,000 mg a day were reported to raise blood urea.'
  severity: info
  reference_ids:
  - REF-5532
  status: verified
- note: 'Blood count: a woman who had taken black seed oil and evening primrose oil daily for about a
    month developed a severe drop in platelets with blood clots after surgery; the authors thought the
    supplements made it worse, but the cause is uncertain (case report).'
  severity: info
  reference_ids:
  - REF-5533
  status: verified
