  PFAF REF-3297, capsules ripen in autumn/September). Single lineage. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep re-sweep batch 11 - Deep re-sweep. Held MAs REF-2512,
  REF-2513 (blood pressure) and REF-2516 (T2D glucose/lipids) were never wired. Added glycaemic MA
  REF-3696, MetS MAs REF-3698/REF-3704, inflammation MA REF-3699. New pairs (owner rule):
  high-blood-pressure, high-cholesterol, cardiovascular-support (MA REF-3703), asthma (MA
  REF-3700), allergy (rhinitis MA REF-3701), liver-support (NAFLD MA REF-3702; no liver warning in
  the record). Not used: RA SR 32274788 (no change in inflammatory biomarkers); herbal mastalgia
  MA 36446563 (not species-specific).
  | 2026-11-26: symptom-source audit research-deepening batch 22 - Searched PubMed (Nigella sativa
  / black seed / black cumin / kalonji tiab, thymoquinone ti: 344 HT, 118 SR, 895 SAFE hits),
  Europe PMC, ClinicalTrials.gov (73) and OpenAlex. Huge plant: screened SRs, conditions without a
  pair and safety; blood sugar, blood pressure, cholesterol, metabolic and cardiovascular pairs
  (8) were not padded. INTEGRITY HOLD checked: no new reference is from the flagged group. Added:
  2022 double-blind knee OA RCT + 2024 OA SR to arthritis (replacing the inferred note), 2017
  processed-seed OA RCT as no effect; NEW acne (2020 hydrogel RCT), sinusitis (2021 nasal-drop
  RCT), kidney-support (2019 triple-blind kidney-stone RCT), insomnia and stress (2023 BlaQmax
  RCTs, same proprietary product) pairs; via Europe PMC: NEW pms pair (2025 double-blind placebo
  RCT) and a 2025 triple-blind episiotomy emulgel RCT to wounds and pain (replacing the inferred
  notes); severe topical-oil dermatitis WARNING (2018 JAMA Dermatology series), rhabdomyolysis/AKI
  caution (2024 case), liver/kidney-marker MA and a thrombocytopenia case (with evening primrose
  oil) as info notes. Not added: 2023 H. pylori RCT (appetite outcome only), 2015 honey-based
  dyspepsia formula (combination), 2023 navel-oil urinary incontinence RCT (topical abdominal
  route; stress incontinence unchanged), 2022 depression adjunct trial (randomisation not stated),
  2019 mucositis rinse and 2026 gingivitis mouthwash (active comparators), thymoquinone gel
  (compound), male infertility (multi-herb SR only; the RCT was not retrieved), olive + black seed
  oil episiotomy trial (combination), rheumatoid arthritis biomarker trials (no clinical outcome),
  contact-dermatitis letters with no abstract, thymoquinone CYP and cyclosporine studies (lab and
  rodent).'
