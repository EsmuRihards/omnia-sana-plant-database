  status: verified
habitat:
  text: Woods and scrub in dry, rocky places. Olive trees are native to Africa, temperate Asia and Europe;
    Grieve gives Asia Minor and Syria as the home of the cultivated tree, which is grown throughout the
    Mediterranean and also in Chile, Peru and South Australia.
  reference_ids:
  - REF-3299
  - REF-4020
  status: verified
harvesting:
  text: The fruit is harvested in autumn, from late September to November in the Northern Hemisphere,
    depending on the variety and region. The leaves, the richest source of olive phenolic compounds, are
    also used.
  parts:
  - Leaf
  - Fruit
  season: Fruit late September to November (Northern Hemisphere)
  reference_ids:
