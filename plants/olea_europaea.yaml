  REF-1442, REF-1443, REF-1444, REF-1445, REF-1446) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage/constituents
  monograph-base fields, sourced from the existing leaf-polyphenol reviews (REF-1437, REF-1438, REF-1446)
  and clinical trials (REF-1443, REF-2537). | 2026-07-13: added anticancer action (where absent) + cancer
  indication (anticancer/antitumour research) sourced from the plant''s cited literature, as part of the
  cancer-condition campaign. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for
  fruit (provisional: PFAF REF-3299, olives harvested in autumn); leaf = GAP (evergreen, no sourced leaf
  timing). Binomial confirmed. | 2026-08-15: leaf harvest_readiness filled (was gap) from Losada-Echeberria et al., Int J Mol Sci 2022 (REF-3380). basis is CONSTITUENT, not traditional - the only sourced stage is an autumn phenolic peak on an evergreen with no traditional collection window.
  | 2026-11-10: symptom-source audit batch 11 - REF-0032 (oleocanthal, olive-specific phenolic;
  compound evidence) kept for arthritis and inflammation only. REF-0299 (olive leaf RCT in T2D)
  names no cardiovascular outcome. REF-0301 (Waterman 2007 review) names blood pressure, LDL and
  antimicrobial activity against intestinal/respiratory pathogens - kept for cardiovascular,
  infection, cold; removed from 6 pairs. REF-1443 (RCT: insulin sensitivity in men at risk of
  metabolic syndrome) added to metabolic-support.
  | 2026-11-13: symptom-source audit deep re-sweep batch 11 - Deep re-sweep. REF-0032 (oleocanthal
  review) removed from antidiabetic/antimicrobial/antiviral; REF-0299 (olive leaf hypoglycaemia
  RCT) kept only for antidiabetic. Held RCT REF-1445 -> new menopause pair. CV MAs
  REF-3695/REF-3688 added. Blood sugar: EVOO and olive-leaf MAs REF-3690/REF-3689/REF-3687
  no-effect. Inflammation: olive oil MA REF-3691 support, olive-leaf MA REF-3689 no-effect.
  Pressure-ulcer MA REF-3692 to wounds; herpes labialis SR REF-3655 to infection. New pairs:
  oral-health (periodontal MA REF-3693), cognitive-function (EVOO MA REF-3694). Not used:
  olive-oil lipid MA 36408701 (trivial effects) - no cholesterol pair.
  | 2026-11-19 (monograph-source audit): dosage[0] and preparations[1] checked against REF-2537/REF-1443/REF-1445 and rewritten to what they report. Dropped as unsupported: standardised for oleuropein, liquid extract, the form used in most trials, culinary oil and leaf tea food-safe.
  | 2026-11-19 (monograph-source audit): botanical_description and habitat cited only REF-1437 and harvesting only REF-1446 (lab and absorption studies). RE-SOURCED: Grieve Olive (REF-4020, new) + PFAF REF-3299; REF-1446 kept only for its statement that the leaves are the richest source of olive phenolics. Dropped as unsupported: 3-15 m, centuries-old specimens, fragrant four-lobed flowers in axillary clusters, green to purple-black, extensive root system, Near East and parts of Africa wording, calcareous soils and drought, leaves harvested year-round with oleuropein highest in late autumn and winter, machine harvesting, green olives from early autumn.
  | 2026-11-26: symptom-source audit research-deepening batch 22 - Searched PubMed (Olea europaea
  / olive leaf / olive leaves / oleuropein tiab, olive oil ti: 748 HT, 108 SR, 814 SAFE hits),
  Europe PMC, ClinicalTrials.gov (108) and OpenAlex. Huge plant: screened SRs, conditions without
  a pair and safety; olive oil trials mostly compare it with other fats (active comparators).
  Added: NEW high-blood-pressure pair (2022 olive leaf MA of 12 RCTs + the 2021 MA REF-2537
  already cited for the antihypertensive interaction); 2025 ESOLED pilot RCT as a no-effect study
