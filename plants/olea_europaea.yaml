traditional_uses:
  text: Olive leaf and fruit have a long Mediterranean tradition as a tonic, antipyretic and mild antihypertensive
    remedy, and olive oil is the foundation fat of the traditional Mediterranean diet, long associated
    with cardiovascular health. Modern research on oleuropein and other leaf polyphenols supports antioxidant,
    anti-inflammatory, antimicrobial, blood-pressure-lowering and insulin-sensitising effects consistent
    with these traditional and dietary uses.
  reference_ids:
  - REF-1437
  - REF-1440
  - REF-1443
  status: verified
preparations:
- name: Leaf infusion (tea)
  text: Dried leaf steeped in hot water, a traditional mild antihypertensive and tonic tea.
  status: draft
- name: Leaf extract (capsules)
  text: Olive leaf extract in capsules, the form used in randomised trials of insulin sensitivity in overweight
    men and of postmenopausal symptoms; one trial dosed it by its oleuropein and hydroxytyrosol content.
  reference_ids:
  - REF-1443
  - REF-1445
  status: verified
- name: Olive oil (culinary)
  text: Extra-virgin, cold-pressed oil, the everyday dietary form and the basis of the Mediterranean diet.
  status: draft
- name: Table olives (fruit)
  text: Cured or fermented ripe or unripe fruit eaten as food.
  status: draft
dosage:
- name: Leaf extract (trials)
  text: In a meta-analysis of olive leaf extract trials in people with prehypertension or hypertension,
    500 mg a day for at least 8 weeks lowered systolic blood pressure compared with placebo, while 1,000
    mg a day showed a similar but non-significant reduction. Other randomised trials used capsules supplying
    51.1 mg oleuropein and 9.7 mg hydroxytyrosol a day, or 250 mg of extract a day, for 12 weeks. Educational
    reference only, not a prescription.
  reference_ids:
  - REF-2537
  - REF-1443
  - REF-1445
  status: verified
