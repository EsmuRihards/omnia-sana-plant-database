botanical_description:
  text: A small evergreen tree, about 6 m or more tall, with pale grey bark and many thin branches with
    opposite branchlets. The short-stalked, opposite leaves are lance-shaped, about 5.5 cm long, pointed,
    smooth-edged, pale green above and silvery below. Numerous small creamy-white flowers open in spring,
    usually from April to June in the Northern Hemisphere. The fruit, the olive, is an ovoid, often pointed
    drupe about 2 cm long, ripening dark purple, its flesh full of oil around a thick, bony stone with
    a single seed.
  height: About 6 m or more
  habit: Small evergreen tree
  leaves: Opposite, short-stalked, lance-shaped, about 5.5 cm, pale green above, silvery below
  flowers: Numerous, small, creamy-white
  stem: Pale grey bark; many thin branches with opposite branchlets
  fruit: Ovoid, often pointed drupe about 2 cm long, ripening dark purple, oily flesh, bony stone
  flowering_period: Spring, usually April to June (Northern Hemisphere)
