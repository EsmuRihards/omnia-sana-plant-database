  notes: "Plantura restharrow overview (REF-3391). TAXONOMIC CAVEAT, and the reason species_confirmed is FALSE: the harvest sentence sits in the source's treatment of spiny restharrow (Ononis spinosa), and the same page treats our plant as a subspecies of it - 'Also known as Ononis arvensis, this is another subspecies of the spiny restharrow' (i.e. Ononis spinosa subsp. hircina). The source therefore never names Ononis arvensis as the plant whose taproot it describes. Recorded as provisional with the caveat visible, rather than silently inheriting the pharmacopoeial congener's timing; the PFAF page for O. arvensis remains an empty template listing only O. repens and O. spinosa. Single lineage -> provisional."
traditional_uses:
  text: Field restharrow grows throughout Europe and is used in folk medicine to treat infections of the
    urinary tract and skin diseases. Its root has long been used as a medicine in many countries, mostly
    as tinctures, infusions and lotions. The restharrow root of the European Pharmacopoeia and the EU
    herbal monograph comes from the related spiny restharrow (Ononis spinosa), used to increase urine
    flow and flush the urinary tract in minor urinary complaints; the two species show no characteristic
    difference in their isoflavonoid pattern.
  reference_ids:
  - REF-2741
  - REF-3023
  - REF-4026
  - REF-2743
  status: verified
