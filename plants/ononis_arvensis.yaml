contraindications:
- note: 'A safety signal exists in the genus: an Ononis spinosa root extract showed hepatotoxic effects
    at higher doses in animals (alongside analgesic activity). Avoid excessive or prolonged use, and use
    caution in liver disease.'
  severity: warning
  reference_ids:
  - REF-2758
  status: verified
- note: No safety assessment exists for field restharrow itself. The EU herbal monograph for the root
    of the related spiny restharrow (Ononis spinosa) says it must not be used where a reduced fluid intake
    is recommended, such as severe heart or kidney disease, that enough fluid must be drunk during use,
    and that a doctor should be seen if urinary complaints worsen or fever, painful urination, spasms
    or blood in the urine appear.
  severity: caution
  reference_ids:
  - REF-4026
  status: verified
- note: The root is rich in isoflavone phytoestrogens (formononetin); avoid medicinal doses in pregnancy
    and breastfeeding and use caution in hormone-sensitive conditions.
  severity: caution
  reference_ids:
  - REF-2741
  - REF-2743
  status: verified
