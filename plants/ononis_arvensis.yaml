habitat:
  text: Native to Eurasia, from central Europe through western Siberia to the western Himalayas. It has
    a more easterly range than spiny or creeping restharrow and is not found west of southern Scandinavia
    and Germany. It grows mainly in dry and semi-dry grassland, mostly where the climate is continental,
    from the lowlands to hill country, and also in meadows and old fields.
  reference_ids:
  - REF-4027
  - REF-4028
  status: verified
harvesting:
  text: The root is the part mainly harvested; the aerial parts are usually left as an unused by-product
    when the roots are dug. In one study the aerial parts were collected in August and dried in air and
    shade. No species-specific season for digging the root was found.
  parts:
  - Root
  - Aerial parts
  season: Aerial parts collected in August in one study; no species-specific root season found
  reference_ids:
