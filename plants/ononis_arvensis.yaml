botanical_description:
  text: 'A summer-green perennial subshrub of the pea family, 30-100 cm tall, mostly upright and almost
    always without spines, with a strong smell. Its shoots are densely hairy: the stem carries spreading
    glandular hairs about 2 mm long among ordinary hairs, and the leaves are glandular-hairy and somewhat
    sticky. The pink flowers, often striped with purple and very rarely white, are borne mostly in dense,
    spike-like clusters at the shoot tips, two at each node, from June to July, and are pollinated mainly
    by bees. The pod is no longer than the calyx, and the plant grows from a strong, branched rootstock.
    It differs from spiny restharrow (O. spinosa) in having its flowers in pairs rather than singly and
    in lacking stiff spines.'
  height: 30-100 cm
  habit: Summer-green perennial subshrub, mostly upright, almost always spineless, strong-smelling
  leaves: Glandular-hairy and somewhat sticky, mostly pointed at the tip
  flowers: Pink, often purple-striped, very rarely white; in dense spike-like clusters at the shoot tips,
    two per node
  stem: Densely hairy, with spreading glandular hairs about 2 mm long among ordinary hairs
  root: A strong, branched rootstock
  fruit: A pod no longer than the calyx
