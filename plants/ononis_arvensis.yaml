internal_notes: 'Created 2026-07-10. 20 refs REF-2741..REF-2760: 12 genuine Ononis arvensis (chiefly phytochemistry - the
  species'' own literature is analytical-heavy) + 8 clearly-labelled Ononis spinosa congener refs supplying
  the pharmacology of Ononidis radix (the officinal diuretic; O. arvensis is used interchangeably). >=15
  genuine target met. Research-workflow leads (wf_25f58939-508) self-verified because the adversarial-verify
  stage failed on the session limit; older non-English Cesk/Aptechnoe/Georgian papers confirmed genuine via
  PubMed metadata. Hepatotoxicity safety signal (REF-2758) surfaced as a warning contraindication.
  Cross-links: solidago-virgaurea + betula-pendula (irrigation-therapy diuretics), trifolium-pratense
  (shared formononetin phytoestrogen - caution). lookalikes none-known (spiny pink-flowered legume,
  distinctive). | 2026-07-13: added anticancer action (where absent) + cancer indication
  (anticancer/antitumour research) sourced from the plant''s cited literature, as part of the
  cancer-condition campaign. | 2026-07-18: added 22 new OpenAlex-sourced scientific references
  (REF-3015..REF-3036) covering anticancer / immunity / cardiovascular / cognitive & general medicinal
  properties; harvested from OpenAlex (open, non-PubMed database). | 2026-07-19 (dosage-sourcing campaign,
  closing sweep): DOCUMENTED DEAD END - closing sweep of the dosage-sourcing campaign. The remaining
  unsourced dosage entry/entries on this record were searched against every seam this campaign opened and
  none yields a dose for this species in this preparation. Seams checked: (1) the official EMA herbal
  medicines register (medicines-output-herbal_medicines-report, 251 rows, retrieved 2026-07-18), matched on
  the accepted binomial AND on every synonym and common name appearing in a register row; (2) WHO monographs
  on selected medicinal plants Volumes 1-4, indexed by Latin drug title with each monograph''s Definition
  read to confirm the species - 177 monographs indexed; (3) this plant''s own reference bucket, mined for
  human studies that state an administered dose. Per the campaign''s integrity bar the entry is left
  unsourced at status draft rather than attached to a tangentially-related paper. SPECIFIC FINDING - WRONG
  SPECIES TRAP: the EMA register does contain Ononidis radix, but that monograph is Ononis SPINOSA (spiny
  restharrow), not O. arvensis. This plant''s own bibliography likewise contains an O. spinosa pharmacology
  paper (REF-2754), and its other dose-bearing candidate (REF-3022) is a multi-herb phyto-complex trial with
  no per-herb dose. Consistent with the earlier precision pass on this record, which removed wrong-species
  Ononis papers. | 2026-08-15: Harvest Calendar (phenological) - harvest_readiness for root recorded as GAP:
  the PFAF Ononis arvensis page is an empty template (lists only congeners O. repens and O. spinosa), so no
  species-specific harvest stage exists; the pharmacopoeial O. spinosa timing must NOT be inherited. Aerial
  parts and flower likewise unsourced this pass. Binomial confirmed (no timing to attach). | 2026-08-15: root harvest_readiness filled (was gap) from Plantura (REF-3391) with species_confirmed FALSE and the taxonomic caveat spelled out in-entry: the source describes the taproot of spiny restharrow and treats O. arvensis as a subspecies of it, so this is not a silent congener inheritance.
  | 2026-11-10: symptom-source audit batch 11 - REF-2748 (Rezacova 1978, Czech pharmacognostic
  study; no abstract or text) removed from every symptom as unverifiable. Cardiovascular note
  corrected: it described PPAR-gamma anti-adipogenic work that neither cited study reports.
  | 2026-11-10: symptom-source audit batch 11 - unverifiable source hidden from remaining
  mechanistic cards / claim note reset.
  | 2026-11-13: symptom-source audit deep re-sweep batch 11 - Deep re-sweep. REF-2759 and REF-3028
  study Ononis spinosa, and REF-3034 screens O. spinosa among Turkish plants - not O. arvensis;
  purged and deleted (the genus hepatotoxicity warning REF-2758 stays). Notes rewritten.
  | 2026-11-20 (monograph-source audit follow-up): REF-2753 (Nechita 2026, Plants, PMID 42122901, PMC13164978) re-tagged review -> narrative-review. Its abstract describes a 4-database search, but the full-text Methods call it ''a comprehensive narrative review'', add later papers ad hoc, include earlier studies ''selectively'' and do no quality assessment, so it fails invariant 8; its 34 studies are all in vitro / animal. Not in any indication or action here, so no score change. OPEN (owner decision, not changed): the paper covers Ononis SPINOSA only - it never names O. arvensis - yet it is still cited on 6 entries of this record: traditional_uses, the Decoction preparation, the irrigation-therapy caution, the diuretics interaction and the solidago-virgaurea and betula-pendula pairings. The full text does support O. spinosa root decoctions for diuresis and kidney stones (Turkish, Iranian folk use), irrigation therapy of the lower urinary tract, and external use on wounds and skin; it does NOT state the oedema / heart-or-kidney caution, any interaction with diuretic drugs, or either pairing (no mention of Solidago or Betula), nor gargles or eczema. The co-citation REF-2748 is the unverifiable Rezacova 1978 study already removed from every symptom on 2026-11-10.
  | 2026-11-20 (REF-2753 wrong-species fix, owner-approved ''Yes, fix them''): REF-2753 (Ononis SPINOSA review) and the unverifiable REF-2748 (Rezacova 1978, no abstract on PubMed 752421) removed from the 6 entries they carried. (1) traditional_uses rewritten to what field-restharrow sources state: REF-2741 abstract ''Ononis arvensis L. can be found overall in Europe and is used to treat infections of the urinary tract and skin diseases in ethnopharmacology''; REF-3023 abstract (O. arvensis and O. intermedia roots used in folk medicine as tinctures, infusions and lotions); plus REF-4026 (EU monograph EMA/HMPC/138317/2013, new) for the officinal spiny restharrow root and REF-2743 (no characteristic isoflavonoid difference between the two species). Dropped as unsourced for O. arvensis: ''aquaretic'', ''used interchangeably with O. spinosa'', cystitis/gravel, mouth/throat gargle, eczema, rheumatic use, ''central and eastern European''. (2) The Decoction preparation is now ''Root tincture, infusion or lotion'' cited to REF-3023; no O. arvensis source names a decoction (even the EU monograph for O. spinosa gives an infusion). (3) Irrigation caution re-sourced to the EU O. spinosa monograph (4.3 contraindication: conditions where reduced fluid intake is recommended, e.g. severe cardiac or renal disease; 4.4 adequate fluid intake, see a doctor for fever/dysuria/spasm/blood in urine) and framed as the congener''s, like the hepatotoxicity row. (4) diuretics interaction (approved by owner 2026-07-10) had no supporting source: the EU monograph 4.5 says ''None reported''. Rewritten as theoretical (REF-3019 states O. arvensis extract diuretic activity was previously proven) and set to DRAFT, so it is off the public interaction checker until re-approved. (5-6) solidago-virgaurea and betula-pendula pairings (approved 2026-07-10) had REF-2753 as sole ref, which never mentions Solidago or Betula; refs removed, set to DRAFT, reviewed_by/date dropped. Leads for the owner, all O. SPINOSA not O. arvensis: Fluxonorm (S. virgaurea + O. spinosa + 3 others, PMID 33877671; RCT PMID 42244389) and a German standard UTI tea formulation with Betula (Boertz 2025 Planta Med, PMID 40112859, no PMC full text). Grieve''s Rest-Harrow page rejected: its own editors note ''Ononis spinosa printed as Ononis arvensis''. Not touched (out of scope): Infusion and Gargle/wash preparations still cite only REF-2748; the unsourced Tincture entry could be sourced to REF-3023 (1:5 root tinctures in 70% ethanol).
  | 2026-11-20: REF-2753 (Nechita 2026, O. spinosa review, PMID 42122901) is now cited by no record (validate orphan, practice loop confirmed wired: 3779/3780) and its bibliography entry was DELETED so it stops shipping to the Knowledge Finder. It covers Ononis spinosa only; do not re-add it to this record.
  | 2026-11-20 (REF-2748 cleanup, owner-approved ''Yes, clean them up''): REF-2748 (Rezacova 1978, Cesk Farm, PubMed 752421, no abstract or text available) was the only source, or the only one covering gross morphology, for 7 entries; it now stays only in the general references list and the 2026-07-10 lookalikes_review (owner sign-off, left alone). (1) botanical_description rewritten from REF-4028 (German Wikipedia Bocks-Hauhechel, new) and REF-4027 (English Wikipedia Ononis arvensis, new), with REF-2750 (shoots intensively pubescent) and REF-2742 (glandular trichomes on the leaf); REF-2750/REF-2742 are anatomy papers and support only the hairs. Dropped: the harrow-stopping taproot story, ''soft spines'', ''often reddish'', ''trifoliolate with toothed leaflets'', ''singly in the leaf axils'', ''the medicinal Ononidis radix'' (that is O. spinosa), flowering to September (sources say June-July). (2) habitat rewritten from the two Wikipedia articles; dropped North Africa (O. spinosa range), dunes (O. repens) and the arable-weed etymology (Grieve, O. spinosa). (3) harvesting rewritten to what O. arvensis sources state: REF-3023 (aerial part an unclaimed by-product of root harvest) and REF-3019 full text (aerial parts collected August 2019, air-shade dried, research material). No species-specific root-digging season found (the Russian pharmacopoeia root monograph was searched for and not located online; the Sechenov ''Poluyanov'' dissertation hit is about Rumex). Dropped: ''autumn from the second year'', ''cleaned and cut'', ''Ononidis radix''. harvest_readiness (Plantura, species_confirmed false) untouched. (4) Infusion (aerial-part tea) and Gargle/wash now unsourced -> needs-review, withheld by D8; no O. arvensis source names either. (5) Tincture now cites REF-3023 (1:5, 70% ethanol, maceration; root tinctures richer than herb); the old ''inferred from antimicrobial action'' note removed. (6) diuretic action: REF-3019 full text (Luzhanin 2021, Razrabotka i registratsiya, https://www.pharmjournal.ru/jour/article/download/887/797) says extracts of O. arvensis have diuretic, choleretic, analgesic, antihypoxic and antimicrobial activity, citing Tulaikin & Bakhtina 2006 (Rastitelnye Resursy 42(1):120-126, diuretic and analgesic activity of aerial-part extracts; not on PubMed, not read). The same text gives folk use for bladder and kidney diseases, haemorrhoids, liver and skin diseases, citing Denes 2015 (Int J Pharmacogn Phytochem Res 30(1):1301-1307, Transylvanian ethnomedicine) - a lead for traditional_uses. Dropped ''aquaretic'', ''irrigation therapy'' and ''used interchangeably with O. spinosa''.
  | 2026-11-20: owner approved in chat (''Approve the diuretic interaction and both pairings''): the diuretics interaction (theoretical wording, REF-3019 + REF-4026) and the solidago-virgaurea and betula-pendula pairings are approved again (reviewed_by owner, 2026-11-20) and back on the public tools. Both pairings are approved WITHOUT references (no source pairs field restharrow with either herb) and keep their 2026-07-10 wording, which calls both herbs ''aquaretic'' / ''irrigation therapy'' herbs - wording this record''s own sources do not state for O. arvensis (see the 2026-11-20 fix notes above).
  | 2026-11-20: owner asked in chat to reword the two pairing notes to match the sourced text (''Yes, reword them''). solidago-virgaurea and betula-pendula notes no longer say ''aquaretic'', ''classic irrigation-therapy pairing'' or ''cystitis and urinary gravel''; each half is now sourced: field restharrow REF-2741 (folk use for urinary tract infections) + REF-3019 (extract diuretic activity); goldenrod REF-0069 (EMA 2008 Solidago virgaurea herba monograph 4.1, read 2026-11-20: ''to increase the amount of urine - as adjuvant in treatment of minor urinary complaints''); birch REF-0080 (EMA 2015 birch leaf public summary: increase urine production to flush the urinary tract in minor urinary problems). Both notes say no study of the two together was found (PubMed: only O. spinosa combinations). Still approved, reviewed_date 2026-11-20.'