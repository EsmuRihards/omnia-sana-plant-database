internal_notes: 'Enriched 2026-06-12 from scientific literature (Iranian Journal of Pharmaceutical Research
  phytochemistry/antimicrobial review; Phytotherapy Research carvacrol review). Note: this is Origanum
  vulgare (wild marjoram), distinct from the book''s Origanum majorana (sweet marjoram). Originally a
  skeleton imported from the omniasana.bio Symptom-to-Plant Lookup tool (cold, cough, indigestion, infection,
  inflammation); associations retained and now part-mapped and cited. Further enriched 2026-06-14 with
  a PubMed-sourced small clinical study showing emulsified oregano oil eradicated enteric parasites (incl.
  Blastocystis hominis) and improved gastrointestinal symptoms (REF-0597). | 2026-06-15: migrated to entity
  schema (actions->vocab ids, indications split out, constituents linked to compounds). | 2026-06-20:
  enriched to >=10 scientific publications: added 10 PubMed-verified @article sources (REF-1447, REF-1448,
  REF-1449, REF-1450, REF-1451, REF-1452, REF-1453, REF-1454, REF-1455, REF-1456) - woven into relevant
  actions/indications and the plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage
  monograph-base fields, sourced from the existing phytochemistry review (REF-0485) and carvacrol review
  (REF-0486). | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for aerial-parts
  (provisional: PFAF REF-3301, whole herb cut in late summer / just before flowering). Single lineage.
  Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 12 - REF-0486 (carvacrol review; carvacrol is
  oregano''s signature phenol - compound evidence) names antimicrobial, antioxidant and anticancer
  activity only - kept for infection, removed from 4 pairs. REF-0485 (O. vulgare antimicrobial
  review; retagged) removed from skin and wounds.
  | 2026-11-13: symptom-source audit deep re-sweep batch 12 - Deep re-sweep. Oregano ointment
  wound RCT REF-3718 added to wounds and infection. Notes rewritten (no "supports respiratory and
  gastrointestinal infections" claim without a source).
  | 2026-11-19 (monograph-source audit): preparations[2] checked against REF-0597: rewritten to its figures; ''oral use of concentrated oil should be supervised'' removed (not stated by the source).
  | 2026-11-19 (monograph-source audit): harvesting cited only REF-1450/REF-1455 (chemotype lab studies). RE-SOURCED: Grieve Wild Marjoram (REF-4018, new) + PFAF REF-3301. Dropped as unsupported: when carvacrol/thymol content peaks, dried quickly in the shade.
  | 2026-11-26: symptom-source audit research-deepening batch 23 - Searched PubMed (Origanum
  vulgare / oregano tiab: 53 HT, 20 SR, 235 SAFE hits; most were animal-feed and food-preservation
  studies), Europe PMC, ClinicalTrials.gov (19) and OpenAlex. Added: NEW sinusitis pair (2023 NMA
  of herbal medicines for rhinosinusitis, low certainty); 1996 systemic allergy case as a caution.
  Not added: 2022 soldiers study (muscle-damage and oxidative-stress blood markers only), 2022
  athletes essential-oil trial (O. vulgare subsp. hirtum raised HDL over 14 days; small, healthy
  people, surrogate), spice-blend meal trials (combinations), oregano + lemon balm vaginal tablet
  vs metronidazole (combination, active comparator), essential-oil cystitis real-world use
  (blends), Origanum onites and O. dubium studies (other species), carvacrol-only studies,
  irritant dermatitis letter with no abstract.'
