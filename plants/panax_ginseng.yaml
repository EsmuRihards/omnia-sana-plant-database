internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific
  publications: added 10 PubMed-verified @article sources (REF-1466, REF-1467, REF-1468, REF-1469, REF-1470,
  REF-1471, REF-1472, REF-1473, REF-1474, REF-1475) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage/constituents
  monograph-base fields, sourced from the existing chemical-constituents review (REF-1468) and the pharmacology/toxicology
  review (REF-1466, REF-1472) plus the Duke-sourced dosage already cited in contraindications. | 2026-08-15:
  Harvest Calendar (phenological) - added harvest_readiness for root (provisional: PFAF REF-3302, dug in
  autumn from mature 6-7 year old plants). Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 12 - Cochrane REF-1475 ("Ginseng for cognition": "a
  lack of convincing evidence") was cited as SUPPORT - moved to null_result_ids. REF-0014 (Attele
  1999 commentary) and REF-0192 (traditional prescriptions; year corrected to 2012, not an RCT)
  name no condition - removed from all 12 pairs. REF-0137 (Kiefer 2003 AFP, PubMed 14596440: may
  improve psychologic function, immune function and diabetes-related conditions;
  anti-inflammatory; "does not appear to enhance physical performance") kept for immune-support,
  blood-sugar, metabolic-support, inflammation only.
  | 2026-11-13: symptom-source audit deep re-sweep batch 12 - Deep re-sweep. REF-0137 removed from
  the ergogenic action (its conclusion: no enhanced physical performance); Cochrane REF-1475
  removed from neuroprotective and recorded as no-effect for memory as well as cognition; AD SR
  REF-3724 no-effect. Red ginseng T2D SR REF-3723 no-effect for blood-sugar. New pairs (owner
  rule): high-cholesterol (2019 MA REF-3719; 2024 GRADE MA REF-3720 no-effect), low-libido (ED SR
  REF-3721, FSD MA REF-3722).
  | 2026-11-26: symptom-source audit research-deepening batch 24 - Searched PubMed (Panax ginseng
  / Korean, Asian or Korean red ginseng / red ginseng tiab: 405 HT, 130 SR, 905 SAFE hits), Europe
  PMC (re-run after an interrupted session), ClinicalTrials.gov (100) and OpenAlex. Huge plant:
  screened SRs, conditions without a pair and safety; low libido (8), fatigue (7) and cholesterol
  (7) were not padded; American ginseng (P. quinquefolius) and notoginseng results were not
  counted. Added: NEW menopause and hot-flashes pairs (2022 MA of placebo RCTs; the 2013 SR it
  updates was not added), NEW high-blood-pressure pair (2017 MA of double-blind RCTs, 2026 Rg3
  RCT, 2022 metabolic MA), NEW stress pair (2025 RCT), 2021 hand OA RCT to arthritis (replacing
  the inferred note); fibroid-safety RCT and pregnancy SR as info notes; via Europe PMC: 2026
  cancer-survivor fatigue RCT to fatigue, 2025 white ginseng RCT to stress, 2026 diabetes add-on
  RCT as a no-effect study on blood-sugar. Not added: 2021 genitourinary-syndrome RCT (only
  patient-reported symptoms improved), 2026 red ginseng glucose RCT (within-group changes only),
  ginseng berry andropause RCT (libido already 8), KRG hangover complex (combination); 2019 Thorax
  COPD RCT (no difference from placebo; no respiratory pair exists), immune-enhancement RCTs
  (NK-cell markers only), 2019 high-stress RCT (biomarkers and one cognitive test), prediabetes
  RCTs and the metabolic MA for blood sugar (blood-sugar left as is beside its null SR), ginseng
  in multi-herb products (Saengmaeksan, aronia mixture, chia fibre), injectable Chinese products
  (Shenmai, Shenfu, Aidi), mouse drug-interaction studies.'
