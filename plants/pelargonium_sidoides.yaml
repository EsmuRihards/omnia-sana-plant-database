internal_notes: 'Enriched 2026-06-12 from scientific literature (Int J Gen Med and Wien Med Wochenschr
  reviews of the standardised root extract EPs 7630). Originally a skeleton imported from the omniasana.bio
  Symptom-to-Plant Lookup tool (bronchitis, cold, sore-throat, sinusitis); associations retained and now
  part-mapped and cited. Further enriched 2026-06-14 with PubMed-sourced systematic reviews - a meta-analysis
  showing EPs 7630 reduces acute-bronchitis symptom scores by day 7 versus placebo (REF-0576) and a systematic
  review of phytotherapy for acute rhinosinusitis in which EPs 7630 appeared useful (REF-0577; rhinosinusitis
  action upgraded to verified). | 2026-06-15: migrated to entity schema (actions->vocab ids, indications
  split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific publications:
  added 11 PubMed-verified @article sources (REF-1868, REF-0492, REF-1869, REF-1870, REF-0576, REF-1871,
  REF-1872, REF-1873, REF-1874, REF-1875, REF-1876) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage
  monograph-base fields; botanical_description/habitat/harvesting are status:draft (well-known general
  facts, no dedicated botanical review in the largely-clinical bucket), traditional_uses/preparations/dosage
  cite the existing EPs 7630 clinical-efficacy reviews (REF-0492, REF-0493). | 2026-08-15: Harvest Calendar
  (phenological) - harvest_readiness for root recorded as GAP: no phenological source for Pelargonium
  sidoides root-harvest timing (Useful Tropical Plants has no record; Wikipedia no timing). Binomial
  confirmed (no timing to attach). | 2026-08-15: root harvest_readiness re-searched and kept a documented gap; SANBI PlantZAfrica gives a dormancy statement, not a harvest rule, and it was deliberately not converted into one.
  | 2026-11-10: symptom-source audit batch 12 - Cochrane 2008 REF-1869 merged into its 2013 update
  REF-1870 (invariant 11); the 2013 review ("may be effective" for acute bronchitis,
  rhinosinusitis and the common cold; low-quality evidence) wired as support per the owner''s
