  monograph-base fields; botanical_description/habitat/harvesting are status:draft (the legacy book refs
  for this plant are poorly formed citation fragments, not usable for specific botanical claims), traditional_uses/preparations/dosage
  reuse the existing Duke/Commission-E-sourced book refs, constituents cite the newer PubMed phytochemistry
  studies (REF-1409, REF-1411, REF-1414, REF-1416). | 2026-07-13: added anticancer action (where absent)
  + cancer indication (anticancer/antitumour research) sourced from the plant''s cited literature, as
  part of the cancer-condition campaign. | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for seed (provisional: PFAF REF-3310, whole plant cut when seed ripe in late summer).
  SAFETY: fatal Conium maculatum (poison hemlock) lookalike. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 13 - REF-1408 (wound healing in diabetic rats) names no
  skin irritation - removed; skin-irritation pair dropped. Claim notes on wounds/infection/cancer
  rewritten to describe their direct sources (they said "inferred"). Gap for owner: the EU anise
  monograph uses (bloating, flatulence, cough with cold) have no pairs.
  | 2026-11-27: symptom-source audit research-deepening batch 25 - Searched PubMed (Pimpinella
  anisum / aniseed / anise seed / anise tiab: 79 HT, 19 SR, 171 SAFE hits), Europe PMC,
  ClinicalTrials.gov (15) and OpenAlex. Research-integrity check: no new reference is first- or
  last-authored by the flagged Tehran psychopharmacology group (author lists checked). Added NEW
  pairs (each from one randomized placebo-controlled trial): ibs and depression (2016 Shiraz
  enteric-coated anise oil trial and its depression report, same 120 patients), indigestion (2015
  functional dyspepsia trial; its separate SF-36 quality-of-life report, PMID 25709650, is the
  same trial and was not cited twice), pms (2020), hot-flashes (2012; randomization and the
  between-group frequency difference confirmed in the PMC full text, severity mixed), diarrhea and
  appetite-loss (2024 COVID-19 add-on trial; aniseed was mixed with rock-candy powder as the
  vehicle; the paper reports risk ratios below 1 while describing more improvement on aniseed, so
  the direction is taken from the authors'' text). Added cautions: aniseed allergy (3 cases plus a
  cross-reactivity lab study) and an infant liver-failure case after star anise + anise tea. GAPS:
  lactation-support - a 2023 RCT found more pumped milk with anise tea in mothers of preterm
  infants, but the record cautions against medicinal use in breastfeeding (inv. 12d), so no pair;
  migraine - the 2019 topical anise oil pilot RCT (PMID 30853645) has its abstract replaced by the
  author-contribution statement in PubMed, Europe PMC and OpenAlex, and the full text is closed,
  so the result could not be verified; menopause - a 2026 RCT reported Kupperman-index gains only
  within the anise group, and its between-group result is a DASS-21 composite score. Not added:
  2026 Apiaceae dysmenorrhoea meta-analysis (pools anise with fennel and dill), IBS meta-analyses
  (only the one anise trial, already cited), six-herb dyspepsia formula, Thai multi-herb remedies
  (Sahastara, Thatbunjob), Menstrugole (combination), star anise (Illicium) poisoning cases and
  studies (other species), alcohol-free aniseed aperitif pseudohyperaldosteronism cases (caused by
  liquorice in the drink), feed-additive and insecticide studies.'
