botanical_description:
  text: Annual herb (Apiaceae), 30-60 cm tall, with an erect, downy stem. Lower leaves are rounded and
    toothed or shallowly lobed, while upper leaves are finely feathery and pinnately divided. Small white
    flowers are borne in compound umbels, followed by small, ridged, downy fruit ('aniseed') with a strong,
    sweet, liquorice scent.
  height: 30-60 cm
  habit: Erect, downy annual herb
  leaves: Lower leaves rounded/toothed; upper leaves finely feathery, pinnately divided
  flowers: Small, white, in compound umbels
  stem: Erect, downy
  root: Slender taproot
  fruit: Small, ridged, downy, sweetly liquorice-scented fruit ("aniseed")
  flowering_period: July-August
  status: draft
habitat:
  text: Native to the eastern Mediterranean and south-west Asia, widely cultivated as a spice and medicinal
    crop in warm-temperate regions worldwide, needing a long, warm growing season and well-drained soil.
  status: draft
harvesting:
  text: Fruit ('seed') is harvested in late summer once the umbels have dried and turned brown, then threshed
    and dried further.
  parts:
  - Fruit
  - Seed
  season: Late summer, once umbels have dried
  status: draft
harvest_readiness:
- part: seed
  signals:
  - "Cut the whole plant when the seed is ripe (late summer), then dry and thresh out the seeds."
  basis: traditional
  source_quote: "The seed is harvested by cutting the whole plant when the seed is ripe."
  reference_ids:
  - REF-3310
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3310); the whole plant is cut when the seed is ripe (seeds ripen August-September), then threshed. Single lineage -> provisional. SAFETY: anise is an Apiaceae - confirm identity against the fatal Conium maculatum (poison hemlock); see Dangerous Lookalikes."
traditional_uses:
  text: Anise has a long Mediterranean and Middle Eastern tradition as a carminative digestive remedy
    for bloating and indigestion, an expectorant for coughs and catarrh, and a traditional galactagogue
    (milk-promoting) herb for nursing mothers. Commission E and WHO both approve its traditional use for
    catarrh of the upper respiratory tract and gastrointestinal spasms.
  reference_ids: []
  status: verified
preparations:
- name: Crushed seed infusion (tea)
  text: 'The classic carminative preparation: crushed seed steeped in hot water.'
  reference_ids: []
  status: needs-review
- name: Essential oil
  text: Concentrated aromatic fruit oil, used in small measured amounts in traditional formulations.
  reference_ids: []
  status: needs-review
- name: Chewed seed
  text: Traditional after-meal digestive aid.
  status: draft
dosage:
- name: Crushed seed / essential oil
  text: 'Duke (2002): about 0.5-1 g crushed seed three times daily in tea, or 0.05-0.2 mL of the fruit
    essential oil. Food amounts up to about 20 g/day are generally considered safe for adults. Avoid medicinal
    doses in pregnancy and in children given limited safety data. Educational reference only, not a prescription.'
  reference_ids: []
  status: needs-review
