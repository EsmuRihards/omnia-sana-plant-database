  mechanistic_exclude_ids:
  - REF-1414
- condition: ibs
  note: In a 2016 randomized double-blind trial in 120 people with IBS, enteric-coated anise oil capsules
    for 4 weeks left 75% free of IBS symptoms, versus 35% on placebo and 52.5% on peppermint oil (Colpermin)
  reference_ids:
  - REF-5574
  status: verified
- condition: depression
  note: In the same randomized double-blind trial in people with IBS and mild to moderate depression,
    anise oil lowered depression scores more than placebo or peppermint oil at 4 and 6 weeks
  reference_ids:
  - REF-5575
  status: verified
- condition: indigestion
  note: In a 2015 randomized double-blind trial in 107 people with functional dyspepsia (postprandial
    distress), anise powder 3 g after meals for 4 weeks reduced symptom severity far more than a cornstarch
    placebo, with the benefit lasting to week 12
  reference_ids:
  - REF-5576
  status: verified
- condition: pms
  note: In a 2020 randomized double-blind trial in 67 students with premenstrual syndrome, anise reduced
    symptom severity more than placebo over two menstrual cycles
  reference_ids:
  - REF-5577
  status: verified
- condition: hot-flashes
  note: In a 2012 randomized double-blind trial in 72 postmenopausal women, anise capsules (330 mg three
    times daily) for 4 weeks cut hot flush frequency compared with placebo, and the effect lasted through
    4 weeks of follow-up; results for severity were mixed
  reference_ids:
  - REF-5578
  status: verified
- condition: diarrhea
  note: In a 2024 randomized double-blind add-on trial in 225 adults with COVID-19 and digestive symptoms,
    aniseed powder for 2 weeks improved diarrhoea more often than placebo
  reference_ids:
  - REF-5579
  status: verified
- condition: appetite-loss
  note: In the same 2024 randomized double-blind trial in adults with COVID-19, aniseed powder improved
    loss of appetite more often than placebo
  reference_ids:
  - REF-5579
  status: verified
contraindications:
- note: Generally safe when consumed in food amounts. Doses up to 20g daily considered safe for adults.
    May cause allergic reactions in some people. Caution advised during pregnancy and breastfeeding -
    stick to food amounts. Anethole can be toxic at high concentrations, particularly to the nervous system.
    Not enough safety data for medicinal use in children.
  severity: caution
  reference_ids: []
  status: needs-review
- note: Duke (2002) provides clinical evidence (score 2) for anise as an antibacterial, antiseptic, antispasmodic,
    and expectorant. It has demonstrated estrogenic activity and is used as a clinically supported lactagogue
    to promote milk production. Commission E and WHO have both approved its use for catarrh and gastrointestinal
    spasms. Typical dosages are 0.5–1 g crushed seed three times per day in tea, or 0.05–0.2 ml of the
    fruit essential oil (Duke, 2002).
  severity: info
  reference_ids:
  - REF-0063
  status: verified
- note: 'Allergy: aniseed can cause IgE-mediated allergy, including tongue swelling after an aniseed liqueur,
    asthma and rhinoconjunctivitis from handling aniseed dust, and food allergy confirmed by a blinded
    oral challenge. People allergic to birch or mugwort pollen, celery, or other parsley-family spices
    (fennel, caraway, coriander, cumin, dill) may cross-react (case reports and lab studies).'
  severity: caution
  reference_ids:
  - REF-5580
  - REF-5581
  - REF-5582
  - REF-5583
  status: verified
- note: 'Infants: a 4-month-old given a daily homemade tea of star anise and anise for two months developed
    liver failure, low blood sugar and seizures; do not give homemade herbal teas to infants (case report;
    star anise was also in the tea).'
  severity: caution
  reference_ids:
  - REF-5584
  status: verified
