  notes: "Zackrisson, Ostlund, Korhonen & Bergman, Vegetation History and Archaeobotany 2000 (REF-3382) - a dendroecological and ethnobotanical study of Sami inner-bark use of Pinus sylvestris L. across 313 bark-peeled-tree sites in northern Sweden, documenting continuous use from A.D. 1450 to 1890. NOTE: the source states the SEASON only. The common assertion that pine bark is taken 'when the sap rises and the bark slips' is NOT claimed here, because no source found states that mechanism for this species. Single lineage -> provisional."
- part: sap
  status: gap
  notes: "GAP (documented dead end, re-searched 2026-08-15). No source states a resin/sap collection stage for Pinus sylvestris specifically. PFAF gives no timing. Resin-tapping literature that does tie tapping to the growing season concerns other pines (Pinus pinaster, P. pinea, P. merkusii, P. elliottii), and that timing must not be inherited across species. The inner bark of this species IS now sourced (spring, REF-3382), but that is a different organ. Next seam: a Nordic or Baltic naval-stores / oleoresin-tapping source that names Pinus sylvestris."
traditional_uses:
  text: Scots pine is valued especially for its antiseptic action and its effect on the respiratory system.
    Turpentine from the resin was used for kidney, bladder and rheumatic complaints, mucous-membrane and
    respiratory complaints, and externally in liniments, plasters and inhalers; the leaves and young shoots
    were taken for chest infections and for rheumatism and arthritis, and added to baths. The tree was
    the main source of tar in preindustrial Scandinavia, and the Sami ate its inner bark as a staple food
    from at least 1450 to 1890.
  reference_ids:
  - REF-3311
  - REF-4312
  - REF-3382
  status: verified
preparations:
- name: Needles and young shoots (internal, bath, inhalant)
  text: Leaves and young shoots, harvested in spring and dried, are taken internally for a mildly antiseptic
    effect in the chest, added to bath water, or used as an inhalant for chest complaints. Only use needles
    from a certainly identified pine, never yew (see dangerous look-alikes).
  reference_ids:
  - REF-3311
  - REF-2664
  status: verified
- name: Essential oil (inhalation/topical)
  text: Steam-distilled from the needles; used diluted in ointments, chest rubs or steam inhalation for
    respiratory complaints.
  reference_ids: []
  status: verified
- name: Bud/bark preparations
  text: Traditional syrup or decoction of young buds or bark for bronchitis and sinus congestion.
  status: draft
