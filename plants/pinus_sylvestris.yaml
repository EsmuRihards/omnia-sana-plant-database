botanical_description:
  text: Coniferous tree up to 35 m tall (exceptionally over 45 m) with a trunk up to 1 m across; mature
    trees have a long, bare, straight trunk topped by a rounded or flat crown. The bark is thick, flaky
    and orange-red when young, becoming scaly and grey-brown, often staying orange-red higher up. Needles
    are glaucous blue-green, 2.5-5 cm long, in pairs with a persistent grey basal sheath. Seed cones are
    red at pollination and mature in their second year into ovoid-conic cones 3-7.5 cm long; the yellow
    pollen cones shed pollen in mid to late spring.
  height: Up to 35 m (exceptionally over 45 m)
  habit: Evergreen coniferous tree
  leaves: Glaucous blue-green needles 2.5-5 cm long, in pairs with a persistent grey basal sheath
  flowers: Yellow (occasionally pink) pollen cones; seed cones red at pollination
  stem: Long, bare, straight trunk; bark orange-red and flaky when young, scaly grey-brown later
  fruit: Ovoid-conic cone 3-7.5 cm, maturing in the second year
  flowering_period: Pollen release in mid to late spring
  reference_ids:
  - REF-4312
  status: verified
habitat:
  text: The only pine native to northern Europe, ranging from western Europe to eastern Siberia, south
    to the Caucasus and Anatolia and north well inside the Arctic Circle; from sea level to 1,000 m in
    the north and at 1,200-2,600 m in the south. It grows mainly on poorer, sandy soils, rocky outcrops,
    peat bogs or near the forest limit; on fertile sites other trees outcompete it.
  reference_ids:
  - REF-4312
  status: verified
harvesting:
  text: The leaves (needles) and young shoots are harvested in spring and dried for later use. The Sami
    took large sheets of inner bark in spring as a stored food. Resin is obtained by tapping the trunk.
  parts:
  - Bark
  - Leaf (needles)
  - Sap
  - Young sprouts
  season: Needles and young shoots in spring; inner bark in spring
  reference_ids:
  - REF-3311
  - REF-3382
  status: verified
