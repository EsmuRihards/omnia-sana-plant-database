  dosage already cited in contraindications. | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for flower + leaf (spring) and root + rhizome (spring or autumn), all provisional: PFAF
  REF-3315. Single lineage. Binomial confirmed.
  | 2026-11-10: symptom-source audit batch 13 - REF-0306 ("Wicke 2007", pages 109-116, no journal
  or DOI) not found in PubMed, OpenAlex or Crossref - purged as unverifiable. REF-0870 (SR of an
  ivy/primrose/thyme combination product; "studies on primrose were lacking") removed.
  Respiratory-support rests on the EU monograph REF-0075 (expectorant in cough associated with
  cold; EMA 429, flagged). Gap for owner: no cough pair and no expectorant action, though EMA and
  ESCOP (2021) both name cough with colds.
  | 2026-11-19 (monograph-source audit): botanical_description and habitat cited only REF-0879 (lab study). RE-SOURCED: Grieve Cowslip (REF-4016, new) + PFAF REF-3315. Dropped as unsupported: wrinkled softly hairy leaves tapering to a winged stalk, one-sided nodding umbel, funnel-shaped flowers with orange throat spots, short rhizome, capsule, western Asia, unimproved species-rich grassland, hedge banks.'
