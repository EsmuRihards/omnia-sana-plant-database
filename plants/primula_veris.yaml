botanical_description:
  text: A low perennial herb up to about 30 cm tall. Its leaves, like a primrose's but shorter and rounder,
    unroll in early spring and lie almost flat in a rosette. From the centre rises a long stalk topped
    by an umbel of flowers on separate short stalks. Each flower has its sepals joined into a pale green,
    crinkled bag, from which the yellow corolla emerges as a narrow tube opening into a golden disc with
    scalloped edges and five red spots. The roots and flowers smell faintly of anise. It flowers in April
    and May.
  height: Up to about 30 cm
  habit: Low perennial herb with a flat basal rosette
  leaves: Like a primrose leaf but shorter and rounder, in a flat rosette
  flowers: Umbel on a long stalk; crinkled pale green calyx; yellow tube opening to a golden disc with
    five red spots
  stem: Single long flowering stalk from the rosette
