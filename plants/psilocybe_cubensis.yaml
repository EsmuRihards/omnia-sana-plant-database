  pattern used for ganoderma-lingzhi/pleurotus-ostreatus. | 2026-07-11 (fix): added the constituents field
  that was missed in the earlier batch-25 edit (caught by the worklist re-check gotcha). | 2026-08-15:
  Harvest Calendar (phenological) - added harvest_readiness for fruiting-body (provisional: Azarius REF-3321;
  harvest as the partial veil under the cap tears, before spores drop). SAFETY: deadly Galerina marginata
  lookalike. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 14 - Deep audit. Depression/anxiety evidence
  is purified psilocybin (the signature compound) - notes now label it as compound evidence (inv.
  10).
  | 2026-11-27: symptom-source audit research-deepening batch 27 - Searched PubMed (Psilocybe
  cubensis / psilocybin or magic mushroom(s) tiab, plus "psilocybin" in titles: 445 HT (listing
  capped at 200, so headache trials were searched directly), 116 SR, 393 SAFE hits), Europe PMC,
  ClinicalTrials.gov (104) and OpenAlex. Depression (10) was not padded. Added: 2020 psilocybin
  meta-analysis in life-threatening illness to anxiety (was 5, resting on one RCT and rodent
  studies); 2021 analysis of online reports (seizures with lithium) and mania/psychosis case
  reports added to the existing caution; new cautions: acute kidney injury after confirmed P.
  cubensis, blood pressure/heart (2026 narrative review + VF case), catatonia after a first dose;
  info note on symptom worsening (2023 IPD meta-analysis) and Oregon regulated-service safety
  (2026 cohort); DRAFT antidepressants-serotonergic interaction (2023 analysis of 611 reports;
  needs owner approval). GAPS: migraine - a 2021 double-blind placebo crossover (10 people) found
  fewer migraine days after one dose, but randomization of the order is stated only in the trial
  registry (abstract silent, full text not open), and a 2026 randomized trial (18 people) missed
  its primary outcome, so no pair; cluster headache - the 2022 randomized trial was not
  significant and its extension compared within-group; alcohol use, smoking, OCD, anorexia, PTSD
  and bipolar depression (no vocabulary condition, or open-label pilots); chronic pain,
  fibromyalgia and phantom limb pain (open-label pilots and case reports). Not added: 2024
  Cochrane review (pools psilocybin with LSD), 2020 Psychiatry Res meta-analysis (within-group
  effect sizes), takotsubo case after Psilocybe semilanceata (other species), letters without
  abstracts (Japanese serotonin-syndrome cases, prolonged mania case, JAMA Netw Open adverse
  outcomes), microdosing review (pools LSD).'
drug_class_interactions:
- drug_class: antidepressants-serotonergic
  severity: caution
  mechanism: In 611 online reports of taking psilocybin mushrooms with an antidepressant, the effects
    were weaker than expected in about half of reports with SSRIs or SNRIs, and the weakening was also
    reported after stopping the antidepressant (report analysis). Antidepressant changes should be supervised
    by a prescriber.
  reference_ids:
  - REF-5626
  status: draft
