  status: verified
indications:
- condition: depression
  note: Psilocybin, the mushroom's active compound, given with psychological support reduced depression
    in randomized trials and meta-analyses (compound evidence; purified psilocybin in supervised settings,
    not the raw mushroom)
  reference_ids:
  - REF-0040
  - REF-0099
  - REF-1520
  - REF-2582
  - REF-2583
  - REF-2584
  - REF-2585
  status: verified
- condition: anxiety
  note: Psilocybin reduced anxiety in people with life-threatening cancer in a randomized trial, and a
    2020 meta-analysis of clinical trials in life-threatening illness found lower anxiety scores with
    psilocybin than with control (compound evidence; purified psilocybin in supervised settings); mushroom
    extracts reduced anxiety-like behaviour in rodents (preclinical)
  reference_ids:
  - REF-0099
  - REF-1520
  - REF-1522
  - REF-5616
  status: verified
contraindications:
- note: Psilocybin is physiologically non-toxic and non-addictive in clinical contexts. Psychological
    risks include anxiety, paranoia, and triggering of latent psychiatric conditions (contraindicated
    in personal or family history of psychosis or schizophrenia). Use only in appropriate clinical/ceremonial
    settings with trained supervision. Illegal in most jurisdictions. Avoid mixing with lithium (seizure
    risk).
  severity: caution
  reference_ids:
  - REF-0040
  - REF-0099
  - REF-5620
  - REF-5621
  - REF-5622
  status: verified
- note: Duke (2002) does not include a dedicated entry for psilocybin mushrooms (Psilocybe cubensis) in
    the Handbook of Medicinal Herbs, Second Edition.
  severity: info
  reference_ids:
  - REF-0040
  - REF-0099
  - REF-0063
  status: verified
- note: 'Kidneys: a 15-year-old developed acute kidney injury 36 hours after eating Psilocybe cubensis
    mushrooms confirmed to contain psilocin; kidney function recovered fully (case report).'
  severity: caution
  reference_ids:
  - REF-5617
  status: verified
- note: 'Heart and blood pressure: in supervised studies psilocybin raised blood pressure by about 19/9
    mmHg on average, peaking 1 to 1.5 hours after dosing and settling within 4 to 6 hours; serious heart
    events were uncommon in screened participants, but risk depends on heart disease and interacting medicines.
    A man taking the stimulant lisdexamfetamine had ventricular fibrillation after using psilocybin mushrooms
    (narrative review; case report).'
  severity: caution
  reference_ids:
  - REF-5618
  - REF-5619
  status: verified
- note: 'Mental health: a man with no psychiatric history developed catatonia, with six months of mutism
    and inability to feed himself, after taking psilocybin for the first time (case report).'
  severity: caution
  reference_ids:
  - REF-5623
  status: verified
- note: 'Supervised and regulated use: in a pooled analysis of three depression trials, clinically significant
    worsening occurred in about 10% of people given psilocybin, similar to escitalopram and less than
    on a waitlist. In 346 clients of Oregon''s state-regulated psilocybin services, 4 (1.2%, all first-time
    users) had behavioural reactions needing medical attention, and about 2% described the experience
    as harmful (meta-analysis; cohort study).'
  severity: info
  reference_ids:
  - REF-5624
  - REF-5625
  status: verified
