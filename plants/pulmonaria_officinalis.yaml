id: pulmonaria-officinalis
scientific_name: Pulmonaria officinalis
common_names:
- Lungwort
- Common lungwort
- Jerusalem cowslip
- Spotted dog
family: Boraginaceae
external_ids:
  gbif: 5341204
  wikidata: Q324331
parts_used:
- Aerial parts (flowering herb)
constituents:
- name: Phenolic acids (rosmarinic, lithospermic and salvianolic acids)
  compounds:
  - phenolic-compound
  - phenolic-acid
  - caffeic-acid
  - rosmarinic-acid
  note: The main antioxidant and COX-2-inhibiting constituents; LC-MS/MS profiling of the aerial parts
    identified dozens of phenolic compounds (caffeic acid esters and danshensu/dicaffeic-acid conjugates),
    nine of them previously undescribed, with marked seasonal variation.
  reference_ids:
  - REF-0479
  - REF-0549
- name: Mucilage, flavonoids, allantoin and silicic acid
  compounds:
  - flavonoid
  - allantoin
  - mucilage
  note: Soothing and supporting constituents underlying the traditional respiratory use.
  reference_ids:
  - REF-0479
  - REF-1545
botanical_description:
  text: A low perennial herb whose stem grows about 30 cm tall, with rough, alternate, egg-shaped leaves,
    the lower ones stalked, curiously spotted with white. The flowers grow in a cluster at the top of
    the stem; they are red before opening and pale purple when fully open, from March to May.
  height: About 30 cm
  habit: Low perennial herb
  leaves: Rough, alternate, egg-shaped, spotted with white; lower leaves stalked
  flowers: Terminal cluster; red in bud, pale purple when fully open
  flowering_period: March to May
  reference_ids:
  - REF-4010
  - REF-3320
  status: verified
habitat:
  text: Moist grassland, damp woods, thickets and hedgerows, avoiding acid soils and usually on limestone.
    Native to Europe and naturalised in Britain, where some regard it as an escape from gardens.
  reference_ids:
  - REF-3320
  - REF-4010
  status: verified
harvesting:
  text: Aerial flowering parts are cut during flowering (spring); the plant can also be gathered later
    in the growing season, though the phenolic constituent profile is documented to differ measurably
    between spring and autumn harvests.
  parts:
  - Aerial parts (flowering herb)
  season: Spring (flowering); constituent profile varies spring vs autumn
  reference_ids:
  - REF-0549
  status: verified
harvest_readiness:
- part: aerial-parts
  signals:
  - "Gather the flowering aerial parts in spring, while in flower."
  basis: traditional
  source_quote: "They are harvested in the spring and dried for later use"
  reference_ids:
  - REF-3320
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3320); the flowering herb is gathered in spring (in flower March-May). Single lineage -> provisional."
traditional_uses:
  text: The white-spotted leaves were thought to look like lungs, and under the doctrine of signatures
    lungwort was esteemed for diseases of the lungs; it was grown in almost every garden as 'Jerusalem
    cowslip'. The slightly astringent, mucilaginous leaves were taken as an infusion for coughs, lung
    catarrh and inflammation, and its high mucilage content is said to make it useful for chronic bronchitis,
    chronic coughs including whooping cough, and asthma.
  reference_ids:
  - REF-4010
  - REF-3320
  status: verified
preparations:
- name: Infusion (tea)
  text: Dried aerial parts steeped in hot water, the traditional respiratory remedy.
  reference_ids:
  - REF-0479
  status: verified
- name: Fresh leaf
  text: Occasionally used fresh in salads or soups, or as a poultice, in some traditional culinary and
    topical uses.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried aerial parts.
  status: draft
dosage:
- name: Infusion (tea)
  text: Traditional guidance suggests roughly 2-4 g dried herb per cup as an infusion, up to three times
    daily, for short-term use; avoid prolonged or high-dose internal use given the borage family's potential
    pyrrolizidine-alkaloid content. Educational reference only, not a prescription.
  reference_ids:
  - REF-0479
  status: verified
actions:
- action: anti-inflammatory
  note: Anti-inflammatory (cyclooxygenase-2 inhibition) and antioxidant
  reference_ids:
  - REF-0479
  - REF-0629
  status: verified
- action: antioxidant
