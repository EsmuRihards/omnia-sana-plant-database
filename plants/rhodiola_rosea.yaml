internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific
  publications: added 10 PubMed-verified @article sources (REF-1526, REF-1527, REF-1528, REF-1529, REF-1530,
  REF-1531, REF-1532, REF-1533, REF-1534, REF-1535) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-11: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage/constituents
  monograph-base fields, sourced from the existing traditional-use/chemical-composition review (REF-1528),
  the stress-symptom clinical review (REF-1526), the anti-inflammatory review (REF-1527) and the SHR-5
  extract trials (REF-1532, REF-1533). | 2026-08-15: Harvest Calendar (phenological) - harvest_readiness for
  rhizome + root recorded as GAP: neither PFAF nor Useful Temperate Plants gives a medicinal-harvest season
  for Rhodiola rosea (only flowering + propagation-division timing). Binomial confirmed. | 2026-08-15: rhizome and root harvest_readiness filled (were gaps) from Alberta Agdex 188/20-2 (REF-3384, maturity: lifted once at the end of the fourth or fifth year) and ISHS Acta Hort (REF-3385, within-season phenophase: rosavins peak at flowering, root dry weight recovers towards a post-wilting harvest). Kept provisional - the two sources are complementary, not confirmatory.
  | 2026-11-13: symptom-source audit deep audit batch 14 - Deep audit (2nd pass + deep). Kelly
  2001 review REF-0132 and Panossian 2010 review REF-1528 (retagged narrative-review) were cited
  on up to 11 pairs whose symptoms they never name - removed from those (kept for
  fatigue/cognition). Darbinyan 2000 RCT REF-0055 removed from four non-matching actions.
  Blood-sugar, metabolic-support, cold and immune-support dropped when no named evidence remained.
  Fatigue: SR REF-1533 ("contradictory") and nursing RCT REF-3730 (worsened fatigue) recorded as
  no-effect; SHR-5 RCT REF-3729 added. Marathon RCT REF-3731 no-effect for muscle soreness. New
  pairs (owner rule): depression (RCT REF-3727; sertraline RCT REF-3728 no-effect vs placebo), pms
  (RCT REF-3732), eye-strain (RCT REF-3733). REF-1530 retagged clinical (no placebo).'
