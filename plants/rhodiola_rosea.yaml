botanical_description:
  text: Succulent perennial herb (Crassulaceae), 15-40 cm tall, with a thick, fleshy, branching rhizome
    that has a rose-like fragrance when cut - the origin of the name 'rosea'. Leaves are fleshy, greyish-green,
    oval to oblong. Small yellow (occasionally reddish) flowers are clustered in dense terminal heads;
    the species is dioecious, with separate male and female plants. Fruit follicles turn red as they ripen.
  height: 15-40 cm
  habit: Succulent perennial herb, dioecious
  leaves: Fleshy, greyish-green, oval to oblong
  flowers: Small, yellow (occasionally reddish), in dense terminal clusters
  stem: Erect, succulent
  root: Thick, fleshy, branching rhizome, rose-scented when cut
  fruit: Follicles, turning red as they ripen
  flowering_period: June-July
  reference_ids:
  - REF-1528
  status: verified
habitat:
  text: Native to arctic and mountainous regions of Europe, Asia and North America (circumpolar), growing
    in cold, rocky, high-altitude or high-latitude terrain - cliffs, rocky slopes and tundra - tolerating
    harsh, exposed conditions.
  reference_ids:
  - REF-1528
  status: verified
harvesting:
  text: Rhizome and root are dug from plants at least a few years old (traditionally 4-5 years), typically
    in autumn, then cleaned and dried. Wild populations grow slowly, so cultivated sources are increasingly
    preferred for sustainability.
  parts:
  - Rhizome
  - Root
  season: Autumn, from plants at least 4-5 years old
  reference_ids:
  - REF-1528
  status: verified
harvest_readiness:
- part: rhizome
  signals:
  - "Lift only from mature plants: the underground parts are dug once, at the end of the fourth or fifth year of growth."
  - "Within a season the rosavin content of the dried rhizome is at its highest at flowering."
  basis: both
  constituent_note: "Total rosavins in the dried rhizome peak at flowering, and root dry weight falls to a minimum at budding/full flowering before rising again towards a harvest taken after wilting (ISHS Acta Horticulturae, REF-3385)."
  source_quote: "Rhodiola rosea is grown as a perennial, but the roots are harvested once at the end of four or five years."
  reference_ids:
  - REF-3384
  - REF-3385
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Two complementary sources, not one confirming the other, which is why this stays provisional. Alberta Agriculture Agdex 188/20-2 (REF-3384) gives the maturity rule (fourth or fifth year); the ISHS harvest-time study (REF-3385) gives the within-season phenophase - 'The content of total rosavins in the dry rhizomes was the highest at flowering on both sites'. They address different aspects of readiness and so do not constitute an independent confirmation of the same stage. Supersedes the earlier dead end (PFAF and Useful Temperate Plants gave only flowering and propagation-division timing)."
- part: root
  signals:
  - "The root is dug with the rhizome, from mature plants only, at the end of the fourth or fifth year of growth."
  - "Root dry weight falls to a minimum around budding and full flowering, then rises again towards a harvest taken after the tops have wilted."
  basis: both
  constituent_note: "Rhizomes of R. rosea contain more phenylpropenoids than the roots, and root dry weight is lowest at budding/full flowering, recovering towards the post-wilting harvest (ISHS Acta Horticulturae, REF-3385)."
  source_quote: "the dry weight of the root decreased until budding/full flowering, followed by an increase towards the last harvest after wilting"
  reference_ids:
  - REF-3384
  - REF-3385
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "ISHS harvest-time study of cultivated Rhodiola rosea at Finnish and Norwegian sites (REF-3385) for the within-season phenophase, plus Alberta Agriculture Agdex 188/20-2 (REF-3384) for the maturity rule, 'the roots are harvested once at the end of four or five years'. The two sources are complementary rather than confirmatory, so this stays provisional. Supersedes the earlier dead end."
traditional_uses:
  text: Rhodiola has a long tradition of use across Scandinavian, Russian and Central Asian folk medicine
    as a tonic for cold-climate hardiness, physical endurance and mental stamina. It is classified as
    a modern 'adaptogen', and clinical trials support benefits for stress-related fatigue, mood and cognitive
    performance.
  reference_ids:
  - REF-1528
  - REF-1526
  status: verified
preparations:
- name: Standardised root extract (capsule)
  text: Standardised to rosavins and salidroside (commonly the SHR-5 extract), the form used in most clinical
    trials.
  reference_ids:
  - REF-1532
  - REF-1533
  status: verified
- name: Tincture
  text: Alcoholic extract of the dried root.
  status: draft
- name: Decoction/tea
  text: Traditional preparation, less concentrated than standardised extracts.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials have most often used 340-680 mg/day of standardised root extract (e.g. SHR-5,
    standardised to rosavins/salidroside), typically taken in the morning to avoid overstimulation. Educational
    reference only, not a prescription.
  reference_ids:
  - REF-1532
  - REF-1533
  status: verified
