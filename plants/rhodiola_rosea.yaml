contraindications:
- note: Generally well tolerated. May cause agitation, insomnia, or vivid dreams in sensitive individuals
    - take in the morning. Avoid in manic episodes or severe anxiety. Theoretical interactions with MAOIs,
    SSRIs, and CNS stimulants. Avoid during pregnancy and breastfeeding.
  severity: caution
  reference_ids:
  - REF-0055
  - REF-0132
  - REF-1528
  status: verified
- note: Duke (2002) does not include a dedicated entry for Rhodiola rosea in the Handbook of Medicinal
    Herbs, Second Edition.
  severity: info
  reference_ids:
  - REF-0132
  - REF-1528
  - REF-0063
  status: verified
- note: 'Medicines: in a randomized crossover study in 13 healthy volunteers, rhodiola reduced the activity
    of the liver enzyme CYP2C9 by about 21% (losartan probe), with no effect on CYP1A2, 2C19, 2D6 or 3A4;
    the authors note this could matter for CYP2C9-metabolised drugs with a narrow safety margin (pharmacokinetic
    study).'
  severity: caution
  reference_ids:
  - REF-5627
  status: verified
- note: 'Product quality: in a 2026 analysis of US rhodiola supplements, rosavin and salidroside content
    ranged from almost none to about 3% and often differed from the label, one product appeared to contain
    added synthetic salidroside, and all capsule products had trace arsenic, cobalt and lead (two at notably
    higher levels) (product analysis).'
  severity: info
  reference_ids:
  - REF-5628
  status: verified
