  - REF-3113
  status: verified
indications:
- condition: arthritis
  note: Standardised rose hip powder reduced osteoarthritis pain and painkiller use in placebo-controlled
    trials and a meta-analysis, and helped rheumatoid arthritis as an add-on in a randomized trial
  reference_ids:
  - REF-0051
  - REF-0989
  - REF-0990
  - REF-3106
  - REF-3107
  - REF-3734
  status: verified
- condition: cancer
  note: Rose hip polyphenols slowed human cancer cells in the lab (preclinical)
  reference_ids:
  - REF-0992
  status: needs-review
- condition: cognitive-function
  note: Animal evidence only. In high-fat-diet/streptozotocin diabetic rats, R. canina ethanol extract
    (250 mg/kg) improved recall and long-term memory and reduced hippocampal insulin resistance, amyloid-beta
    and acetylcholinesterase activity. No human data; the effect is reported in a diabetes model, not
    in healthy or cognitively impaired people.
  reference_ids:
  - REF-3111
  status: needs-review
- condition: inflammation
  note: Rose hip reduced osteoarthritis symptoms in trials, and its compounds are anti-inflammatory in
    the lab (systematic reviews; preclinical)
  reference_ids:
  - REF-0051
  - REF-0990
  status: needs-review
- condition: metabolic-support
  reference_ids:
  - REF-0051
  - REF-0991
  - REF-0994
  - REF-3111
  - REF-5634
  status: verified
  note: Rose hip flesh and extracts reduced fat build-up and improved blood sugar in animal studies (preclinical);
    seed lipid-lowering effects reviewed (systematic review); in a 2015 randomized double-blind trial
    in 32 pre-obese adults, rose hip extract for 12 weeks reduced abdominal visceral fat, body weight
    and BMI more than placebo
- condition: skin-irritation
  note: inferred from anti-inflammatory action
  reference_ids:
  - REF-0051
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0989
  - REF-0990
- condition: uti
  note: One triple-blind placebo-controlled RCT (n=400) found that 500 mg R. canina fruit capsules twice
    daily for 20 days after caesarean section reduced the incidence of urinary tract infection. The incidence
    of cystitis specifically did not differ significantly between groups. Prevention in a post-surgical
    population; not evidence for treating an established UTI.
  reference_ids:
  - REF-3105
  status: verified
- condition: high-cholesterol
  note: In a 2012 randomized double-blind crossover trial in 31 obese adults, a rose hip powder drink
    for 6 weeks lowered total cholesterol by 4.9% and LDL cholesterol by 6% compared with a control drink;
    a 2023 systematic review found mixed effects on blood lipids across trials
  reference_ids:
  - REF-5635
  status: verified
- condition: high-blood-pressure
  note: In the same 2012 randomized double-blind crossover trial in obese adults, the rose hip drink lowered
    systolic blood pressure by 3.4% compared with a control drink; diastolic pressure did not change
  reference_ids:
  - REF-5635
  status: verified
contraindications:
- note: Rosa canina (dog rose) hips are generally recognized as safe (GRAS) for consumption, widely used
    in teas, jams, and supplements. They are highly nutritious but may cause minor digestive upset (nausea,
    diarrhea) in some users. The small, irritating hairs around the seeds should be removed before consumption.
  severity: info
  reference_ids:
  - REF-0051
  - REF-0239
  status: verified
- note: Duke (2002) rates dog rose hips as +++ with clinical evidence (score 2) for astringent activity
    and experimental support for antioxidant and diuretic effects. Dog rose hips are exceptionally rich
    in vitamin C and bioflavonoids. They are traditionally used for cold and influenza prevention, urinary
    tract health, and mild diarrhea. Duke notes the diuretic (score 1) and lipoxygenase-inhibitory activities
    as experimentally documented. The fruit is considered food-grade safe (Duke, 2002).
  severity: info
  reference_ids:
  - REF-0051
  - REF-0239
  - REF-0063
  status: verified
