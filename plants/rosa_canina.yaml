botanical_description:
  text: A deciduous shrub usually 1-5 m tall that can scramble higher into the crowns of taller trees.
    Its many arching stems are covered with small, sharp, hooked prickles that help it climb. The leaves
    are pinnate with 5-7 leaflets and are fragrant when bruised. The sweet-scented flowers, 4-6 cm across
    with five petals, are usually pale pink but range from deep pink to white, and open in June and July.
    They ripen in September and October into oval, red-orange hips 1.5-2 cm long, which can stay on the
    plant for months and turn black. A layer of irritant hairs surrounds the seeds just beneath the flesh
    of the hip.
  height: 1-5 m; can scramble higher into trees
  habit: Deciduous shrub with arching, scrambling stems
  leaves: Pinnate, with 5-7 leaflets, fragrant when bruised
  flowers: Usually pale pink (deep pink to white), 4-6 cm across, five petals, sweet-scented
  stem: Arching, covered in small, sharp, hooked prickles
  fruit: Oval red-orange hip 1.5-2 cm long, ripe in September-October, can persist for months and turn
    black; irritant hairs surround the seeds inside
  flowering_period: June to July; hips ripen September to October
  reference_ids:
  - REF-3966
  - REF-3322
  status: verified
habitat:
  text: Native to Europe, including Britain, from Norway south and east to north-west Africa and south-west
    Asia. It grows in hedges, scrub, woods, roadsides and banks.
  reference_ids:
  - REF-3322
  - REF-3966
  status: verified
harvesting:
  text: The hips are usually harvested from late summer to early autumn (August to October), once ripe,
    and are used raw or cooked in jams, jellies, syrups and teas. The layer of hairs around the seeds
    irritates the mouth and digestive tract and must be removed.
  parts:
  - Fruit (hip)
  - Petals
  - Seed
  season: Late summer to early autumn (August to October)
  reference_ids:
  - REF-3322
  status: verified
harvest_readiness:
- part: fruit
  signals:
  - "Gather the hips in autumn (late summer to October), when ripe red and softened by the first frosts."
  basis: traditional
  source_quote: "Rose hips are typically harvested in late summer to early autumn, usually from August to October"
  reference_ids:
  - REF-3322
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3322); the hips are gathered in autumn, softened and sweetened by frost. Single lineage -> provisional."
- part: seed
  signals:
  - "Collect the seeds (achenes) from the ripe hips in autumn to early winter."
  basis: traditional
  source_quote: "the seeds ripen from October to December"
  reference_ids:
  - REF-3322
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3322); the seeds ripen in the autumn/early-winter hips (October-December). Single lineage -> provisional. (The petals, also a listed part, were not separately timing-sourced this pass - gathered in early summer while in flower.)"
traditional_uses:
  text: The petals, hips and galls have been used as astringent, carminative, diuretic, laxative and tonic
    remedies. The hips are taken for colds, influenza, minor infections, scurvy, diarrhoea and gastritis,
    and a syrup of the hips is used to flavour medicines and cough mixtures; the hip shells contain 0.2-2.4%
    vitamin C. In randomised trials a powder made from the seeds and shells of the hips reduced osteoarthritis
    pain compared with placebo, a modest effect in a meta-analysis of three trials.
  reference_ids:
  - REF-3322
  - REF-3106
  - REF-3107
  - REF-0989
  status: verified
preparations:
- name: Rosehip powder (seeds and shells)
  text: A powder made from the seeds and shells of the hips of a Rosa canina subspecies (Hyben Vital)
    is the form tested in randomised osteoarthritis trials, where it reduced pain compared with placebo.
  reference_ids:
  - REF-3106
  - REF-3107
  - REF-0989
  status: verified
- name: Infusion/tea
  text: Dried, deseeded hip steeped in hot water - a traditional vitamin C tonic.
  status: draft
- name: Syrup
  text: Traditional preparation, historically used as a vitamin C supplement, particularly for children.
  status: draft
- name: Petals
  text: Occasionally used for their fragrance in traditional preparations.
  status: draft
dosage:
- name: Rosehip powder
  text: In two randomised, placebo-controlled trials in osteoarthritis, 5 g a day of a powder made from
    the seeds and shells of rose hips was taken for 3 months and reduced pain and stiffness. Educational
    reference only, not a prescription.
  reference_ids:
  - REF-3106
  - REF-3107
  status: verified
constituents:
- name: Vitamin C and carotenoids
  compounds:
  - carotenoid
  note: The hip is exceptionally rich in vitamin C and carotenoids, underpinning its traditional tonic
    use. Quantified in commercial dried fruit at beta-carotene 7.25 mg/100 g and lycopene 2.34 mg/100
    g fresh weight.
  reference_ids:
  - REF-0993
  - REF-3112
- name: Galactolipids
  note: Galactolipids are among the rose hip compounds, with phenolics, terpenoids, carotenoids, fruit
    acids and fatty oils, that a systematic review considers jointly responsible for its effects in osteoarthritis.
  reference_ids:
  - REF-0990
- name: Flavonoids and tannins
  compounds:
  - flavonoid
  - tannin
  note: Contribute to antioxidant activity. Leaves carry a higher total phenolic, flavonoid and phenolic-acid
    content than the hips, and leaf infusions were the only preparation to show antibacterial activity
    in vitro.
  reference_ids:
  - REF-0992
  - REF-3113
- name: Seed oil (unsaturated fatty acids, tocopherols, phytosterols)
  compounds:
  - phytosterol
  note: Cold-pressed rose hip seed oil is high in linolenic acid, with phytosterols up to 6485 mg/kg,
    tocopherols up to 1125 mg/kg and carotenoids up to 108 mg/kg; p-coumaric acid methyl ester predominates
    among its phenolics.
  reference_ids:
  - REF-3114
actions:
- action: anti-inflammatory
  note: In vitro, the lipophilic (n-hexane and dichloromethane) rose hip extracts inhibited COX-1, COX-2
    and 5-LOX-mediated leukotriene B4 formation; the aqueous and methanol extracts were inactive.
  reference_ids:
  - REF-0051
  - REF-0989
  - REF-0990
  - REF-3110
  status: verified
- action: anticancer
  reference_ids:
