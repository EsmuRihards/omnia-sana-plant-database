internal_notes: 'Enriched 2026-06-12 from scientific literature (BMC Complementary Medicine and Therapies
  observational study; ANZJOG survey). Evidence is weak/observational, reflected in needs-review action
  statuses. Note: distinct from the book''s Rubus fruticosus (blackberry leaf). Originally a skeleton
  imported from the omniasana.bio Symptom-to-Plant Lookup tool (menstrual-cramps, pregnancy-support, diarrhea);
  associations retained and now part-mapped and cited. Further enriched 2026-06-14 with the PubMed-sourced
  double-blind RCT by Simpson et al. (REF-0607; n=192, shorter second stage of labour and fewer forceps
  deliveries, no effect on first stage, no adverse effects) - the action remains needs-review given the
  single small trial. | 2026-06-15: migrated to entity schema (actions->vocab ids, indications split out,
  constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific publications: added 9 PubMed-verified
  @article sources (REF-0497, REF-1536, REF-1537, REF-1538, REF-1539, REF-1540, REF-1541, REF-1542, REF-1543) -
  woven into relevant actions/indications and the plant-level references bucket. | 2026-07-11: added
  botanical_description/habitat/harvesting/traditional_uses/preparations/dosage monograph-base fields,
  sourced from the existing pregnancy observational study (REF-0497), pregnancy survey (REF-0498) and
  phenolic-composition study (REF-1536). | 2026-08-15: Harvest Calendar (phenological) - added
  harvest_readiness for leaf (provisional: PFAF REF-3328, gathered in summer). Single lineage. Binomial
  confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 15 - Deep audit (2nd pass + deep).
  Menstrual-cramps dropped: its two cards (guinea-pig ileum relaxation; rat endometriosis) never
  name cramps. Pregnancy observational study REF-0497 (tagged rct; retagged clinical) removed from
  antidiarrheal/astringent; survey REF-0498 (retagged clinical), labour RCT REF-0607 (null) and
  REF-1541 removed from the emmenagogue action. REF-0607 and the 2021 SR REF-3735 ("evidence base
  weak") recorded as no-effect for pregnancy-support; REF-2574 retagged narrative-review. New pair
  (owner rule): arthritis (held knee OA RCT REF-1538).
  | 2026-11-19 (monograph-source audit): traditional_uses, constituents[2], preparations[0] and dosage[0] cited only REF-0497 (observational study) and REF-0498 (survey), which do not support the uterine-tonic history, vitamin C, the tea or 1-3 cups a day. RE-SOURCED: PFAF REF-3328 (folk uses), EU herbal monograph 2014 (REF-3981, new; indications, tea 1.5-8 g, dry extract 113-226 mg, NOT recommended in pregnancy or lactation), Simpson RCT REF-0607 (1.2 g tablets twice daily from 32 weeks; first stage not shortened, second stage about 10 minutes shorter, fewer forceps births), berry-leaf review REF-1536 (minerals). IMPORTANT: the old dosage text described starting the tea in late pregnancy at 1-3 cups a day; no source read states that, and the EU monograph advises against use in pregnancy, so it now says so. Dropped: vitamin C, possible modest effect on labour duration (the RCT found the first stage was not shortened), classic late-pregnancy preparation.'
