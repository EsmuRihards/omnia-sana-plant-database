botanical_description:
  text: Deciduous, thicket-forming shrub (Rosaceae), 1-2 m tall, with upright, prickly, biennial canes
    (vegetative in the first year, fruiting in the second). Leaves are pinnate with 3-7 toothed leaflets,
    whitish-felted beneath. Small white, five-petalled flowers are followed by the aggregate red raspberry
    fruit, a cluster of drupelets.
  height: 1-2 m
  habit: Deciduous, thicket-forming shrub with biennial canes
  leaves: Pinnate, 3-7 toothed leaflets, whitish-felted beneath
  flowers: Small, white, five-petalled
  stem: Upright, prickly canes
  root: Spreading suckering root system
  fruit: Aggregate red raspberry (cluster of drupelets)
  flowering_period: May-June
  reference_ids:
  - REF-1536
  status: verified
habitat:
  text: Native to Europe and northern Asia, widely cultivated as a fruit crop and naturalised on woodland
    edges, hedgerows and disturbed ground in temperate regions.
  reference_ids:
  - REF-1536
  status: verified
harvesting:
  text: Leaves are picked fresh during the growing season - before or during flowering is considered optimal
    - and dried; fruit is picked when fully ripe in summer.
  parts:
  - Leaf
  season: Leaf before/during flowering; fruit in summer
  reference_ids:
  - REF-1536
  status: verified
harvest_readiness:
- part: leaf
  signals:
  - "Gather the leaves in summer, for drying as raspberry-leaf tea."
  basis: traditional
  source_quote: "The leaves are harvested in the summer and dried for later use."
  reference_ids:
  - REF-3328
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3328); the leaves are gathered in summer. Single lineage -> provisional."
traditional_uses:
  text: Raspberry leaf tea is a traditional herb taken in pregnancy in the belief that it shortens labour
    and makes it easier; the leaves have also been used for diarrhoea, as a uterine tonic for pregnant
    women and an aid in childbirth, for painful menstrual cramps, and as a gargle for tonsillitis and
    mouth inflammation. The EU herbal monograph accepts traditional use for minor menstrual cramps, mild
    inflammation in the mouth or throat and mild diarrhoea, but does not recommend use in pregnancy or
    breastfeeding because safety has not been established. In a randomised trial of raspberry leaf tablets
    taken from 32 weeks of pregnancy, the first stage of labour was not shortened; the second stage was
    about 10 minutes shorter and forceps deliveries were fewer.
  reference_ids:
  - REF-0498
  - REF-3328
  - REF-3981
  - REF-0607
  status: verified
preparations:
- name: Infusion (tea)
  text: 'Dried leaf infused in boiling water: the EU herbal monograph gives 1.5-8 g in 150 ml three times
    a day for mild diarrhoea, or as a gargle for mild mouth or throat inflammation. Raspberry leaf tea
    is also widely drunk in pregnancy (38% of women in one survey), though the EU monograph does not recommend
    it then.'
  reference_ids:
  - REF-3981
  - REF-0498
  status: verified
- name: Tincture
  text: Alcoholic extract, less commonly used than the tea.
  status: draft
- name: Standardised leaf extract
  text: Used in some observational and clinical research.
  reference_ids:
  - REF-1536
  status: verified
dosage:
- name: Infusion and dry extract (EU herbal monograph)
  text: For adults the EU herbal monograph gives 1.5-8 g of the cut leaf in 150 ml of boiling water three
    times a day as a tea for mild diarrhoea or as a gargle, and 113-226 mg of a dry extract up to 3-4
    times a day after meals for minor menstrual cramps. It does not recommend use in pregnancy or breastfeeding.
    A randomised trial in late pregnancy used raspberry leaf tablets of 1.2 g twice a day from 32 weeks.
    Educational reference only, not a prescription.
  reference_ids:
  - REF-3981
  - REF-0607
  status: verified
actions:
- action: antidiarrheal
  note: Astringent for mild diarrhoea (tannins)
  reference_ids: []
  status: needs-review
- action: astringent
  note: Astringent for menstrual cramps (traditional); Astringent for mild diarrhoea (tannins)
  reference_ids: []
  status: needs-review
- action: emmenagogue
  note: Traditional uterine tonic taken in late pregnancy to tone the uterus and support labour - one
    small double-blind RCT found a shorter second stage of labour and fewer forceps deliveries (no effect
    on the first stage), alongside observational signals; robust proof is still lacking
  reference_ids:
  - REF-0497
  status: needs-review
indications:
- condition: pregnancy-support
  reference_ids:
  - REF-0497
  - REF-2574
  status: needs-review
  null_result_ids:
  - REF-0607
  - REF-3735
  note: 'Widely used to prepare for labour: an observational study linked it to less labour augmentation,
    but a randomized trial found it did not shorten labour, and reviews judge the evidence weak, with
    a possible negative effect on cervical ripening'
- condition: arthritis
  note: A raspberry leaf extract relieved knee osteoarthritis pain vs placebo in a randomized trial
  reference_ids:
  - REF-1538
  status: verified
contraindications:
- note: Despite widespread popular use, there is no robust (randomised-trial) evidence of efficacy or
    safety. Use in pregnancy should be discussed with a midwife or doctor and is generally reserved for
    the last few weeks rather than early pregnancy.
  severity: caution
  reference_ids:
  - REF-0497
  - REF-0498
  status: verified
