id: salix-alba
scientific_name: Salix alba
common_names:
- Willow Bark
- White willow
- European willow
family: Salicaceae
external_ids:
  wikidata: Q156918
parts_used:
- Bark
constituents:
- name: Salicin and related salicylates
  note: Metabolised in the body to salicylic acid - the 'natural aspirin' that gives the analgesic, anti-inflammatory
    and antipyretic effects.
  reference_ids:
  - REF-0529
  - REF-0530
  - REF-1253
  - REF-1254
  - REF-1258
  - REF-1259
  compounds:
  - salicin
- name: Polyphenols, flavonoids and tannins
  compounds:
  - phenolic-compound
  - flavonoid
  - tannin
  note: Contribute additionally to the anti-inflammatory and antioxidant activity.
  reference_ids:
  - REF-0530
  - REF-1262
botanical_description:
  text: Large deciduous tree (Salicaceae), 10-25 m tall (occasionally taller), fast-growing with a broad
    crown. Leaves are narrow and lance-shaped, silvery-white and silky-hairy beneath, giving the tree
    a shimmering appearance in the wind. Tiny flowers are borne in catkins appearing with the leaves in
    spring; the species is dioecious. The fruit is a small capsule releasing cottony-tufted seeds.
  height: 10-25 m
  habit: Large, fast-growing deciduous tree, dioecious
  leaves: Narrow, lance-shaped, silvery-white and silky-hairy beneath
  flowers: Tiny, in catkins with the leaves
  stem: Broad-crowned trunk
  root: Extensive, water-seeking root system
  fruit: Small capsule with cottony-tufted seeds
  flowering_period: April-May
  reference_ids:
  - REF-0530
  status: verified
habitat:
  text: Native to Europe, western and central Asia and North Africa, growing on damp ground along riverbanks,
    floodplains and wet meadows; widely planted and naturalised elsewhere.
  reference_ids:
  - REF-0530
  status: verified
harvesting:
  text: Bark is stripped from young branches (2-3-year-old growth is preferred, as salicin content is
    highest in younger bark) in spring, when the rising sap makes the bark peel most easily, then dried.
  parts:
  - Bark
  season: Spring
  reference_ids:
  - REF-0530
  status: verified
harvest_readiness:
- part: bark
  signals:
  - "Strip the bark in spring, as the sap rises and the bark slips, or in early autumn - from 3 to 6 year old branches."
  basis: traditional
  source_quote: "The bark is harvested in the spring or early autumn from 3 - 6 year old branches and is dried for later use."
  reference_ids:
  - REF-3327
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3327); the bark is stripped in spring (sap rising, bark slips) or early autumn, from 3-6 year old branches. Single lineage -> provisional."
traditional_uses:
  text: Willow bark has one of the longest documented histories of any medicinal plant, used since antiquity
    (recorded by Hippocrates) as a remedy for pain and fever. Its salicin content, chemically related
    to aspirin, gives it official European herbal-monograph recognition for mild joint pain, headache
    and feverish colds, with modern clinical trials supporting benefit for low back pain.
  reference_ids:
  - REF-0530
  - REF-0529
  status: verified
preparations:
- name: Decoction
  text: Dried bark simmered in water - the traditional preparation, since salicin needs proper simmering
    (not just a quick infusion) to extract well.
  reference_ids:
  - REF-0530
  status: verified
- name: Extract (dosed by salicin)
  text: 'Willow bark extracts, tinctures and fluid extracts are dosed by their total salicin content:
    the WHO monograph gives the equivalent of 120-240 mg of total salicin a day in two doses. The trials
    in a systematic review of musculoskeletal pain all used ethanol extracts, at up to 240 mg salicin
    a day for up to six weeks.'
  reference_ids:
  - REF-3994
  - REF-0529
  status: verified
- name: Tincture
  text: Alcoholic extract of the dried bark.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials for back pain have used around 240 mg salicin/day of standardised extract. Educational
    reference only, not a prescription; avoid if allergic to aspirin/salicylates, in children/teenagers
    with a viral illness (Reye's syndrome risk), or alongside anticoagulants.
  reference_ids:
  - REF-0529
  - REF-0530
  status: verified
actions:
- action: analgesic
  note: Analgesic and anti-inflammatory for low back pain (moderate evidence; dose-dependent, around 240
    mg salicin/day) - in an RCT, 240 mg salicin/day left 39% pain-free vs 6% on placebo within 4 weeks
  reference_ids:
  - REF-0529
  - REF-0530
  - REF-0592
  - REF-1253
  - REF-1261
  status: verified
- action: anti-inflammatory
  note: Analgesic and anti-inflammatory for low back pain (moderate evidence; dose-dependent, around 240
    mg salicin/day) - in an RCT, 240 mg salicin/day left 39% pain-free vs 6% on placebo within 4 weeks
  reference_ids:
  - REF-0529
  - REF-0530
  - REF-0592
  - REF-1253
  status: verified
- action: antipyretic
  note: Antipyretic (reduces fever)
  reference_ids:
  - REF-0530
  status: verified
indications:
- condition: arthritis
  note: Willow bark extract eased osteoarthritis pain moderately vs placebo in one randomized trial but
    showed no relevant effect in another; traditional use for minor joint pain (EU herbal monograph)
  reference_ids:
  - REF-0529
  - REF-0530
  - REF-3736
  status: verified
  mechanistic_exclude_ids:
  - REF-0592
  null_result_ids:
  - REF-3737
- condition: back-pain
  note: Willow bark extract (about 240 mg salicin daily) relieved low back pain vs placebo and matched
    rofecoxib in randomized trials (moderate evidence; Cochrane review)
  reference_ids:
  - REF-0529
  - REF-0530
  - REF-0592
  - REF-1261
  - REF-3738
  status: verified
- condition: fever
  note: Antipyretic (reduces fever)
  reference_ids:
  - REF-0530
  status: verified
