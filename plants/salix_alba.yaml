internal_notes: 'Enriched 2026-06-12 from scientific and regulatory literature (Phytotherapy Research
  systematic review; EMA HMPC monograph for Salicis cortex). Originally a skeleton imported from the omniasana.bio
  Symptom-to-Plant Lookup tool (pain, headache, inflammation, arthritis, fever, back-pain); associations
  retained and now part-mapped and cited. Further enriched 2026-06-14 with the landmark PubMed-sourced
  randomized double-blind RCT of willow bark extract for low-back-pain exacerbations (REF-0592; 240 mg
  salicin/day, 39% pain-free vs 6% placebo, effect within one week). | 2026-06-15: migrated to entity
  schema (actions->vocab ids, indications split out, constituents linked to compounds). | 2026-06-20:
  enriched to >=10 scientific publications: added 10 PubMed-verified @article sources (REF-1253, REF-1254,
  REF-1255, REF-1256, REF-1257, REF-1258, REF-1259, REF-1260, REF-1261, REF-1262) - woven into relevant
  actions/indications and the plant-level references bucket. | 2026-07-12: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage
  monograph-base fields, sourced from the existing EMA HMPC monograph (REF-0530) and systematic review
  (REF-0529). D6 (entity gap) 2026-07-20: this plant named a defining constituent that had NO entity in
  compounds/, so it resolved to nothing and would have emitted no practice recommendation. Entity created
  and the constituent wired to it. Only the molecules the entry already names were wired - no constituent
  was reinterpreted. | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for bark
  (provisional: PFAF REF-3327, stripped in spring as the sap rises or in early autumn, from 3-6 year
  branches). Single lineage. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 15 - Deep audit. Superseded 2006 Cochrane
  REF-1260 purged and deleted (2014 update REF-1261 kept). OA RCT REF-3736 added; OA/RA RCT
  REF-3737 (no relevant efficacy) recorded as no-effect; rofecoxib-comparison LBP RCT REF-3738
  added. Inflammation now mechanistic (none of its cards names inflammation); calf PGE2 study
  REF-1256 removed from the action.
  | 2026-11-19 (monograph-source audit): preparations[1] (''standardised to salicin, the form used in trials'') cited only REF-0529. Now WHO Cortex Salicis vol. 4 (REF-3994, new) + REF-0529 as it states (ethanolic extracts, up to 240 mg salicin/day, up to six weeks). Note WHO''s monograph covers several Salix species, S. alba among them; the dose is given per salicin, not per species.
  | 2026-11-27: symptom-source audit research-deepening batch 29 - Searched PubMed (Salix alba /
  white willow / willow bark / Salicis cortex tiab: 36 HT, 10 SR, 66 SAFE hits), Europe PMC,
  ClinicalTrials.gov (6) and OpenAlex. Back-pain and pain (9) and arthritis (8) were not padded
  (2023 Salix spp. arthritis meta-analysis of six RCTs, 2007/2016 Cochrane back-pain reviews, STW
  33-I long-term and 2008 multicentre studies). Added: 2001 randomized platelet study (willow bark
  with 240 mg salicin inhibited platelets far less than aspirin but more than placebo) and the
  2019 USP safety review to the bleeding caution; the USP review and a 2003 anaphylaxis case
  (willow-bark-containing supplement in a woman with aspirin allergy) to the aspirin-allergy
  caution; 2022 mouse genotoxicity study as an info note. Not added: 2017 fatal infant liver
  failure after willow bark tea + acetaminophen (no abstract), 2021 HepaRG CYP study (Salix
  pentandra and an unspecified reference extract), fat-burner and weight-loss supplement cases
  (multi-ingredient), willow pollen allergy (not related to use), topical and cosmetic blends.'
