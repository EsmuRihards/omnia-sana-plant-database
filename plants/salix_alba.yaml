contraindications:
- note: Because it works like aspirin, avoid willow bark if you are allergic to aspirin or salicylates,
    and do NOT give it to children or teenagers with a viral illness (risk of Reye's syndrome). Use caution
    in asthma (salicylate sensitivity).
  severity: caution
  reference_ids:
  - REF-0530
  - REF-5641
  - REF-5642
  status: verified
- note: Avoid with anticoagulant/antiplatelet medicines (bleeding risk) and in active peptic ulcer; avoid
    in pregnancy (especially the third trimester) and breastfeeding.
  severity: caution
  reference_ids:
  - REF-0530
  - REF-5640
  - REF-5641
  status: verified
- note: 'Lab safety: white willow bark extract given to mice at up to 2,000 mg/kg daily for 7 days caused
    no DNA damage or chromosome changes in blood, liver, bone marrow, heart or testis cells (animal study).'
  severity: info
  reference_ids:
  - REF-5643
  status: verified
