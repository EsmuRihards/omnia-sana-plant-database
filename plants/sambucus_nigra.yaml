  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3332); the flowers are gathered in early summer, in full bloom (in flower June-July). Single lineage -> provisional. SAFETY: do not confuse with the toxic dwarf elder (Sambucus ebulus); the raw flowers are fine, but see Dangerous Lookalikes."
- part: fruit
  signals:
  - "Gather the berries in autumn, when fully ripe and black (the clusters hang down) - and always cook them, as raw elderberries are cyanogenic."
  basis: traditional
  source_quote: "Elderberries are usually harvested in late summer to early autumn, around August to September, when the berries are fully ripe."
  reference_ids:
  - REF-3332
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3332); the berries are gathered in autumn when fully ripe (August-September). Single lineage -> provisional. SAFETY: raw elderberries and the leaves are cyanogenic (cook before use); and the toxic dwarf elder (Sambucus ebulus) is a lookalike - S. ebulus berries stand upright whereas S. nigra clusters droop; see Dangerous Lookalikes."
traditional_uses:
  text: Elder has one of the most celebrated European folk-medicine reputations, described as a 'medicine
    chest' of the countryside. The flowers have official European herbal-monograph use for symptoms of
    the common cold, and the berries - cooked, or as a standardised extract - are widely used and clinically
    studied for upper respiratory and flu-like symptoms.
  reference_ids:
  - REF-0085
  - REF-1016
  status: verified
