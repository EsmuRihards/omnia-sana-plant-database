drug_class_interactions:
- drug_class: chemotherapy-agents
  severity: insufficient
  mechanism: A woman who had taken elderberry flower supplements for years developed severe nausea, diarrhoea
    and grade 3 liver injury four weeks after starting the cancer drug pazopanib; liver tests recovered
    after both were stopped, and the authors suggest a possible interaction (case report).
  reference_ids:
  - REF-5654
  status: draft
