contraindications:
- note: Raw or unripe elderberries and the leaves and stems contain cyanide-producing substances that
    can cause nausea, vomiting and severe diarrhoea; cooking the berries eliminates the toxin, and large
    amounts may cause serious illness (NCCIH). Use in pregnancy and breastfeeding is not recommended because
    safety has not been established (EU herbal monograph; NCCIH). Do not use if allergic to elder. If
    you take any medicine, talk with your health care provider first, as some herbs and medicines interact
    (NCCIH).
  severity: caution
  reference_ids:
  - REF-3763
  - REF-0085
  status: verified
- note: 'Duke (2002) rates elderflower and elderberry as +++ with clinical evidence (score 2) for bronchostimulant,
    diaphoretic, and secretagogue activities, consistent with Commission E approval. Dose: dried flower:
    3-5 g as tea three times daily. Important safety consideration: raw elderberries and elder bark contain
    sambunigrin (cyanogenic glycoside) and lectins - always cook berries before consumption, and avoid
    bark preparations for medicinal use without expert guidance (Duke, 2002).'
  severity: caution
