  - REF-4309
  status: verified
harvesting:
  text: The flowers are collected when just in full bloom during their short season (about three weeks
    in June) and used fresh, salted ('pickled') or dried for infusions; they dry to a poor, brownish colour
    if left too long in the sun before gathering or left in heaps.
  parts:
  - Flower
  season: Flowers in June, when just in full bloom
  reference_ids:
