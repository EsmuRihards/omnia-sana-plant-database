- part: flower
  signals:
  - "Gather the creamy flower umbels in early summer, in full bloom, before they set fruit."
  basis: traditional
  source_quote: "It is in flower from June to July, and the seeds ripen from August to September."
  reference_ids:
  - REF-3332
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3332); the flowers are gathered in early summer, in full bloom (in flower June-July). Single lineage -> provisional. SAFETY: do not confuse with the toxic dwarf elder (Sambucus ebulus); the raw flowers are fine, but see Dangerous Lookalikes."
- part: fruit
  signals:
  - "Gather the berries in autumn, when fully ripe and black (the clusters hang down) - and always cook them, as raw elderberries are cyanogenic."
  basis: traditional
  source_quote: "Elderberries are usually harvested in late summer to early autumn, around August to September, when the berries are fully ripe."
  reference_ids:
  - REF-3332
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3332); the berries are gathered in autumn when fully ripe (August-September). Single lineage -> provisional. SAFETY: raw elderberries and the leaves are cyanogenic (cook before use); and the toxic dwarf elder (Sambucus ebulus) is a lookalike - S. ebulus berries stand upright whereas S. nigra clusters droop; see Dangerous Lookalikes."
traditional_uses:
  text: Elder has one of the most celebrated European folk-medicine reputations, described as a 'medicine
    chest' of the countryside. The flowers have official European herbal-monograph use for symptoms of
    the common cold, and the berries - cooked, or as a standardised extract - are widely used and clinically
    studied for upper respiratory and flu-like symptoms.
  reference_ids:
  - REF-0085
  - REF-1016
  status: verified
preparations:
- name: Elderflower infusion (tea)
  text: Dried flowers infused in boiling water as a herbal tea, traditionally used for the early symptoms
    of a common cold.
  reference_ids:
  - REF-0085
  status: verified
- name: Elderberry syrup
  text: Elderberry syrup taken by mouth; in a randomised trial in influenza A and B, 15 ml four times
    a day for 5 days relieved symptoms about 4 days sooner than placebo syrup. A meta-analysis of 180
    participants found elderberry supplementation substantially reduced upper respiratory symptoms.
  reference_ids:
  - REF-0316
  - REF-1016
  status: verified
- name: Elderberry extract (liquid)
  text: Liquid elderberry extract, the form tested in influenza trials. A later emergency-department trial
    in 87 people (15 ml twice a day for children aged 5-12, four times a day for those over 12, for 5
    days) found no effect on how long or how badly influenza lasted.
  reference_ids:
  - REF-0316
  - REF-3759
  status: verified
- name: Elderflower cordial
  text: Traditional non-medicinal but commonly made preparation.
  status: draft
