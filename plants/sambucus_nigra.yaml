  | 2026-11-13: symptom-source audit deep audit batch 15 - Deep audit. COVID pros/cons review
  REF-1018 removed from respiratory-support. Air-traveller RCT REF-3760 added to cold; Macknin
  2020 influenza RCT REF-3759 (no benefit) and Wieland 2021 SR REF-3758 (evidence uncertain)
