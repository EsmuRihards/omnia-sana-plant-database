botanical_description:
  text: A shrub of moist soil with stems up to 4 m high containing abundant white pith. The leaves are
    imparipinnate, with 5-11 oblong leaflets. Flat-topped compound cymes of small, white, fragrant flowers
    are followed by large drooping bunches of purplish-black, juicy, berry-like drupes.
  height: Stems up to 4 m
  habit: Shrub
  leaves: Imparipinnate, with 5-11 oblong leaflets
  flowers: Small, white, urn-shaped and fragrant, in flat compound cymes
  stem: Stems with abundant white pith
  fruit: Purplish-black, juicy, berry-like drupes in drooping bunches
  flowering_period: June (about three weeks)
  reference_ids:
