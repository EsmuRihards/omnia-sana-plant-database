  | 2026-11-19 (monograph-source audit): preparations[1] (cooked, sweetened syrup, the most widely used form) and preparations[2] (concentrated extract used in influenza trials) cited only REF-1016 (meta-analysis, no form or dose in its abstract). Rewritten to the trials: Zakay-Rones REF-0316 (15 ml four times daily for 5 days, symptoms 4 days shorter) and the NULL emergency-room trial REF-3759, stated as null. Dropped: cooked and sweetened, most widely used form, standardised, concentrated.
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): the EU elder-flower
  monograph REF-0085 (now linked) states use and posology only, so the description, habitat and
