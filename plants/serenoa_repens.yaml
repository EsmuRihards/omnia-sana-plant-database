  - REF-3765
- condition: urinary-support
  note: Saw palmetto fruit extract eased mild urinary frequency vs placebo in three small Japanese randomized
    trials (women, men and healthy adults); in men with an enlarged prostate the 2023 Cochrane review
    found little to no benefit
