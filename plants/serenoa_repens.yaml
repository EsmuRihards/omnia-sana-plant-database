indications:
- condition: prostate-support
  note: 'Urinary symptoms of an enlarged prostate (BPH): the 2023 Cochrane review found saw palmetto alone
    gives little to no benefit over placebo, and two large US trials (one at double and triple doses)
    found none; meta-analyses of one hexane extract (Permixon) report fewer night-time urinations and
    better flow, similar to tamsulosin'
  reference_ids:
  - REF-0571
  - REF-1888
  - REF-1889
  - REF-1891
  - REF-0572
  - REF-1894
  status: needs-review
  null_result_ids:
  - REF-1895
  - REF-1887
  - REF-1890
  - REF-1508
  - REF-3764
  - REF-3765
- condition: urinary-support
  note: Saw palmetto fruit extract eased mild urinary frequency vs placebo in three small Japanese randomized
    trials (women, men and healthy adults); in men with an enlarged prostate the 2023 Cochrane review
    found little to no benefit
  reference_ids:
  - REF-0571
  - REF-1888
  - REF-1889
  - REF-0572
  - REF-1894
  - REF-3766
  - REF-3767
  - REF-3768
  status: needs-review
