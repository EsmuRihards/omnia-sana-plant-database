  - REF-3764
  - REF-3765
contraindications:
- note: Generally well tolerated; mild gastrointestinal upset is the most common effect. BPH must be medically
    diagnosed (to exclude prostate cancer), and because the best evidence does not show benefit, saw palmetto
    should not replace proven treatment.
  severity: caution
  reference_ids:
  - REF-1508
  status: verified
- note: Has mild anti-androgen and antiplatelet effects, so use caution with anticoagulant medicines and
    before surgery; avoid in pregnancy (hormonal activity).
  severity: caution
  reference_ids:
  - REF-1508
  - REF-5662
  - REF-5659
  status: needs-review
- note: 'Liver: a 70-year-old man developed biopsy-confirmed cholestatic drug-induced liver injury after
    about four months of saw palmetto, which improved after stopping it (case report), and FDA adverse-event
    reports show a disproportionate number of liver and bile-duct problems with saw palmetto (pharmacovigilance
    study).'
  severity: caution
  reference_ids:
  - REF-5658
  - REF-5659
  status: verified
- note: 'Sexual and mental health: an Italian case series described persistent sexual, psychiatric and
    physical symptoms after saw palmetto, resembling post-finasteride syndrome, lasting years in most
    people; causality was rated probable in 54% (case series).'
  severity: caution
  reference_ids:
  - REF-5660
  status: verified
- note: 'Rare serious reactions: acute pancreatitis (case report, possibly due to saw palmetto) and rhabdomyolysis
    with kidney failure in an 82-year-old taking several health foods, in whom a lymphocyte test pointed
    to saw palmetto (case report).'
  severity: caution
  reference_ids:
  - REF-5663
  - REF-5664
  status: verified
- note: 'Children: a 10-year-old girl taking a saw palmetto supplement for excess hair developed hot flushes
    that stopped when it was stopped and returned on re-challenge, and reached menarche about 4 months
    later; the authors suggest hormonal effects (case report).'
  severity: caution
  reference_ids:
  - REF-5665
  status: verified
- note: 'Reporting data: in 1,810 worldwide reports of suspected reactions to saw palmetto products, 44%
    were serious; serious reactions were more likely with dietary supplements, with several products taken
    together and with use for more than 14 days (pharmacovigilance study).'
  severity: info
  reference_ids:
  - REF-5661
  status: verified
- note: 'Liver enzymes: in 12 healthy volunteers, saw palmetto 320 mg daily for 14 days did not change
    the activity of the drug-metabolising enzymes CYP2D6 or CYP3A4 (pharmacokinetic study).'
  severity: info
  reference_ids:
  - REF-5666
  status: verified
