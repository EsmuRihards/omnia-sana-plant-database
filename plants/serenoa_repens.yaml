indications:
- condition: prostate-support
  note: 'Urinary symptoms of an enlarged prostate (BPH): the 2023 Cochrane review found saw palmetto alone
    gives little to no benefit over placebo, and two large US trials (one at double and triple doses)
    found none; meta-analyses of one hexane extract (Permixon) report fewer night-time urinations and
    better flow, similar to tamsulosin'
  reference_ids:
