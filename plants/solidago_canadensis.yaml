contraindications:
- note: Generally well tolerated; toxicity testing classified the herb extract as practically non-toxic (toxicity
    class V, LD50 > 5000 mg/kg). May cause allergic reactions in individuals sensitive to Asteraceae/Compositae
    plants. As with other goldenrod used for urinary irrigation, ensure adequate fluid intake and avoid use
    in cases of oedema arising from impaired cardiac or renal function. Safety data in pregnancy and breastfeeding
    are lacking, so use is not recommended during these periods.
  severity: caution
  reference_ids:
  - REF-3160
  - REF-3157
  - REF-3158
  status: verified
