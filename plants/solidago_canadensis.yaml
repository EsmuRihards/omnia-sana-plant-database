- name: Tincture / hydroethanolic extract
  text: An alcoholic extract of the dried herb. In pharmacological research on S. canadensis, a 40% ethanol
    extract of the herb carried the most pronounced anti-inflammatory and hepatoprotective activity.
  reference_ids:
