  - REF-3175
  status: verified
harvesting:
  text: The flowering aerial parts (herb) - flowering tops, leaves and stems - are cut at the onset of flowering
    in late summer and dried. This dried flowering herb is the material recognised, together with Solidago
    gigantea, as goldenrod herb ('Solidaginis herba') in the European Pharmacopoeia.
