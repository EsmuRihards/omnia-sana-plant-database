dosage:
- name: Infusion (traditional)
  text: 'Traditionally the dried flowering herb is taken as a tea for urinary-tract irrigation, with generous
    fluid intake. A species-specific, clinically established human dose for Solidago canadensis is not defined
    in the scientific literature; diuretic (aquaretic) activity was demonstrated for standardised extracts
    of the flowering aerial parts in an animal model at 400 mg/kg. Educational reference only, not a prescription;
    ensure adequate fluid intake and avoid in oedema arising from cardiac or renal impairment.'
  reference_ids:
