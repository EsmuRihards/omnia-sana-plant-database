habitat:
  text: Native to North America, where it is widespread across the USA and Canada, Solidago canadensis is
    a late-season-flowering perennial of open, sunny and often disturbed ground - fields, roadsides, railway
    banks, forest edges, riverbanks, meadows and abandoned land. Introduced to Europe as an ornamental in
    the 17th century, it has since become one of the most widespread invasive plants across Europe, temperate
    Asia, China, Japan and Australia, forming dense clonal stands that suppress surrounding vegetation.
  reference_ids:
