internal_notes: 'New record created 2026-08-04 (Canadian goldenrod campaign). Species deliberately kept distinct
  from the existing solidago-virgaurea record: S. canadensis and S. virgaurea are routinely conflated and
  most pharmacopoeial "goldenrod" therapeutic literature (EMA/HMPC monograph, Commission E) is virgaurea-specific.
  Every wired claim is backed by a source that names Solidago canadensis (or Ph. Eur. "Solidaginis herba"
  = S. canadensis + S. gigantea) in the title/abstract. 27 references added (REF-3157..REF-3183): 26 S. canadensis-specific
  publications from PubMed/EuropePMC plus one botanical field-guide source (REF-3183, Minnesota Wildflowers)
  for morphology. Evidence is preclinical/phytochemical throughout - there are no human clinical trials of
  S. canadensis - so scored indications sit at the preclinical tier and the inferred-from-action indications
  are marked needs-review. | Wrong-species trap caught and rejected: PMID 29543989 (cyclitols/sugars) studies
  Solidago virgaurea, not canadensis - not cited. | Ecology/agronomy/materials papers on this heavily-studied
  invasive (allelopathy, soil N/GHG, microplastics, phytoremediation, biochar, nanoparticle green-synthesis,
  molluscicidal/nematicidal pesticide, cut-flower vase life) were reviewed and NOT wired to medicinal claims;
  a few broad phytochem/biology ones sit in the references[] bucket. | EMA finding (precise): there is NO
  EMA/HMPC monograph for S. canadensis - the EU goldenrod monograph covers S. virgaurea only. Therefore the
  tincture-calculator practice/normative record was deliberately NOT created (no qualifying normative dosing
  source with a drug:extract ratio for this species; virgaurea''s 1:5 / 45% ratio must not be borrowed).
  Owner authorised the practice record only "if EMA qualifies" - it does not. Documented dead-end, revisit
  if Commission E "Solidaginis herba" or a Ph. Eur. posology is opened. | dosage left as needs-review: no
  species-specific human posology exists; the 400 mg/kg figure is the animal aquaretic dose, not a human
  prescription. | Safety arrays: dangerous_lookalikes (ragwort) approved (owner-authorized 2026-08-04, reusing
  the goldenrod/ragwort foraging refs REF-2705/2689/2690, which are genus-generic). drug_class_interactions
  and pairings deliberately left empty: no S. canadensis-specific interaction or herb-pairing evidence exists,
  and class-based inference from the diuretic action was judged too weak to publish (the more-studied virgaurea
  record likewise carries none). Revisit if a diuretic-class interaction source specific to goldenrod is found.
  | 2026-08-04: dropped bare "Goldenrod" from common_names (kept Canadian/Canada goldenrod). It was a shared
  alias with solidago-virgaurea and, via the plant-page os_pp_studies() common-name fallback, pulled two
  S. virgaurea studies (REF-1045 review, REF-1047 Candida RCT) onto this page''s "Selected studies" section.
  Root cause was renderer-side only — this record''s citations are all S. canadensis-specific or generic; the
  DB was never wrong. Renderer fixed to require a scientific-name match (common-name fallback now fires only
  when a citation names no binomial). Audited clean 2026-08-04. | 2026-08-15: Harvest Calendar (phenological)
  - added harvest_readiness for flower + leaf + stem (all provisional: PFAF REF-3340, flowering tops gathered
  in summer as it comes into flower). SAFETY: PA-toxic ragwort (Jacobaea vulgaris) lookalike. Binomial
  confirmed.'
