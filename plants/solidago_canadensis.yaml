botanical_description:
  text: Erect rhizomatous perennial herb (Asteraceae), typically 0.6-1.5 m (2-5 ft) tall, spreading by creeping
    underground rhizomes so that many stems arise together. Stems are erect and rigid, short-hairy in the
    upper part and becoming smoother towards the base. Leaves are alternate (with no basal rosette), lance-elliptic,
    2-19 cm long, strongly three-nerved, and sharply toothed except near the base. The numerous small yellow
    flower heads (each about 3 mm, with roughly 8-15 ray florets around 3-6 disc florets) are borne on one
    side of arching branches, forming a large pyramidal to recurved, plume-like terminal panicle. The fruit
    is a small, sparsely hairy achene (1-1.5 mm) tipped with a white pappus for wind dispersal.
  height: 0.6-1.5 m (2-5 ft)
  habit: Erect rhizomatous perennial herb
  leaves: Alternate, lance-elliptic, strongly three-nerved, sharply toothed
  flowers: Many small yellow heads (about 8-15 ray florets, 3-6 disc florets) in a pyramidal, plume-like panicle
  stem: Erect, rigid, short-hairy above and smoother below; multiple stems from creeping rhizomes
  root: Creeping rhizomes with fibrous roots
  fruit: Small, sparsely hairy achene (1-1.5 mm) with a white pappus
  flowering_period: July-October
