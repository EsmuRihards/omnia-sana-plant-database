traditional_uses:
  text: In its native North America, Solidago canadensis was used by Indigenous peoples - including the Haudenosaunee
    (Iroquois) - as a traditional medicine, and its extracts show antibacterial activity. In European phytotherapy
    the dried flowering herb has long been used, as a tea, tincture or decoction, as a urological and anti-inflammatory
    ('antiphlogistic') remedy - a mild aquaretic diuretic and antispasmodic for irrigation of the urinary
    tract - and it is documented in traditional use for kidney, urinary-tract and liver complaints and for
    inflammation-related conditions. The European Pharmacopoeia accepts S. canadensis, together with S. gigantea,
    as a source of goldenrod herb ('Solidaginis herba'). Note that the formal EU (EMA/HMPC) herbal monograph
    for medicinal goldenrod covers the related species Solidago virgaurea, not S. canadensis.
  reference_ids:
  - REF-3157
  - REF-3160
  - REF-3161
  - REF-3174
  - REF-3180
  - REF-3166
  status: verified
