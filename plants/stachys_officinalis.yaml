internal_notes: 'Enriched 2026-06-12 from general phytotherapy literature (PeaceHealth and Naturopathic
  Herbalist monographs). Stachys officinalis = Betonica officinalis. Originally a skeleton imported from
  the omniasana.bio Symptom-to-Plant Lookup tool (headache, anxiety, nervous-tension, indigestion); associations
  retained and now part-mapped and cited. Further enriched 2026-06-14 with a PubMed-sourced comparative
  study of Lamiaceae antioxidants in which Stachys officinalis was among the strongest free-radical scavengers
  (REF-0621), adding an antioxidant action. | 2026-06-15: migrated to entity schema (actions->vocab ids,
  indications split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific
  publications: added 10 PubMed-verified @article sources (REF-1055, REF-1056, REF-1057, REF-1058, REF-1059,
  REF-1042, REF-1060, REF-1061, REF-1062, REF-1063) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-12: added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage
  monograph-base fields, sourced from the existing general wood-betony monographs (REF-0534, REF-0535). |
  2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for aerial-parts (provisional: PFAF
  REF-3343, whole herb collected when in flower in summer). Single lineage. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 16 - Deep audit. Naturopathic Herbalist page
  REF-0535 (no references) purged and deleted; it was the only source for bloating, menstrual
  cramps and muscle spasm (dropped) and for safety note #1. PeaceHealth REF-0534 (5 references;
  1-star traditional ratings) kept for anxiety, nervous tension, headache and added to indigestion
  (heartburn, gastritis). Grieve REF-3786 added (head maladies, neuralgia, dyspepsia, rheumatism).
  Safety notes re-sourced to PeaceHealth; the unsourced "may lower blood pressure" line removed.
  Genotoxicity study REF-1055 moved from the antioxidant action to a new info safety note.'
