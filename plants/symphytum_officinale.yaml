traditional_uses:
  text: Grieve records comfrey as a demulcent and mildly astringent remedy given for diarrhoea, coughs
    and lung complaints, and applied as a poultice to bruises, cuts, boils and inflammatory swellings;
    its reputation for 'knitting' fractures was put down partly to reducing the swelling around them.
    The EU herbal monograph now recognises only external use of the root, for minor sprains and bruises.
  reference_ids:
  - REF-4310
  - REF-0074
  status: verified
