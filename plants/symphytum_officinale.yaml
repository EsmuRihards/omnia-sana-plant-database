botanical_description:
  text: Erect perennial, rough and hairy all over, with a branched rootstock and fleshy, spindle-shaped
    roots up to 30 cm long, blackish outside and white and juicy inside. The leafy stem is 60-90 cm tall,
    stout, angular, hollow and broadly winged above. The lower leaves are very large (up to 25 cm), ovate
    and rough with itching hairs; the stem leaves run down the stem (decurrent). Drooping creamy-yellow
    or purple flowers hang in one-sided, curled clusters from late April through the summer. Comfrey leaves
    can be mistaken for foxglove leaves; in comfrey the smaller veins do not run into the wings of the
    leaf-stalk.
  height: 60-90 cm (2-3 ft)
  habit: Erect perennial, rough and hairy all over
  leaves: Lower leaves very large (to 25 cm), ovate, rough-hairy; stem leaves decurrent
  flowers: Drooping, creamy-yellow or purple, in one-sided curled (scorpioid) clusters
  stem: Stout, angular, hollow, winged above, with bristly hairs
