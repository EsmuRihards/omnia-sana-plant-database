contraindications:
- note: 'Big headline: Comfrey naturally contains pyrrolizidine alkaloids (PAs), which can seriously harm
    the liver if taken internally (Staiger, 2012; EMA, 2015). • Do not ingest comfrey (no teas, no internal
    tinctures, no capsules), because PA exposure from internal use is the main safety problem (Staiger,
    2012; Bach et al., 1990). • Topical use only, short-term: EU herbal guidance describes comfrey root
    preparations for minor bruises and sprains in adults, and recommends limited duration (commonly up
    to about 10 days) (EMA, 2015; EMA/HMPC, 2024). • Do not apply to broken skin (open wounds, damaged/irritated
    skin) and avoid eyes/mucous membranes (EMA/HMPC, 2024). • Pregnancy & breastfeeding: best avoided
    (not enough safety margin for medicinal use) (EMA/HMPC, 2024). • Children/adolescents: not recommended
    for medicinal topical use in EU monograph context (EMA/HMPC, 2024). • If you have liver disease or
    take medicines that stress the liver, skip comfrey completely (risk management logic based on PA concern)
    (Staiger, 2012; EMA, 2015). • Skin reactions: mild rash/irritation can occur; stop if it irritates
    (Smith and Jacobson, 2011).'
  severity: serious
  reference_ids:
  - REF-0074
  - REF-0246
  - REF-0281
  status: verified
- note: Duke (2002) classifies common comfrey (Symphytum officinale) with anti-inflammatory and wound-healing
    properties, supported by allantoin content (promotes cell proliferation). However, comfrey also contains
    hepatotoxic pyrrolizidine alkaloids. Internal use is no longer recommended, and Commission E approved
    only external use. Duke emphasizes that pyrrolizidine alkaloids are cumulative hepatotoxins associated
    with veno-occlusive disease, and prolonged or internal use is contraindicated (Duke, 2002).
  severity: info
  reference_ids:
  - REF-0074
  - REF-0246
  - REF-0281
  - REF-0063
  status: verified
- note: 'Foraging: a 55-year-old woman died of heart-rhythm failure after drinking tea made from foxglove
    leaves she had mistaken for comfrey, despite antidote treatment (case report); see the foxglove lookalike
    entry for how to tell them apart.'
  severity: warning
  reference_ids:
  - REF-5668
  status: verified
- note: 'Skin absorption: in lab tests on human skin, only 0.04-0.22% of lycopsamine, a main pyrrolizidine
    alkaloid of comfrey, passed through the epidermis from a comfrey ointment within 24 hours (lab study);
    internal use remains unsafe.'
  severity: info
  reference_ids:
  - REF-5669
  status: verified
