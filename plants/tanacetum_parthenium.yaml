id: tanacetum-parthenium
scientific_name: Tanacetum parthenium
common_names:
- Feverfew
- Featherfew
- Bachelor's buttons
- Midsummer daisy
family: Asteraceae
external_ids:
  gbif: 3118430
  wikidata: Q818481
parts_used:
- Leaf (aerial parts)
constituents:
- name: Sesquiterpene lactones (parthenolide)
  compounds:
  - sesquiterpene-lactone
  - sesquiterpene
  - parthenolide
  note: Parthenolide is the principal active compound, to which extracts are often standardised; it is
    biosynthesised and stored in the glandular trichomes of the aerial parts.
  reference_ids:
  - REF-0450
  - REF-0552
  - REF-0553
  - REF-1579
  - REF-1580
- name: Flavonoids and essential oil
  compounds:
  - essential-oil
  - flavonoid
  note: Supporting antioxidant and aromatic constituents.
  reference_ids:
  - REF-0450
botanical_description:
  text: Aromatic perennial herb (Asteraceae), 20-60 cm tall, with much-branched, downy stems. Leaves are
    yellow-green, bipinnately divided and strongly scented. Small, daisy-like flower heads have white
    ray florets and a flat yellow disc, borne in loose clusters.
  height: 20-60 cm
  habit: Erect, much-branched, aromatic perennial herb
  leaves: Yellow-green, bipinnately divided, strongly scented
  flowers: Small, daisy-like, white ray florets around a flat yellow disc
  stem: Much-branched, downy
  root: Fibrous perennial rootstock
  fruit: Small ribbed achenes (typical Asteraceae)
  flowering_period: June-September
  reference_ids:
  - REF-0553
  status: verified
habitat:
  text: Native to the Balkans and Caucasus region, now naturalised across Europe, North America and elsewhere;
    grows on disturbed ground, walls, roadsides and waste places, and is widely cultivated.
  reference_ids:
  - REF-0450
  status: verified
harvesting:
  text: Leaves (aerial parts) are gathered during the growing season, ideally at flowering, and dried
    or used fresh.
  parts:
  - Leaf (aerial parts)
  season: Growing season, ideally at flowering
  reference_ids:
  - REF-0553
  status: verified
harvest_readiness:
- part: leaf
  signals:
  - "Gather the leaves with the flowering herb, as the plant comes into flower in summer."
  basis: traditional
  source_quote: "The plant is gathered as it comes into flower and can be dried for later use."
  reference_ids:
  - REF-3347
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3347); the leaf/flowering herb is gathered as the plant comes into flower (in flower July-August). Single lineage -> provisional."
traditional_uses:
  text: Feverfew has a long European folk tradition, its name derived from 'febrifuge' (fever-reducer),
    as a remedy for fevers, headaches and joint pain. Modern use and clinical research focus on migraine
    prevention, with parthenolide identified as the key active compound responsible for inhibiting the
    inflammatory pathways implicated in migraine.
  reference_ids:
  - REF-0450
  status: verified
preparations:
- name: Fresh leaf (chewed, traditional)
  text: A few fresh leaves chewed daily - the classic, though mouth-irritating, traditional preparation.
  status: draft
- name: Standardised leaf extract (capsule)
  text: Freeze-dried or standardised-parthenolide extract, the form used in most clinical trials.
  reference_ids:
  - REF-0450
  status: verified
- name: Infusion (tea)
  text: Dried leaf steeped in hot water.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried leaf.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials for migraine prevention have most often used standardised extracts providing around
    0.2-0.6% parthenolide, taken daily; do not stop abruptly after prolonged use given a documented 'post-feverfew'
    rebound syndrome. Educational reference only, not a prescription; avoid in pregnancy and with anticoagulants.
  reference_ids:
  - REF-0450
  - REF-0552
  status: verified
actions:
- action: anti-inflammatory
  note: Anti-inflammatory - parthenolide inhibits NF-kB and nitroglycerin-induced neuronal (Fos) activation,
    the proposed basis of its antimigraine action
  reference_ids:
  - REF-0552
  - REF-1574
  - REF-1578
  status: verified
indications:
- condition: arthritis
  note: Traditionally used for rheumatoid arthritis (review); a placebo-controlled trial in rheumatoid
    arthritis found no benefit
  reference_ids:
  - REF-1574
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0552
  null_result_ids:
  - REF-3792
- condition: fever
  note: Traditional use for fevers (review)
  reference_ids:
  - REF-1574
  status: needs-review
- condition: headache
  note: Feverfew modestly reduced migraine headaches in a Cochrane review (low-quality evidence)
  reference_ids:
  - REF-0450
  - REF-1572
  status: verified
- condition: inflammation
  note: A parthenolide-depleted feverfew extract had anti-inflammatory activity in the lab (preclinical)
  reference_ids:
  - REF-1578
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0552
- condition: migraine
  note: Feverfew modestly reduced migraine frequency in the 2015 Cochrane review (low-quality evidence)
    and in a randomized trial of a CO2 extract (MIG-99); a smaller dose-finding trial and a 2020 systematic
    review found mixed results
  reference_ids:
  - REF-0450
  - REF-0552
  - REF-1572
  - REF-1574
  - REF-1581
  - REF-3791
  status: verified
  null_result_ids:
  - REF-1576
  - REF-1575
- condition: pain
  note: Traditionally used for toothache and stomach ache (review)
  reference_ids:
  - REF-1574
  status: needs-review
- condition: skin-irritation
  note: A parthenolide-depleted feverfew extract reduced chemically induced skin redness in a clinical
    model and inflammation in the lab
  reference_ids:
  - REF-1578
  status: needs-review
  mechanistic_exclude_ids:
  - REF-0552
contraindications:
- note: As a member of the daisy family (Asteraceae), it can cause allergic reactions in people sensitive
    to ragweed and related plants. Chewing fresh leaves commonly causes mouth ulcers and oral soreness.
  severity: info
  reference_ids:
  - REF-0450
  status: verified
- note: Stopping feverfew abruptly after prolonged use can cause a 'post-feverfew' rebound of headache,
    anxiety and muscle/joint stiffness. Avoid in pregnancy (uterine-stimulant) and breastfeeding, and
    use caution with anticoagulant/antiplatelet medicines.
  severity: caution
  reference_ids:
  - REF-0450
  status: verified
references:
- REF-1572
- REF-1574
- REF-1575
- REF-1576
- REF-1578
- REF-1579
- REF-1580
- REF-1581
drug_class_interactions:
- drug_class: anticoagulants-antiplatelets
  severity: caution
  mechanism: Feverfew and its component parthenolide inhibit platelet aggregation and serotonin release,
    so combining it with anticoagulant or antiplatelet drugs may increase bleeding risk.
  reference_ids:
  - REF-2444
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
pairings:
- partner_id: zingiber-officinale
  type: caution
  note: Feverfew and ginger both reduce blood clotting/platelet stickiness, so taking them together may
    add up and raise the risk of bruising or bleeding - use caution, especially before surgery or alongside
    blood-thinning drugs.
  reference_ids:
  - REF-2457
  - REF-2444
  - REF-2443
  status: approved
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-03'
lookalikes_review:
  outcome: none-known
  reviewed_by: Omnia Sana (owner-authorized)
  reviewed_date: '2026-07-07'
