botanical_description:
  text: A perennial herb 30-90 cm tall with more or less branched stems up to 5 mm thick. The alternate,
    stalked leaves are greenish-yellow, 2-5 cm (sometimes up to 10 cm) long, deeply divided (pinnatisect
    to bipinnate) and more or less hairy on both sides. The flower heads, 1.2-2.2 cm across on long stalks,
    are grouped 5-30 together in wide, flat-topped clusters; each has a centre of yellow, tubular, five-toothed
    disc florets and a ring of white ray florets 2-7 mm long. The fruit is a brown achene 1.2-1.5 mm long
    with 5-10 white ribs. It flowers in July and August.
  height: 30-90 cm
  habit: Perennial herb with more or less branched stems
  leaves: Alternate, stalked, greenish-yellow, 2-5 cm (up to 10 cm) long, pinnatisect to bipinnate, more
    or less hairy on both sides
  flowers: Heads 1.2-2.2 cm across, 5-30 in wide flat-topped clusters; yellow tubular disc florets and
    white ray florets 2-7 mm long
  stem: More or less branched, up to 5 mm thick
  fruit: Brown achene 1.2-1.5 mm long with 5-10 white ribs
  flowering_period: July to August
  reference_ids:
  - REF-3968
  - REF-3347
  status: verified
habitat:
  text: Indigenous to south-east Europe as far east as the Caucasus, and now common throughout Europe
    and the United States; naturalised in Britain. It grows in mountain scrub, on rocky slopes, walls
    and waste places, and as a garden weed, avoiding acid soils.
  reference_ids:
  - REF-3968
  - REF-3347
  status: verified
harvesting:
  text: The plant is gathered as it comes into flower and can be dried for later use; the medicinal material
    is the dried leaves or aerial parts.
  parts:
  - Leaf (aerial parts)
  season: As it comes into flower (July to August)
  reference_ids:
  - REF-3347
  - REF-3968
  status: verified
harvest_readiness:
- part: leaf
  signals:
  - "Gather the leaves with the flowering herb, as the plant comes into flower in summer."
  basis: traditional
  source_quote: "The plant is gathered as it comes into flower and can be dried for later use."
  reference_ids:
  - REF-3347
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3347); the leaf/flowering herb is gathered as the plant comes into flower (in flower July-August). Single lineage -> provisional."
traditional_uses:
  text: In folk medicine feverfew was taken for fevers, colds, arthritis and rheumatism, and for anaemia,
    asthma, indigestion, constipation, diarrhoea, painful periods, oedema, sciatica, toothache, tinnitus
    and vertigo; a tea of the whole plant was used for arthritis, colds and fevers, and an infusion to
    bathe swollen feet. The WHO monograph notes that these folk uses are not supported by experimental
    or clinical data, and that a trial in rheumatoid arthritis found no benefit. Its main modern use is
    preventing migraine, which WHO lists as supported by clinical data; a Cochrane review found the evidence
    mixed and of low quality, with the largest trial showing 0.6 fewer attacks a month than placebo.
  reference_ids:
  - REF-3968
  - REF-3347
  - REF-0450
  status: verified
preparations:
- name: Fresh leaf (chewed, traditional)
  text: A few fresh leaves chewed daily - the classic, though mouth-irritating, traditional preparation.
  status: draft
- name: Capsules (leaf or extract)
  text: 'For migraine prevention feverfew is taken in capsules: the WHO monograph gives encapsulated crude
    drug equivalent to 0.2-0.6 mg parthenolide a day, and the largest trial in a Cochrane review used
    a stable feverfew extract.'
  reference_ids:
  - REF-3968
  - REF-0450
  status: verified
- name: Infusion (tea)
  text: Dried leaf steeped in hot water.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried leaf.
  status: draft
dosage:
- name: Standardised extract
  text: Clinical trials for migraine prevention have most often used standardised extracts providing around
    0.2-0.6% parthenolide, taken daily; do not stop abruptly after prolonged use given a documented 'post-feverfew'
    rebound syndrome. Educational reference only, not a prescription; avoid in pregnancy and with anticoagulants.
  reference_ids:
  - REF-0450
  - REF-0552
  status: verified
actions:
- action: anti-inflammatory
  note: Anti-inflammatory - parthenolide inhibits NF-kB and nitroglycerin-induced neuronal (Fos) activation,
    the proposed basis of its antimigraine action
  reference_ids:
  - REF-0552
  - REF-1574
  - REF-1578
  status: verified
