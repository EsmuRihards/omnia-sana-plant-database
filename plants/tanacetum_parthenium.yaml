internal_notes: 'Enriched 2026-06-12 from scientific literature (Cochrane systematic review of feverfew
  for migraine prevention). Further enriched 2026-06-13 with two PubMed studies - a parthenolide mechanism-of-action
  study in an animal migraine model (REF-0552, Tassorelli et al. 2005) and a parthenolide biosynthesis/localization
  study (REF-0553, Majdi et al. 2011). Originally a skeleton imported from the omniasana.bio Symptom-to-Plant
  Lookup tool (headache, migraine, inflammation, fever, arthritis); associations retained and now part-mapped
  and cited. | 2026-06-15: migrated to entity schema (actions->vocab ids, indications split out, constituents
  linked to compounds). | 2026-06-20: enriched to >=10 scientific publications: added 10 PubMed-verified
  @article sources (REF-1572, REF-1573, REF-1574, REF-1575, REF-1576, REF-1577, REF-1578, REF-1579, REF-1580,
  REF-1581) - woven into relevant actions/indications and the plant-level references bucket. | 2026-07-12:
  added botanical_description/habitat/harvesting/traditional_uses/preparations/dosage monograph-base fields,
  sourced from the existing Cochrane migraine-prevention review (REF-0450) and parthenolide biosynthesis/localisation
  study (REF-0553). | 2026-08-15: Harvest Calendar (phenological) - added harvest_readiness for leaf
  (provisional: PFAF REF-3347, gathered as the plant comes into flower). Single lineage. Binomial
  confirmed.
  | 2026-11-10: symptom-source audit batch 3 - REF-1577 purged: feverfew + white willow
  combination (Mig-RL), not feverfew alone.
  | 2026-11-13: symptom-source audit deep audit batch 17 - Deep audit (2nd pass + deep). 2000
  Cochrane REF-1573 purged and deleted (superseded by the 2015 update REF-0450). MIG-99
  dose-finding RCT REF-1576 (no overall effect) and the 2020 herbal-migraine SR REF-1575 ("mixed")
  moved to no-effect; the positive 2005 MIG-99 RCT REF-3791 added. Pattrick 1989 RA RCT REF-3792
  recorded as no-effect. Cochrane REF-0450 removed from pain (never names it) and the
  anti-inflammatory action; review REF-1574 (retagged narrative-review) names toothache/stomach
  ache. REF-0552 retagged preclinical (rat migraine model).'
