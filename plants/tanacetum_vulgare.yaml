traditional_uses:
  text: Tansy was a strewing herb said to keep flies away, and its young leaves went into Easter 'tansy'
    cakes. It was used to expel worms in children, as an emmenagogue, for hysteria, kidney weakness and
    gout, and externally for eruptive skin diseases and sprains; in large doses it is a violent irritant.
    These internal uses are recorded for history only, not as a recommendation.
  reference_ids:
  - REF-3811
  status: verified
preparations:
- name: Strewing herb (fly repellent, external)
  text: Strewn in rooms as a strewing herb, said to keep flies away, especially mixed with elder leaves;
    meat rubbed with the plant was said to be left alone by flies.
  reference_ids:
  - REF-3811
  status: verified
- name: Essential oil (external, historical)
  text: Used historically as an insect repellent; prolonged skin contact should still be avoided given
    its sensitising potential.
