botanical_description:
  text: Hardy perennial with creeping roots and an erect, leafy, grooved and angular stem about 60-90
    cm (2-3 ft) high. The leaves are alternate and much cut, 5-15 cm long. In August and September it
    bears clusters of round, flat, dull yellow flower heads ('buttons'). The plant has a curious, camphor-like
    smell.
  height: 60-90 cm (2-3 ft)
  habit: Hardy perennial spreading by creeping roots
  leaves: Alternate, much divided, 5-15 cm long and about 10 cm wide
  flowers: Round, flat, dull yellow button-like heads in clusters
  stem: Erect, leafy, grooved and angular
  root: Creeping
  flowering_period: August-September
  reference_ids:
  - REF-3811
  status: verified
habitat:
  text: A hardy perennial widely spread over Europe, familiar in hedgerows and waste places and growing
    in abundance on marshy ground; often grown in gardens.
  reference_ids:
