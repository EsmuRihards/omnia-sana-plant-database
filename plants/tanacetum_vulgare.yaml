  status: verified
dosage:
- name: Internal use
  text: Not recommended for internal use at any dose. Grieve records that large doses are a violent irritant
    and that excessive doses of the essential oil have produced seizures, and Duke lists tansy as abortifacient.
    Educational reference only, not a prescription; avoid in pregnancy.
  reference_ids:
