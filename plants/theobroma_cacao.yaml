  - REF-3974
  status: verified
habitat:
  text: Native to South America (Brazil, Peru, Colombia and the Guianas) and Central America (Belize,
    Guatemala and southern Mexico), where it is an understorey tree of evergreen rainforest in the wet
    humid tropics, in places not usually flooded. It is widely cultivated in lowland tropical areas around
    the world, usually below 300 m, where the mean annual temperature is 18-28.5 degrees C and 1,500-2,000
    mm of rain falls through the year.
  reference_ids:
  - REF-3973
  status: verified
harvesting:
  text: The seeds are taken from the ripe pods, which turn yellow to orange, and cured by pressing, fermenting
    and then drying them. The cured seeds are roasted and ground to make cocoa, and cocoa butter is extracted
    from them.
  parts:
  - Fruit
  - Seed
  season: When the pods are ripe (yellow to orange)
  reference_ids:
  - REF-3973
  - REF-3974
  status: verified
harvest_readiness:
- part: fruit
  signals:
  - "Cut the pod from the trunk once it has passed physiological maturity and the husk has changed colour."
  - "Read ripeness from the PROPORTION of the pod and its grooves that has turned, not from one fixed colour: the ripe colour is clone-specific (for example purple to reddish with yellow grooves), and some clones show little colour change at all."
  basis: traditional
  source_quote: "ripeness states (RS) were established based on days since flowering to ensure that all fruits had exceeded the state of physiological maturity"
  reference_ids:
  - REF-3388
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "Rojas et al., Heliyon 2020 (REF-3388), open access, tracking husk colour, firmness, weight, soluble solids and pH against ripeness state in three Theobroma cacao clones (ICS95, CCN51, TSH565). The paper's colour descriptors run from 'Purple to reddish color with 20% yellow grooves' to 'Reddish to yellow color with 60% yellow grooves' depending on clone, and it concludes that each clone carries its own set of ripeness parameters - which is why the signal here is the proportion turned rather than a single colour. Supersedes the earlier dead end (Useful Tropical Plants gave no pod-ripeness stage). The seed (cocoa bean) is extracted from these same harvested pods. Single lineage -> provisional."
traditional_uses:
  text: Cacao was grown by the Maya and the Aztecs, who considered it a divine plant, drank it as a ritual
    beverage and used the beans as currency; the trees also gave them medicine, fibre and building materials.
    The genus name Theobroma is Greek for 'food of the gods'. In Central America and the Caribbean the
    seed is used as a heart and kidney tonic, an infusion of the baked seed membranes is drunk for anaemia,
    and cacao powder is taken for angina and high blood pressure; cocoa butter is used to soften damaged
    skin. In a large randomised trial in older adults, a cocoa extract supplying 500 mg of flavanols a
    day did not significantly reduce total cardiovascular events, though deaths from cardiovascular disease
    were 27% lower.
  reference_ids:
  - REF-3973
  - REF-3974
  - REF-1085
  status: verified
preparations:
- name: Traditional cacao drink
  text: Roasted, ground beans made into a beverage - the historic Mesoamerican preparation, often unsweetened
    and sometimes spiced.
  status: draft
- name: Cocoa powder
  text: Defatted, roasted, ground beans, used in modern beverages and food.
  status: draft
- name: Dark chocolate
  text: Chocolate made from the roasted beans. Dark chocolate is considered one of the main sources of
    antioxidants in the American diet after fruit and vegetables, but cocoa processing makes its polyphenol
    content vary widely.
  reference_ids:
  - REF-1090
  status: verified
- name: Cocoa flavanol extract
  text: A cocoa extract supplement supplying a set amount of flavanols, the form tested in the COSMOS
    trial of cardiovascular disease prevention.
  reference_ids:
  - REF-1085
  status: verified
dosage:
- name: Cocoa flavanol extract
  text: The COSMOS trial in 21,442 older adults used a cocoa extract supplying 500 mg of flavanols a day,
    including 80 mg of epicatechin, for a median of 3.6 years; it did not significantly reduce total cardiovascular
    events, though cardiovascular deaths were 27% lower. Cacao seed contains stimulant xanthines. Educational
    reference only, not a prescription.
  reference_ids:
  - REF-1085
  - REF-3973
  status: verified
constituents:
- name: Methylxanthines (theobromine, caffeine)
  note: Theobromine is the dominant methylxanthine and the main stimulant/bronchodilator constituent,
    with lesser amounts of caffeine.
  reference_ids:
  - REF-0131
- name: Flavanols (epicatechin, catechin, procyanidins)
  compounds:
  - catechin
  - proanthocyanidin
  - flavonoid
  note: Cocoa is rich in phenolic antioxidants, about 10% of the dry weight of the bean. The flavonoids
    catechin, epicatechin and procyanidins predominate in its antioxidant activity, and epicatechin is
    considered mainly responsible for its effect on the lining of the blood vessels, through nitric oxide.
  reference_ids:
  - REF-0131
  - REF-1090
- name: Phenylethylamine
  note: A trace amine sometimes linked to cacao's reputed mood-elevating effects.
  reference_ids:
  - REF-0131
- name: Cocoa butter (fatty acids)
  note: The fat fraction of the seed, classified as emollient and used in both food and topical products.
