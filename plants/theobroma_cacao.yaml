botanical_description:
  text: A small evergreen tree with a rounded crown, usually about 8 m tall but exceptionally up to 20
    m, with a short trunk 20-30 cm across. The leaves are alternate, entire and unlobed, 10-50 cm long
    and 5-10 cm broad. Small flowers 1-2 cm across, with a pink calyx, grow in clusters directly on the
    trunk and older branches (cauliflory) and are pollinated by tiny midges. The fruit, the cacao pod,
    is ovoid, 15-30 cm long and 8-10 cm wide, ripening yellow to orange and weighing about 500 g; it holds
    20-60 seeds (the beans) in a white pulp.
  height: Usually about 8 m; exceptionally up to 20 m
  habit: Small evergreen tree with a rounded crown; flowers and pods grow on the trunk (cauliflory)
  leaves: Alternate, entire, unlobed, 10-50 cm long and 5-10 cm broad
  flowers: Small, 1-2 cm across, with a pink calyx, in clusters on the trunk and older branches; midge-pollinated
  stem: Short trunk 20-30 cm across
  fruit: Ovoid pod 15-30 cm long, ripening yellow to orange, about 500 g, holding 20-60 seeds in white
    pulp
  reference_ids:
