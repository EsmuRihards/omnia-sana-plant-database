contraindications:
- note: '• Stimulant effect (most common issue): cacao naturally contains theobromine (and some caffeine).
    In larger amounts it can feel like a “gentle coffee”: faster heartbeat, restlessness, trouble sleeping.
    • Heavy metals (quality matters): cocoa/chocolate can contain cadmium and lead from soil and processing.
    For frequent use (especially powders, dark chocolate, “ceremonial” paste), choose brands that publish
    lab tests. • Pregnancy (extra caution late pregnancy): some research suggests very polyphenol-rich
    foods (including cocoa/dark chocolate) could affect fetal circulation in late pregnancy. This is not
    “everyone must avoid chocolate,” but high-dose cacao drinks are something to discuss with a clinician
    if pregnant-especially in the 3rd trimester. • Breastfeeding: moderate chocolate/cacao is usually
    fine, but very large amounts can affect some infants (stimulation/irritability) because stimulant
    compounds can pass into milk in small amounts. • If you’re sensitive: cacao can worsen reflux/heartburn,
    trigger migraines in some people, or cause nausea-especially in strong ceremonial-style servings.
    • Medication caution: if you take stimulant-sensitive meds, have heart rhythm issues, severe anxiety,
    or use MAOI antidepressants, treat high-dose cacao drinks like a stimulant and be cautious'
  severity: caution
  reference_ids:
  - REF-0131
  - REF-0249
  status: verified
- note: Duke (2002) notes that cacao is primarily known for its cardiotonic, CNS-stimulant, and broncholytic
    activities at the experimental level (score 1). Theobromine is identified as the principal active
    constituent responsible for mild bronchodilation and cardiovascular stimulation. Cocoa butter is classified
    as emollient (score 1). Chocolate's content of phenylethylamine may contribute to reported aphrodisiac
    properties. Duke notes that excessive consumption may be cariogenic and pro-acneic, and cocoa is a
    known allergen in sensitive individuals (Duke, 2002).
  severity: info
  reference_ids:
  - REF-0131
  - REF-0249
  - REF-0063
  status: verified
- note: 'Allergy: a person with tree-nut allergy had anaphylaxis after eating a piece of chocolate; skin
    tests showed cocoa sensitization with cross-reactivity to tree nuts (case report).'
  severity: caution
  reference_ids:
  - REF-5673
  status: verified
- note: 'Migraine: about 14% of people with migraine report chocolate as a trigger (meta-analysis of self-report
    studies); effects vary between individuals, so a headache diary is more useful than routine avoidance.'
  severity: info
  reference_ids:
  - REF-5672
  status: verified
- note: 'Heavy metals: in 155 chocolates on the US market, cadmium and lead were higher in dark chocolate
    (50% cacao or more), and highest in cacao from Central and South America; in 155 Serbian chocolates,
    weekly cadmium intake stayed below the tolerable limit but reached about 60% of it for children (product
    analyses).'
  severity: info
  reference_ids:
  - REF-5674
  - REF-5675
  status: verified
