internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx). reference_ids are
  plant-level: the book lists parts and actions as flat, unmapped lists, so the full set of references cited
  for this plant is attached to each action rather than split per action. constituents not yet extracted -
  manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab ids, indications split
  out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific publications: added 5
  PubMed-verified @article sources (REF-1323, REF-1324, REF-1325, REF-1326, REF-1327) - woven into relevant
  actions/indications and the plant-level references bucket. | 2026-06-27: enriched to >=15 scientific
  publications: added 7 PubMed-verified @article sources (REF-1324, REF-1323, REF-2366, REF-1326, REF-1325,
  REF-2367, REF-2368) - woven into relevant actions/indications and the plant-level references bucket. |
  2026-07-12: added monograph-base fields (botanical_description, habitat, harvesting, traditional_uses,
  preparations, dosage + constituents) sourced from the existing references bucket; general/undated claims
  marked status: draft per the integrity-first sourcing policy. | 2026-07-13: added anticancer action (where
  absent) + cancer indication (anticancer/antitumour research) sourced from the plant''s cited literature,
  as part of the cancer-condition campaign. | 2026-07-17: enriched with 10 PubMed-verified @article sources
  (REF-2901..REF-2910): antidiabetic/antioxidant/antiproliferative white-clover-flower muffins,
  hydrolysed-extract menopause-obesity/depression model, T. repens essential-oil cytotoxicity/antimicrobial,
  multi-Trifolium dermal wound-healing isoflavones, Trifolium seed-oil antioxidant lipids, isoflavone-legume
  reversal of ergot vasoconstriction (cardiovascular), T. repens antioxidant polysaccharides, forage-legume
  seed flavonoids, white-clover condensed-tannin activity against Cryptosporidium, and identification of T.
  repens as a new glycyrrhetinic-acid source; added antimicrobial/antidiabetic actions +
  blood-sugar/infection indications and wove refs into existing claims + references bucket. Note: white
  clover''s peer-reviewed medicinal literature is genuinely thin (its strongest prior papers were already
  cited), so genus-level and phytochemistry studies that explicitly report T. repens data are included. |
  2026-07-18: added 10 more sources (REF-2935..2944) via OpenAlex (not PubMed); OpenAlex surfaced genuinely
  medicinal T. repens papers in non-PubMed-indexed journals: DPPH/phenolic methanol-extract
  characterization, edible-flower antioxidant + alpha-amylase/glucosidase/lipase inhibition (antidiabetic),
  anti-cholinesterase leaf extract (created neuroprotective action + cognitive-function indication),
  essential-oil pseudoionone multi-target (diabetic-neuropathy neuroprotection, anti-inflammatory,
  anti-MDR-infection), in-silico antibacterial screening, and green-juice
  antioxidant/antibacterial/anti-inflammatory. The two weakest (clover-protein redox enzymes; a multi-oil
  cytostatic panel) are kept in the references bucket only, not asserted as therapeutic claims. | 2026-07-18
  (dosage-sourcing campaign, batch 7): WHO SEARCHED, WRONG SPECIES - documented so a future pass does not
  repeat the search or, worse, cite it. A text search of WHO monographs on selected medicinal plants Vols
  1-4 surfaces a monograph whose text mentions this genus, but it covers a DIFFERENT species and its
  posology must not be transferred here. The hit is Flos Trifolii (WHO Vol 4) = Trifolium PRATENSE (red
  clover). This record is Trifolium repens (white clover). No WHO or EMA monograph covers T. repens. Dosage
  entry remains unsourced. Consistent with the earlier clover-refs campaign, where white clover repeatedly
  proved to be the sparsely-documented species of the pair. | 2026-07-19 (dosage-sourcing campaign, closing
  sweep): DOCUMENTED DEAD END - closing sweep of the dosage-sourcing campaign. The remaining unsourced
  dosage entry/entries on this record were searched against every seam this campaign opened and none yields
  a dose for this species in this preparation. Seams checked: (1) the official EMA herbal medicines register
  (medicines-output-herbal_medicines-report, 251 rows, retrieved 2026-07-18), matched on the accepted
  binomial AND on every synonym and common name appearing in a register row; (2) WHO monographs on selected
  medicinal plants Volumes 1-4, indexed by Latin drug title with each monograph''s Definition read to
  confirm the species - 177 monographs indexed; (3) this plant''s own reference bucket, mined for human
  studies that state an administered dose. Per the campaign''s integrity bar the entry is left unsourced at
  status draft rather than attached to a tangentially-related paper. | 2026-08-15: Harvest Calendar
  (phenological) - added harvest_readiness for flower + leaf (both provisional: PFAF REF-3359, gathered
  while in flower in summer). Single lineage. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 18 - Deep audit (2nd pass + deep). Generic
  Grieve REF-0098 purged from this record: Grieve has no white clover entry (checked 2026-11-13;
  only Clover, Red). White clover review REF-0027 (no abstract, retagged narrative-review) was
  pinned to 9 pairs; kept only where a checkable study agrees (inflammation, wounds).
  Clover-isoflavone review REF-0140 removed from 5 actions. Bruising, cold, menstrual-cramps,
  muscle-spasm dropped (nothing names them). T. canescens wound result REF-2904 and in-silico
  REF-2941 removed; Cryptosporidium tannin study REF-2909 (no inhibition) moved to no-effect.
  Blood-sugar is in vitro only (verified -> needs-review).
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): REF-0027 (''Bhattacharya
  2013, review of white clover'', vol 7(7):583-8) and REF-0140 (''Klaiber 2002, isoflavones from
  clover species'') are not in PubMed, Crossref or OpenAlex under those titles, authors or years:
  removed and deleted. The description, habitat, harvest, history, infusion, constituents and caution
  are rewritten from PFAF REF-3359, Wikipedia REF-4313, the Ahmad & Zeb review REF-1324 and REF-2368.
  The antispasmodic action had no other source and is removed. Inflammation and wounds keep their lab
  sources (same tier). Dropped as unsourced: 3-4-seeded pods, flowering May-October, ''lighter than
  red clover'', isoflavones lower than red clover, ''not significant in normal food or tea use'',
  red-clover hormone precautions.'