traditional_uses:
  text: White clover has been used as a traditional medicine as well as a leafy vegetable and fodder;
    a review lists its traditional anti-inflammatory, antiseptic, analgesic, antirheumatic and antimicrobial
    uses. An infusion has been used for coughs, colds, fevers and leucorrhoea, a leaf tincture as an ointment
    for gout, and a flower infusion as an eyewash.
  reference_ids:
  - REF-1324
  - REF-3359
  status: verified
preparations:
- name: Infusion
  text: An infusion of the plant has been used for coughs, colds, fevers and leucorrhoea, and an infusion
    of the flowers as an eyewash.
  reference_ids:
  - REF-3359
  status: verified
- name: Poultice (leaf)
  text: Fresh crushed leaf applied topically as a traditional wound and bruise poultice.
  status: draft
dosage:
- name: Infusion
  text: Traditional herbal references suggest around 2-4 g of dried flower/leaf per cup, up to three times
    daily. Educational reference only, not a prescription.
  status: draft
