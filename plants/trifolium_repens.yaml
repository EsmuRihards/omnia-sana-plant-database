botanical_description:
  text: Low-growing herbaceous evergreen perennial about 10 cm tall whose stems act as stolons, creeping
    up to 18 cm a year and rooting at the nodes to form mats. The leaves are trifoliolate, smooth, elliptic
    to egg-shaped and long-stalked, usually with light or dark markings. Heads 1.5-2 cm wide of whitish
    florets, often tinged pink or cream, stand on stalks about 7 cm long. It flowers from June to September
    and fixes nitrogen.
  height: About 10 cm
  habit: Low, mat-forming perennial with creeping stolons rooting at the nodes
  leaves: Trifoliolate, smooth, elliptic to egg-shaped, long-stalked, usually with light or dark markings
  flowers: Whitish florets, often tinged pink or cream, in heads 1.5-2 cm wide on stalks about 7 cm long
  stem: Stolons creeping up to 18 cm a year, rooting at the nodes
  root: Nitrogen-fixing
  flowering_period: June-September
  reference_ids:
  - REF-4313
  - REF-3359
  status: verified
habitat:
  text: Grassland and lawns, preferring a calcareous clay soil. Native to Eurasia, from Europe including
    Britain south and east to North Africa and north and western Asia; widely introduced as a forage crop
    and now common in grassy areas of the Americas, Australia and New Zealand.
  reference_ids:
  - REF-3359
  - REF-4313
  status: verified
harvesting:
  text: The flowering heads are gathered while the plant is in flower (June-September) and dried, for
    example as a tea substitute.
  parts:
  - Flower
  season: June-September, in flower
  reference_ids:
  - REF-3359
  status: verified
