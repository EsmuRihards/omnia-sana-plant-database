- condition: blood-sugar
  note: Fenugreek lowered fasting blood sugar and HbA1c in type 2 diabetes and prediabetes in meta-analyses
    of trials (study quality varies); traditional use in diabetes (Grieve, A Modern Herbal)
  reference_ids:
  - REF-1117
  - REF-3817
