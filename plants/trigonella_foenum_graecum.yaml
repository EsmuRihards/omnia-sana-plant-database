id: trigonella-foenum-graecum
scientific_name: Trigonella foenum-graecum
common_names:
- Fenugreek
- Bird’s foot
- goat’s horn
- Greek clover
- and alholva
family: Fabaceae
external_ids:
  gbif: 5360475
  wikidata: Q133205
parts_used:
- Leaf
- Seed
- Young sprouts
botanical_description:
  text: Erect annual herb with trifoliate leaves, each leaflet oblong and finely toothed toward the tip.
    Small, pale yellow to white, pea-like flowers are borne singly or in pairs in the leaf axils, followed
    by long, slender, curved seed pods.
  height: 30-80 cm
  habit: Erect annual herb
  leaves: Trifoliate, each leaflet oblong, finely toothed toward the tip
  flowers: Small, pale yellow to white, pea-like, borne singly or in pairs in leaf axils
  stem: Erect, branching, slightly hairy
  root: Taproot with nitrogen-fixing nodules
  fruit: Long, slender, curved seed pod (10-15 cm) containing 10-20 hard, angular, yellow-brown seeds
  flowering_period: May-June
  reference_ids: []
  status: verified
habitat:
  text: Cultivated widely as a food and forage crop; native to the eastern Mediterranean and western Asia,
    now grown throughout South Asia, the Middle East and North Africa.
  reference_ids: []
  status: verified
harvesting:
  text: Leaves and young sprouts are harvested throughout the growing season; seed pods are collected
    when fully mature and dried, then the hard seeds are threshed out.
  parts:
  - Leaf
  - Seed
  - Young sprouts
  season: Leaf/sprouts through growing season; seed at maturity
  reference_ids: []
  status: verified
harvest_readiness:
- part: seed
  signals:
  - "Harvest the seed when fully ripe, in late summer - the pods ripen intermittently over some weeks."
  basis: traditional
  source_quote: "The seeds are harvested when fully ripe and dried for later use."
  reference_ids:
  - REF-3356
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3356); the seed is harvested when fully ripe (seeds ripen August-September, intermittently). Single lineage -> provisional. (Leaf and young sprouts, also listed parts, are a fresh-herb/sprouting use rather than a distinct field harvest stage.)"
traditional_uses:
  text: Fenugreek seed was held in high repute by the Egyptians, Greeks and Romans for medicine and cooking;
    in Egypt the soaked seed (helba) was taken against fevers, for the stomach and for diabetes, and the
    mucilaginous decoction was drunk for inflamed stomach and bowels and applied as a poultice to boils
    (Grieve). Pharmacopoeias list it internally for loss of appetite and externally as a poultice for
    local inflammation, and WHO lists clinical support as an adjunct for high cholesterol and high blood
    sugar in diabetes; it is widely used as a traditional medicine for diabetes in Asia.
  reference_ids:
  - REF-3849
  - REF-3984
  - REF-2449
  status: verified
preparations:
- name: Seed and cold infusion
  text: Cut or crushed seed taken by mouth (WHO average daily dose 6 g), or a cold infusion of 0.5 g of
    cut seed soaked in 150 ml of cold water for 3 hours, several cups a day. Externally, powdered seed
    is made into a poultice (50 g per litre of hot water) or added to a hot bath.
  reference_ids:
  - REF-3984
  status: verified
- name: Extracts and tinctures
  text: Seed extracts, fluid extracts and tinctures; the WHO monograph gives a daily native extract (3-4:1)
    of 1.5-2 g, a fluid extract (1:1) of 6 ml or a tincture (1:5) of 30 ml.
  reference_ids:
  - REF-3984
  status: verified
- name: Sprouted seed / leaf (food use)
  text: Young sprouts and leaves used as a leafy vegetable or salad green, milder in taste and effect
    than the seed.
  status: draft
dosage:
- name: Seed
  text: The WHO monograph gives an average daily dose of 6 g of cut or crushed seed by mouth, or the equivalent
    in preparations. In a meta-analysis of trials, effects on blood sugar were seen only with medium or
    high doses in people with diabetes. Educational reference only, not a prescription.
  reference_ids:
  - REF-3984
  - REF-2449
  status: verified
constituents:
- name: Steroidal saponins (diosgenin, yamogenin, tigogenin)
  compounds:
  - saponin
  note: Saponins make up 0.6-1.7% of the seed and are derived from diosgenin, yamogenin, tigogenin and
    related compounds.
  reference_ids:
  - REF-3984
- name: Mucilage (soluble fibre)
  compounds:
  - polysaccharide
  note: The seed is rich in mucilage, 25-45% of its weight; this strong mucilage is why the seed has been
    used for inflammation and ulcers of the stomach and intestines.
  reference_ids:
  - REF-3984
  - REF-3356
- name: 4-hydroxyisoleucine (amino acid)
  note: An unusual amino acid from the seed, studied for its effects on insulin resistance.
  reference_ids:
  - REF-1117
- name: Sotolon (flavor compound)
  note: Aromatic lactone responsible for fenugreek's characteristic maple-syrup smell, including the body-odor
    effect reported with supplementation.
  reference_ids: []
