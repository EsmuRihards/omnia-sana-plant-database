internal_notes: 'Bulk-ingested from the Omnia Sana book manuscript (Koffetablbok_with_additions.docx).
  reference_ids are plant-level: the book lists parts and actions as flat, unmapped lists, so the full
  set of references cited for this plant is attached to each action rather than split per action. constituents
  not yet extracted - manual enrichment pending. | 2026-06-15: migrated to entity schema (actions->vocab
  ids, indications split out, constituents linked to compounds). | 2026-06-20: enriched to >=10 scientific
  publications: added 10 PubMed-verified @article sources (REF-1114, REF-1115, REF-1116, REF-1117, REF-0182,
  REF-1118, REF-1119, REF-1120, REF-1121, REF-1122) - woven into relevant actions/indications and the
  plant-level references bucket. | 2026-07-12: added monograph-base fields (botanical_description, habitat,
  harvesting, traditional_uses, preparations, dosage + constituents) sourced from the existing references
  bucket; general/undated claims marked status: draft per the integrity-first sourcing policy. | 2026-07-13:
  added anticancer action (where absent) + cancer indication (anticancer/antitumour research) sourced
  from the plant''s cited literature, as part of the cancer-condition campaign. | 2026-08-15: Harvest
  Calendar (phenological) - added harvest_readiness for seed (provisional: PFAF REF-3356, harvested when
  fully ripe in late summer). Single lineage. Binomial confirmed.
  | 2026-11-13: owner decisions (deep re-sweep) - Fertility pair re-filed to the new low-libido
  condition (owner, 2026-11-13: libido split out of fertility). Its evidence is a sexual-function
  RCT in men (Testofen, REF-1116). REF-0308 (WHO Monographs vol. 1) dropped from this pair: vol. 1
  has no fenugreek monograph (fenugreek is in vol. 3) - the record''s other REF-0308 citations are
  left for its deep re-sweep batch.
  | 2026-11-13: symptom-source audit deep audit batch 18 - Deep audit. REF-0308 "WHO Monographs
  Vol 1 (1999)" purged from this record: fenugreek is not in volume 1. Rat MI study REF-0148
  (retagged preclinical) and glycaemia MA REF-0182 removed from non-matching actions. Glycaemia MA
  REF-3817 and held T2D MA REF-2515 added. New pairs (owner rule): high-cholesterol (2 MAs +
  REF-2515), high-blood-pressure (MA; systolic only), hot-flashes and menopause (placebo RCT).
  Grieve REF-3849 added (diabetes, gout). Gaps: dysmenorrhoea MA (effect "highly uncertain"),
  lactation RCT (no significant difference), Alzheimer''s RCT (within-group only).
  | 2026-11-19 (monograph-source audit): constituents[1] and preparations[0-1] cited only REF-0182 (glycaemia meta-analysis, no abstract stored, cannot be checked). RE-SOURCED: WHO Semen Trigonellae Foenugraeci vol. 3 (REF-3984, new; mucilage 25-45%, dosage forms and posology) + PFAF REF-3356 (strong mucilage, stomach and intestinal inflammation). Dropped as unsupported: galactomannan named as the fibre, slows carbohydrate absorption as the key glucose mechanism, taken with food, simmered tea, capsules, the form most used in trials.
  | 2026-11-20 locatorless-ref audit (scripts/audit_locatorless_refs.py): REF-0182 was a second,
  locator-less copy of the Neelakantan 2014 glycaemia meta-analysis (PMID 24438170), already in the
  bib as REF-2449; every citation moved to REF-2449 and REF-0182 deleted (same paper, same tier, so no
  score change). REF-0148 (''Kumar & Bhandari 2013, fenugreek in experimental myocardial infarction'')
  is not in PubMed, Crossref or OpenAlex under that title, author or year: removed and deleted, so the
  cardiovascular pair no longer claims a rat heart-attack result. traditional_uses, the seed dose, the
  saponin and 4-hydroxyisoleucine constituents and both cautions are rewritten from WHO vol. 3
  (REF-3984), Grieve (REF-3849), the 4-hydroxyisoleucine review REF-1117 and the toxicology review
  REF-1115; the two caution notes were scraped web text with pasted URLs. Dropped as unsupported: 6-50
  g a day, 1-4 g in tea, Commission E approval, lactation aid.'
