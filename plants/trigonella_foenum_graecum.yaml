contraindications:
- note: The WHO monograph contraindicates fenugreek seed in allergy to the plant and, because it stimulates
    the uterus, in pregnancy. Allergic reactions after eating or inhaling the seed have been reported,
    ranging from a runny nose and wheezing to fainting and facial swelling.
  severity: caution
  reference_ids:
  - REF-3984
  status: verified
- note: Because it lowers blood sugar in people with diabetes, WHO advises using fenugreek seed with diabetes
    tablets or insulin only under the supervision of a health professional. A review of its toxicology
    reports birth defects and anti-fertility effects in animals and advises against use in pregnancy,
    and suggests avoiding it with peanut or chickpea allergy (possible cross-reactivity) and in chronic
    asthma.
  severity: caution
  reference_ids:
  - REF-3984
  - REF-1115
  status: verified
- note: 'Duke (2002) provides strong clinical evidence (score 2) for fenugreek''s hypoglycemic and hypocholesterolemic
    activities - among the best-evidenced herbal treatments for blood sugar and lipid management. Anti-inflammatory
    and demulcent activities also have clinical support. The seed is Commission E approved as an appetite
    stimulant. Dose: 6–50 g of ground seeds daily for blood sugar management; 1–4 g seeds in tea for digestive
    use. The plant has lactagogue effects and can cause maple syrup-like body odor due to sotolon content.
    Contraindicated in pregnancy at medicinal doses due to uterotonic effects (Duke, 2002).'
  severity: caution
  reference_ids:
  - REF-0063
  status: verified
