botanical_description:
  text: Perennial herb with creeping roots, the whole plant downy and covered with stinging hairs; each
    sting is a hollow spine with the irritant fluid held in its swollen base. Leaves are heart-shaped,
    finely toothed and taper to a point, borne in opposite pairs. Small green flowers hang in long, branched
    clusters from the leaf axils; male and female flowers are usually on separate plants (hence dioica).
  height: 60-90 cm as a rule (Grieve); 0.9-2 m in summer (Wikipedia), taller on rich soil
  habit: Herbaceous perennial with widely spreading creeping rhizomes, forming patches; dies down in winter
  leaves: Opposite, heart-shaped at the base, strongly toothed and tapering to a point, with stinging
    hairs
  flowers: Small, green, in long branched clusters from the leaf axils; male and female usually on separate
    plants
  stem: Downy and covered with stinging hairs
  root: Creeping perennial rhizomes and roots, bright yellow
  fruit: Small, one-seeded
  flowering_period: June-September
  reference_ids:
  - REF-3844
  - REF-4030
  status: verified
habitat:
  text: Common on disturbed soil and river banks, in ditches and among brambles, and near houses and dumped
    refuse; nettles follow human settlement and usually indicate soil rich in nitrogen. Native to Europe,
    much of temperate Asia and western North Africa, and introduced to many other parts of the world.
  reference_ids:
  - REF-3844
  - REF-4030
  status: verified
harvesting:
  text: Young tops are picked in spring when 15-20 cm (6-8 inches) high, wearing gloves. For drying, the
    whole herb is cut in May and June just before it flowers, on a dry morning, and hung in bunches; seeds
    and flowers are dried in the sun or over a stove. Autumn leaves are gritty and best avoided. Heat,
    wilting or drying removes the sting.
  parts:
  - Leaf
  - Seed
  season: Young tops in spring; whole herb in May-June, just before flowering
  reference_ids:
  - REF-3844
  status: verified
harvest_readiness:
- part: leaf
  signals:
  - "Gather the young leaves and shoots in spring, before the plant flowers - once it flowers the leaves are gritty and best avoided."
  basis: traditional
  source_quote: "The leaves and young shoots are typically harvested in spring, before flowering, from early spring to late spring."
  reference_ids:
