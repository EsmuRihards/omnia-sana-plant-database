contraindications:
- note: The fresh plant stings; heat, wilting or drying removes the sting, and a strong decoction drunk
    too freely has caused burning over the whole body (Grieve). The EU herbal monograph on the leaf advises
    against it where reduced fluid intake is recommended (for example severe heart or kidney disease),
    in pregnancy and breastfeeding, and under 12 years; mild stomach upset and skin reactions may occur.
    No interactions are reported for the leaf or the root, and root preparations can cause stomach upset
    or allergic skin reactions.
  severity: caution
  reference_ids:
  - REF-3844
  - REF-3082
  - REF-4029
  status: verified
- note: 'Duke (2002) rates stinging nettle as +++ and provides clinical evidence (score 2) for antiprostatitic
    activity (BPH - benign prostatic hyperplasia), consistent with Commission E approval for irritative
    urination symptoms associated with BPH. Dose: 4–6 g dried herb daily or 600–1200 mg root extract.
    The root preparations are used for BPH while leaf preparations are used for antiallergic and anti-inflammatory
    purposes. Duke also notes experimental antiarthritic and analgesic activity. Generally safe; the most
    common adverse effect is mild gastrointestinal upset (Duke, 2002).'
  severity: info
  reference_ids:
  - REF-0063
  status: verified
