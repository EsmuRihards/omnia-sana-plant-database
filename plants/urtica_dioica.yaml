  note: Phenolic acids have been isolated from the plant, and the leaves are rich in antioxidant polyphenols.
  reference_ids:
  - REF-1329
  - REF-1335
- name: Lectin (UDA) and polysaccharides (root)
  note: Only a few components of the root's active principle are known; a root extract and a polysaccharide
    fraction were anti-inflammatory, and the isolated lectin UDA was immunomodulatory, in lab studies.
  reference_ids:
  - REF-1332
- name: Histamine, serotonin and acetylcholine (stinging hairs); formic acid
  note: The sting's irritants include histamine, serotonin and acetylcholine; Grieve lists formic acid
    in the fresh plant. Heat, wilting or drying removes the sting.
  reference_ids:
  - REF-4030
  - REF-3844
