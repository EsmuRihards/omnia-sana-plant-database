  OpenAlex under that title, author or year, so it is treated as unverifiable and deleted; the root
  preparation, root dose and prostate claims now cite the EU nettle root monograph REF-4029. Generic
  Grieve REF-0098 replaced by the nettle entry REF-3844 in the monograph blocks, with Wikipedia
