  status: provisional
  notes: "PFAF (REF-3355); the young leaves and shoots are gathered in spring, before flowering (in flower May-October). Single lineage -> provisional."
- part: seed
  signals:
  - "Collect the seeds when they ripen, from summer into autumn."
  basis: traditional
  source_quote: "the seeds ripen from June to October"
  reference_ids:
