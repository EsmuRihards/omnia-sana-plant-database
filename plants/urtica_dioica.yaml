  histamine/serotonin/acetylcholine; unsupported details dropped (square stem, freeze-drying, seed as
  kidney tonic, root dug in autumn, root tincture interacting with
  diuretics/antihypertensives/antidiabetics: the EU monographs report no interactions).'
