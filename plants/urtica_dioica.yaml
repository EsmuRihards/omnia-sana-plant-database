  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3355); the seeds ripen from summer into autumn (June-October). Single lineage -> provisional."
- part: root
  status: gap
  notes: "GAP (documented dead end, re-searched 2026-08-15). No source states a root-harvest stage for Urtica dioica. Grieve's Nettles entry gives the herb only ('The whole herb, collected in May and June, just before coming into flower'); Herbal Reality gives the leaf only; the Arzneipflanzen-Lexikon entry has no root collection time; and Madaus is explicit that under the HAB it is the FRESH HERB, root excluded, that is the collection material for this species, noting root use only as a historical recommendation. Wikipedia supplies the aerial phenology ('dying down to the ground in winter') but no harvest rule, and it was not converted into one. German herbal websites do assert a spring/autumn root window but none could be retrieved to quote verbatim. Next seam: the EMA HMPC Urticae radix monograph checked for a collection statement, or a nettle-root agronomy paper."
traditional_uses:
  text: Nettle tea is an old country spring medicine and blood purifier, also taken for nettle rash and
    gouty gravel; nettle beer was given to old people for gouty and rheumatic pains, and flogging with
    nettles ('urtication') was an old remedy for chronic rheumatism. The EU herbal monographs recognise
    traditional use of the leaf for minor joint pain and to increase urine flow in minor urinary complaints,
    and of the root for lower urinary tract symptoms of an enlarged prostate.
  reference_ids:
  - REF-3844
  - REF-3082
  - REF-4029
  status: verified
preparations:
- name: Infusion (leaf)
  text: 'Dried herb infused in hot water (Grieve: 1 oz to a pint of boiling water); nettle tea is a traditional
    spring medicine, and the EU monograph lists the leaf as a herbal tea for minor joint pain and to increase
    urine flow.'
  reference_ids:
  - REF-3844
  - REF-3082
  status: verified
- name: Root infusion or extract
  text: Comminuted root as an infusion, or dry and liquid root extracts, taken by mouth for lower urinary
    tract symptoms of an enlarged prostate once a doctor has excluded serious conditions.
  reference_ids:
  - REF-4029
  status: verified
- name: Freeze-dried leaf (capsule)
  text: Freeze-dried leaf in capsule form, used to avoid the fresh sting while retaining nutrients.
  status: draft
dosage:
- name: Leaf infusion
  text: The EU herbal monograph on nettle leaf gives 2-4 g as a single dose for herbal tea, 3-6 times
    daily, for a daily dose equivalent to 8-12 g, in adolescents, adults and elderly; a 1:5 liquid extract
    at 30-40 drops 3-4 times daily and several dry extracts are also listed. Not to be used for more than
    4 weeks, and not recommended under 12 years. Educational reference only, not a prescription.
  reference_ids:
  - REF-3082
  status: verified
- name: Root extract
  text: The EU herbal monograph on nettle root gives, for adult and elderly men, 2 g of comminuted root
    in 150 mL water as an infusion 2-3 times daily, or dry extracts at about 300-720 mg a day depending
    on the extract (960 mg a day at the start of treatment for one extract); long-term use is possible,
    and it is not for under-18s. Educational reference only, not a prescription.
  reference_ids:
  - REF-4029
  status: verified
constituents:
- name: Flavonoids
  compounds:
  - flavonoid
  note: Flavonoids are among the bioactive constituents isolated from the plant.
  reference_ids:
