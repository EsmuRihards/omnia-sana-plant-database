  and the plant-level references bucket. | 2026-07-11: added monograph-base fields (botanical_description,
  habitat, harvesting, traditional_uses, preparations, dosage) sourced from the existing references bucket;
  general/undated claims marked status: draft per the integrity-first sourcing policy. | 2026-08-15: Harvest
  Calendar (phenological) - added harvest_readiness for fruit (provisional: PFAF REF-3358, berries ripe and
  deep red in autumn). Single lineage. Binomial confirmed.
  | 2026-11-13: symptom-source audit deep audit batch 18 - Deep audit. Dose-comparison RCT
  REF-1343 (no placebo arm) removed from uti; lingonberry (V. vitis-idaea) review REF-1346 removed
  from uti and the action. MS placebo RCT REF-3829 (no difference) recorded as no-effect. Men-LUTS
  RCT REF-3830 added; OAB RCT REF-3832 (ITT null) no-effect. New pair (owner rule): oral-health
  (gingivitis RCT). REF-0390 retagged narrative-review. Gap: RA juice RCT (within-group change
  only).
  | 2026-11-19 (monograph-source audit): traditional_uses, preparations[0-1] and dosage[0] cited only REF-0389 (UTI network meta-analysis). RE-SOURCED: WHO Fructus Macrocarponii vol. 4 (REF-3982, new; traditional uses, clinical uses incl. negative paediatric trials, anti-adhesion mechanism, dosage forms, posology); REF-0389 kept for its finding. Dropped as unsupported: Native American folk tradition (PFAF mentions only a branch infusion for pleurisy), unsweetened, standardised PAC extract, 36 mg PAC a day (the only trial in the record using 36 mg, REF-3829, found NO benefit), 240-300 ml a day, A-type PACs named as the active anti-adhesion compounds.'
