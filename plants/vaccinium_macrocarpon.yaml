id: vaccinium-macrocarpon
scientific_name: Vaccinium macrocarpon
common_names:
- American Cranberry
- Cranberry
- Large cranberry
- Bearberry
family: Ericaceae
external_ids:
  gbif: 2882841
  wikidata: Q149397
parts_used:
- Fruit (berry)
constituents:
- name: A-type proanthocyanidins (PACs)
  compounds:
  - proanthocyanidin
  note: The constituents responsible for the anti-adhesion effect against uropathogenic E. coli.
  reference_ids:
  - REF-0390
- name: Flavan-3-ols, anthocyanins and other flavonoids
  compounds:
  - anthocyanin
  - phenolic-compound
  - flavonoid
  note: Antioxidant polyphenols of the berry.
  reference_ids:
  - REF-0390
- name: Phenolic acids and organic acids (quinic, malic, citric)
  compounds:
  - phenolic-acid
  note: Contribute to the acidity and antioxidant capacity.
  reference_ids:
  - REF-0390
- name: Oxalates
  note: Present in relatively high amounts; relevant to kidney-stone risk.
  reference_ids:
  - REF-0391
botanical_description:
  text: Low, trailing, evergreen woody vine with small, wiry stems and small, oval, leathery leaves. Small,
    pink, four-petalled flowers with reflexed petals give way to round to oblong, tart red berries.
  height: 5-20 cm (trailing vine, stems can spread 1-2 m)
  habit: Low, trailing, evergreen woody vine
  leaves: Small, oval, leathery, dark green above and pale beneath
  flowers: Small, pink, four-petalled with reflexed (swept-back) petals
  stem: Wiry, trailing, rooting at nodes
  root: Shallow, fibrous root system
  fruit: Round to oblong, tart, red berry
  flowering_period: May-July
  status: draft
habitat:
  text: Grows in acidic bogs, wetlands and sandy peat soils; native to North America and now widely cultivated
    commercially, especially in flooded bogs.
  status: draft
harvesting:
  text: Berries are harvested in autumn when fully red, either dry-picked or by flooding the bog so the
    berries float (wet harvest) for collection.
  parts:
  - Fruit (berry)
  season: Autumn
  status: draft
harvest_readiness:
- part: fruit
  signals:
  - "Pick the berries when ripe and deep red, in autumn."
  basis: traditional
  source_quote: "the seeds ripen from August to October"
  reference_ids:
  - REF-3358
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3358); the berries ripen to deep red in autumn (seeds ripen August-October; flowering June-August). Single lineage -> provisional."
traditional_uses:
  text: In traditional medicine cranberry was used for asthma, fever, loss of appetite, scurvy, stomach
    ailments, gallbladder and liver disease and wounds. Its main modern use is as an adjunct for preventing
    and easing urinary tract infections in adults, which WHO lists as supported by clinical data; trials
    in children were negative. Laboratory studies show that cranberry works by stopping E. coli from sticking
    to the cells lining the urinary tract, not by acidifying the urine. A network meta-analysis of 20
    trials found 54% fewer urinary infections with cranberry juice than with no treatment.
  reference_ids:
  - REF-3982
  - REF-0389
  status: verified
preparations:
- name: Juice
  text: Cranberry juice, taken regularly to prevent urinary infections; in a network meta-analysis, cranberry
    juice was linked to 54% fewer infections than no treatment and 27% fewer than a placebo drink.
  reference_ids:
  - REF-0389
  - REF-3982
  status: verified
- name: Tablets/capsules (concentrated extract)
  text: Tablets and capsules of concentrated cranberry extract; WHO gives 1-6 capsules a day, each equivalent
    to 90 ml of juice or 400-450 mg of cranberry solids.
  reference_ids:
  - REF-3982
  - REF-0389
  status: verified
dosage:
- name: Juice/extract (WHO monograph)
  text: For preventing urinary infections in adults the WHO monograph gives 30-300 ml a day of a 30% pure
    cranberry juice product, and for treatment 360-960 ml a day or equivalent; concentrated-extract capsules
    are taken 1-6 a day. Trials do not support cranberry products for children. Educational reference
    only, not a prescription.
  reference_ids:
  - REF-3982
  status: verified
actions:
- action: antioxidant
  reference_ids:
  - REF-0390
  - REF-1345
  status: verified
- action: urinary-antiseptic
  note: Anti-adhesion of uropathogenic Escherichia coli to the urinary tract lining
  reference_ids:
  - REF-0390
  - REF-1338
  - REF-1339
  status: verified
indications:
- condition: infection
  note: Prevention of recurrent urinary tract infections in women and children (Cochrane review); no benefit
    in multiple sclerosis in a randomized trial
  reference_ids:
  - REF-0389
  - REF-0390
  - REF-0391
  - REF-1338
  - REF-1342
  - REF-1347
  status: verified
  null_result_ids:
  - REF-3829
- condition: urinary-support
  note: Cranberry reduced recurrent urinary tract infections in women (meta-analyses) and improved lower
    urinary tract symptoms in men in a randomized trial; it did not help overactive bladder in an intention-to-treat
    analysis
  reference_ids:
  - REF-0390
  - REF-1340
  - REF-1344
  - REF-3830
  status: needs-review
  null_result_ids:
  - REF-3832
- condition: uti
  note: Cranberry reduced recurrent urinary tract infections in women, children and people at risk after
    medical procedures (Cochrane review), but not in the elderly, people with bladder-emptying problems
    or multiple sclerosis; it blocks E. coli sticking to the bladder lining
  reference_ids:
  - REF-0389
  - REF-0390
  - REF-0391
  - REF-1338
  - REF-1339
  - REF-1340
  - REF-1341
  - REF-1342
  - REF-1344
  - REF-1347
  status: verified
  null_result_ids:
  - REF-3829
- condition: oral-health
  note: A cranberry drink reduced gum inflammation and plaque vs control in people with gingivitis in
    a randomized trial
  reference_ids:
  - REF-3831
  status: verified
contraindications:
- note: Best supported for PREVENTION of recurrent UTIs, not for treating an active infection; an established
    UTI needs proper medical assessment and, usually, antibiotics.
  severity: info
  reference_ids:
  - REF-0389
  - REF-0391
  status: verified
- note: May interact with the anticoagulant warfarin (evidence is conflicting); people taking warfarin
    should be cautious and consult their clinician.
  severity: caution
  reference_ids:
  - REF-0391
  status: verified
- note: High in oxalates; people with a history of kidney stones should avoid large or prolonged intake.
    Many cranberry juices are also high in sugar.
  severity: caution
  reference_ids:
  - REF-0391
  status: verified
references:
