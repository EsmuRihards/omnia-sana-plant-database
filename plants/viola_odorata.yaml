dosage:
- name: Infusion/syrup
  text: A double-blind randomised placebo-controlled trial used 5 mL of Viola odorata syrup every 12 hours
    for 4 weeks as add-on therapy for insomnia. Traditional references suggest around 2-4 g of dried flower
    and leaf per cup, up to three times daily. Note the EU monograph on Violae herba cum flore covers
    Viola tricolor, a different species, and its posology does not transfer here. Educational reference
    only, not a prescription.
  reference_ids:
