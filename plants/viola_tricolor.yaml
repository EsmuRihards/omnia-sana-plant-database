  reference_ids:
  - REF-0463
  status: needs-review
- condition: psoriasis
  note: Traditionally used for psoriasis (Herbal Reality); heartsease cyclotides calmed overactive immune
    cells in the lab (preclinical)
  reference_ids:
  - REF-0463
  - REF-0517
  status: verified
- condition: skin-irritation
  note: Traditionally applied to itching, scabs and inflamed skin (Grieve, A Modern Herbal; Herbal Reality);
    a heartsease gel reduced sunburn inflammation in rats (preclinical)
  reference_ids:
