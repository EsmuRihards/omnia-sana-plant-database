  status: needs-review
- condition: eczema
  note: Traditional remedy for eczema and other skin troubles (Grieve, A Modern Herbal; Herbal Reality);
    heartsease cyclotides calmed overactive immune cells in the lab (preclinical)
  reference_ids:
  - REF-0463
  - REF-3855
