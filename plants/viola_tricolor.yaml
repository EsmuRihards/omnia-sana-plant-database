id: viola-tricolor
scientific_name: Viola tricolor
common_names:
- Heartsease
- Wild pansy
- Johnny-jump-up
- Love-in-idleness
family: Violaceae
external_ids:
  gbif: 5331347
  wikidata: Q190326
parts_used:
- Aerial parts (flowering herb)
constituents:
- name: Cyclotides (cyclic plant peptides)
  note: Bioactive cyclic peptides shown to suppress over-active immune (T-cell) responses - the rationale
    for use in inflammatory skin disease; the cytotoxic cyclotides vitri A, varv A and varv E have been
    isolated from V. tricolor. Cyclotide-enriched preparations (including hot-water decoctions) reduce
    T-cell proliferation and macrophage cytokine output in vitro, of interest for inflammatory bowel disease.
  reference_ids:
  - REF-0463
  - REF-0556
  - REF-0617
- name: Flavonoids (rutin, violanthin), salicylates and mucilage
  compounds:
  - flavonoid
  - mucilage
  - rutin
  note: Antioxidant, anti-inflammatory and soothing constituents.
  reference_ids:
  - REF-0463
  - REF-1605
  - REF-1606
botanical_description:
  text: 'A small annual or perennial herb, about 10-20 cm tall, with a freely branching, angular stem.
    The leaves are deeply cut into rounded lobes, the end lobe much the largest, with very large leafy
    stipules at their base. The flowers, 0.6-3 cm across, vary in colour and size but are purple, yellow
    or white, most often all three together: the upper petals are usually purple and the lowest, broadest
    petal yellow, with a spur at its base. They open from April to September and are followed by small
    seed capsules that open by three valves.'
  height: About 10-20 cm
  habit: Small annual or perennial herb
  leaves: Deeply cut into rounded lobes, end lobe largest, with very large leafy stipules
  flowers: 0.6-3 cm across; purple, yellow and white, usually combined; lowest petal yellow and spurred
  stem: Freely branching, angular
  fruit: Small capsule opening by three valves
  flowering_period: April to September
  reference_ids:
  - REF-3855
  - REF-3368
  status: verified
habitat:
  text: Cultivated and waste ground, cornfields, gardens, hedgebanks and short grassland, mainly on acid
    and neutral soils. Native to Europe, including Britain, from Scandinavia south and east to Corsica,
    western Asia, Siberia and the Caucasus.
  reference_ids:
  - REF-3368
  - REF-3855
  status: verified
harvesting:
  text: The flowering herb is harvested from June to August and dried for later use.
  parts:
  - Aerial parts (flowering herb)
  season: June to August
  reference_ids:
  - REF-3368
  status: verified
harvest_readiness:
- part: aerial-parts
  signals:
  - "Cut the flowering aerial parts in summer, while in flower (harvested June to August)."
  basis: traditional
  source_quote: "The plant is harvested from June to August and dried for later use."
  reference_ids:
  - REF-3368
  independent_confirmation: null
  species_confirmed: true
  status: provisional
  notes: "PFAF (REF-3368); the flowering herb is cut from June to August while in flower (in flower April-September). Single lineage -> provisional."
traditional_uses:
  text: Heartsease was once highly regarded for epilepsy, asthma, skin diseases and many other complaints;
    its flowers were considered good for diseases of the heart, which may explain the name, and Gerard
    commended it for children's convulsions, inflammation of the lungs and chest, and scabs and itching.
    Modern herbalism treats it as a purifying herb taken internally for skin complaints such as eczema,
    and as an expectorant for bronchitis and whooping cough. The EU herbal monograph gives a tea for internal
    use and infusions for wet dressings and baths.
  reference_ids:
  - REF-3855
  - REF-3368
  - REF-3074
  status: verified
preparations:
- name: Infusion
  text: Dried flowering herb infused in hot water, taken internally for cough or used as a cooled compress
    for skin irritation.
  reference_ids:
  - REF-0463
  status: verified
- name: Cream/ointment
  text: Extract formulated into a topical cream or ointment for eczema and irritated skin.
  status: draft
- name: Tincture
  text: Alcoholic extract of the dried flowering herb.
  status: draft
dosage:
- name: Infusion
  text: The EU herbal monograph gives, for oral use in adults and elderly, 3 g of the comminuted herb
    as an infusion 1-3 times daily. For cutaneous use, 5-20 g/L as an infusion applied as a wet dressing
    2-3 times daily, or 5-10 g/L as a bath additive (1 litre of infusion per bath). Contraindicated in
    hypersensitivity to salicylates, and cutaneously on open wounds or large areas of damaged skin. Oral
    use not recommended under 18 years. Educational reference only, not a prescription.
  reference_ids:
  - REF-3074
  status: verified
actions:
- action: anti-inflammatory
  note: Anti-inflammatory / immunomodulatory for chronic skin conditions - eczema, psoriasis, itching
    and scabs (traditional, supported by cyclotide research) - cyclotide-enriched V. tricolor preparations
    suppress T-cell proliferation and pro-inflammatory cytokine secretion in vitro; Soothes irritated
    skin (demulcent and anti-inflammatory)
  reference_ids:
