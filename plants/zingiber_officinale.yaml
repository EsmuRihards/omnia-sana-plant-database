  - REF-0637
botanical_description:
  text: Herbaceous perennial. Branched, thickened, fleshy and strongly aromatic rhizomes, yellowish inside,
    send up erect, leafy false stems (pseudostems) 50-100 cm tall, made of the rolled bases of the leaves.
    The stalkless leaves stand in two ranks; each blade is lance-shaped to narrowly lance-shaped, 15-30
    cm long and 2-2.5 cm wide. The flower spikes arise directly from the rhizome on separate stalks up
    to 25 cm long - an egg-shaped head 4-5 cm long of pale green bracts, with yellowish-green flowers
    whose lip carries a purple stripe and cream blotches.
  height: Pseudostems 50-100 cm
  habit: Herbaceous perennial with erect, leafy pseudostems arising from a rhizome
  leaves: Stalkless, in two ranks; blade lanceolate to linear-lanceolate, 15-30 x 2-2.5 cm
  flowers: Egg-shaped spike 4-5 cm long on a separate stalk up to 25 cm long from the rhizome; pale green
    bracts; yellowish-green corolla; lip with a purple stripe and cream blotches; dark purple stamen
  stem: Erect, leafy pseudostem (false stem) made of the rolled leaf bases
  root: Branched, thickened, fleshy rhizome, yellowish inside and strongly aromatic
  flowering_period: October (Flora of China)
  reference_ids:
  - REF-3955
  - REF-3954
  status: verified
habitat:
  text: Believed native to tropical Southeast Asia; cultivated extensively throughout the tropics and
    subtropics (India, China, Nigeria, the Caribbean) in warm, humid conditions on well-drained, fertile
    soil.
  status: draft
harvesting:
  text: The rhizome is dug 8-10 months after planting, once the leaves have died back, for mature ('old')
    ginger with the fullest pungency, or earlier for milder young ('green') ginger; cleaned and used fresh
    or dried and ground.
  parts:
