dangerous_lookalikes:
- dangerous_plant: asarum-europaeum
  severity: dangerous
  confused_part: The rootstock, if a ginger-scented wild root is gathered as a substitute for ginger
  confusion_context: European wild ginger (Latvian parastā kumeļpēda) shares the name "wild ginger"
    and its roots have a ginger aroma, but it is not closely related to culinary ginger. It is common
    in woods throughout Latvia and is a poisonous plant - it contains aristolochic acid, which causes
    irreversible kidney damage and cancer of the urinary tract. Culinary ginger is a cultivated plant
    that does not exist in the wild, so a ginger-scented root dug from a Latvian wood cannot be ginger.
  distinguishing_features:
  - 'Size and leaves: European wild ginger lies close to the ground, only 3-10 cm high, with rounded,
    evergreen leaves 5-8 cm wide with a kidney-shaped base. Ginger grows leafy false stems about 1 m
    tall with narrow leaf blades.'
  - 'Flower: European wild ginger has a single drooping, brownish-red flower close to the ground in April
    and May.'
  - 'Rootstock: European wild ginger has creeping rhizomes with scales at the nodes, growing in woodland
    soil.'
  - 'Where it grows: culinary ginger is a cultivated plant that does not exist in its wild state, so it
    is never found growing in European woods.'
  key_test: Ask where it came from. Ginger is bought, never foraged - it does not grow wild anywhere -
    so any ginger-scented root dug in a European wood is not ginger and must not be eaten.
