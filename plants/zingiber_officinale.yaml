traditional_uses:
  text: Ginger has been used since antiquity in Chinese, Ayurvedic and Tibb-Unani herbal medicine for a
    wide range of ailments, including arthritis, rheumatism, muscular aches and pains, sore throats, cramps,
    indigestion, constipation, vomiting and fever. In Western herbalism it was a stimulant and carminative
    given for indigestion and flatulent colic. The European Medicines Agency recognises well-established
    use for preventing nausea and vomiting in motion sickness, and traditional use for motion sickness,
    mild spasmodic digestive complaints with bloating and wind, temporary loss of appetite, minor joint
    pain and the symptoms of the common cold. Meta-analyses of clinical trials have since found that ginger
    eases nausea in pregnancy and modestly reduces osteoarthritis pain, and that ginger capsules added to
    standard anti-sickness drugs reduce severe chemotherapy-induced nausea.
  reference_ids:
