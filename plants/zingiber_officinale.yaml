    antiemetic ginger tea.
  status: draft
- name: Standardised extract/powder
  text: Capsules of dried, powdered rhizome or standardised ginger extract - the form tested in many clinical
    trials, including trials in chemotherapy-induced nausea and in knee osteoarthritis.
