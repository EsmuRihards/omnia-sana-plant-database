- name: Culinary use
  text: Fresh, dried or crystallised rhizome used extensively as a food spice and flavouring.
  status: draft
dosage:
- name: Powdered rhizome (EU herbal monograph)
  text: 'The 2025 EU herbal monograph gives, for preventing nausea and vomiting in motion sickness (well-established
    use), 1-2 g of powdered rhizome for adults, taken 1 hour before travel. As a traditional remedy for motion
    sickness it gives 500-750 mg half an hour before travelling for adolescents and adults, and 250-500 mg for
    children aged 6-12. For mild spasmodic digestive complaints it gives 0.18-1 g three times daily, and for
    temporary loss of appetite, minor joint pain or common-cold symptoms 0.25-1 g three times daily, both
    for adults only. It does not recommend ginger for children under 6, or for under-18s outside the travel
    use. Educational reference only, not a prescription.'
