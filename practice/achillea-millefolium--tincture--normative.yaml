# The calculator payload. A 1:5 tincture: 5 mL of finished tincture is equivalent to
# 1 g of dried herb. Menstruum strength 45% ethanol (headline; a 31.5% variant exists).
conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 45
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # yarrow tincture is taken orally (appetite / GI indications)
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph lists a yarrow (Achillea millefolium)
    herb tincture as a 1:5 preparation in ethanol 45% V/V; the same monograph also
    lists a 1:5 tincture in ethanol 31.5% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength for yarrow from the free public EMA
  HMPC monograph EMA/HMPC/376416/2019 Revision 1, read in full via the EMA PDF. Section
  2 (traditional use) lists TWO 1:5 tinctures: preparation d) in ethanol 45% V/V and
  preparation e) in ethanol 31.5% V/V. The 45% variant is recorded as the headline
  (the more conventional, higher-strength tincture, dosed 2-4 ml 3x daily for appetite
  and GI indications); the 31.5% variant is noted in the finding and statement. Route
  internal: the tinctures are oral for indications 1-3 (loss of appetite; spasmodic GI;
  menstrual spasm). One authority suffices for a normative record; jurisdiction is EU
  and the statement is jurisdiction-scoped. reviewed_by/verified_by are two distinct AI
  passes by the same agent, owner-authorized, NOT two independent human experts.
