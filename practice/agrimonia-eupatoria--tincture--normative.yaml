# The calculator payload. A 1:5 tincture: 5 mL of finished tincture is equivalent to
# 1 g of dried herb. Menstruum strength 45% ethanol.
conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 45
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # agrimony tincture, indication 1 (mild diarrhoea), is taken orally
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph defines a standard agrimony (Agrimonia
    eupatoria) herb tincture as a 1:5 preparation in ethanol 45% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 45% V/V) for agrimony from
  the free public EMA HMPC monograph EMA/HMPC/680597/2013, read in full via the EMA
  PDF. The monograph's single tincture is preparation b), 1:5 at 45% ethanol
  (traditional-use-only monograph). Route recorded internal because the tincture is
  dosed orally for indication 1 (mild diarrhoea, 1-4 ml 3x daily); the same tincture is
  also used as a gargle (oromucosal) for indication 2 and cutaneously for indication 3.
  One authority suffices for a normative record; jurisdiction is EU and the statement is
  jurisdiction-scoped. reviewed_by/verified_by are two distinct AI passes by the same
  agent, owner-authorized, NOT two independent human experts.
