internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 70% V/V) for wormwood from
  the free public EMA HMPC monograph EMA/HMPC/751490/2016 Corr. 1, read in full via the
  EMA PDF. The monograph's single tincture is preparation d), 1:5 at 70% ethanol
  (traditional-use-only monograph). Route internal (oral bitter for loss of appetite
  and mild dyspeptic/GI disorders). Safety context noted for downstream dosing (not a
  gate on this null-key dose-form record): the monograph caps thujone daily exposure
  below 6.0 mg and contraindicates bile-duct obstruction, cholangitis and liver
  disease. One authority suffices for a normative record; jurisdiction is EU and the
  statement is jurisdiction-scoped. reviewed_by/verified_by are two distinct AI passes
  by the same agent, owner-authorized, NOT two independent human experts.
