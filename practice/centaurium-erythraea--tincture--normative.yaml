findings:
  - id: F1
    ref_id: REF-3143
    method_type: pharmacopoeial
    fulltext_source: publisher-html
    varied_factor: none
    statement_summary: >-
      EMA HMPC lists, among traditional-use centaury (Centaurium erythraea s.l.)
      herb preparations, a tincture at a herbal-substance-to-extraction-solvent
      ratio of 1:5 in ethanol 70% V/V (plus a 1:1 liquid extract in ethanol 25%
      and a water soft extract).
    locator:
      section: monograph
      monograph: "Centaurium erythraea Rafn. s.l., herba — section 2, Qualitative and quantitative composition"
      edition: "EMA/HMPC/277493/2015 (adopted 24 November 2015)"
    authority: ema-hmpc
    material:
      species: Centaurium erythraea
      part: herb
      state: dried

# The calculator payload. A 1:5 tincture: 5 mL of finished tincture is equivalent to
# 1 g of dried herb. Menstruum strength 70% ethanol.
conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 70
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # centaury tincture is taken orally
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph defines a standard centaury
    (Centaurium erythraea) herb tincture as a 1:5 preparation in ethanol 70% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 70% V/V) for centaury from
  the free public EMA HMPC monograph EMA/HMPC/277493/2015, read in full via the EMA
  PDF. The monograph's single tincture is 1:5 at 70% ethanol (traditional-use-only
  monograph; no well-established-use column). Published name in the monograph is
  "Centaurium erythraea Rafn. s.l." (sensu lato, including C. majus and C.
  suffruticosum); normalised here to the DB accepted binomial Centaurium erythraea,
  which is the monograph's headline name and matches slug(species)==plant.id. One
  authority suffices for a normative record; jurisdiction is EU and the statement is
  jurisdiction-scoped. reviewed_by/verified_by are two distinct AI passes by the same
  agent, owner-authorized, NOT two independent human experts.
