# Practice corpus — dose-form-conversion (NORMATIVE), APPROVED.
# Sources the centaury (Centaurium erythraea) herb tincture standard (ratio +
# menstruum strength) from the free, public EMA HMPC EU herbal monograph.
# Normative: one authority suffices.
id: centaurium-erythraea--tincture--normative
record_type: dose-form-conversion
parameter_kind: normative
species_scope: species-specific
species: Centaurium erythraea
status: approved
