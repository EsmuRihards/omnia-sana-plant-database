# The calculator payload. A 1:5 tincture: 5 mL of finished tincture is equivalent to
# 1 g of dried herb. Menstruum strength 25% ethanol.
conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 25
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # blessed-thistle tincture is taken orally (bitter, appetite/dyspepsia)
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph defines a standard blessed thistle
    (Cnicus benedictus) herb tincture as a 1:5 preparation in ethanol 25% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 25% V/V) for blessed thistle
  from the free public EMA HMPC monograph EMA/HMPC/32402/2022, read in full via the EMA
  PDF. The monograph's single tincture is preparation d), 1:5 at 25% ethanol
  (traditional-use-only monograph); a 1:1 liquid extract in the same 25% solvent also
  exists. The low ethanol (25%) is faithful to the monograph — blessed thistle is a
  bitter used at low proof. Material reference in the monograph is the Austrian
  Pharmacopoeia (OeAB 2009/007), not Ph. Eur. Route internal (oral bitter for loss of
  appetite and dyspepsia). One authority suffices for a normative record; jurisdiction
  is EU and the statement is jurisdiction-scoped. reviewed_by/verified_by are two
  distinct AI passes by the same agent, owner-authorized, NOT two independent human
  experts.
