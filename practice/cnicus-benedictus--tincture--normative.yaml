      EMA HMPC lists, among traditional-use blessed thistle (Cnicus benedictus) herb
      preparations, a tincture at a herbal-substance-to-extraction-solvent ratio of
      1:5 in ethanol 25% V/V (plus a 1:1 liquid extract in the same solvent).
    locator:
