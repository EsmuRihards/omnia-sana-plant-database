# Practice corpus — dose-form-conversion (NORMATIVE), APPROVED.
# Sources the hawthorn (Crataegus monogyna) leaf-and-flower tincture standard
# (ratio + menstruum strength) from the free, public EMA HMPC EU herbal monograph.
# Normative: one authority suffices. The DER is a RANGE (1:3.5-4.5), so the
# conversion block carries drug_extract_ratio_range and the calculator uses the
# midpoint (4.0) for the equivalence/ABV math, mirroring the ethanol-range handling.
id: crataegus-monogyna--tincture--normative
record_type: dose-form-conversion
parameter_kind: normative
