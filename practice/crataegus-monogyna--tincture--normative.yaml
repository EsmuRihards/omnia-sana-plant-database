  method: null

findings:
  - id: F1
    ref_id: REF-3152
    method_type: pharmacopoeial
    fulltext_source: publisher-html
    varied_factor: none
    statement_summary: >-
      EMA HMPC lists, among traditional-use hawthorn (Crataegus spp.) leaf-and-flower
      preparations, a tincture at a herbal-substance-to-extraction-solvent ratio (DER)
      of 1:3.5-4.5 in ethanol 35% V/V (preparation j, alongside dry/liquid extracts and
      expressed juices).
    locator:
