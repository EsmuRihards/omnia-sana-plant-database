conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 60
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # hops tincture is taken orally (mental stress / sleep)
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph defines a standard hops (Humulus
    lupulus) strobile tincture as a 1:5 preparation in ethanol 60% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 60% V/V) for hops from the
  free public EMA HMPC Community herbal monograph EMA/HMPC/682384/2013, read in full via
  the EMA PDF. The monograph's single tincture is preparation e), 1:5 at 60% ethanol
  (traditional-use-only monograph). material.part is "strobile" (the hop cone/flos; the
  monograph titles it "flos"). Route internal (oral for mild mental stress and to aid
  sleep). Safety context noted for downstream dosing (not a gate on this null-key
  dose-form record): the monograph warns preparations may impair the ability to drive or
  use machines. One authority suffices for a normative record; jurisdiction is EU and the
  statement is jurisdiction-scoped. reviewed_by/verified_by are two distinct AI passes by
  the same agent, owner-authorized, NOT two independent human experts.
