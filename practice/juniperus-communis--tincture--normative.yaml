internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 45% V/V) for juniper from the
  free public EMA HMPC monograph EMA/HMPC/241320/2021 Revision 1, read in full via the
  EMA PDF. The monograph's single tincture is preparation c), 1:5 at 45% ethanol
  (traditional-use-only monograph). Published name is "Juniperus communis L., galbulus
  (pseudo-fructus)"; the material is the ripe cone berry (galbulus / juniper berry).
  Route internal (oral for urinary-tract flushing and dyspepsia). Safety context noted
  for downstream dosing (not a gate on this null-key dose-form record): not recommended
  in severe renal disease (interstitial nephritis, pyelitis, pyelonephritis) or where
  reduced fluid intake is advised; adequate fluid intake required. One authority suffices
  for a normative record; jurisdiction is EU and the statement is jurisdiction-scoped.
  reviewed_by/verified_by are two distinct AI passes by the same agent, owner-authorized,
  NOT two independent human experts.
