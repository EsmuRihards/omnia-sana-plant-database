internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 45-53% V/V) for lemon balm
  from the free public EMA HMPC monograph EMA/HMPC/196745/2012, read in full via the
  EMA PDF. The monograph's only tincture is 1:5 at 45-53% ethanol (Melissa is a
  traditional-use-only monograph; no well-established-use column). Ethanol recorded as
  a range (menstruum_ethanol_range) rather than inventing a single figure; the
  calculator displays "45-53%" and uses the midpoint only for the ABV/shelf-life
  estimate. reviewed_by/verified_by are two distinct AI passes by the same agent,
  owner-authorized, NOT two independent human experts.
