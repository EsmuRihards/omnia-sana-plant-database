      EMA HMPC lists, among traditional-use tormentil (Potentilla erecta) rhizome
      preparations, two tinctures at a ratio of 1:5 — one in ethanol 70% V/V (the Ph.
      Eur. Tormentillae tinctura), one in ethanol 45% V/V — plus liquid and dry extracts.
