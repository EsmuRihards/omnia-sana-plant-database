# menstruum strength) from the free, public EMA HMPC EU herbal monograph.
# Normative: one authority suffices.
id: primula-veris--tincture--normative
record_type: dose-form-conversion
parameter_kind: normative
species_scope: species-specific
species: Primula veris
status: approved
