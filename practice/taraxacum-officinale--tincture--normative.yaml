    statement_summary: >-
      EMA HMPC lists, among traditional-use dandelion (Taraxacum officinale) root
      preparations, a tincture at a herbal-substance-to-extraction-solvent ratio of
      1:5 in ethanol 45% V/V (plus a 1:1 liquid extract in ethanol 30% and juices).
    locator:
      section: monograph
      monograph: "Taraxacum officinale F.H. Wigg., radix — section 2, Qualitative and quantitative composition"
