# The calculator payload. A 1:5 tincture: 5 mL of finished tincture is equivalent to
# 1 g of dried root. Menstruum strength 45% ethanol.
conversion:
  input_form: dried-herb
  output_form: tincture
  drug_extract_ratio: "1:5"
  menstruum_ethanol_pct: 45
  equivalence:
    preparation_ml: 5
    dried_herb_g: 1

recommendation:
  parameter: drug_extract_ratio
  route: internal                 # dandelion-root tincture is taken orally (digestive/appetite/diuretic)
  jurisdiction: EU
  value: "1:5"
  statement: >-
    In the EU, the EMA HMPC herbal monograph defines a standard dandelion (Taraxacum
    officinale) root tincture as a 1:5 preparation in ethanol 45% V/V.
  derived_from: [F1]

internal_notes: >-
  Normative dose-form-conversion record (2026-07-27, approved). Sources the tincture
  calculator's ratio (1:5) and menstruum strength (ethanol 45% V/V) for dandelion root
  from the free public EMA HMPC monograph EMA/HMPC/475726/2020, read in full via the
  EMA PDF. The monograph's single tincture is preparation e), 1:5 at 45% ethanol
  (traditional-use-only monograph). Published name is "Taraxacum officinale F.H. Wigg.,
  radix"; normalised here to the DB accepted binomial Taraxacum officinale (the botanical
  authority F.H. Wigg. is dropped for slug(species)==plant.id). Material corresponds to
  the ROOT (radix). Route internal (oral for mild digestive disorders, loss of appetite,
  and urinary-tract flushing). Safety context noted for downstream dosing (not a gate on
  this null-key dose-form record): not recommended in bile-duct obstruction, cholangitis,
  liver disease, gallstones or biliary disease. One authority suffices for a normative
  record; jurisdiction is EU and the statement is jurisdiction-scoped. reviewed_by/
  verified_by are two distinct AI passes by the same agent, owner-authorized, NOT two
  independent human experts.
